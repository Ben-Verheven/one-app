<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Watch</title>
<!--
  Project Watch (Partner Watch until 2026-10-16) — the partner-search
  entries of the brokerage sites, which Mark calls arenas, copied
  every night by the partner-copier function (supabase/8-…), browsed here:
  site, list, entry. One file on its own while it is tried out; it is drawn
  in the Marketplace room's colours and type so that it can move into the
  One App later as a room or a Marketplace view without being redrawn.

  It reads and writes only through the cloud, behind the same login as the
  One App and Pocket, because the entries hold people's names and emails
  and the repository is public.
-->
<style>
:root{
  color-scheme:light;
  /* Warm paper (Mark chose the all-light option on 2026-10-16, over the
     Marketplace's dark ground: long descriptions read far easier dark on
     light). The tones are the Marketplace's own light sheet, the one its
     pop-up cards wear, so a move into the One App can still borrow them. */
  --paper:#EFE9DC; --panel:#E6DFCF; --field:#FCFAF3; --sheet:#FAF7F0;
  --ink:#282420; --muted:#5E574B;
  /* The sheet's --faint, struck deep enough to read at 12 px on all three
     grounds here (paper, bar, sheet). */
  --faint:#6A6250;
  --key:#6E6656; --key2:#3A342C;
  --grid:rgba(42,38,32,.10); --line:rgba(42,38,32,.18); --line2:rgba(42,38,32,.32);
  --hover:rgba(42,38,32,.05); --sel:rgba(42,38,32,.09);
  --brok:#C2382C; --brok-ink:#8E241B; --brok-soft:rgba(194,56,44,.13);
  --call:#4646B8; --call-ink:#33338F; --call-soft:rgba(70,70,184,.13);
  --new:#6C8E1C; --new-ink:#43590E; --new-soft:rgba(140,190,40,.16); --new-line:rgba(108,142,28,.5);
  --gold:#9A6A00; --gold-ink:#6B4A00; --gold-soft:rgba(154,106,0,.13); --gold-line:rgba(154,106,0,.45);
  --warn-ink:#8E241B; --warn-line:rgba(142,36,27,.35);
  --serif:'Optima','Palatino Linotype','Book Antiqua',Georgia,serif;
  --body:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,Menlo,monospace;
  --radius:7px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column;min-width:900px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--key2);outline-offset:1px}
[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.bar h1{font:400 19px var(--serif);margin:0;letter-spacing:.02em}
.grow{flex:1}
.btn{background:none;border:1px solid var(--line2);color:var(--key2);font:13.5px var(--serif);padding:5px 12px;border-radius:var(--radius);cursor:pointer}
.btn:hover{border-color:var(--key)}
.btn:disabled{color:var(--faint);cursor:default}
.meta{font:12px var(--mono);color:var(--faint)}
#search{background:var(--field);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font:14px var(--body);padding:5px 10px;width:260px}
#search::placeholder{color:var(--faint)}
.cols{flex:1;display:grid;grid-template-columns:240px 360px minmax(0,1fr);min-height:0}
/* In a window of half a wide screen the two left columns gave up so much
   room that the entry's text ran a few words a line (2026-10-16); below
   1280 px they narrow, and the entry pane rearranges itself (see .read). */
@media (max-width:1280px){ .cols{grid-template-columns:200px 300px minmax(0,1fr)} }
/* With a call's notes open the entry list has nothing to say, so it goes
   and the notes sit beside the arenas (Mark, 2026-10-16). */
.cols.noting{grid-template-columns:240px minmax(0,1fr)}
.cols.noting > .col + .col{display:none}
@media (max-width:1280px){ .cols.noting{grid-template-columns:200px minmax(0,1fr)} }
/* On the iPad the arenas took a fifth of the screen from the entry for a
   choice made once a session (Mark, 2026-10-16), so the column folds to a
   rail that brings it back. It starts folded where the pointer is a
   finger and open at the desk; either way the fold is kept per device. */
.cols.folded{grid-template-columns:44px 360px minmax(0,1fr)}
.cols.folded.noting{grid-template-columns:44px minmax(0,1fr)}
@media (max-width:1280px){ .cols.folded{grid-template-columns:44px 300px minmax(0,1fr)} }
.cols.folded > .col:first-child > :not(.unfold){display:none}
.unfold{display:none;flex:1;flex-direction:column;align-items:center;gap:10px;width:100%;padding:12px 0;border:0;background:none;color:var(--faint);cursor:pointer;
  font:11.5px/16px var(--serif);letter-spacing:.08em;text-transform:uppercase}
.unfold:hover{background:var(--hover);color:var(--key2)}
.unfold span{writing-mode:vertical-rl}
.cols.folded .unfold{display:flex}
.colhead .fold{margin:-6px -8px -6px auto;border:0;background:none;padding:6px 8px;border-radius:5px;color:var(--key);cursor:pointer;display:flex}
.colhead .fold:hover{color:var(--key2);background:var(--hover)}
.col{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;min-height:0;flex:1}
/* One line height for both heads, whatever their type: the list's count in
   typewriter type stood taller than the word beside it and dropped the
   list's head two pixels below the arenas' head. */
.colhead{padding:12px 14px 8px;font:11.5px/16px var(--serif);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.colhead .meta{line-height:16px}
/* An arena is drawn like an entry row beside it: a hairline between each,
   the name in the rows' type. Its cards had no edges of their own, so the
   selected one stood out as a grey slab among text floating on the paper,
   and the counts under the name, in typewriter type and red, were the
   loudest thing in the column (Mark dropped them on 2026-10-16). */
.arena{position:relative;border-top:1px solid var(--grid)}
.arena:first-child{border-top-color:var(--line)}
.arena:last-child{border-bottom:1px solid var(--grid)}
.site{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:10px 40px 10px 11px;cursor:pointer}
.site:hover{background:var(--hover)}
.site.on{background:var(--sel);border-left-color:var(--key2)}
.site .nm{font:15px var(--serif)}
.site .sub{font-size:12.5px;color:var(--muted)}
/* The scroll opens the call's documents beside the page; the note under
   it opens Mark's own notes on the call in the entry pane, its lines drawn
   in once there is something written. Both sit over the card rather than
   in it, because a link inside the card's button is not allowed and would
   not be clickable on its own. */
.docs,.cnote{position:absolute;right:9px;display:flex;padding:4px;border:0;border-radius:5px;background:none;color:var(--key);cursor:pointer}
.docs{top:9px}
.cnote{top:35px}
.cnote.on{color:var(--key2);background:var(--sel)}
.docs:hover,.cnote:hover{color:var(--key2);background:var(--hover)}
/* The pencil in the column's head turns every arena into its link field at
   once, with one Save under them all (Mark, 2026-10-16). */
.colhead .editlinks{border:0;background:none;padding:2px 4px;margin:-2px 0;border-radius:5px;color:var(--key);cursor:pointer;display:flex}
.colhead .editlinks:hover{color:var(--key2);background:var(--hover)}
.arena.editing{padding:9px 12px 11px 14px}
.arena.editing .nm{font:15px var(--serif);margin-bottom:4px}
.arena.editing input{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:var(--radius);color:var(--ink);font:13px var(--body);padding:5px 8px}
.arena.editing .err{font-size:12px;color:var(--warn-ink);margin-top:4px}
.linkbar{padding:10px 14px 4px;font-size:12.5px;color:var(--muted)}
.linkbar .lbtns{display:flex;gap:6px;margin-top:8px}
.linkbar .btn{padding:3px 12px;font-size:12.5px}
.site .err{font-size:12px;color:var(--warn-ink);margin-top:3px;overflow-wrap:anywhere}
.runbox{margin:12px 14px 16px;padding:10px 12px;border:1px dashed var(--line2);border-radius:var(--radius);font-size:12.5px;color:var(--muted);flex:none}
.runbox b{color:var(--ink);font-weight:500}
.runbox .btn{margin-top:8px;width:100%}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;flex:none}
.chip{font:12px var(--serif);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:none;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--line2);background:var(--sel)}
.sep{width:100%;height:0}
.row{display:grid;grid-template-columns:18px 8px minmax(0,1fr);gap:9px;padding:9px 14px 9px 10px;border-top:1px solid var(--grid);cursor:pointer}
.row.picked{background:var(--gold-soft)}
.row.on.picked{background:rgba(154,106,0,.2)}
.pick{width:16px;height:16px;margin-top:3px;border:1px solid var(--line2);border-radius:4px;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font:11px/1 var(--mono);color:#FFFFFF}
.pick:hover{border-color:var(--key2)}
.row.picked .pick{background:var(--gold);border-color:var(--gold)}
.group{padding:10px 14px 5px;font:11.5px var(--serif);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:var(--gold-soft);flex:none}
.bulk b{font:500 13.5px var(--serif);margin-right:4px}
.bulk .act{padding:3px 10px;font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--key2);font:12.5px var(--serif);padding:2px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row.gone .t,.row.binned .t{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px}
.dot.new{background:var(--new)}
.dot.seen{border:1px solid var(--line2)}
.row .t{font:15px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .o{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
.kind{font:11.5px var(--serif);border-radius:4px;padding:1px 7px;white-space:nowrap}
.kind.seeks{background:var(--brok-soft);color:var(--brok-ink)}
.kind.offers{background:var(--call-soft);color:var(--call-ink)}
.st{font:11.5px var(--serif);border-radius:4px;padding:1px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.interesting{border-color:var(--gold-line);color:var(--gold-ink);background:var(--gold-soft)}
.st.chg{border-style:dashed;color:var(--key2)}
.st.newtag{border-color:var(--new-line);color:var(--new-ink)}
.st.gone{color:var(--warn-ink);border-color:var(--warn-line)}
.empty{padding:22px 16px;color:var(--muted);font-size:14px}
.det{padding:18px 28px 40px;max-width:1180px;container-type:inline-size;container-name:entry}
#detwrap{background:var(--sheet)}
/* The text column takes all the room beside the facts, up to a line of
   about ninety characters: on a full wide screen it was held to seventy
   and left a gulf before the facts, and Mark wanted longer lines there. */
.read{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:32px;margin-top:6px}
.texts{min-width:0}
.sec{margin-top:20px}
.sec h3{font:400 13px var(--serif);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.sec .txt{font-size:16.5px;line-height:1.62;overflow-wrap:anywhere}
.sec .txt p{margin:0 0 .7em}
.sec .txt p.none{color:var(--faint);font-style:italic}
.sec.lead .txt{font-size:17px}
.facts{border-left:1px solid var(--line);padding-left:18px;margin-top:20px;font-size:13.5px;min-width:0}
.facts .f + .f{margin-top:12px}
.facts .fbreak{border-top:1px solid var(--line);margin:16px 0}
.facts .l{font:11px var(--serif);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
/* When the entry pane is narrow (a half-screen window, or an iPad), a
   side column would squeeze the text to a few words a line; there the
   facts become a box above the text, several to a row, and the text gets
   the full width. Measured on the entry itself, not the window, because its
   width is what decides: 644 px inside the padding is a pane of 700. The
   upright iPad's reader holds the entry narrower than that on purpose. */
@container entry (max-width: 644px){
  .read{grid-template-columns:minmax(0,1fr);gap:0}
  .facts{order:-1;border:1px solid var(--line);border-radius:var(--radius);background:var(--field);padding:12px 14px;
         display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 18px}
  .facts .f + .f{margin-top:0}
  .facts .fbreak{grid-column:1/-1;margin:2px 0}
}
.facts .v{white-space:pre-wrap;overflow-wrap:anywhere}
.facts .v.none{color:var(--faint);font-style:italic}
.dhead{display:flex;gap:14px;align-items:flex-start}
.dtitle{font:400 23px/1.25 var(--serif);margin:6px 0 0;text-wrap:balance}
.dsub{color:var(--muted);font-size:14px;margin-top:3px}
/* Mark's notes on a call: a few paragraphs, so written and read at the
   size of an entry's own description, held to a readable line now that
   the pane runs the width of the page. Rich text, because he pastes from
   the call documents and wants the bold and the lists to come along. */
.notebar{display:flex;gap:4px;margin-top:18px;max-width:880px}
.notebar button{background:none;border:1px solid var(--line);border-radius:5px;color:var(--key2);font:13.5px var(--serif);min-width:32px;padding:3px 8px;cursor:pointer}
.notebar button:hover{border-color:var(--line2);background:var(--hover)}
#callNote{position:relative;min-height:60vh;max-width:880px;margin-top:6px;background:var(--field);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink);font:16.5px/1.62 var(--body);padding:14px 18px;overflow-wrap:anywhere}
#callNote:focus{border-color:var(--line2);outline:none}
#callNote.blank::before{content:attr(data-placeholder);position:absolute;top:14px;left:18px;right:18px;color:var(--faint);pointer-events:none}
#callNote p{margin:0 0 .7em}
#callNote h3,#callNote h4{font:600 17.5px/1.4 var(--serif);margin:1em 0 .35em}
#callNote h4{font-size:16px}
#callNote ul,#callNote ol{margin:0 0 .7em;padding-left:1.5em}
#callNote > :first-child,#callNote li > p{margin-top:0}
#callNote li > p{margin-bottom:.2em}
#callNote blockquote{margin:0 0 .7em;padding-left:14px;border-left:2px solid var(--line2);color:var(--muted)}
#callNote a{color:var(--call-ink)}
#callNote table{border-collapse:collapse;margin:0 0 .7em;font-size:14.5px}
#callNote td,#callNote th{border:1px solid var(--line);padding:4px 8px;vertical-align:top;text-align:left}
.notelabel{font:11.5px/16px var(--serif);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.notestate{font-size:12.5px;color:var(--faint);margin-top:6px;min-height:1.2em}
/* The answers stay at the top of the pane while the entry scrolls under
   them: Mark makes up his mind somewhere down a long description and had
   to scroll back up to bin it (2026-10-16). The bar reaches over the
   pane's side padding so the text does not show beside it, and draws its
   rule only once something is under it. */
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:2;background:var(--sheet);margin:8px -28px 0;padding:8px 28px}
.actions.stuck{box-shadow:0 1px 0 var(--line)}
.act{background:none;border:1px solid var(--line2);color:var(--key2);font:13.5px var(--serif);padding:6px 13px;border-radius:var(--radius);cursor:pointer}
.act kbd{font:11px var(--mono);color:var(--faint);margin-left:6px}
.act.interesting.on{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.act.later.on{border-color:var(--key2);color:var(--ink);background:var(--sel)}
.act.bin.on{color:var(--muted);background:var(--hover);text-decoration:line-through}
#why{flex:1;min-width:220px;background:var(--field);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font:13.5px var(--body);padding:6px 10px}
#why::placeholder{color:var(--faint)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:14px var(--serif);padding:6px 0;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--key2)}
.fields{display:grid;grid-template-columns:190px minmax(0,1fr);gap:9px 18px;font-size:14.5px;margin:16px 0 0}
.fields dt{color:var(--muted);font-size:13px;padding-top:2px}
.fields dd{margin:0;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.orig{background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font:13px/1.65 var(--mono);color:var(--key2);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}
.note{margin-top:14px;font-size:13px;color:var(--faint)}
.hist{margin-top:16px;display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 16px;font-size:14px}
.hist .d{font:12.5px var(--mono);color:var(--faint);padding-top:2px}
.diff{font:12.5px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.diff .add{color:var(--new-ink);background:var(--new-soft)}
.diff .del{color:var(--brok-ink);background:var(--brok-soft);text-decoration:line-through}
/* ── the reader, on an iPad held upright ──────────────────────────────
   Upright, the three columns read as a side view: a list and a sliver of
   entry, and the page set wider than the screen cut every entry off at the
   right (Mark, 2026-10-17). There the entry is the page, held to a line of
   about seventy-five characters, and the arenas and the list slide in over
   it from the button at the top left; the arrows beside the search, ← → or
   a sideways swipe turn to the next entry without opening the list. Held
   sideways, and at the desk, nothing here applies. */
.rd{display:none}
.veil{display:none}
@media (orientation:portrait){
  body{min-width:0}
  #total{display:none}
  .rd{display:flex;align-items:center}
  .rd-list{gap:7px;margin-left:-6px;background:none;border:1px solid var(--line2);border-radius:var(--radius);color:var(--key2);font:14px var(--serif);padding:5px 11px 5px 9px;cursor:pointer}
  .rd-step{gap:2px;font:12.5px var(--mono);color:var(--muted);white-space:nowrap}
  .rd-step button{display:flex;background:none;border:0;border-radius:5px;color:var(--key2);padding:6px;cursor:pointer}
  .rd-step button:disabled{color:var(--line2);cursor:default}
  #search{width:220px}
  .cols,.cols.folded,.cols.noting,.cols.folded.noting{grid-template-columns:minmax(0,1fr);position:relative}
  .cols > .col{position:absolute;top:0;bottom:0;z-index:4;background:var(--paper);
    transform:translateX(-640px);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
  .cols > .col:first-child{left:0;width:220px}
  .cols > .col + .col{left:220px;width:360px;box-shadow:6px 0 18px rgba(42,38,32,.16)}
  .cols.folded > .col:first-child{width:44px}
  .cols.folded > .col + .col{left:44px}
  body.drawer .cols > .col{transform:none;visibility:visible;transition:transform .22s ease}
  body.drawer .veil{display:block;position:absolute;inset:0;z-index:3;background:rgba(42,38,32,.28)}
  .det{max-width:700px;margin:0 auto;padding-top:26px}
  .dtitle{font-size:26px}
  .sec .txt,.sec.lead .txt{font-size:18px;line-height:1.65}
  #callNote{max-width:none}
  /* The page turn (see turnPage). The pane takes vertical scrolling for
     itself and leaves sideways movement to the page, and the page in
     motion is a sheet with edges, so two of them side by side read as
     two pages rather than one smear of text. */
  #detwrap{position:relative;overflow-x:hidden;touch-action:pan-y pinch-zoom}
  .det.turning{background:var(--sheet);min-height:100%;box-shadow:0 0 0 1px var(--grid),0 6px 28px rgba(42,38,32,.16);will-change:transform}
  .det.ghost{position:absolute;left:0;right:0;pointer-events:none;z-index:3}
}
@media (orientation:portrait) and (prefers-reduced-motion:reduce){ .cols > .col{transition:none} }
.banner{padding:8px 18px;background:var(--brok-soft);color:var(--warn-ink);font-size:13.5px;flex:none}
/* the login */
#login{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:5}
#login form{width:340px;display:flex;flex-direction:column;gap:10px}
#login h2{font:400 22px var(--serif);margin:0 0 4px}
#login p{color:var(--muted);font-size:13.5px;margin:0 0 6px}
#login input{background:var(--field);border:1px solid var(--line2);border-radius:var(--radius);color:var(--ink);font:15px var(--body);padding:8px 10px}
#login .btn{padding:8px;font-size:15px}
#login .err{color:var(--warn-ink);font-size:13px;min-height:1.2em}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm">
    <h2>Project Watch</h2>
    <p>Log in with the same email and password as the One App.</p>
    <input id="email" type="email" autocomplete="username" placeholder="Email" required>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" type="submit">Log in</button>

<script>
/* The cloud: the One App's own Supabase project. The key is the public one
   (the same as Pocket's BUILT_IN); since the lock it opens nothing without
   Mark's login, which is why it can stand in a public page. */
var CLOUD = { url:'https://eaaggqydnjkufzajgpzh.supabase.co',
  key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhYWdncXlkbmprdWZ6YWpncHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzEwMjMsImV4cCI6MjA5OTI0NzAyM30.pRQPc-qZWV0wwPPnfQU0I_HzmZZ36xZYIXJQYfQG96g' };
var AUTH = 'partnerwatch.auth', VIEW = 'partnerwatch.view';

/* ── the login ─────────────────────────────────────────────────────────
   Pocket's way (pocket/index.html, "the login"): log in once, keep the
   session on this device, renew it a minute before it runs out, and only
   one renewal at a time, because Supabase ends the whole session when the
   same refresh token comes back twice. */
var auth = null, renewing = null;
try { auth = JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch(e){}

function authCall(path, body){
  return fetch(CLOUD.url + '/auth/v1/' + path, {
    method:'POST',
    headers:{ apikey:CLOUD.key, 'Content-Type':'application/json', Authorization:'Bearer ' + CLOUD.key },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
    if (!r.ok){ var e = new Error(j.error_description || j.msg || j.message || r.status); e.status = r.status; throw e; }
    return j;
  }); });
}
function keepAuth(j){
  auth = { access:j.access_token, refresh:j.refresh_token,
           until: j.expires_at ? j.expires_at * 1000 : Date.now() + (j.expires_in || 3600) * 1000 };
  try { localStorage.setItem(AUTH, JSON.stringify(auth)); } catch(e){}
}
function dropAuth(){ auth = null; try { localStorage.removeItem(AUTH); } catch(e){} }
function token(){
  if (!auth || !auth.refresh) return Promise.reject(Object.assign(new Error('not logged in'), { status:401 }));
  if (auth.until - Date.now() > 60000) return Promise.resolve(auth.access);
  if (!renewing) renewing = authCall('token?grant_type=refresh_token', { refresh_token:auth.refresh })
    .then(function(j){ keepAuth(j); renewing = null; return auth.access; },
          function(e){ renewing = null; if (e.status === 400 || e.status === 401) dropAuth(); throw e; });
  return renewing;
}
function api(path, opts){
  opts = opts || {};
  return token().then(function(t){
    var h = Object.assign({ apikey:CLOUD.key, Authorization:'Bearer ' + t }, opts.headers || {});
    if (opts.body) h['Content-Type'] = 'application/json';
    return fetch(CLOUD.url + path, { method:opts.method || 'GET', headers:h,
      body: opts.body ? JSON.stringify(opts.body) : undefined });
  }).then(function(r){
    if (r.status === 401){ dropAuth(); showLogin('Your session ended. Log in again.'); throw new Error('logged out'); }
    if (!r.ok) return r.text().then(function(t){ throw new Error(r.status + ' ' + t.slice(0, 200)); });
    return r.status === 204 ? null : r.json();
  });
}
/* The database hands out a thousand rows per request at most; Water4All
   alone is near three hundred and the four sites past eight hundred. */
function all(path){
  var out = [];
  function page(from){
    return api(path, { headers:{ Range: from + '-' + (from + 999), 'Range-Unit':'items' } })
      .then(function(rows){ out = out.concat(rows); return rows.length < 1000 ? out : page(from + 1000); });
  }
  return page(0);
}

/* ── state ─────────────────────────────────────────────────────────── */
var sites = [], entries = [], lastRun = null, byId = {};
var view = { site:null, kind:'all', state:'open', q:'', id:null, tab:'fields' };
try { Object.assign(view, JSON.parse(localStorage.getItem(VIEW) || '{}'), { q:'' }); } catch(e){}
if (typeof view.fold !== 'boolean') view.fold = matchMedia('(pointer:coarse)').matches;
var detail = {};          // id → { fields, page_text, versions }
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function saveView(){ try { localStorage.setItem(VIEW, JSON.stringify({ site:view.site, kind:view.kind, state:view.state, id:view.id, tab:view.tab, fold:view.fold })); } catch(e){} }
function day(iso){ if (!iso) return ''; var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
function stamp(iso){ if (!iso) return ''; var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }
function siteOf(e){ return sites.find(function(s){ return s.id === e.site; }) || { name:e.site }; }
function title(e){ return e.org || e.contact || ('Entry ' + e.ext_id); }

var COLS = 'id,site,ext_id,url,kind,contact,org,country,topic,keywords,posted,list_text,first_seen,fetched_at,changed_at,removed_at,opened_at,verdict,why,decided_at';
function load(){
  return Promise.all([
    api('/rest/v1/partner_sites?select=*&order=sort'),
    all('/rest/v1/partner_entries?select=' + COLS + '&order=first_seen.desc,id'),
    api('/rest/v1/partner_watch_log?select=*&order=ran_at.desc&limit=1'),
    api('/rest/v1/app_state?id=eq.' + MINE_ROW + '&select=data').catch(function(){ return []; })
  ]).then(function(r){
    sites = r[0]; entries = r[1]; lastRun = r[2][0] || null;
    var mine = (r[3][0] || {}).data || {};
    links = mine.docs || {};
    Object.keys(mine.notes || {}).forEach(function(k){ if (!(k in notes)) notes[k] = mine.notes[k]; });
    byId = {}; entries.forEach(function(e){ byId[e.id] = e; });
    /* Newest first: the night it arrived, then the site's own date where
       it gives one, then the site's own number, which both platforms count
       upwards — the first night brings every entry at once, and without
       this the list would be in no useful order at all. */
    entries.sort(function(a, b){
      return (b.first_seen || '').slice(0, 10).localeCompare((a.first_seen || '').slice(0, 10))
          || (b.posted || '').localeCompare(a.posted || '')
          || (+b.ext_id - +a.ext_id);
    });
    entries.forEach(function(e, i){ e._i = i; });
    if (!sites.some(function(s){ return s.id === view.site; })) view.site = sites.length ? sites[0].id : null;
    regroup();
    $('#banner').hidden = true;
    draw();
  }).catch(function(e){
    if (String(e.message) === 'logged out' || e.status === 401) return;
    $('#banner').textContent = 'Could not reach the cloud: ' + e.message;
    $('#banner').hidden = false;
  });
}

/* ── the filters ─────────────────────────────────────────────────────
   Binned entries stay out of every view but Binned: they are kept so the
   copier never brings them back as new, not so they are seen again. */
var STATES = [['open','All'],['unsorted','Unsorted'],['interesting','Interesting'],['later','Later'],['bin','Binned']];
var KINDS = [['all','Both kinds'],['seeks','Seeks partners'],['offers','Offers expertise']];
function passes(e){
  if (e.site !== view.site) return false;
  if (view.kind !== 'all' && e.kind !== view.kind) return false;
  if (view.state === 'open' && e.verdict === 'bin') return false;
  if (view.state === 'unsorted' && e.verdict) return false;
  if (['interesting','later','bin'].indexOf(view.state) >= 0 && e.verdict !== view.state) return false;
  if (view.q){
    var hay = [e.contact, e.org, e.country, e.topic, e.keywords, e.list_text, e.why].join(' ').toLowerCase();
    if (view.q.toLowerCase().split(/\s+/).some(function(w){ return w && hay.indexOf(w) < 0; })) return false;
  }
  return true;
}
/* Within a site: what is new on top, then Interesting, then Later, then
   the rest (Mark, 2026-10-16), each newest first. The group is fixed when
   the list is drawn afresh — on loading, or on choosing a site, a filter or
   a kind — and not when an entry is opened or flagged: an entry that jumped
   to another group under the cursor would make ↓ skip or repeat entries. */
var GROUPS = ['New', 'Interesting', 'Later', 'Seen', 'Binned'];
function groupOf(e){
  return e.verdict === 'interesting' ? 1 : e.verdict === 'later' ? 2 : e.verdict === 'bin' ? 4 : !e.opened_at ? 0 : 3;
}
function regroup(){ entries.forEach(function(e){ e._g = groupOf(e); }); }
function shown(){
  return entries.filter(passes).sort(function(a, b){ return (a._g - b._g) || (a._i - b._i); });
}
function isNew(e){ return !e.opened_at && !e.verdict; }

/* ── drawing ───────────────────────────────────────────────────────── */
function kindTag(k){ return k === 'seeks' ? '<span class="kind seeks">Seeks partners</span>'
  : k === 'offers' ? '<span class="kind offers">Offers expertise</span>' : ''; }
function stateTags(e){
  return (e.verdict === 'interesting' ? '<span class="st interesting">Interesting</span>'
        : e.verdict === 'later' ? '<span class="st">Later</span>'
        : e.verdict === 'bin' ? '<span class="st">Binned</span>' : '')
       + (e.changed_at && (!e.opened_at || e.changed_at > e.opened_at) ? '<span class="st chg">Changed</span>' : '')
       + (e.removed_at ? '<span class="st gone">Gone from site</span>' : '');
}
/* Where each arena's scroll points: the call text's own PDF to start
   with, and whatever Mark puts there with the pencil after that. His links,
   and his notes on each call, are kept in the cloud in app_state under a
   row of their own, because his login may write that table and only reads
   partner_sites; so what is set on one device is there on the others. An
   empty link is kept too: it means no scroll, not the starting link back.
   The phone's page (pocket/index.html here) holds a copy of these as
   PW_DOCS; a change to one is a change to both. */
var DOCS = {
  sbep:       'https://www.bluepartnership.eu/sites/bluepartnership.eu/files/documents/2026-10/sbep_jtc_2026_4th_call_announcement_061026_0.pdf',
  water4all:  'https://www.water4all-partnership.eu/sites/default/files/2026-09/Call_Announcement_Water4All_JTC2026_20260908.pdf',
  biodiversa: 'https://www.biodiversa.eu/wp-content/uploads/2026/09/BiodivFuture_Doc1_Announcement-opportunity.pdf',
  forest:     'https://forest-partnership.eu/wp-content/uploads/2026/09/260915_FOREST_JC2026_Call_Announcement_FINAL-1.pdf',
  dut:        'https://dutpartnership.eu/sites/default/files/2026-10/DUT%20Call%202026_Call%20Text_0.pdf',
  eppermed:   'https://www.eppermed.eu/wp-content/uploads/EPPerMed_JTC2027_pre-announcement.pdf'
};
var MINE_ROW = 'partnerwatch', links = {}, notes = {}, editingLinks = false;
function docsOf(id){ return Object.prototype.hasOwnProperty.call(links, id) ? links[id] : (DOCS[id] || ''); }
function svg(size, paths){ return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>'; }
var PENCIL = svg(14, '<path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/><path d="M14.5 5.5l4 4"/>');
var SCROLL = svg(17, '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/>'
  + '<path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>');
function noteIcon(full){ return svg(16, '<path d="M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/>'
  + (full ? '<path d="M7 13h10"/><path d="M7 17h6"/>' : '')); }
$('.rd-list').innerHTML = svg(17, '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>') + 'Entries';
$('[data-step="-1"]').innerHTML = svg(18, '<path d="M15 6l-6 6 6 6"/>');
$('[data-step="1"]').innerHTML = svg(18, '<path d="M9 6l6 6-6 6"/>');
function drawSites(){
  /* No "All sites": Mark works one site at a time (2026-10-16). */
  var h = '', typed = {}, errs = {};
  document.querySelectorAll('[data-linkfor]').forEach(function(i){ typed[i.dataset.linkfor] = i.value; });
  document.querySelectorAll('[data-errfor]').forEach(function(d){ errs[d.dataset.errfor] = d.textContent; });
  sites.forEach(function(s){
    if (editingLinks){
      h += '<div class="arena editing"><div class="nm">' + esc(s.name) + '</div>'
         + '<input type="url" spellcheck="false" data-linkfor="' + esc(s.id) + '" aria-label="Call documents link of ' + esc(s.name) + '" value="' + esc(s.id in typed ? typed[s.id] : docsOf(s.id)) + '">'
         + '<div class="err" data-errfor="' + esc(s.id) + '">' + esc(errs[s.id] || '') + '</div></div>';
      return;
    }
    var doc = docsOf(s.id), hasNote = !!noteText(notes[s.id]);
    h += '<div class="arena"><button class="site' + (view.site === s.id ? ' on' : '') + '" data-site="' + esc(s.id) + '">'
       + '<div class="nm">' + esc(s.name) + '</div><div class="sub">' + esc(s.call || '') + '</div>'
       + (s.last_error ? '<div class="err">Last read failed, ' + esc(stamp(s.last_error_at)) + ': ' + esc(s.last_error) + '</div>' : '')
       + '</button>'
       + (doc ? '<a class="docs" href="' + esc(doc) + '" target="_blank" rel="noopener" title="Call documents" aria-label="Call documents of ' + esc(s.name) + '">' + SCROLL + '</a>' : '')
       + '<button class="cnote' + (view.note === s.id ? ' on' : '') + '" data-callnote="' + esc(s.id) + '" title="' + (hasNote ? 'Your notes on this call' : 'Write notes on this call') + '" aria-label="Notes on the call of ' + esc(s.name) + '">' + noteIcon(hasNote) + '</button>'
       + '</div>';
  });
  if (editingLinks) h += '<div class="linkbar">The link each scroll opens, such as the call text\'s PDF. Empty for no scroll.'
    + '<div class="lbtns"><button class="btn" data-savelinks="1">Save</button><button class="btn" data-cancellinks="1">Cancel</button></div></div>';
  $('#sites').innerHTML = h;
  $('.editlinks').innerHTML = PENCIL;
  $('.editlinks').hidden = editingLinks;
  $('.fold').innerHTML = svg(16, '<path d="M15 6l-6 6 6 6"/>');
  $('.unfold').innerHTML = svg(16, '<path d="M9 6l6 6-6 6"/>') + '<span>Arenas</span>';
  $('.cols').classList.toggle('folded', view.fold);
  if (editingLinks && !Object.keys(typed).length){ var first = $('[data-linkfor]'); if (first) first.focus(); }
  var waiting = entries.filter(function(e){ return !e.fetched_at && !e.removed_at; }).length;
  $('#runbox').innerHTML = (lastRun
      ? '<b>Last check ' + esc(stamp(lastRun.ran_at)) + '</b><br>' + lastRun.added + ' new · ' + lastRun.changed + ' changed · ' + lastRun.removed + ' gone'
        + (lastRun.errors ? '<br><span style="color:var(--warn-ink)">' + esc(lastRun.errors.split('\n')[0]) + '</span>' : '')
      : '<b>Not checked yet</b><br>The copier runs every night.')
    + (waiting ? '<br>' + waiting + ' entry pages still to copy' : '')
    + '<button class="btn" id="checkNow">Check now</button>';

}
function drawFilters(){
  function chips(list, key){ return list.map(function(c){
    return '<button class="chip' + (view[key] === c[0] ? ' on' : '') + '" data-' + key + '="' + c[0] + '">' + c[1] + '</button>'; }).join(''); }
  $('#filters').innerHTML = chips(STATES, 'state') + '<span class="sep"></span>' + chips(KINDS, 'kind');
}
function drawRows(){
  var s = sites.find(function(x){ return x.id === view.site; });
  $('#listhead').textContent = s ? s.name : '';
  var list = shown();
  $('#listcount').textContent = list.length + ' shown';
  drawStep();
  if (!entries.length){
    $('#rows').innerHTML = '<div class="empty">Nothing copied yet. Press <b>Check now</b> to read the arenas; their entries appear here at once, and the full entry pages follow over the night.</div>';
    return;
  }
  if (!list.length){ $('#rows').innerHTML = '<div class="empty">No entries match. Try All, Both kinds, or clear the search.</div>'; return; }
  /* Drawn in one go: eight hundred rows of plain markup is quicker than any
     scheme for drawing only the visible ones, and keeps Find in page working. */
  var per = {}; list.forEach(function(e){ per[e._g] = (per[e._g] || 0) + 1; });
  var last = -1;
  $('#rows').innerHTML = list.map(function(e){
    var sub = [e.org && e.contact ? e.contact : null, e.country].filter(Boolean).join(' · ');
    var head = e._g !== last ? '<div class="group"><span>' + GROUPS[e._g] + '</span><span>' + per[e._g] + '</span></div>' : '';
    last = e._g;
    var picked = sel.has(e.id);
    /* A row is a div and not a button, because the tick box inside it is
       a button of its own, and a button may not hold another. */
    return head + '<div class="row' + (e.id === view.id && !view.note ? ' on' : '') + (picked ? ' picked' : '') + (e.removed_at ? ' gone' : '') + (e.verdict === 'bin' ? ' binned' : '')
      + '" data-id="' + esc(e.id) + '" role="button" tabindex="0">'
      + '<button class="pick" data-pick="' + esc(e.id) + '" aria-pressed="' + picked + '" aria-label="Select">' + (picked ? '✓' : '') + '</button>'
      + '<span class="dot ' + (isNew(e) ? 'new' : 'seen') + '"></span><span style="min-width:0">'
      + '<div class="t">' + esc(title(e)) + '</div><div class="o">' + esc(sub) + '</div>'
      + '<div class="tags">' + kindTag(e.kind) + stateTags(e) + '</div></span></div>';
  }).join('');
  drawBulk();
}
/* ── choosing several ────────────────────────────────────────────────
   The tick box picks an entry; shift picks every entry between it and the
   last one picked; Ctrl or ⌘ on a row picks it too. With anything picked,
   the bar's buttons and the keys I L B answer all of them at once. */
var sel = new Set(), anchor = null;
function drawBulk(){
  var b = $('#bulk');
  if (!sel.size){ b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = '<b>' + sel.size + ' selected</b>'
    + '<button class="act" data-bulk="interesting">Interesting</button>'
    + '<button class="act" data-bulk="later">Later</button>'
    + '<button class="act" data-bulk="bin">Bin</button>'
    + '<button class="act" data-bulk="none">Unsort</button>'
    + '<button class="act" data-bulk="read">Mark seen</button>'
    + '<span class="grow"></span>'
    + '<button class="linkbtn" data-bulk="all">Select all ' + shown().length + '</button>'
    + '<button class="linkbtn" data-bulk="clear">Clear</button>';
}
function pick(id, range){
  if (range && anchor){
    var list = shown(), a = list.findIndex(function(e){ return e.id === anchor; }), b = list.findIndex(function(e){ return e.id === id; });
    if (a >= 0 && b >= 0){
      list.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(function(e){ sel.add(e.id); });
      drawRows(); return;
    }
  }
  if (sel.has(id)) sel.delete(id); else sel.add(id);
  anchor = id;
  drawRows();
}
function bulk(what){
  if (what === 'all'){ shown().forEach(function(e){ sel.add(e.id); }); drawRows(); return; }
  if (what === 'clear'){ sel.clear(); drawRows(); return; }
  var list = [...sel].map(function(id){ return byId[id]; }).filter(Boolean);
  var now = new Date().toISOString();
  var vals = what === 'read' ? { opened_at:now }
           : what === 'none' ? { verdict:null, decided_at:null }
           : { verdict:what, decided_at:now };
  if (what === 'read') list = list.filter(function(e){ return !e.opened_at; });
  patchMany(list, vals);
  sel.clear();
  drawSites(); drawRows(); drawDetail();
}
/* An entry as Mark chose to read it (2026-10-16): the long texts down the
   middle, whole, with the project description first because it says what
   they are after, and every short fact in a narrow column beside them, so
   who and where stay in view without scrolling. Nothing is sorted into
   boxes of ours: every pair the site gives is shown, in the site's own
   words and, within each column, in the site's own order. Only a pair the
   page repeats word for word (EPSS prints "Looking for" twice) is shown once.
   Long values are never cut short behind a "Show all": he turned that down.
   The one exception to the site's order is the top of the facts column
   (Mark, 2026-10-16): who it is comes first, in his words for it whatever
   the site calls it, then a break, then the rest with the call topic first,
   kept in the column even when it runs long. */
/* A b2match entry's title is its headline (DUT, 2026-10-17): in the side
   column it read as one more fact, so it heads the middle instead. */
var MIDDLE = /description|cooperation interest|^title$/i;
var WHO = [[/^(organisation name|name of organisation\/institution\/company)$/i, 'Name of organisation'],
           [/^country$/i, 'Country'], [/^(name|contact name)$/i, 'Contact name'], [/^(email|email address)$/i, 'Email']];
var TOPIC = /^(topics?|priority areas|disciplines)$/i;
function isLongField(f){ return !TOPIC.test(f[0]) && (MIDDLE.test(f[0]) || String(f[1] || '').length > 220 || /\n\s*\n/.test(f[1] || '')); }

function entryBody(fields){

   hard to see that anything had turned at all (Mark, 2026-10-17). Now the
   page leaves to one side and the next comes in from the other, both in
   view at once, and under a finger the page follows the finger first.
   The leaving page is a copy of the entry as it stood, laid where it was
   on screen, because the entry itself is redrawn for the next one at once.
   The curve decelerates, as a page let go of does; the start waits two

var swipe = null;
function neighbour(d){
  var list = shown(), i = list.findIndex(function(e){ return e.id === view.id; });
  return i >= 0 && !!list[i + d];
}
function springBack(){
  var det = $('#det');
  det.style.transition = 'transform 220ms cubic-bezier(.22,.7,.25,1)';
  det.style.transform = 'translateX(0)';
  setTimeout(function(){ if (!turning){ det.classList.remove('turning'); det.style.transition = ''; det.style.transform = ''; } }, 260);
}
$('#detwrap').addEventListener('touchstart', function(ev){
  swipe = upright.matches && !view.note && view.id && ev.touches.length === 1 && !ev.target.closest('.actions,input,[contenteditable]')
    ? { x:ev.touches[0].clientX, y:ev.touches[0].clientY, t:Date.now(), axis:null, dx:0 } : null;
}, { passive:true });
$('#detwrap').addEventListener('touchmove', function(ev){
  if (!swipe || ev.touches.length !== 1) return;
  var dx = ev.touches[0].clientX - swipe.x, dy = ev.touches[0].clientY - swipe.y;
  if (!swipe.axis){
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    swipe.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
    if (swipe.axis === 'x'){ settleTurn(); $('#det').classList.add('turning'); }
  }
  if (swipe.axis !== 'x') return;
  swipe.dx = neighbour(dx < 0 ? 1 : -1) ? dx : dx * 0.3;
  var det = $('#det');
  det.style.transition = 'none';
  det.style.transform = 'translateX(' + swipe.dx + 'px)';
}, { passive:true });
function letGo(ev){
  if (!swipe) return;
  var sw = swipe; swipe = null;
  if (sw.axis !== 'x') return;
  var W = $('#detwrap').clientWidth, fast = Math.abs(sw.dx) > 30 && Math.abs(sw.dx) / (Date.now() - sw.t) > 0.45;
  var d = sw.dx < 0 ? 1 : -1;
  if (ev.type === 'touchend' && (Math.abs(sw.dx) > W / 5 || fast) && neighbour(d)) step(d, sw.dx);
  else springBack();
}
$('#detwrap').addEventListener('touchend', letGo);
$('#detwrap').addEventListener('touchcancel', letGo);
upright.addEventListener('change', function(){ if (!upright.matches) drawer(false); });
$('#search').addEventListener('input', function(){ view.q = this.value; drawRows(); });
/* The keys: ↑ ↓ walk the list, I L B answer the open entry (or all the
   picked ones), X picks the open entry, Esc lets go of the picked ones.
   Not while typing, or a search for "Ireland" would flag three entries. */
document.addEventListener('keydown', function(ev){
  if (ev.target.dataset && ev.target.dataset.linkfor){
    if (ev.key === 'Enter'){ ev.preventDefault(); saveLinks(); }
    else if (ev.key === 'Escape') cancelLinks();
    return;
  }
  if (ev.target.matches('input,textarea') || ev.target.isContentEditable || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var k = ev.key;
  /* With a call's notes open no entry is on screen, so the letters that
     answer an entry would answer one Mark cannot see. */
  if (view.note && /^[ilbx]$/i.test(k)) return;
  if (k === 'ArrowDown' || k === 'ArrowUp' || (upright.matches && (k === 'ArrowRight' || k === 'ArrowLeft'))){
    if (view.note) return;
    if (step(k === 'ArrowDown' || k === 'ArrowRight' ? 1 : -1)) ev.preventDefault();
  } else if (k === 'Escape' && document.body.classList.contains('drawer')){
    drawer(false);
  } else if (/^[ilb]$/i.test(k)){
    setVerdict({ i:'interesting', l:'later', b:'bin' }[k.toLowerCase()]);
  } else if (/^x$/i.test(k) && view.id){
    pick(view.id, ev.shiftKey);
  } else if (k === 'Escape' && sel.size){
    sel.clear(); drawRows();
  } else if (k === 'Enter' && ev.target.dataset && ev.target.dataset.id){
    openEntry(ev.target.dataset.id);
  }
});

function showLogin(msg){ $('#loginErr').textContent = msg || ''; $('#login').hidden = false; $('#email').focus(); }
$('#loginForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  $('#loginErr').textContent = '';
  authCall('token?grant_type=password', { email:$('#email').value.trim(), password:$('#pass').value })
    .then(function(j){ keepAuth(j); $('#pass').value = ''; $('#login').hidden = true; return load(); })
    .then(function(){ if (view.id && byId[view.id]) openEntry(view.id); })
    .catch(function(e){ $('#loginErr').textContent = e.message === 'Invalid login credentials' ? 'That email and password do not match.' : e.message; });
});

if (!auth) showLogin();
else load().then(function(){ if (view.id && byId[view.id]) openEntry(view.id); });
</script>
