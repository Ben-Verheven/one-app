<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Mark’s Place">
<link rel="icon" type="image/png" href="pocket/icon.png">
<link rel="apple-touch-icon" href="pocket/icon.png">
<title>Mark’s Place</title>
<!--
  Mark’s Place (Partner Watch until 2026-10-16, then Project Watch, and
  for an afternoon MARK-it Place, MARKetplace and two spellings of this,
  until 2026-10-17, then Mark't Place until 2026-10-18, then Marked Place until 2026-10-21) — the partner-search entries of the brokerage sites,
  which Mark calls venues, as the Marketplace does (arenas until
  2026-10-17), copied
  every night by the partner-copier function (supabase/8-…), browsed here:
  site, list, entry. One file on its own while it is tried out; it is drawn
  in the Marketplace room's colours and type so that it can move into the
  One App later as a room or a Marketplace view without being redrawn.

  It reads and writes only through the cloud, behind the same login as the
  One App, because the entries hold people's names and emails
  and the repository is public.
-->
<style>
:root{
  color-scheme:light;
  /* Warm paper (Mark chose the all-light option on 2026-10-16, over the
     Marketplace's dark ground: long descriptions read far easier dark on
     light). The tones are the Marketplace's own light sheet, the one its
     pop-up cards wear, so a move into the One App can still borrow them. */
  --paper:#EFE9DC; --panel:#E6DFCF; --field:#FCFAF3; --sheet:#FAF7F0;
  --ink:#282420; --muted:#5E574B;
  /* The sheet's --faint, struck deep enough to read at 12 px on all three
     grounds here (paper, bar, sheet). */
  --faint:#6A6250;
  --key:#6E6656; --key2:#3A342C;
  --grid:rgba(42,38,32,.10); --line:rgba(42,38,32,.18); --line2:rgba(42,38,32,.32);
  --hover:rgba(42,38,32,.05); --sel:rgba(42,38,32,.09);
  --brok:#C2382C; --brok-ink:#8E241B; --brok-soft:rgba(194,56,44,.13);
  --call:#4646B8; --call-ink:#33338F; --call-soft:rgba(70,70,184,.13);
  --new:#6C8E1C; --new-ink:#43590E; --new-soft:rgba(140,190,40,.16); --new-line:rgba(108,142,28,.5);
  --gold:#9A6A00; --gold-ink:#6B4A00; --gold-soft:rgba(154,106,0,.13); --gold-line:rgba(154,106,0,.45);
  --warn-ink:#8E241B; --warn-line:rgba(142,36,27,.35);
  --serif:'Optima','Palatino Linotype','Book Antiqua',Georgia,serif;
  --body:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,Menlo,monospace;
  --radius:7px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column;min-width:900px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--key2);outline-offset:1px}
[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.bar h1{font:400 19px var(--serif);margin:0;letter-spacing:.02em}
.grow{flex:1}
.btn{background:none;border:1px solid var(--line2);color:var(--key2);font:13.5px var(--serif);padding:5px 12px;border-radius:var(--radius);cursor:pointer}
.btn:hover{border-color:var(--key)}
.btn:disabled{color:var(--faint);cursor:default}
.meta{font:12px var(--mono);color:var(--faint)}
/* The search box holds its terms as chips, the Topic Atlas's way (Mark,
   2026-10-22): a term is typed and given with Enter, then the next. */
#sbox{display:flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:2px 4px 2px 6px;min-width:260px;max-width:min(560px,48vw);overflow-x:auto;scrollbar-width:none}
#sbox:focus-within{border-color:var(--line2)}
#schips{display:flex;gap:4px;flex:none}
.schip{display:inline-flex;align-items:center;gap:2px;padding:0 2px 0 8px;border:1px solid var(--line2);border-radius:99px;font:13px var(--body);color:var(--ink);background:var(--sheet);white-space:nowrap}
.schip button{border:0;background:none;color:var(--muted);font:14px var(--body);padding:0 5px;cursor:pointer}
.schip button:hover{color:var(--warn-ink)}
#search{flex:1;min-width:110px;border:0;outline:none;background:none;color:var(--ink);font:14px var(--body);padding:3px 4px}
#search::placeholder{color:var(--faint)}
/* ── the reader ──────────────────────────────────────────────────────
   The entry is the page, on every screen (Mark, 2026-10-17). It was so on
   the upright iPad only, where three columns had read as a side view; he
   chose it for the desk too, over three columns side by side, a drawer
   that shows the venues and then a venue's entries, and an overview page
   apart from the reader, drawn side by side. Entries at the top left
   slides the venues and the chosen venue's entries in over the entry,
   side by side, and takes them away again; ← → or a sideways swipe turn
   to the next entry without them. The venues are wide enough to stand in
   one line each with their arenas under them, so most of them are in view
   at once. */
/* The page clips what is parked beside it: the Semaphore's panel waits
   past the right edge, and unclipped it made the page 400 px wider than
   the screen, which the iPad answered by shrinking the whole page to fit
   (Mark, 2026-10-18: the venues, the entries and Entries all smaller). */
.cols{flex:1;min-height:0;position:relative;display:flex;overflow:hidden;overflow:clip}
.cols > .col{position:absolute;top:0;bottom:0;z-index:4;background:var(--paper);
  transform:translateX(-860px);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.cols > .col:first-child{left:0;width:420px}
.cols > .col + .col{left:420px;width:400px;box-shadow:8px 0 22px rgba(42,38,32,.16)}
body.drawer .cols > .col{transform:none;visibility:visible;transition:transform .22s ease}
.veil{display:none}
body.drawer .veil{display:block;position:absolute;inset:0;z-index:3;background:rgba(42,38,32,.28)}
@media (prefers-reduced-motion:reduce){ .cols > .col{transition:none} }
.col{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;min-height:0;flex:1}
/* One line height for both heads, whatever their type: the list's count in
   typewriter type stood taller than the word beside it and dropped the
   list's head two pixels below the arenas' head. */
.colhead{padding:12px 14px 8px;font:11.5px/16px var(--serif);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.colhead .meta{line-height:16px}
/* A venue is a row like the Brokerage Semaphore's Venues tab: its name on
   one line, with its counts at the end of it, and the arenas
   it serves in one line under it (Mark, 2026-10-17: "I like the way you get
   overview then"). Its call is said at the head of its entries instead. The
   cards before were three lines and their icons stacked beside them, a
   hundred pixels a venue. The scroll and the note stood at the end of the
   name until they moved into the venue's panel (Mark, 2026-10-21). */
.venue{position:relative;border-bottom:1px solid var(--grid)}
.site{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 13px 7px 13px;cursor:pointer}
.site:hover{background:var(--hover)}
.site.on{background:var(--sel);border-left-color:var(--key2)}
.site .l1{grid-column:1;grid-row:1;display:flex;align-items:baseline;gap:10px;min-width:0}
.site .nm{font:15px/1.35 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* Its counts, in two kinds, as on the phone (Mark, 2026-10-22, from a
   sheet of three drawn on both pages, for "unity, not similarity"): what
   asks for him, how many Marked and how many new, at the right of the
   name, as the phone's star and its green badge drawn in this page's
   type; and how big the venue is, the entries it still holds with the
   binned not counted, in quiet grey on the arenas' line, which on the
   phone is the grey line under the name. A venue without arenas has it
   beside the name. Before that day the three were words, and before
   them discs of three kinds that never sat right (see the note); a "2m"
   badge at the end of the arenas read as one more arena. */
.site .c1,.site .c2{grid-column:2;display:flex;justify-content:flex-end;align-items:center;gap:8px;font:12.5px/1.35 var(--serif);white-space:nowrap}
.site .c1{grid-row:1;align-self:center}
.site .c2{grid-row:2;align-self:center;margin-top:3px}
.site .c1 .mk{display:flex;align-items:center;gap:3px;color:var(--gold-ink)}
.site .c1 .mk svg{width:12px;height:12px}
/* the badge soft rather than solid, a tint of new with its ink and a
   rule of it round (Mark, 2026-10-22: the solid disc stood out too much
   on the paper) */
.site .c1 .nw{min-width:19px;height:19px;padding:0 6px;border:1px solid var(--new-line);border-radius:99px;background:var(--new-soft);color:var(--new-ink);font-size:12px;line-height:17px;text-align:center}
.site .c1 .mo,.site .c2 .mo{font-size:12px;color:var(--muted)}
/* The venues stand in the Marketplace's groups, each under a thin band in
   its type's colour, and carry the arenas they serve as the Marketplace's
   tags do: the arena's tone struck into the paper with a rule of it down
   the left, the name in full ink (Mark, 2026-10-17: "a bit the same
   colours"). The tones are the Marketplace's own; see `TONES` below. */
.vgrp{display:flex;align-items:center;gap:8px;height:22px;margin:12px 0 0;padding:0 9px 0 12px;border-radius:0 var(--radius) var(--radius) 0;
  background:color-mix(in srgb,var(--tone,#7D7466) 26%,var(--paper));box-shadow:inset 3px 0 0 var(--tone,var(--line2));
  font:600 9.5px var(--serif);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.vgrp:first-child{margin-top:0}
.vgrp b{font:10px var(--mono);font-weight:400;letter-spacing:0;color:var(--key2)}
/* The second line carries the arenas. Each arena keeps its whole
   name, and those that do not fit fade out at the end of the line, which
   says there are more: a "+2" after three cut names cluttered the venues
   (Mark, 2026-10-21). The venue's panel names them all. */
.site .l2{grid-column:1;grid-row:2;display:flex;align-items:baseline;gap:10px;margin-top:3px;min-width:0}
.site .tags{display:flex;flex-wrap:nowrap;gap:4px;overflow:hidden;min-width:0;margin-top:0}
.site .tags.over{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 46px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 46px),transparent)}
.site .tag{flex:none;padding:0 7px 1px 6px;font:italic 12px/1.45 var(--body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--tone) 30%,var(--paper));border-left:3px solid var(--tone);border-radius:0 var(--radius) var(--radius) 0}
/* The pencil in the column's head turns every arena into its link field at
   once, with one Save under them all (Mark, 2026-10-16). */
.colhead .editlinks{border:0;background:none;padding:2px 4px;margin:-2px 0;border-radius:5px;color:var(--key);cursor:pointer;display:flex}
.colhead .editlinks:hover{color:var(--key2);background:var(--hover)}
.venue.editing{padding:9px 12px 11px 14px}
.venue.editing .nm{font:15px var(--serif);margin-bottom:4px}
.venue.editing input{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:var(--radius);color:var(--ink);font:13px var(--body);padding:5px 8px}
.venue.editing .err{font-size:12px;color:var(--warn-ink);margin-top:4px}
.linkbar{padding:10px 14px 4px;font-size:12.5px;color:var(--muted)}
.linkbar .lbtns{display:flex;gap:6px;margin-top:8px}
.linkbar .btn{padding:3px 12px;font-size:12.5px}
.site .err{grid-column:1 / -1;font-size:12px;color:var(--warn-ink);margin-top:3px;overflow-wrap:anywhere;white-space:normal}
/* A failed read is one small line that opens on a tap (Mark, 2026-10-22:
   four lines of the raw message under each venue were "so big"). */
.errx{display:inline-block;font-size:12px;color:var(--warn-ink);cursor:pointer;margin-top:3px}
.errx::after{content:' ›'}
.errx.open::after{content:' ⌄'}
.errx .full{display:block;white-space:pre-line;overflow-wrap:anywhere;margin-top:2px;color:var(--warn-ink)}
.site .errx{grid-column:1 / -1}
.runbox{display:flex;align-items:center;gap:12px;padding:9px 14px 10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45;color:var(--muted);flex:none}
.runbox .say{flex:1;min-width:0}
.runbox b{color:var(--ink);font-weight:500}
.runbox .btn{flex:none;padding:3px 11px;font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;flex:none}
.chip{font:12px var(--serif);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:none;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--line2);background:var(--sel)}
.sep{width:100%;height:0}
.row{display:grid;grid-template-columns:18px 8px minmax(0,1fr);gap:9px;padding:9px 14px 9px 10px;border-top:1px solid var(--grid);cursor:pointer}
.row.picked{background:var(--gold-soft)}
.row.on.picked{background:rgba(154,106,0,.2)}
.pick{width:16px;height:16px;margin-top:3px;border:1px solid var(--line2);border-radius:4px;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font:11px/1 var(--mono);color:#FFFFFF}
.pick:hover{border-color:var(--key2)}
.row.picked .pick{background:var(--gold);border-color:var(--gold)}
.group{padding:10px 14px 5px;font:11.5px var(--serif);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:var(--gold-soft);flex:none}
.bulk b{font:500 13.5px var(--serif);margin-right:4px}
.bulk .act{padding:3px 10px;font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--key2);font:12.5px var(--serif);padding:2px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row.gone .t,.row.binned .t{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px}
.dot.new{background:var(--new)}
.dot.seen{border:1px solid var(--line2)}
.row .t{font:15px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .o{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lt{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colhead .call{text-transform:none;letter-spacing:0;font:italic 13px var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
.kind{font:11.5px var(--serif);border-radius:4px;padding:1px 7px;white-space:nowrap}
.kind.seeks{background:var(--brok-soft);color:var(--brok-ink)}
.kind.offers{background:var(--call-soft);color:var(--call-ink)}
.st{font:11.5px var(--serif);border-radius:4px;padding:1px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.interesting{border-color:var(--gold-line);color:var(--gold-ink);background:var(--gold-soft)}
.st.chg{border-style:dashed;color:var(--key2)}
.st.newtag{border-color:var(--new-line);color:var(--new-ink)}
.st.gone{color:var(--warn-ink);border-color:var(--warn-line)}
.empty{padding:22px 16px;color:var(--muted);font-size:14px}
.det{padding:18px 28px 40px;max-width:1120px;container-type:inline-size;container-name:entry}
#detwrap{background:var(--sheet)}
/* The programme and topic over the title, their names set apart from
   what they name, as on a lead's sheet */
.where{display:grid;grid-template-columns:92px minmax(0,1fr);gap:1px 0;margin:8px 0 0;align-items:baseline}
.where dt{font:11px var(--serif);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.where dd{margin:0;font-size:14px;color:var(--ink)}
/* The box: the organisation, the contact and the dates side by side, the
   site's other facts under a rule in the same three columns */
.ebox{border:1px solid var(--line);border-radius:var(--radius);background:var(--field);margin-top:20px;font-size:13.5px}
.ebox .l{font:11px var(--serif);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.egroups,.erest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.egroups{padding:12px 0}
.eg{padding:2px 16px;min-width:0;overflow-wrap:anywhere}
.eg + .eg{border-left:1px solid var(--line)}
.eg .main{font-size:15.5px;line-height:1.35;margin-bottom:2px}
.eg .em{font-style:italic;color:var(--muted)}
.eg a,.erest a{color:var(--key2)}
.erest{gap:10px 0;padding:10px 0 12px}
.egroups + .erest{border-top:1px solid var(--line)}
.erest .f{padding:0 16px;min-width:0}
.erest .v{white-space:pre-wrap;overflow-wrap:anywhere}
.erest .v.none{color:var(--faint);font-style:italic}
.sec{margin-top:20px}
.sec h3{font:400 13px var(--serif);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.sec .txt{font-size:16.5px;line-height:1.62;overflow-wrap:anywhere}
.sec .txt p{margin:0 0 .7em}
.sec .txt p.none{color:var(--faint);font-style:italic}
.sec.lead .txt{font-size:17px}
.dhead{display:flex;gap:14px;align-items:flex-start}
.dtitle{font:400 23px/1.25 var(--serif);margin:6px 0 0;text-wrap:balance}
.dsub{color:var(--muted);font-size:14px;margin-top:3px}
.dshare{display:flex;gap:6px;flex:none}
/* A lead's sheet, printed on its own (see "a lead's sheet"): everything
   else is put away, so the PDF holds the project and nothing of the app.
   The page wears the reader's own ground, edge to edge, so the browser is
   told to print its colours even when its background setting is off, and
   the page's margin is the sheet's own padding, repeated on every page,
   because the browser leaves a page margin white. */
#sheet{display:none}
@media print{
  @page{margin:0}
  html,body{height:auto;background:#FAF7F0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{display:block;min-width:0}
  body > :not(#sheet){display:none!important}
  #sheet{display:block;padding:12mm 10mm;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  #sheet > table{max-width:none!important}
}
/* Mark's notes on a call: a few paragraphs, so written and read at the
   size of an entry's own description, held to a readable line now that
   the pane runs the width of the page. Rich text, because he pastes from
   the call documents and wants the bold and the lists to come along. */
.notebar{display:flex;gap:4px;margin-top:18px;max-width:880px}
.notebar button{background:none;border:1px solid var(--line);border-radius:5px;color:var(--key2);font:13.5px var(--serif);min-width:32px;padding:3px 8px;cursor:pointer}
.notebar button:hover{border-color:var(--line2);background:var(--hover)}
#callNote{position:relative;min-height:60vh;max-width:880px;margin-top:6px;background:var(--field);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink);font:16.5px/1.62 var(--body);padding:14px 18px;overflow-wrap:anywhere}
#callNote:focus{border-color:var(--line2);outline:none}
#callNote.blank::before{content:attr(data-placeholder);position:absolute;top:14px;left:18px;right:18px;color:var(--faint);pointer-events:none}
#callNote p{margin:0 0 .7em}
#callNote h3,#callNote h4{font:600 17.5px/1.4 var(--serif);margin:1em 0 .35em}
#callNote h4{font-size:16px}
#callNote ul,#callNote ol{margin:0 0 .7em;padding-left:1.5em}
#callNote > :first-child,#callNote li > p{margin-top:0}
#callNote li > p{margin-bottom:.2em}
#callNote blockquote{margin:0 0 .7em;padding-left:14px;border-left:2px solid var(--line2);color:var(--muted)}
#callNote a{color:var(--call-ink)}
#callNote table{border-collapse:collapse;margin:0 0 .7em;font-size:14.5px}
#callNote td,#callNote th{border:1px solid var(--line);padding:4px 8px;vertical-align:top;text-align:left}
.notelabel{font:11.5px/16px var(--serif);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.notestate{font-size:12.5px;color:var(--faint);margin-top:6px;min-height:1.2em}
/* The answers stay at the top of the pane while the entry scrolls under
   them: Mark makes up his mind somewhere down a long description and had
   to scroll back up to bin it (2026-10-16). The bar reaches over the
   pane's side padding so the text does not show beside it, and draws its
   rule only once something is under it. */
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:2;background:var(--sheet);margin:8px -28px 0;padding:8px 28px}
.actions.stuck{box-shadow:0 1px 0 var(--line)}
.act{background:none;border:1px solid var(--line2);color:var(--key2);font:13.5px var(--serif);padding:6px 13px;border-radius:var(--radius);cursor:pointer}
.act kbd{font:11px var(--mono);color:var(--faint);margin-left:6px}
.act.interesting.on{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.act.bin.on{color:var(--muted);background:var(--hover);text-decoration:line-through}
#why{flex:1;min-width:220px;background:var(--field);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font:13.5px var(--body);padding:6px 10px}
#why::placeholder{color:var(--faint)}
/* Make lead, in the leads' clay as the Semaphore's drawer wears it, struck
   deep enough for 7:1 on the sheet; once made it names the arena and opens it */
.act.mklead{border-color:rgba(141,85,69,.55);color:#7a4536}
.act.mklead.made{background:rgba(141,85,69,.12)}
.act.mklead:disabled{color:var(--faint);cursor:default}
.mkask{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#mkArena{background:var(--field);border:1px solid var(--line2);border-radius:var(--radius);color:var(--ink);font:13.5px var(--body);padding:5px 8px;max-width:280px}
/* A line written is lit in the gold of Marked, so a glance says the entry
   carries a note (Mark, 2026-10-18: an empty field and a filled one looked
   alike). */
#why:not(:placeholder-shown){background:var(--gold-soft);border-color:var(--gold-line)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:14px var(--serif);padding:6px 0;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--key2)}
.fields{display:grid;grid-template-columns:190px minmax(0,1fr);gap:9px 18px;font-size:14.5px;margin:16px 0 0}
.fields dt{color:var(--muted);font-size:13px;padding-top:2px}
.fields dd{margin:0;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.orig{background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font:13px/1.65 var(--mono);color:var(--key2);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}
.note{margin-top:14px;font-size:13px;color:var(--faint)}
.hist{margin-top:16px;display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 16px;font-size:14px}
.hist .d{font:12.5px var(--mono);color:var(--faint);padding-top:2px}
.diff{font:12.5px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.diff .add{color:var(--new-ink);background:var(--new-soft)}
.diff .del{color:var(--brok-ink);background:var(--brok-soft);text-decoration:line-through}
/* The bar's Entries button and the arrows that turn the page. Entries
   opens the drawer and closes it again (Mark, 2026-10-17: it only opened
   it, and the veil or Esc were the only ways back). */
.rd{display:flex;align-items:center}
.rd-list{gap:7px;margin-left:-6px;background:none;border:1px solid var(--line2);border-radius:var(--radius);color:var(--key2);font:14px var(--serif);padding:5px 11px 5px 9px;cursor:pointer}
body.drawer:not(.leads) .rd-list{background:var(--sel);border-color:var(--key)}
/* Leads beside it, smaller and in the leads' clay, as Make lead wears it */
.rd-leads{gap:5px;margin-left:-8px;background:none;border:1px solid rgba(141,85,69,.55);border-radius:var(--radius);color:#7a4536;font:13px var(--serif);padding:3px 9px 3px 7px;cursor:pointer}
.rd-leads .n{font:11.5px var(--mono);margin-left:2px}
body.drawer.leads .rd-leads{background:rgba(141,85,69,.12)}
.rd-step{gap:2px;font:12.5px var(--mono);color:var(--muted);white-space:nowrap}
.rd-step button{display:flex;background:none;border:0;border-radius:5px;color:var(--key2);padding:6px;cursor:pointer}
.rd-step button:disabled{color:var(--line2);cursor:default}
/* The entry runs down the middle of the page: on a wide screen a line of
   about ninety characters, as Mark wanted there; held upright, a line of
   about seventy-five and the type a size up, as on the reader he chose then. */
.det{margin:0 auto;padding-top:26px}
#callNote{max-width:none}
@media (orientation:portrait){
  body{min-width:0}
  #total{display:none}
  #sbox{min-width:220px}
  .det{max-width:700px}
  .dtitle{font-size:26px}
  .sec .txt,.sec.lead .txt{font-size:18px;line-height:1.65}
}
/* The page turn (see turnPage). The pane takes vertical scrolling for
   itself and leaves sideways movement to the page, and the page in motion
   is a sheet with edges, so two of them side by side read as two pages
   rather than one smear of text. */
#detwrap{position:relative;overflow-x:hidden;touch-action:pan-y pinch-zoom}
.det.turning{background:var(--sheet);min-height:100%;box-shadow:0 0 0 1px var(--grid),0 6px 28px rgba(42,38,32,.16);will-change:transform}
.det.ghost{position:absolute;left:0;right:0;pointer-events:none;z-index:3}
.banner{padding:8px 18px;background:var(--brok-soft);color:var(--warn-ink);font-size:13.5px;flex:none}
/* ── the search's results (see "the search" in the script) ────────────
   A card per entry, its score a bar in the colours of the parts that
   made it, and under it each term with the places it was found, the
   sentence of the best one open, and with Show the sums the arithmetic
   of each line at its right. Each part has its colour: the headline the
   page's ink, what they seek the red of Seeks partners, the project a
   warm brown, keywords a quiet one, where the terms meet a teal the page
   uses nowhere else, and what they already have hatched, because it is
   taken off. */
.lv-title{--lv:var(--key2);--lv-ink:var(--key2);--lv-soft:var(--sel)}
.lv-seek{--lv:var(--brok);--lv-ink:var(--brok-ink);--lv-soft:var(--brok-soft)}
.lv-proj{--lv:#8A6A3A;--lv-ink:#5E4520;--lv-soft:rgba(138,106,58,.15)}
.lv-frame{--lv:#B3A994;--lv-ink:var(--muted);--lv-soft:var(--hover)}
.lv-near{--lv:#2E7D7A;--lv-ink:#1F5C59;--lv-soft:rgba(46,125,122,.15)}
.lv-own{--lv:var(--warn-ink);--lv-ink:var(--warn-ink);--lv-soft:transparent}
.shead{padding-bottom:14px;border-bottom:1px solid var(--line)}
.sterms{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13.5px;color:var(--muted)}
.sterms b{color:var(--ink);font-weight:500}
.sterm{font:13px var(--serif);border:1px solid var(--line2);border-radius:99px;padding:1px 10px;color:var(--key2);background:var(--field)}
.sterm.none{border-color:var(--warn-line);color:var(--warn-ink)}
.sterm b{font-weight:600;color:var(--ink)}
.sterm .sto{color:var(--muted)}
.scount{margin-left:4px;color:var(--muted)}
.scount b{color:var(--ink);font-weight:600}
.smore{margin-top:10px;padding:10px 14px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field)}
.smore .smaps{margin-top:0}
.sopts .lbl{font-size:13px;color:var(--muted);margin-left:10px}
/* the search's page before anything is typed */
.sstart{max-width:640px;padding-top:30px}
.sstart h2{font:400 23px var(--serif);margin:0 0 8px}
.sstart p{color:var(--muted);margin:0 0 12px}
.sopts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.sopts .gap{width:8px}
.sopts .linkbtn{margin-left:6px}
.sweights{display:grid;grid-template-columns:max-content 170px 40px;gap:6px 12px;align-items:center;margin-top:10px;padding:10px 14px;
  font-size:13.5px;color:var(--key2);border:1px solid var(--line);border-radius:var(--radius);background:var(--field);width:max-content;max-width:100%}
.sweights input{width:100%;accent-color:var(--key2)}
.sweights .linkbtn{grid-column:1 / -1;justify-self:start;padding-left:0}
.sindex{font-size:12.5px;color:var(--muted);margin-top:6px}
.sindex:empty{display:none}
.badge{display:inline-block;font:10.5px/16px var(--mono);min-width:17px;padding:0 3px;text-align:center;border-radius:4px;background:var(--lv-soft);color:var(--lv-ink);box-shadow:inset 0 0 0 1px var(--lv)}
.hit{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:13px 18px 9px;margin-top:12px}
.htop{display:flex;align-items:baseline;gap:5px 9px;flex-wrap:wrap}
.htitle{background:none;border:0;padding:0;font:17.5px/1.3 var(--serif);color:var(--ink);text-align:left;cursor:pointer}
.htitle:hover{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.hsub{font-size:12.5px;color:var(--muted)}
.htop .scorewrap{margin-left:auto;display:flex;align-items:center;gap:8px;align-self:center}
.sbar{width:110px;height:7px;border-radius:4px;background:var(--sel);overflow:hidden;display:flex}
.sbar i{display:block;height:100%;background:var(--lv)}
.sbar i.lv-own{background:repeating-linear-gradient(135deg,var(--warn-ink) 0 2px,transparent 2px 4px)}
.snum{font:11.5px var(--mono);color:var(--faint);min-width:28px;text-align:right}
.hline{font-size:14px;color:var(--key2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paths{margin-top:9px;border-top:1px solid var(--grid);padding-top:2px}
.qgroup{margin:8px 0 2px;font-size:12.5px;color:var(--muted)}
.qgroup b{color:var(--ink);font-weight:600}
.path{display:flex;align-items:center;flex-wrap:wrap;gap:3px 4px;padding:3px 6px;border-radius:6px;font-size:13.5px}
.path:hover{background:var(--hover)}
.pmt{font:11px var(--mono);color:var(--faint);width:14px;text-align:center}
.pw{padding:0 6px;border-radius:5px;background:var(--lv-soft);color:var(--lv-ink);font-weight:600}
.pw.lv-own{box-shadow:inset 0 0 0 1px var(--warn-line)}
.prel{font:10.5px var(--mono);color:var(--faint);padding:0 3px}
.against{font:italic 12px var(--body);color:var(--warn-ink);margin-left:6px}
.arith{margin-left:auto;padding-left:14px;font:11.5px var(--mono);color:var(--faint);white-space:nowrap}
.arith b{color:var(--ink);font-weight:500}
.qgroup .arith{float:right;padding-right:6px}
.combine{margin:8px 0 2px;padding-top:6px;border-top:1px dashed var(--line2);font:12px var(--mono);color:var(--faint);text-align:right}
.combine b{color:var(--ink);font-weight:500}
/* the switch that shows the sums */
.tgl{display:inline-flex;align-items:center;gap:7px;padding:2px 10px 2px 5px;border:1px solid var(--line);border-radius:99px;background:none;
  font:12px var(--serif);color:var(--muted);cursor:pointer}
.tgl .knob{position:relative;width:24px;height:13px;border-radius:99px;background:var(--sel);box-shadow:inset 0 0 0 1px var(--line2)}
.tgl .knob::after{content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px rgba(42,38,32,.3)}
.tgl.on{color:var(--ink);border-color:var(--line2)}
.tgl.on .knob{background:var(--key2);box-shadow:none}
.tgl.on .knob::after{left:13px}
.snippet{margin:3px 4px 8px 26px;padding:8px 12px;background:var(--sheet);border-left:2px solid var(--lv);border-radius:0 7px 7px 0;
  font-size:14px;line-height:1.55;color:var(--key2);max-width:780px;overflow-wrap:anywhere}
.snippet mark{background:none;color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--lv)}
.snippet .from{display:block;margin-top:4px;color:var(--faint);font-size:12px}
.showmore{background:none;border:0;font:12.5px var(--serif);color:var(--muted);padding:3px 6px;cursor:pointer}
.showmore:hover{color:var(--ink)}
.sdiv{margin-top:28px;padding-top:12px;border-top:1px solid var(--line2);font-size:13.5px;color:var(--muted)}
.sdiv b{display:block;font:400 13px var(--serif);letter-spacing:.07em;text-transform:uppercase;color:var(--warn-ink);margin-bottom:2px}
.smore{margin:16px 0 0}
/* An idea of the Topic Atlas's libraries wears its axis's colours from
   there: methods a dusk violet, application domains a slate blue. */
.idea{display:inline-flex;align-items:center;gap:3px;padding:0 7px;border-radius:5px;border:0;font:13.5px/1.6 var(--body);white-space:nowrap;
  background:#E7E2EC;color:#4F4566}
.idea.ax-domain{background:#E0E6EE;color:#2E4560}
button.idea{cursor:pointer}
button.idea:hover{box-shadow:inset 0 0 0 1px currentColor}
.idea.off{text-decoration:line-through;background:var(--hover);color:var(--faint)}
.idea .pmt{width:auto;padding:0 2px 0 0}
.smaps{margin-top:10px}
.smap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;font-size:13.5px;color:var(--muted);margin:3px 0}
.smap > b{color:var(--ink);font-weight:600}
.nbrs{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 12px;margin:3px 0 4px 18px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.nbrs .nb{display:inline-flex;align-items:center;gap:3px}
.sweights .lbl{font-size:13.5px}
.against.waived{color:var(--muted)}
button.badge{border:0;cursor:pointer}
button.badge:hover{box-shadow:inset 0 0 0 1.5px var(--lv)}
.fixrole{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:2px 0 6px 26px;font-size:12.5px;color:var(--muted)}
/* The card's lines, after the Topic Atlas's (see "the card's lines" in
   the script): the way to the idea in its own column, each card's as wide
   as its longest; a dotted arrow stretching to the words, in a shaded
   column as wide on every card; where two terms meet, a bracket in the
   column after it. */
.lines{display:grid;position:relative;grid-template-columns:minmax(0,min(var(--pw,300px),58%)) var(--ww,240px) var(--mw,0px) minmax(0,1fr)}
.wband{grid-column:2;background:rgba(42,38,32,.055);border-radius:7px}
.lrow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;position:relative;z-index:1;border-radius:6px}
.lrow.line{cursor:pointer}
.lrow.line:hover{background:var(--hover)}
.lp{grid-column:1;align-self:start;display:flex;align-items:center;gap:3px;min-width:0;min-height:28px;padding-left:4px}
.lp .idea{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lp .pmt,.lp .prel{flex:none}
.idea.ax-text{background:rgba(138,106,58,.15);color:#5E4520}
.dots{flex:1 0 24px;height:0;border-top:1px dotted var(--faint);margin:0 -6px 0 8px;position:relative}
.dots::after{content:"";position:absolute;right:0;top:-3.5px;border-left:5px solid var(--faint);border-top:3px solid transparent;border-bottom:3px solid transparent}
.lw{grid-column:2;align-self:start;display:flex;flex-direction:column;min-width:0;padding:0 6px 0 10px}
.lw1{display:flex;align-items:center;gap:6px;min-width:0;min-height:28px}
.lph{font-size:14px;color:var(--lv-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lph.meetw{border-bottom:1.5px solid #2E7D7A}
.lw .against{margin:-4px 0 4px 28px}
.lwa{margin:-4px 0 5px 28px;padding-left:0;white-space:nowrap}
.marm{flex:1 0 8px;height:0;border-top:1.5px solid #2E7D7A}
.lh{align-self:end;padding-bottom:3px;font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.lwh{grid-column:2;padding-left:10px}
.lmh{grid-column:3;padding-left:6px;color:#1F5C59}
.lrow.lq .qgroup{grid-column:1;min-width:0}
.qgroup.near b{color:#1F5C59}
.lrow.lmore .lp{min-height:0}
.lsn{grid-column:1 / 3;position:relative;z-index:1}
.mbr{position:absolute;grid-column:3;left:0;width:8px;top:13px;bottom:-15px;border:1.5px solid #2E7D7A;border-left:none;border-radius:0 4px 4px 0;z-index:2;pointer-events:none}
.mlw{position:absolute;grid-column:3;left:14px;top:13px;bottom:-15px;display:flex;align-items:center;z-index:2;pointer-events:none}
.mlab{pointer-events:auto;font:11px var(--body);color:#1F5C59;background:rgba(46,125,122,.15);border:0;border-radius:4px;padding:1px 6px;white-space:nowrap;cursor:pointer}
.mlab:hover{background:#2E7D7A;color:var(--sheet)}
/* Upright, the card is too narrow for a way and the words side by side
   at their full lengths: the ideas' names give way (the whole name on
   hover), the words keep their column. */
@media (orientation:portrait){ .lines{grid-template-columns:minmax(0,44%) minmax(0,1fr) var(--mw,0px) 0} .lmh{white-space:normal} }
/* ── the Semaphore's slide-ins (see openPanel) ───────────────────────
   The venue's name and the arena's tags say they open something of their
   own, apart from the row that chooses the venue. The panel is the
   Semaphore's: 404 px from the right edge, over the drawer and the entry
   alike, the rest veiled; a press on the veil, ✕ or Esc puts it away. */
.site .nm[data-msite]:hover{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.site .tag[data-marena]:hover{background:color-mix(in srgb,var(--tone) 46%,var(--paper))}
.mscrim{position:absolute;inset:0;z-index:5;background:rgba(42,38,32,.28);visibility:hidden;opacity:0;transition:opacity .24s ease,visibility 0s linear .24s}
.mpanel{position:absolute;top:0;right:0;bottom:0;width:404px;max-width:94vw;z-index:6;display:flex;flex-direction:column;
  background:var(--sheet);border-left:1px solid var(--line2);box-shadow:-10px 0 28px rgba(42,38,32,.2);
  transform:translateX(105%);visibility:hidden;transition:transform .3s cubic-bezier(.22,.72,.24,1),visibility 0s linear .3s}
.mpanel:focus{outline:none}
body.mopen .mscrim{visibility:visible;opacity:1;transition:opacity .24s ease,visibility 0s}
body.mopen .mpanel{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.22,.72,.24,1),visibility 0s}
@media (prefers-reduced-motion:reduce){ .mscrim,.mpanel,body.mopen .mscrim,body.mopen .mpanel{transition:none} }
.mbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 26px 22px}
.mhead{position:relative;padding-right:26px}
.mhead h2{font:400 20px/1.3 var(--serif);letter-spacing:.03em;margin:0}
.mx{position:absolute;top:-4px;right:-8px;border:0;background:none;color:var(--faint);font-size:15px;line-height:1;padding:5px 7px;border-radius:6px;cursor:pointer}
.mx:hover{color:var(--ink);background:var(--hover)}
.mkind,.mmeta{margin:0 0 5px;font:600 9.5px var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.mmeta{margin:7px 0 0}
.mdoubt{display:inline-block;font:600 12px/18px var(--serif);width:18px;text-align:center;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);vertical-align:2px;cursor:help}
.mrow{display:flex;align-items:center;gap:10px;margin-top:11px}
.mgo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:var(--radius);padding:3px 10px;background:none;color:var(--key2);font:13px var(--mono);text-decoration:none;white-space:nowrap;cursor:pointer}
.mgo:hover{border-color:var(--key);background:var(--hover)}
.mgo svg{flex:none}
.mgo.on{background:var(--sel)}
.mplace{margin:14px 0 4px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);font:13px/1.45 var(--body);color:var(--muted)}
.mplace b{font:600 9.5px var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-right:8px}
.mplace.st-new{border-color:var(--new-line);background:var(--new-soft)}
.mplace.st-new b{color:var(--new-ink)}
.mplace i{font-style:italic}
.mps{margin-top:18px}
.mph{display:flex;align-items:baseline;gap:9px;margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid var(--grid);
  font:600 9.5px var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mph i{font:italic 12.5px var(--body);letter-spacing:0;text-transform:none;color:var(--faint)}
.mnone{font:italic 13px var(--body);color:var(--faint);margin:0}
.mtext{margin:0;font-size:13.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.mlink{border:0;background:none;padding:0;text-align:left;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.mlink:hover{text-decoration-color:var(--ink)}
/* The window and the calls as a small table, as the Semaphore's board
   lays out its rows: what each line is, and its date that matters, in a
   column on the left; the line itself on a track to the right; one row of
   months over them all, a hairline at each month, and today the gold line
   straight down every track. The names and dates stood on the strip
   itself until Mark found them floating over one another and the bars
   (2026-10-21). See vLifeHTML. */
.mtl{margin-top:8px}
.mtr{display:grid;grid-template-columns:136px minmax(0,1fr);border-top:1px solid var(--grid)}
.mtr.axis{border-top:0}
.mtl:not(.all) .mtr.more{display:none}
.mtn{min-width:0;padding:6px 10px 6px 0;font-size:13px;line-height:1.3}
.mtn b,.mtn i,.mtn span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtn b{font:400 13px/1.3 var(--serif);color:var(--ink)}
.mtn i{font:italic 12.5px/1.3 var(--body);color:var(--muted)}
.mtn span{margin-top:1px;font:10.5px/1.4 var(--mono);color:var(--key2)}
.mtr.past .mtn b,.mtr.past .mtn i,.mtr.past .mtn span{color:var(--faint)}
.mtk{position:relative;overflow:hidden;min-height:34px}
.mtk > *{position:absolute}
.mtr.axis .mtk{min-height:18px;overflow:visible}
.mmo{bottom:3px;padding-left:3px;font:10px/1 var(--mono);color:var(--muted);white-space:nowrap}
.mmo.jan{color:var(--ink)}
.mnow{top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gold);z-index:1}

<script src="../topic-atlas/library.js"></script>
<script>
/* The cloud: the One App's own Supabase project. The key is the public one
   (the same as the One App's BUILT_IN); since the lock it opens nothing without
   Mark's login, which is why it can stand in a public page. */
var CLOUD = { url:'https://eaaggqydnjkufzajgpzh.supabase.co',
  key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhYWdncXlkbmprdWZ6YWpncHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzEwMjMsImV4cCI6MjA5OTI0NzAyM30.pRQPc-qZWV0wwPPnfQU0I_HzmZZ36xZYIXJQYfQG96g' };
var AUTH = 'partnerwatch.auth', VIEW = 'partnerwatch.view';

/* ── the login ─────────────────────────────────────────────────────────
   As Pocket did, until it went on 2026-10-22: log in once, keep the
   session on this device, renew it a minute before it runs out, and only
   one renewal at a time, because Supabase ends the whole session when the
   same refresh token comes back twice. */
var auth = null, renewing = null;
try { auth = JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch(e){}

function authCall(path, body){
  return fetch(CLOUD.url + '/auth/v1/' + path, {
    method:'POST',
    headers:{ apikey:CLOUD.key, 'Content-Type':'application/json', Authorization:'Bearer ' + CLOUD.key },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
    if (!r.ok){ var e = new Error(j.error_description || j.msg || j.message || r.status); e.status = r.status; throw e; }
    return j;
  }); });
}
function keepAuth(j){
  auth = { access:j.access_token, refresh:j.refresh_token,
           until: j.expires_at ? j.expires_at * 1000 : Date.now() + (j.expires_in || 3600) * 1000 };
  try { localStorage.setItem(AUTH, JSON.stringify(auth)); } catch(e){}
}
function dropAuth(){ auth = null; try { localStorage.removeItem(AUTH); } catch(e){} }
function token(){
  if (!auth || !auth.refresh) return Promise.reject(Object.assign(new Error('not logged in'), { status:401 }));
  if (auth.until - Date.now() > 60000) return Promise.resolve(auth.access);
  if (!renewing) renewing = authCall('token?grant_type=refresh_token', { refresh_token:auth.refresh })
    .then(function(j){ keepAuth(j); renewing = null; return auth.access; },
          function(e){ renewing = null; if (e.status === 400 || e.status === 401) dropAuth(); throw e; });
  return renewing;
}
/* "Load failed" is how Safari says a request got no answer at all: the
   iPad waking from sleep or the wifi changing hands drops it, and Mark saw
   those two bare words in the banner (2026-10-21). Every read and save
   here can safely go twice, so a request that got no answer is sent again,
   a second and then three seconds later, before anything is said; an
   answer, even a refusal, is never sent again. The copier is the
   exception (`once`): a second run beside the first only doubles the wait. */
function send(url, init, tries){
  return fetch(url, init).catch(function(err){
    if (!tries) throw Object.assign(new Error('the connection dropped before the cloud answered (Safari calls it \u201c' + err.message + '\u201d)'), { dropped:true });
    return new Promise(function(ok){ setTimeout(ok, tries > 1 ? 1000 : 3000); })
      .then(function(){ return send(url, init, tries - 1); });
  });
}
function api(path, opts){
  opts = opts || {};
  return token().then(function(t){
    var h = Object.assign({ apikey:CLOUD.key, Authorization:'Bearer ' + t }, opts.headers || {});
    if (opts.body) h['Content-Type'] = 'application/json';
    return send(CLOUD.url + path, { method:opts.method || 'GET', headers:h,
      body: opts.body ? JSON.stringify(opts.body) : undefined }, opts.once ? 0 : 2);
  }).then(function(r){
    if (r.status === 401){ dropAuth(); showLogin('Your session ended. Log in again.'); throw new Error('logged out'); }
    if (!r.ok) return r.text().then(function(t){ throw new Error(r.status + ' ' + t.slice(0, 200)); });
    return r.status === 204 ? null : r.json();
  });
}
/* The database hands out a thousand rows per request at most; Water4All
   alone is near three hundred and the four sites past eight hundred. */
function all(path){
  var out = [];
  function page(from){
    return api(path, { headers:{ Range: from + '-' + (from + 999), 'Range-Unit':'items' } })
      .then(function(rows){ out = out.concat(rows); return rows.length < 1000 ? out : page(from + 1000); });
  }
  return page(0);
}

/* ── state ─────────────────────────────────────────────────────────── */
var sites = [], entries = [], lastRun = null, byId = {};
var view = { site:null, leads:false, kind:'all', state:'open', q:'', chips:[], id:null, tab:'fields', scope:'all', any:false, sums:false, results:false, hits:false };
try { Object.assign(view, JSON.parse(localStorage.getItem(VIEW) || '{}'), { q:'', chips:[] }); } catch(e){}
/* a device last left on Later, which went on 2026-10-18, comes back to All */
if (view.state === 'later') view.state = 'open';
var detail = {};          // id → { fields, page_text, versions }
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function saveView(){ try { localStorage.setItem(VIEW, JSON.stringify({ site:view.site, leads:view.leads, kind:view.kind, state:view.state, id:view.id, tab:view.tab, scope:view.scope, any:view.any, sums:view.sums })); } catch(e){} }
function day(iso){ if (!iso) return ''; var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
/* The copier's errors in words Mark reads, the site's own message after
   them; and which of the small error lines he has opened, kept while the
   page redraws. */
var errOpen = {};
function plainErr(m){
  m = String(m || '');
  if (/^skipped:/.test(m)) return 'Not tried: the site had turned the connection away earlier in the same check.';
  if (/connection refused|tcp connect|os error 111/i.test(m)) return 'The site turned the connection away. This usually passes by itself; the next check tries again.\n' + m;
  if (/timed? ?out|aborted/i.test(m)) return 'The site took too long to answer; the next check tries again.\n' + m;
  return m;
}
function errLine(key, short, full){
  var on = !!errOpen[key];
  return '<span class="errx' + (on ? ' open' : '') + '" data-errx="' + esc(key) + '">⚠ ' + esc(short)
    + (on ? '<span class="full">' + esc(full) + '</span>' : '') + '</span>';
}
function stamp(iso){ if (!iso) return ''; var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }
function siteOf(e){ return sites.find(function(s){ return s.id === e.site; }) || { name:e.site }; }
function title(e){ return e.org || e.contact || ('Entry ' + e.ext_id); }

var COLS = 'id,site,ext_id,url,kind,contact,org,country,topic,keywords,posted,list_text,first_seen,fetched_at,changed_at,removed_at,opened_at,verdict,why,decided_at,page_hash';
function load(){
  return Promise.all([
    api('/rest/v1/partner_sites?select=*&order=sort'),
    all('/rest/v1/partner_entries?select=' + COLS + '&before_watch=is.false&order=first_seen.desc,id'),
    api('/rest/v1/partner_watch_log?select=*&order=ran_at.desc&limit=1'),
    api('/rest/v1/app_state?id=eq.' + MINE_ROW + '&select=data').catch(function(){ return []; }),
    api('/rest/v1/app_state?id=eq.semaphore&select=data').catch(function(){ return []; })
  ]).then(function(r){
    market = (r[4][0] || {}).data || null;
    sites = inMarketOrder(r[0]); entries = r[1]; lastRun = r[2][0] || null;
    var mine = (r[3][0] || {}).data || {};
    links = mine.docs || {};
    roleFix = {}; Object.keys(mine.roles || {}).forEach(function(k){ if (mine.roles[k]) roleFix[k] = mine.roles[k]; }); roleRev++;
    Object.keys(mine.notes || {}).forEach(function(k){ if (!(k in notes)) notes[k] = mine.notes[k]; });
    byId = {}; entries.forEach(function(e){ byId[e.id] = e; });
    /* Newest first: the night it arrived, then the site's own date where
       it gives one, then the site's own number, which both platforms count
       upwards — the first night brings every entry at once, and without
       this the list would be in no useful order at all. */
    entries.sort(function(a, b){
      return (b.first_seen || '').slice(0, 10).localeCompare((a.first_seen || '').slice(0, 10))
          || (b.posted || '').localeCompare(a.posted || '')
          || (+b.ext_id - +a.ext_id);
    });
    entries.forEach(function(e, i){ e._i = i; });
    if (!sites.some(function(s){ return s.id === view.site; })) view.site = sites.length ? sites[0].id : null;
    regroup();
    if (query().length) runSearch();
    $('#banner').hidden = true;
    draw();
    /* a device the search has read pages on before takes the new ones in */
    var used = false; try { used = !!localStorage.getItem(SXKEY); } catch(e){}
    if (found || used) syncIndex();
    tidyLeadLinks();
    warm();
  }).catch(function(e){
    if (String(e.message) === 'logged out' || e.status === 401) return;
    $('#banner').textContent = 'Could not reach the cloud: ' + e.message;
    $('#banner').hidden = false;
  });
}

/* ── the filters ─────────────────────────────────────────────────────
   Binned entries stay out of every view but Binned and the search: they
   are kept so the copier never brings them back as new, not so they are
   seen again. */
var STATES = [['open','All'],['unsorted','Unsorted'],['interesting','Marked'],['bin','Binned']];
var KINDS = [['all','Both kinds'],['seeks','Seeks partners'],['offers','Offers expertise']];
function stateOk(e){
  if (view.state === 'open' && e.verdict === 'bin') return false;
  if (view.state === 'unsorted' && e.verdict) return false;
  if (['interesting','bin'].indexOf(view.state) >= 0 && e.verdict !== view.state) return false;
  return true;
}
/* An entry made into a lead leaves its venue for Leads (Mark,
   2026-10-22), where every lead is listed whatever the filters say; the
   filters sort what is still to be judged, and a lead is past that. */
function passes(e){
  if (view.leads) return !!e._lead && (!found || reaches(found.per[e.id]));
  if (e._lead) return false;
  if (e.site !== view.site) return false;
  if (view.kind !== 'all' && e.kind !== view.kind) return false;
  if (!stateOk(e)) return false;
  if (found && !reaches(found.per[e.id])) return false;
  return true;
}
/* Within a site: what is new on top, then Marked, then the rest (Mark,
   2026-10-16; Later went on 2026-10-18, and what was Later is in the
   rest), each newest first. The group is fixed when
   the list is drawn afresh — on loading, or on choosing a site, a filter or
   a kind — and not when an entry is opened or flagged: an entry that jumped
   to another group under the cursor would make ↓ skip or repeat entries. */
var GROUPS = ['New', 'Marked', 'Seen', 'Binned'];
function groupOf(e){
  return e.verdict === 'interesting' ? 1 : e.verdict === 'bin' ? 3 : !e.opened_at ? 0 : 2;
}
/* Whether an entry is a lead is fixed with its group, for the same
   reason: the lead just made stays in the list under the cursor, so ↓
   goes on to the next entry, and leaves it at the next drawing afresh. */
function regroup(){ var L = leadMap(); entries.forEach(function(e){ e._g = groupOf(e); e._lead = L[e.id] || null; }); }
/* Binned reads in the order things went into the bin, the last one on
   top, so an entry binned by mistake a moment ago is the first one there
   to take back out (Mark, 2026-10-21). */
function shown(){
  if (view.hits && found) return results();
  var bin = view.state === 'bin';
  if (view.leads) return entries.filter(passes).sort(function(a, b){
    return String(a._lead.a.name).localeCompare(String(b._lead.a.name)) || (a._i - b._i); });
  return entries.filter(passes).sort(function(a, b){
    return bin ? (b.decided_at || '').localeCompare(a.decided_at || '') || (a._i - b._i) : (a._g - b._g) || (a._i - b._i); });
}
/* when it was binned: the hour today, the day before that */
function binnedWhen(iso){
  if (!iso) return '';
  var d = new Date(iso), t = new Date(), y = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1);

/* The sentence a place is in, its words marked, cut to some 160

   the stop between them. */
function snippet(sec, sent, hits, lvl, also){

  var spans = [];
  hits.forEach(function(x){ if (x.sent === sent) x.spans.forEach(function(p){ spans.push(p); }); });
  spans.sort(function(x, y){ return x[0] - y[0]; });

    lo = Math.max(a, spans[0][0] - 160); hi = Math.min(b, spans[spans.length - 1][1] + 160);
    if (lo > a){ var sp = sec.raw.indexOf(' ', lo); if (sp > 0 && sp < spans[0][0]) lo = sp + 1; }
    if (hi < b){ var sq = sec.raw.lastIndexOf(' ', hi); if (sq > spans[spans.length - 1][1]) hi = sq; }
  }
  var out = '', at = lo;
  spans.forEach(function(p){ if (p[0] < at) return; out += esc(sec.raw.slice(at, p[0])) + '<mark>' + esc(sec.raw.slice(p[0], p[1])) + '</mark>'; at = p[1]; });

  }
  var sh = ev.target.closest('[data-sheet]');
  if (sh) return sh.dataset.sheet === 'pdf' ? printSheet(byId[view.id]) : copySheet(byId[view.id], sh);
  /* Make lead: the Why line is kept first, since a press on the button
     may come before the field has said it changed */
  var mk = ev.target.closest('[data-mklead],[data-mkgo],[data-mkno]');
  if (mk){
    var me = byId[view.id], w = $('#why');
    if (!me) return;
    if (w && (w.value.trim() || null) !== (me.why || null)) patch(me, { why:w.value.trim() || null });
    if (mk.dataset.mkno){ mkAsk = null; return drawDetail(); }
    if (mk.dataset.mkgo) return makeLead(me, $('#mkArena') && $('#mkArena').value);
    var c = leadArenas(me);
    if (c.mine.length === 1) return makeLead(me, c.mine[0].id);
    mkAsk = me.id; drawDetail();
    if ($('#mkArena')) $('#mkArena').focus();
    return;
  }
  var ex = ev.target.closest('[data-errx]');
  if (ex){ ev.preventDefault(); errOpen[ex.dataset.errx] = !errOpen[ex.dataset.errx]; return drawSites(); }
  var t = ev.target.closest('[data-pick],[data-bulk],[data-site],[data-id],[data-state],[data-kind],[data-tab],[data-verdict],[data-editlinks],[data-savelinks],[data-cancellinks],[data-callnote],[data-drawer],[data-step],#checkNow');
  if (!t) return;
  if (t.dataset.drawer) return drawer(t.dataset.drawer === 'toggle' || t.dataset.drawer === 'leads' ? t.dataset.drawer : t.dataset.drawer === '1');
  if (t.dataset.step) return step(+t.dataset.step);
  /* In the reader, choosing what to read puts the list away again. */
  if ((t.dataset.callnote || (t.dataset.id && !t.dataset.pick && !(ev.ctrlKey || ev.metaKey || ev.shiftKey)))) drawer(false);
  if (t.id === 'checkNow') return checkNow(t);
  if (t.dataset.editlinks) return editLinks();
  if (t.dataset.savelinks) return saveLinks();
  if (t.dataset.cancellinks) return cancelLinks();
  if (t.dataset.callnote){ closePanel(); return openNote(t.dataset.callnote); }
  if (t.dataset.pick) pick(t.dataset.pick, ev.shiftKey);
  else if (t.dataset.bulk) bulk(t.dataset.bulk);
  else if (t.dataset.site){ view.site = t.dataset.site; view.leads = false; document.body.classList.remove('leads'); $('.rd-list').setAttribute('aria-expanded', 'true'); $('.rd-leads').setAttribute('aria-expanded', 'false'); view.note = null; view.hits = view.results = false; sel.clear(); regroup(); saveView(); draw(); }
  else if (t.dataset.id){ if (ev.ctrlKey || ev.metaKey || ev.shiftKey) pick(t.dataset.id, ev.shiftKey); else openEntry(t.dataset.id); }
  else if (t.dataset.state){ view.state = t.dataset.state; sel.clear(); regroup(); saveView(); drawFilters(); drawRows(); if (view.results) drawResults(); }
  else if (t.dataset.kind){ view.kind = t.dataset.kind; sel.clear(); regroup(); saveView(); drawFilters(); drawRows(); if (view.results) drawResults(); }
  else if (t.dataset.tab){ view.tab = t.dataset.tab; saveView(); drawDetail(); }
  else if (t.dataset.verdict) setVerdict(t.dataset.verdict);
});
document.addEventListener('change', function(ev){
  if (ev.target.id === 'why'){ var e = byId[view.id]; if (e) patch(e, { why:ev.target.value.trim() || null }); }
});
/* Asked again after every drawing of the entry, because answering it
   draws the bar afresh while the pane stays scrolled down. */
function markStuck(){
  var a = $('.actions'); if (a) a.classList.toggle('stuck', a.getBoundingClientRect().top <= $('#detwrap').getBoundingClientRect().top + 1);
}
$('#detwrap').addEventListener('scroll', markStuck);
/* A page turn in the reader by hand: once a finger has clearly gone
   sideways the page follows it, and on letting go it turns if it went a
   fifth of the way across or was flicked, and springs back if not. At
   the first or last entry it gives a little and comes back, so the end
   of the list is felt rather than a swipe that does nothing. Not from the
   answers bar or a field, where moving sideways is choosing text. */
var swipe = null;
function neighbour(d){
  var list = shown(), i = list.findIndex(function(e){ return e.id === view.id; });
  return i >= 0 && !!list[i + d];
}
function springBack(){
  var det = $('#det');
  det.style.transition = 'transform 220ms cubic-bezier(.22,.7,.25,1)';
  det.style.transform = 'translateX(0)';
  setTimeout(function(){ if (!turning){ det.classList.remove('turning'); det.style.transition = ''; det.style.transform = ''; } }, 260);
}
$('#detwrap').addEventListener('touchstart', function(ev){
  swipe = !view.note && !view.results && view.id && ev.touches.length === 1 && !ev.target.closest('.actions,input,[contenteditable]')
    ? { x:ev.touches[0].clientX, y:ev.touches[0].clientY, t:Date.now(), axis:null, dx:0 } : null;
}, { passive:true });
$('#detwrap').addEventListener('touchmove', function(ev){
  if (!swipe || ev.touches.length !== 1) return;
  var dx = ev.touches[0].clientX - swipe.x, dy = ev.touches[0].clientY - swipe.y;
  if (!swipe.axis){
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    swipe.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
    if (swipe.axis === 'x'){ settleTurn(); $('#det').classList.add('turning'); }
  }
  if (swipe.axis !== 'x') return;
  swipe.dx = neighbour(dx < 0 ? 1 : -1) ? dx : dx * 0.3;
  var det = $('#det');
  det.style.transition = 'none';
  det.style.transform = 'translateX(' + swipe.dx + 'px)';
}, { passive:true });
function letGo(ev){
  if (!swipe) return;
  var sw = swipe; swipe = null;
  if (sw.axis !== 'x') return;
  var W = $('#detwrap').clientWidth, fast = Math.abs(sw.dx) > 30 && Math.abs(sw.dx) / (Date.now() - sw.t) > 0.45;
  var d = sw.dx < 0 ? 1 : -1;
  if (ev.type === 'touchend' && (Math.abs(sw.dx) > W / 5 || fast) && neighbour(d)) step(d, sw.dx);
  else springBack();
}
$('#detwrap').addEventListener('touchend', letGo);
$('#detwrap').addEventListener('touchcancel', letGo);
/* The search waits for a pause in the typing, because each pass reads
   every entry's pages. Back in the box, the results come back. */
$('#search').addEventListener('input', function(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(setQuery, 220);
});
/* Enter gives the term typed and starts the next; Backspace in an empty
   box takes the last term back to be typed again; Esc empties the box,
   and an empty one puts the search away. */
$('#search').addEventListener('keydown', function(ev){
  if (ev.key === 'Enter'){
    ev.preventDefault();
    view.q = this.value;
    typed().forEach(function(t){ if (view.chips.indexOf(t) < 0) view.chips.push(t); });
    this.value = ''; clearTimeout(searchTimer); setQuery();
  } else if (ev.key === 'Backspace' && !this.value && view.chips.length){
    ev.preventDefault();
    this.value = view.chips.pop(); clearTimeout(searchTimer); setQuery();
  } else if (ev.key === 'Escape'){
    ev.preventDefault();
    if (this.value || view.chips.length){ this.value = ''; view.chips = []; clearTimeout(searchTimer); setQuery(); }
    else this.blur();
  }
});
document.addEventListener('click', function(ev){
  var u = ev.target.closest('[data-unchip]'); if (!u) return;
  view.chips.splice(+u.dataset.unchip, 1); setQuery(); $('#search').focus();
});
$('#sbox').addEventListener('click', function(ev){ if (ev.target === this) $('#search').focus(); });
/* Pressing the box puts the venues and entries away and brings the
   search's page to the front (Mark, 2026-10-22); leaving it with no term
   goes back to the entry. */
$('#search').addEventListener('focus', function(){
  drawer(false); closePanel();
  if (!view.results){ view.results = true; $('#detwrap').scrollTop = 0; drawDetail(); }
});
$('#search').addEventListener('blur', function(){
  setTimeout(function(){
    if (!query().length && view.results && document.activeElement !== $('#search')){ view.results = false; drawDetail(); }
  }, 250);
});
document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-hit],[data-try],[data-results],[data-snip],[data-more],[data-showmore],[data-scope],[data-any],[data-sums],[data-weigh],[data-hops],[data-offidea],[data-near],[data-fixrole],[data-setrole]');
  if (!t) return;
  if (t.dataset.setrole !== undefined){
    var rk = t.dataset.rolekey, ch = {};
    if (t.dataset.setrole) roleFix[rk] = t.dataset.setrole; else delete roleFix[rk];
    ch[rk] = t.dataset.setrole || null;
    fixing = null; roleRev++;
    storeMine('roles', ch).catch(function(err){ $('#banner').textContent = 'The sentence\'s reading was not saved: ' + err.message; $('#banner').hidden = false; });
    if (found) runSearch();
    drawRows(); return drawDetail();
  }
  if (t.dataset.hit){ view.hits = true; drawer(false); return openEntry(t.dataset.hit); }
  if (t.dataset.try){ view.chips = [t.dataset.try]; $('#search').value = ''; $('#search').focus(); return setQuery(); }
  if (t.dataset.results){ view.results = true; $('#detwrap').scrollTop = 0; return drawDetail(); }
  if (t.dataset.snip){
    snips[t.dataset.snip] = t.dataset.open !== '1';
  } else if (t.dataset.more) opened[t.dataset.more] = true;
  else if (t.dataset.showmore) showing += SHOW;
  else if (t.dataset.scope) view.scope = t.dataset.scope;
  else if (t.dataset.any){ view.any = t.dataset.any === 'any'; rescore(); }
  else if (t.dataset.sums) view.sums = !view.sums;
  else if (t.dataset.weigh === 'reset'){ SW = Object.assign({}, SWDEF); try { localStorage.removeItem(SWKEY); } catch(e){} runSearch(); }
  else if (t.dataset.hops){ SW.hops = +t.dataset.hops; try { localStorage.setItem(SWKEY, JSON.stringify(SW)); } catch(e){} runSearch(); }
  else if (t.dataset.offidea){
    var oi = t.dataset.offidea.split('|'), o = offIdeas[oi[0]] || (offIdeas[oi[0]] = {});
    if (o[oi[1]]) delete o[oi[1]]; else o[oi[1]] = 1;
    runSearch(); drawRows();
  }
  else if (t.dataset.near) nearOpen[t.dataset.near] = !nearOpen[t.dataset.near];
  else if (t.dataset.fixrole) fixing = fixing === t.dataset.fixrole ? null : t.dataset.fixrole;
  else if (t.dataset.weigh) weighing = !weighing;
  if (t.dataset.scope || t.dataset.any || t.dataset.sums){ saveView(); showing = SHOW; drawRows(); }
  drawResults();
});
/* A weight says its figure while it is dragged and orders the results
   when it is let go: drawn afresh under the finger, the slider would be
   dropped mid-drag. */
document.addEventListener('input', function(ev){
  var w = ev.target.dataset && ev.target.dataset.sw; if (!w) return;
  ev.target.nextElementSibling.textContent = (w === 'own' ? '\u2212' : '') + (+ev.target.value).toFixed(1);
});
document.addEventListener('change', function(ev){
  var w = ev.target.dataset && ev.target.dataset.sw; if (!w) return;
  SW[w] = +ev.target.value;
  try { localStorage.setItem(SWKEY, JSON.stringify(SW)); } catch(e){}
  rescore(); drawRows(); drawResults();
  var r = $('#sw-' + w); if (r) r.focus();
});

/* The keys: ↑ ↓ walk the list, M B answer the open entry (or all the
   picked ones), X picks the open entry, Esc lets go of the picked ones.
   Not while typing, or a search for "Ireland" would flag three entries. */
document.addEventListener('keydown', function(ev){
  if (ev.target.dataset && ev.target.dataset.linkfor){
    if (ev.key === 'Enter'){ ev.preventDefault(); saveLinks(); }
    else if (ev.key === 'Escape') cancelLinks();
    return;
  }
  if (ev.target.matches('input,textarea,select') || ev.target.isContentEditable || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var k = ev.key;
  /* With a panel open, the letters and arrows would answer and turn an
     entry hidden under it; Esc puts the panel away first. */
  if (panel.id){ if (k === 'Escape') closePanel(); return; }
  /* With a call's notes or the search's results open no entry is on
     screen, so the letters that answer an entry would answer one Mark
     cannot see. */
  if ((view.note || view.results) && /^[mibx]$/i.test(k)) return;
  if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'ArrowRight' || k === 'ArrowLeft'){
    if (view.note || view.results) return;
    if (step(k === 'ArrowDown' || k === 'ArrowRight' ? 1 : -1)) ev.preventDefault();
  } else if (k === 'Escape' && document.body.classList.contains('drawer')){
    drawer(false);
  } else if (/^[mib]$/i.test(k)){
    /* M since the button became Mark (2026-10-18); I, its old key, still
       works. L went with the Later button the same day. */
    setVerdict({ m:'interesting', i:'interesting', b:'bin' }[k.toLowerCase()]);
  } else if (/^x$/i.test(k) && view.id){
    pick(view.id, ev.shiftKey);
  } else if (k === 'Escape' && sel.size){
    sel.clear(); drawRows();
  } else if (k === 'Enter' && ev.target.dataset && ev.target.dataset.id){
    openEntry(ev.target.dataset.id);
  }
});

function showLogin(msg){ $('#loginErr').textContent = msg || ''; $('#login').hidden = false; $('#email').focus(); }
$('#loginForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  $('#loginErr').textContent = '';
  authCall('token?grant_type=password', { email:$('#email').value.trim(), password:$('#pass').value })
    .then(function(j){ keepAuth(j); $('#pass').value = ''; $('#login').hidden = true; return load(); })
    .then(function(){ if (view.id && byId[view.id]) openEntry(view.id); })
    .catch(function(e){ $('#loginErr').textContent = e.message === 'Invalid login credentials' ? 'That email and password do not match.' : e.message; });
});

if (!auth) showLogin();
else load().then(function(){ if (view.id && byId[view.id]) openEntry(view.id); });
</script>
