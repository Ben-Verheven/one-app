<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No viewport-fit=cover: on the home screen iOS 26 draws nothing in the bottom status
     bar's height of a page that covers the screen (WebKit bug 301108). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Mark’s Place">
<link rel="icon" type="image/png" href="icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
<title>Mark’s Place</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   Mark’s Place on the phone — the brokerage sites' partner-search entries
   that the copier brings in every night (partner-watch/index.html is the
   desk's page, notes/partner-watch.md what Mark chose for it), gone
   through in an idle minute: a venue, its list, an entry, a flag.

   It was built to become a tab of Pocket, and so is made of two parts.
   The first, "Pocket's shell", is Pocket's own sheet, toast, login and
   request, copied from it; the second, "the watch", has classes starting
   with pw- and names with pw. Pocket was removed on 2026-10-22, when Mark
   no longer needed it, so this page is the phone's only app and both
   parts stay.

   It dresses as an iPhone app does (Mark, 2026-10-21: "much more easy and
   Apple like"), where until then it wore Pocket's charcoal, bone and
   Palatino: the system's own type, its dark grouped lists as in Settings,
   a screen that slides in from the right for each step down (venues, a
   venue's entries, an entry) with the way back at its top left, Mail's
   blue dot for what is unread, and the system's blue for whatever can be
   pressed. Dark throughout, because a home-screen page cannot choose the
   colour of the clock's figures: they stay white, and would vanish over a
   light bar. The long texts of an entry keep a reading face, the system's
   own serif.
   ══════════════════════════════════════════════════════════════════ */

:root{
  color-scheme:dark;
  --bg:#000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:#232326; --press:#3A3A3C;
  --label:#FFF; --label2:#A1A1A8; --label3:#8E8E93;
  --sep:#38383A;
  --tint:#0A84FF; --tint-ink:#409CFF;
  --orange:#FF9F0A; --red-ink:#FF6961; --green:#30D158; --indigo-ink:#8E8CFF; --yellow:#FFD60A;
  --clay:#E0866B;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  --read:ui-serif,'New York','Iowan Old Style',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --radius:10px;
  --sb:max(env(safe-area-inset-bottom), var(--home-b, 0px));
  --top:max(env(safe-area-inset-top), var(--top-fix, 0px));
  /* No tab bar: the foot keeps only the home bar's room. */
  --tabs:var(--sb);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font:17px/1.35 var(--ui);letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
svg{display:block}

/* ── the bar at the top: the way back, the screen's name once its large
   title has scrolled away, and refresh and settings ────────────────── */
#top{position:fixed;z-index:40;inset:0 0 auto 0;height:calc(var(--top) + 44px);padding:var(--top) 6px 0;
  display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.72);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
#top.edge{border-bottom-color:var(--sep)}
.pw-up{flex:0 1 auto;min-width:0;max-width:40%;display:flex;align-items:center;gap:2px;height:44px;padding:0 8px 0 2px;color:var(--tint)}
.pw-up[hidden]{display:none}
.pw-up svg{flex:0 0 auto;width:22px;height:22px}
.pw-up span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pw-navtitle{flex:1;min-width:0;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity .15s}
#top.edge #pw-navtitle{opacity:1}
.icon{flex:0 0 44px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tint);border-radius:22px}
.icon svg{width:23px;height:23px}
.icon:active{background:var(--press)}
.icon.spin svg{animation:turn .9s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

#stage{position:fixed;inset:0;padding-top:calc(var(--top) + 44px);
  padding-bottom:var(--tabs);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.view{display:none;padding:0 0 40px}
.view.on{display:block}
.view.in-r{animation:pwFromR .3s cubic-bezier(.2,.8,.2,1)}
.view.in-l{animation:pwFromL .3s cubic-bezier(.2,.8,.2,1)}
@media (display-mode: standalone){ html,body{overscroll-behavior:none} }

/* the large title each screen opens with, as in Settings and Mail */
.pw-large{margin:2px 16px 0;font:700 34px/1.12 var(--ui);letter-spacing:.01em;overflow-wrap:anywhere}
.pw-large.long{font-size:28px;line-height:1.15}
.pw-stamp{display:block;margin:4px 16px 0;font-size:15px;color:var(--label2)}

/* ── a grouped list: rounded cells inset from the edges, a small grey
   header over each group, hairlines between the cells ─────────────── */
.pw-gh{display:flex;justify-content:space-between;margin:26px 32px 7px;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--label2)}
.pw-gh b{font-weight:400}
.pw-group{margin:0 16px;background:var(--cell);border-radius:var(--radius);overflow:hidden}
.pw-cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:11px 14px 11px 16px;text-align:left;color:var(--label)}
.pw-cell + .pw-cell::before{content:"";position:absolute;top:0;left:var(--inset,16px);right:0;border-top:.5px solid var(--sep)}
.pw-cell:active{background:var(--press)}
.pw-cell.icon-cell{--inset:59px}
.pw-cell.dot-cell{--inset:36px}
.pw-cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pw-cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-cs{font-size:15px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-cr{flex:0 0 auto;display:flex;align-items:center;gap:8px;color:var(--label2)}
.pw-chev{width:8px;height:14px;color:#5A5A5F}
.pw-chev svg{width:8px;height:14px}
.pw-chev svg[viewBox="0 0 24 24"]{width:16px;height:16px;margin-left:-4px}
/* the coloured square a row of Settings carries, here in the colour of
   the venue's type, with the venue's first letter */
.pw-sq{flex:0 0 29px;width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:var(--tone,#636366);color:#fff;font:600 15px/1 var(--ui)}
.pw-sq svg{width:18px;height:18px}
/* counts: new as the badge of an unread mailbox, Marked beside it. New
   is green (Mark, 2026-10-22), not the system's blue, so it no longer
   reads as one more thing to press; the badge's green is the darker one,
   because white figures on the bright green cannot be read */
.pw-badge{min-width:24px;height:24px;padding:0 8px;border-radius:12px;background:#248A3D;color:#fff;font:600 15px/24px var(--ui);text-align:center}
.pw-star{display:flex;align-items:center;gap:3px;color:var(--orange);font-size:15px}
.pw-star svg{width:15px;height:15px}

/* ── a venue's screen: its call, the search, the two choices ───────── */
.pw-search{position:sticky;top:0;z-index:6;padding:10px 16px 8px;background:var(--bg)}
.pw-search label{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;background:var(--fill);color:var(--label3)}
.pw-search svg{flex:0 0 auto;width:17px;height:17px}
input[type="search"]{flex:1;min-width:0;height:100%;font:17px var(--ui);color:var(--label);background:none;border:0;padding:0;-webkit-appearance:none;outline:none}
input[type="search"]::placeholder{color:var(--label3)}
input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none}
/* the system's segmented control: a grey track, the chosen part raised */
.pw-seg{display:flex;margin:4px 16px 0;padding:2px;border-radius:9px;background:var(--fill)}
.pw-seg[hidden]{display:none}
.pw-seg + .pw-seg{margin-top:8px}
.pw-seg button{flex:1;min-width:0;min-height:32px;border-radius:7px;font:500 13px/1.1 var(--ui);color:var(--label);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;position:relative}
.pw-seg button::after{content:"";position:absolute;inset:-6px 0}
.pw-seg button.on{background:#636366;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.25)}
/* an entry's row: Mail's dot when unread, in the green of new, the organisation, who and
   where, and its kind and state in coloured words */
.pw-unread{flex:0 0 10px;width:10px;height:10px;border-radius:50%;align-self:flex-start;margin-top:6px}
.pw-unread.new{background:var(--green)}
.pw-row .pw-cn{font-weight:600}
.pw-row.dim .pw-cn{color:var(--label2);font-weight:400}
.pw-flags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;font-size:13px;color:var(--label2)}
.pw-flags span{display:flex;align-items:center;gap:3px}
.pw-flags svg{width:12px;height:12px}
.pw-flags .seeks{color:var(--red-ink)}
.pw-flags .offers{color:var(--indigo-ink)}
.pw-flags .interesting{color:var(--orange)}
.pw-flags .chg{color:var(--yellow)}
.pw-flags .gone{color:var(--red-ink)}
.pw-flags .newtag{color:var(--green)}
/* Choosing several, as Mail's Select (Mark, 2026-10-22): a long press on
   an entry starts it, a round tick stands at the head of every row, the
   bar at the top says how many and holds Select All and Done, and each
   group's header can take the whole group; the answers stand in a
   toolbar at the foot. The press must not open iOS's own menu or select
   the row's words, or the long press shows a callout over the list. */
.pw-row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pw-txtbtn{flex:0 0 auto;height:44px;padding:0 10px;color:var(--tint);white-space:nowrap;display:none}
body.pw-selecting .pw-txtbtn{display:block}
body.pw-selecting #pw-up,body.pw-selecting #pw-checknow,body.pw-selecting #refresh,body.pw-selecting #gear{display:none}
body.pw-selecting #pw-navtitle{opacity:1}
#pw-seldone{font-weight:600}
.pw-tick{flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid #636366;align-self:center;
  display:flex;align-items:center;justify-content:center;color:#fff}
.pw-tick svg{width:13px;height:13px}
.pw-row.picked{background:#14253A}
.pw-row.picked .pw-tick{background:var(--tint);border-color:var(--tint)}
body.pw-selecting .pw-row{--inset:70px}
body.pw-selecting .pw-row .pw-chev{display:none}
.pw-gh .pw-ghall{margin:-12px -8px;padding:12px 8px;color:var(--tint);font-size:13px;text-transform:none}
#pw-selbar{position:fixed;z-index:45;inset:auto 0 0 0;display:none;align-items:center;padding:4px 8px calc(4px + var(--sb));
  background:rgba(28,28,30,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
body.pw-selecting #pw-selbar{display:flex}
#pw-selbar button{flex:1;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:500 10px/1.1 var(--ui);color:var(--tint);text-align:center;border-radius:8px}
#pw-selbar button:active{background:var(--press)}
#pw-selbar button:disabled{color:#636366}
#pw-selbar svg{width:25px;height:25px}
body.pw-selecting #stage{padding-bottom:calc(var(--sb) + 60px)}
body.pw-selecting #toast{bottom:calc(var(--sb) + 68px)}
/* the check, an icon in the top bar beside refresh (Mark, 2026-10-22):
   while the copier runs it breathes and cannot be pressed again */
#pw-checknow:disabled svg{animation:pwBreathe 1.4s ease-in-out infinite}
@keyframes pwBreathe{50%{opacity:.35}}
.pw-note{padding:60px 32px;text-align:center;color:var(--label2);font-size:15px;line-height:1.45}
.pw-note b{display:block;margin-bottom:6px;color:var(--label);font-size:20px;font-weight:600}

/* ── the sheet: the shell's, raised from the foot for the notes on a
   call, and for an entry pushed in from the right as a screen ─────── */
#sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.5)}
#sheet.up{display:block}
#sheet .panel{position:absolute;inset:auto 0 0 0;max-height:94%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--cell);color:var(--label);border-radius:12px 12px 0 0;padding:6px 16px 0;animation:pwRise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pwRise{from{transform:translateY(100%)}}
#sheet .grab{width:36px;height:5px;border-radius:3px;background:#5A5A5F;margin:0 auto 12px}
#sheet .body{padding-bottom:16px}
#sheet h2{margin:0 0 4px;font:700 22px/1.25 var(--ui);overflow-wrap:break-word}
#sheet p{margin:0}
/* the sheet's foot: the system's toolbar, its words in blue */
#sheet .bar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;margin:0 -16px;padding:4px 8px calc(4px + var(--sb));
  background:rgba(28,28,30,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
#sheet .bar button,#sheet .bar a.key{flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;gap:2px;flex-direction:column;
  font:500 10px/1.1 var(--ui);color:var(--tint);text-decoration:none;text-align:center;border-radius:8px}
#sheet .bar .key{font-weight:600}
#sheet .bar button:active,#sheet .bar a.key:active{background:var(--press)}
#sheet .bar svg{width:25px;height:25px}
#sheet .bar .wide,#sheet .bar a.wide{flex-direction:row;font-size:17px}

/* the shell's message at the foot, as the system's own banners look */
#toast{position:fixed;z-index:80;left:12px;right:12px;bottom:calc(var(--tabs) + 12px);
  display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 6px 6px 16px;border-radius:14px;
  background:rgba(44,44,46,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);font:15px/1.3 var(--ui);color:var(--label);
  visibility:hidden;opacity:0;pointer-events:none;transform:translateY(18px);
  transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease,visibility 0s linear .26s}
#toast.up{visibility:visible;opacity:1;pointer-events:auto;transform:translateY(0);
  transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease,visibility 0s}
#toast span{flex:1;min-width:0}
#toast button{flex:0 0 auto;min-height:40px;padding:0 12px;border-radius:9px;color:var(--tint-ink);font:600 15px var(--ui)}
#toast button:active{background:var(--press)}
#toast.bad span{color:var(--red-ink)}
#sheet.up ~ #toast{bottom:calc(66px + var(--sb))}

/* the login, as the system's own sign-in screens */
#setup{position:fixed;inset:0;z-index:70;display:none;background:var(--bg);
  padding:calc(var(--top) + 50px) 16px 24px;overflow-y:auto}
#setup.up{display:block}
#setup h2{margin:0 0 8px;font:700 34px/1.1 var(--ui)}
#setup p{margin:0 0 26px;color:var(--label2);font-size:15px;line-height:1.4}
#setup p.fit{margin:26px 0 0;font:12px/1.5 var(--mono);color:var(--label3)}
#setup label{display:block;margin:0 0 6px 16px;font-size:13px;text-transform:uppercase;color:var(--label2)}
#setup input{width:100%;margin-bottom:18px;font:17px var(--ui);color:var(--label);
  background:var(--cell);border:0;border-radius:var(--radius);padding:13px 16px;-webkit-appearance:none}
#setup input:focus{outline:2px solid var(--tint)}
#setup .act{display:block;width:100%;min-height:50px;border-radius:12px;font:600 17px var(--ui);color:#fff;background:var(--tint);text-align:center}
#setup .err{color:var(--red-ink);font-size:15px;margin-bottom:14px;min-height:20px}
#setup .act.quiet{margin-top:12px;background:var(--cell);color:var(--tint)}
#setup .act.quiet[hidden]{display:none}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
@keyframes pwFromR{from{transform:translateX(38%);opacity:0}}
@keyframes pwFromL{from{transform:translateX(-38%);opacity:0}}

/* ── an entry, a screen of its own ───────────────────────────────────
   Pushed in from the right over the venue's entries, as Mail opens a
   message, and filling the screen as the desk's reader does (Mark,
   2026-10-21). Its head holds still: back to the list at the left, up and
   down to the entry either side at the right, as in Mail; the page beneath
   also turns with a sideways swipe, and a swipe from the left edge goes
   back. The answers stand in the toolbar at the foot. The order inside is
   the desk's (Mark, 2026-10-16): who it is first, then the long texts,
   whole and the project description first, then every other fact the
   site gives, in its words and order; nothing is cut behind "Show all". */
#sheet.pw-full{background:none}
#sheet.pw-full .panel{top:0;max-height:none;border-radius:0;padding-top:0;background:var(--bg);animation-name:pwPush;
  box-shadow:-10px 0 30px rgba(0,0,0,.5)}
@keyframes pwPush{from{transform:translateX(100%)}}
#sheet.pw-full .panel.pop{transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.6,1)}
#sheet.pw-full .grab{display:none}
.pw-head{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:2px;margin:0 -16px;
  height:calc(var(--top) + 44px);padding:var(--top) 6px 0;
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.pw-head .pw-up{max-width:none;flex:1}
.pw-arr{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tint);border-radius:22px}
.pw-arr svg{width:22px;height:22px}
.pw-arr:disabled{color:#48484A}
.pw-arr:active{background:var(--press)}
.pw-page{padding:14px 0 24px}
#sheet-body .pw-page.pw-from-r{animation:pwFromR .24s cubic-bezier(.2,.8,.2,1)}
#sheet-body .pw-page.pw-from-l{animation:pwFromL .24s cubic-bezier(.2,.8,.2,1)}
.pw-of{display:block;margin-bottom:6px;font-size:13px;color:var(--label2)}
.pw-of .pw-flags{display:inline-flex;margin:0 0 0 10px}
#sheet .pw-page h2{font:700 28px/1.15 var(--ui);margin:0 0 6px}
.pw-dsub{margin:0 0 4px;font-size:17px;color:var(--label2)}
.pw-meta{margin:0;font-size:13px;color:var(--label3);overflow-wrap:anywhere}
/* the entry's own grouped cells sit flush with the page's sides */
#sheet .pw-group{margin:0 -2px}
#sheet .pw-gh{margin:24px 14px 7px}
/* The entry is read on paper (Mark, 2026-10-21: "the nice reading
   colour", the bone the entry wore before the Apple look), and is set for
   reading: the page's own words straight under the title, in the reading
   face and without boxes, and the buttons and facts after them. Only its
   head stays dark, so the clock's white figures over it can still be read. */
#sheet.pw-full .panel{
  --bg:#F4EEE2; --cell:#FBF8F1; --cell2:#ECE5D7; --fill:#E6DECF; --press:#E2D9C8;
  --label:#282420; --label2:#5E574B; --label3:#6A6250; --sep:#D8CFBF;
  --tint:#0A5FC2; --tint-ink:#0A5FC2; --orange:#9A5B00; --red-ink:#B4322A; --indigo-ink:#4646B8;
  --yellow:#7A6200; --green:#2F7A2A; --clay:#8D4A35;
  color-scheme:light;background:linear-gradient(170deg,#F6F1E6,#ECE4D3);color:var(--label)}
#sheet.pw-full .pw-head{--tint:#0A84FF;--press:#3A3A3C;background:rgba(28,28,30,.96);border-bottom-color:#38383A}
#sheet.pw-full .pw-arr:disabled{color:#636366}
#sheet.pw-full .bar{background:rgba(242,236,224,.94);border-top-color:var(--sep)}
#sheet.pw-full .pw-chev{color:#9A9082}
.pw-page{max-width:640px;margin:0 auto}
#sheet .pw-page h2{font:600 27px/1.2 var(--read);letter-spacing:0;margin:2px 0 6px}
#sheet.pw-full .pw-dsub{font-size:15px}
.pw-read{margin:22px 4px 8px}
.pw-read .pw-sec + .pw-sec{margin-top:26px}
.pw-read h3{margin:0 0 8px;font:600 12px/1.3 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--label2)}
.pw-read .pw-txt{padding:0;font:19px/1.65 var(--read);color:var(--label);hyphens:auto;-webkit-hyphens:auto}
#sheet.pw-full .pw-meta{margin:10px 14px 0;font-size:13px;line-height:1.4}
#pw-lead:not(:empty){box-shadow:inset 0 .5px 0 var(--sep)}
a.pw-cell{text-decoration:none}
.pw-cell.link{color:var(--tint)}
.pw-cell.link .pw-cm{color:var(--tint)}
.pw-why{flex:1;min-width:0;font:17px var(--ui);color:var(--label);background:none;border:0;padding:0;-webkit-appearance:none;outline:none}
.pw-why::placeholder{color:var(--label3)}
/* a line written is lit in the orange of Marked, so a glance says the
   entry carries a note (Mark, 2026-10-18) */
.pw-whycell.has{box-shadow:inset 3px 0 0 var(--orange)}
.pw-whycell.has .pw-sq{background:var(--orange)}
.pw-f{display:flex;flex-direction:column;gap:2px;padding:10px 16px}

.pw-fold summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;list-style:none;cursor:pointer;color:var(--label)}
.pw-fold summary::-webkit-details-marker{display:none}
.pw-fold summary::after{content:"";width:8px;height:8px;border-right:2px solid #5A5A5F;border-bottom:2px solid #5A5A5F;transform:rotate(-45deg);transition:transform .15s}
.pw-fold[open] summary::after{transform:rotate(45deg)}
.pw-fold + .pw-fold{border-top:.5px solid var(--sep)}
.pw-orig{margin:0 16px 14px;padding:12px;border-radius:8px;background:var(--cell2);font:12.5px/1.6 var(--mono);color:var(--label2);white-space:pre-wrap;overflow-wrap:anywhere}
.pw-hist{display:flex;flex-direction:column;gap:10px;padding:0 16px 14px;font-size:15px}

.pw-diff{margin-top:5px;font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.pw-diff .add{color:var(--green);background:rgba(48,209,88,.14)}
.pw-diff .del{color:var(--red-ink);background:rgba(255,69,58,.14);text-decoration:line-through}
/* the two answers in the toolbar, each showing when it is the one given */
#sheet .bar button.pw-i.on{color:var(--orange)}
#sheet .bar button.pw-b.on{color:var(--red-ink)}
/* Make lead, in the leads' clay; once made it says under which arena */
.pw-cell.lead{color:var(--clay);justify-content:center;font-weight:600}
.pw-cell.lead.made{color:var(--label2);font-weight:400}
.pw-cell.lead:disabled{color:var(--label3)}
.pw-cell select{flex:1;min-width:0;font:17px var(--ui);color:var(--tint);background:none;border:0;-webkit-appearance:none;outline:none}
.pw-leadgo{display:flex}
.pw-leadgo button{flex:1;min-height:44px;color:var(--tint);text-align:center}

.pw-leadgo button + button{border-left:.5px solid var(--sep)}
.pw-leadgo button:active{background:var(--press)}

/* Mark's notes on a call, as long as he writes them, with the formatting
   the desk lets him keep (bold, headings, lists, links, tables); on the
   phone it is set with the iPhone's own B I U menu over a selection. */
#sheet .pw-label.over{display:block;margin:0 0 2px;font-size:13px;text-transform:uppercase;color:var(--label2)}
#sheet .pw-memo{position:relative;min-height:46vh;margin-top:14px;padding:12px 14px;
  border-radius:var(--radius);background:var(--cell2);
  font:17px/1.5 var(--ui);color:var(--label);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
#sheet .pw-memo:focus{outline:2px solid var(--tint)}
#sheet .pw-memo.blank::before{content:attr(data-placeholder);position:absolute;top:12px;left:14px;right:14px;
  color:var(--label3);pointer-events:none}
#sheet .pw-memo p{margin:0 0 .7em}
#sheet .pw-memo h3,#sheet .pw-memo h4{margin:1em 0 .35em;font:600 19px/1.3 var(--ui)}
#sheet .pw-memo h4{font-size:17px}
#sheet .pw-memo ul,#sheet .pw-memo ol{margin:0 0 .7em;padding-left:1.4em}
#sheet .pw-memo > :first-child,#sheet .pw-memo li > p{margin-top:0}
#sheet .pw-memo li > p{margin-bottom:.2em}

#sheet .pw-memo table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:0 0 .7em;font-size:14px}

</style>
</head>

<script>
'use strict';
/* ══ Pocket's shell ═══════════════════════════════════════════════════
   Copied from Pocket (removed 2026-10-22; its file and its reasons for
   each part are in git's history). Only the login
   sheet is cut down: this page knows its one project, so it never asks
   for a url or a key. The session is kept under a key of its own, not
   Pocket's: two pages renewing one session in turn would hand Supabase
   the same refresh token twice, and it ends the session for that. */
var AUTH = 'partnerwatch.pocket.auth';
var cfg = { url:'https://eaaggqydnjkufzajgpzh.supabase.co',
  key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhYWdncXlkbmprdWZ6YWpncHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzEwMjMsImV4cCI6MjA5OTI0NzAyM30.pRQPc-qZWV0wwPPnfQU0I_HzmZZ36xZYIXJQYfQG96g' };

function $(s){ return document.querySelector(s); }
function el(t, c, x){ var n = document.createElement(t); if (c) n.className = c;
  if (x != null) n.textContent = x; return n; }

var auth = null, renewing = null;
function authCall(path, body, token){
  return fetch(cfg.url.replace(/\/+$/,'') + '/auth/v1/' + path, {
    method: 'POST',
    headers: { 'apikey': cfg.key, 'Content-Type': 'application/json',
               'Authorization': 'Bearer ' + (token || cfg.key) },
    body: JSON.stringify(body || {})
  }).then(function(r){
    return r.text().then(function(t){
      var j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
      if (!r.ok){
        var e = new Error((j && (j.error_description || j.msg || j.message)) || (r.status + ' ' + r.statusText));
        e.status = r.status; throw e;
      }
      return j;
    });
  });
}
function keepAuth(j, email){
  auth = { access: j.access_token, refresh: j.refresh_token,
           until: j.expires_at ? j.expires_at * 1000 : Date.now() + (j.expires_in || 3600) * 1000,
           email: (j.user && j.user.email) || email || (auth && auth.email) || '' };
  try { localStorage.setItem(AUTH, JSON.stringify(auth)); } catch(e){}
}
function dropAuth(){
  auth = null;
  try { localStorage.removeItem(AUTH); } catch(e){}
}
function logIn(email, pass){
  return authCall('token?grant_type=password', { email: email, password: pass })
    .then(function(j){ keepAuth(j, email); });
}
function renew(){
  if (renewing) return renewing;
  renewing = authCall('token?grant_type=refresh_token', { refresh_token: auth.refresh })
    .then(function(j){ keepAuth(j); return auth.access; },
          function(e){
            if (e.status === 400 || e.status === 401){ dropAuth(); askLogin('Logged out — please log in again.'); }
            throw e;
          })
    .then(function(t){ renewing = null; return t; }, function(e){ renewing = null; throw e; });
  return renewing;
}
function token(){
  if (!auth || !auth.refresh) return Promise.reject(new Error('not logged in'));
  if (auth.until - Date.now() > 60000) return Promise.resolve(auth.access);
  return renew();
}
function askLogin(msg){
  $('#setup-err').textContent = msg || '';
  fillSetup();
  $('#setup').classList.add('up');
}
function rest(path, opts){
  opts = opts || {};
  return token().then(function(tok){ return send(path, opts, tok); })
    .then(null, function(e){
      if (e.status !== 401 || !auth) throw e;
      return renew().then(function(tok){ return send(path, opts, tok); });
    });
}
function send(path, opts, tok){
  var h = { 'apikey': cfg.key, 'Authorization': 'Bearer ' + tok,
            'Content-Type': 'application/json' };
  if (opts.prefer) h['Prefer'] = opts.prefer;
  return fetch(cfg.url.replace(/\/+$/,'') + '/rest/v1/' + path, {
    method: opts.method || 'GET', headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.text().then(function(t){
      if (!r.ok){ var e = new Error(r.status + ' ' + (t || r.statusText).slice(0, 160)); e.status = r.status; throw e; }
      if (!t) return null;
      try { return JSON.parse(t); } catch(e){ return null; }
    });
  });
}

var toastTimer = null;
function toast(text, undo, bad){
  var t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  var btn = document.getElementById('toast-do');
  btn.textContent = undo ? 'Undo' : '';
  btn.style.display = undo ? '' : 'none';
  btn.onclick = function(){ hideToast(); if (undo) undo(); };
  t.classList.toggle('bad', !!bad);
  t.classList.add('up');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 6000 : 3800);
}
function hideToast(){ document.getElementById('toast').classList.remove('up'); }

function sheet(build){
  var body = $('#sheet-body'), bar = $('#sheet-bar');
  body.textContent = ''; bar.textContent = ''; bar.className = 'bar';
  build(body, bar);
  bar.style.display = bar.children.length ? '' : 'none';
  body.scrollTop = 0;
  $('#sheet .panel').scrollTop = 0;
  $('#sheet').classList.add('up');
}
function shut(){ $('#sheet').classList.remove('up'); }

var fitSaid = 'not on the home screen';
function topInset(){
  var p = $('#fit-probe');
  if (!p){
    p = el('div');
    p.id = 'fit-probe';
    p.style.cssText = 'position:fixed;left:0;top:0;width:0;visibility:hidden;' +
      'padding-top:env(safe-area-inset-top)';
    document.body.appendChild(p);
  }
  return parseFloat(getComputedStyle(p).paddingTop) || 0;
}
var CLOCK = { 812:47, 844:47, 926:47, 852:59, 932:59, 874:62, 956:62 };
function fitScreen(){
  var home = navigator.standalone ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!home || !window.screen) return;
  function fit(){
    var w = screen.width, h = screen.height;
    var upright = innerWidth < innerHeight;
    var tall = upright ? Math.max(w, h) : Math.min(w, h);
    var notch = Math.max(w, h) >= 812;
    var root = document.documentElement;
    root.style.setProperty('--home-b', (notch ? 18 : 0) + 'px');
    var whole = notch && upright && innerHeight >= tall - 1;
    root.style.setProperty('--top-fix', (whole ? CLOCK[tall] || 54 : 0) + 'px');
    fitSaid = 'screen ' + tall + ' · view ' + innerHeight + ' · top ' + topInset() +
      (whole ? ' · clock ' + (CLOCK[tall] || 54) : '') + ' · fit 8';
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
}

$('#sheet').addEventListener('click', function(e){ if (e.target === $('#sheet')) shut(); });

var ON_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
document.addEventListener('click', function(e){
  if (!ON_IOS || e.defaultPrevented) return;
  var a = e.target.closest && e.target.closest('a[href]');
  if (!a || !/^https?:\/\//i.test(a.href)) return;
  e.preventDefault();
  location.href = 'ddgQuickLink://' + a.href;
});

function fillSetup(){
  if (auth && auth.email) $('#s-email').value = auth.email;
  $('#s-pass').value = '';
  $('#s-save').textContent = auth ? 'Log in again' : 'Log in';
  $('#s-close').hidden = !auth;
  $('#s-out').hidden = !auth;
  $('#s-fit').textContent = fitSaid;
}
$('#gear').addEventListener('click', function(){ askLogin(''); });
$('#s-close').addEventListener('click', function(){ $('#setup').classList.remove('up'); });
$('#s-save').addEventListener('click', function(){
  var email = $('#s-email').value.trim(), pass = $('#s-pass').value;
  if (!email || !pass){ $('#setup-err').textContent = 'Your email and password are both needed.'; return; }
  $('#setup-err').textContent = 'Logging in…';
  logIn(email, pass).then(function(){
    $('#s-pass').value = '';
    $('#setup-err').textContent = '';
    $('#setup').classList.remove('up');
    pwLoad();
  }, function(e){
    $('#setup-err').textContent = 'Log in failed — ' + (e && e.message ? e.message : 'no answer');
  });
});
$('#s-pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#s-save').click(); });
</script>

<script>
'use strict';
/* ══ The watch ════════════════════════════════════════════════════════
   The phone's Mark’s Place itself. It reads the copier's tables as the desk's page
   does (partner-watch/index.html) and writes only what that page writes:
   an entry's four columns of Mark's own (opened_at, verdict, why,
   decided_at), his notes on a call in the `partnerwatch` row of
   app_state, and by Make lead a lead in the `semaphore` row. The links of
   the arenas' scrolls are changed at the desk. */

var PW_VIEW = 'partnerwatch.pocket.view', PW_ROW = 'partnerwatch';
var pwSites = [], pwEntries = [], pwById = {}, pwRun = null, pwLoaded = false;
var pwLinks = {}, pwNotes = {}, pwDetail = {}, pwOpenId = null;
var pwView = { site:null, leads:false, state:'open', q:'' };
try { Object.assign(pwView, JSON.parse(localStorage.getItem(PW_VIEW) || '{}'), { q:'' }); } catch(e){}
/* a phone last left on Later, which went on 2026-10-18, comes back to All */
if (pwView.state === 'later') pwView.state = 'open';
function pwSaveView(){ try { localStorage.setItem(PW_VIEW, JSON.stringify({ site:pwView.site, state:pwView.state })); } catch(e){} }

/* Where each arena's scroll points until Mark sets it at the desk: the
   desk page's DOCS, copied as they stand there (partner-watch/index.html,
   "Where each arena's scroll points"). A link he has set, or emptied,
   comes from the cloud and wins. */
var PW_DOCS = {
  sbep:       'https://www.bluepartnership.eu/sites/bluepartnership.eu/files/documents/2026-10/sbep_jtc_2026_4th_call_announcement_061026_0.pdf',
  water4all:  'https://www.water4all-partnership.eu/sites/default/files/2026-09/Call_Announcement_Water4All_JTC2026_20260908.pdf',
  biodiversa: 'https://www.biodiversa.eu/wp-content/uploads/2026/09/BiodivFuture_Doc1_Announcement-opportunity.pdf',
  forest:     'https://forest-partnership.eu/wp-content/uploads/2026/09/260915_FOREST_JC2026_Call_Announcement_FINAL-1.pdf',
  dut:        'https://dutpartnership.eu/sites/default/files/2026-10/DUT%20Call%202026_Call%20Text_0.pdf',
  eppermed:   'https://www.eppermed.eu/wp-content/uploads/EPPerMed_JTC2027_pre-announcement.pdf'
};
function pwDocs(id){ return Object.prototype.hasOwnProperty.call(pwLinks, id) ? pwLinks[id] : (PW_DOCS[id] || ''); }

/* ── reading ──────────────────────────────────────────────────────── */

var PW_COLS = 'id,site,ext_id,url,kind,contact,org,country,topic,keywords,posted,list_text,first_seen,fetched_at,changed_at,removed_at,opened_at,verdict,why,decided_at,needs_fetch';
/* The database hands out a thousand rows a request at most, and the four
   arenas held past eight hundred on their first night. */
function pwAll(path){
  var out = [];
  function page(from){
    return rest(path + '&limit=1000&offset=' + from).then(function(rows){
      out = out.concat(rows || []);
      return rows && rows.length === 1000 ? page(from + 1000) : out;
    });
  }
  return page(0);
}
function pwLoad(){
  var icon = $('#refresh');
  icon.classList.add('spin');
  /* a pull from the top shows nothing moving of its own, so the line
     under the name says the cloud is being asked */
  if (pwLoaded) pwStamp('fetching…');
  return Promise.all([
    rest('partner_sites?select=*&order=sort'),
    pwAll('partner_entries?select=' + PW_COLS + '&before_watch=is.false&order=first_seen.desc,id'),
    rest('partner_watch_log?select=ran_at,added,changed,removed,errors&order=ran_at.desc&limit=1'),
    rest('app_state?id=eq.' + PW_ROW + '&select=data').then(null, function(){ return []; }),
    rest('app_state?id=eq.semaphore&select=data').then(null, function(){ return []; })
  ]).then(function(r){
    pwMarket = ((r[4] || [])[0] || {}).data || null;
    pwSites = pwInMarketOrder(r[0] || []); pwEntries = r[1]; pwRun = (r[2] || [])[0] || null;
    var mine = ((r[3] || [])[0] || {}).data || {};
    pwLinks = mine.docs || {};
    pwNotes = mine.notes || {};
    pwById = {}; pwEntries.forEach(function(e){ pwById[e.id] = e; });
    /* Newest first, as the desk orders them: the night an entry arrived,
       then the site's own date where it gives one, then the site's own
       number, which both platforms count upwards. */
    pwEntries.sort(function(a, b){
      return (b.first_seen || '').slice(0, 10).localeCompare((a.first_seen || '').slice(0, 10))
          || (b.posted || '').localeCompare(a.posted || '')
          || (+b.ext_id - +a.ext_id);
    });
    pwEntries.forEach(function(e, i){ e._i = i; });
    if (!pwSites.some(function(s){ return s.id === pwView.site; })) pwView.site = pwSites.length ? pwSites[0].id : null;
    pwLoaded = true;
    pwRegroup();
    pwDraw();
  }).catch(function(e){
    pwStamp('cloud: ' + (e && e.message ? e.message.slice(0, 40) : 'unreachable'));
    if (!auth && !$('#setup').classList.contains('up')) askLogin('Log in to read the cloud.');
    console.error(e);
  }).then(function(){ icon.classList.remove('spin'); });
}
function pwStamp(msg){
  if (msg){ $('#stamp').textContent = msg; return; }
  $('#stamp').textContent = !pwLoaded ? 'not yet loaded'
    : pwChecking ? 'checking the venues… ' + pwChecking
    : pwRun ? 'checked ' + pwWhen(pwRun.ran_at) + ' · ' + pwRun.added + ' new' : 'not checked yet';
}
function pwDay(iso){ return iso ? new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : ''; }
function pwWhen(iso){ if (!iso) return ''; var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }

/* ── what is shown, in what order ─────────────────────────────────────
   The desk's filters and groups. Binned entries stay out of every view but
   Binned. Within an arena the list reads New, then Marked, then
   the rest (Mark, 2026-10-16; Later went on 2026-10-18), each newest first; the group is
   fixed when the list is drawn afresh, not when an entry is answered, so
   going to the next entry never skips or repeats one. */
var PW_STATES = [['open','All'],['unsorted','Unsorted'],['interesting','Marked'],['bin','Binned']];
var PW_GROUPS = ['New', 'Marked', 'Seen', 'Binned'];
function pwIsNew(e){ return !e.opened_at && !e.verdict; }
function pwGroupOf(e){
  return e.verdict === 'interesting' ? 1 : e.verdict === 'bin' ? 3 : !e.opened_at ? 0 : 2;
}
/* An entry made into a lead leaves its venue for Leads, as at the desk
   (see "Leads" in partner-watch/index.html), fixed with its group. */
function pwRegroup(){ var L = pwLeadMap(); pwEntries.forEach(function(e){ e._g = pwGroupOf(e); e._lead = L[e.id] || null; }); }
function pwPasses(e){
  var v = pwView;
  if (v.leads ? !e._lead : e._lead || e.site !== v.site) return false;
  if (!v.leads){
  /* a search under All reaches the binned too, as at the desk */
  if (v.state === 'open' && e.verdict === 'bin' && !v.q) return false;
  if (v.state === 'unsorted' && e.verdict) return false;
  if (['interesting','bin'].indexOf(v.state) >= 0 && e.verdict !== v.state) return false;
  }
  if (v.q){
    var hay = [e.contact, e.org, e.country, e.topic, e.keywords, e.list_text, e.why].join(' ').toLowerCase();

/* ── the Marketplace's order ──

var pwMarket = null;

  aqua:'#59beb8', mist:'#5bbad0', cornflower:'#71b3e1', dusk:'#8faae8', lilac:'#aca0e2', mauve:'#c598d1', rose:'#d992b3',
  rosewood:'#ad6464', rust:'#a96b45', umber:'#9c7334', ochre:'#8d7b32', moss:'#6f8644', fern:'#3c8d6d', teal:'#1b8e88',
  slate:'#218a9f', cobalt:'#4183ae', twilight:'#617ab5', violet:'#7d71b0', plum:'#9469a0', berry:'#a66384' };

    var keys = [v.url].concat((v.pages || []).map(function(p){ return p.url; })).filter(Boolean).map(pwSiteKey);
    if (keys.some(function(x){ return pwSameSite(x, k); }) && (!best || (v.place === 'venues' && best.place !== 'venues'))) best = v;
  });

}
function pwVenueArenas(v){
  var as = (pwMarket && pwMarket.arenas) || [];

    .filter(function(a){ return a && !a.frozenAt; });

/* ── an entry ─────────────────────────────────────────────────────────
   The desk's reading of the site's label-value pairs, kept the same so an
   entry says the same thing on both: a pair is long when it is a
   description or the cooperation interest, runs past 220 characters or
   holds a blank line, and never when it is the call topic; who it is comes
   first, in Mark's words for it whatever the site calls it; a pair the page
   repeats word for word (EPSS prints "Looking for" twice) is shown once. */
var PW_MIDDLE = /description|cooperation interest|^title$/i;
var PW_WHO = [[/^(organisation name|name of organisation\/institution\/company)$/i, 'Name of organisation'],
              [/^country$/i, 'Country'], [/^(name|contact name)$/i, 'Contact name'], [/^(email|email address)$/i, 'Email']];
var PW_TOPIC = /^(topics?|priority areas|disciplines)$/i;
function pwIsLong(f){ return !PW_TOPIC.test(f[0]) && (PW_MIDDLE.test(f[0]) || String(f[1] || '').length > 220 || /\n\s*\n/.test(f[1] || '')); }
function pwEmpty(v){ return !v || /^[-–—\s]*$/.test(v); }
function pwSplit(fields){
  var seen = {}, list = fields.filter(function(f){ var k = f[0] + '\u0000' + f[1]; if (seen[k]) return false; seen[k] = 1; return true; });
  var long = list.filter(pwIsLong), short = list.filter(function(f){ return !pwIsLong(f); });
  var first = /project description|cooperation interest/i;
  long.sort(function(a, b){ return (first.test(b[0]) ? 1 : 0) - (first.test(a[0]) ? 1 : 0); });
  var who = [];
  PW_WHO.forEach(function(w){
    for (var i = 0; i < short.length; i++) if (w[0].test(short[i][0])){ who.push([w[1], short.splice(i, 1)[0][1]]); return; }
  });
  short = short.filter(function(f){ return PW_TOPIC.test(f[0]); }).concat(short.filter(function(f){ return !PW_TOPIC.test(f[0]); }));
  return { who:who, long:long, short:short };
}
/* A fact's value, with an address or a web link made pressable: on the
   phone an email is written from here, and a profile is opened. */
function pwFact(f){
  var d = el('div', 'pw-f');
  d.appendChild(el('span', 'pw-label', f[0].replace(/^Link to 'research gate' or equivalent$/i, 'Research profile')));
  var v = String(f[1] == null ? '' : f[1]).trim(), box = el('div', 'pw-v' + (pwEmpty(v) ? ' none' : ''));
  if (pwEmpty(v)) box.textContent = 'empty on the site';
  else if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ var m = el('a', '', v); m.href = 'mailto:' + v; box.appendChild(m); }
  else if (/^https?:\/\/\S+$/i.test(v)){ var a = el('a', '', v); a.href = v; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a); }

function pwParas(host, t){

function pwFacts(host, head, list){

/* The reading goes into host, the page's own words and nothing else;

function pwBody(host, e){
  host.textContent = '';

function pwOpen(id){

/* Back to the list: the entry slides away to the right, as it came. */

/* The next entry down the list as it was when this one was opened, so a

function pwNext(e, list){

function pwTurn(id, from){

/* the entry after this one (1) or before it (-1) in the list as it stands */
function pwStep(d){

/* The sheet in the hand. A finger's first ten points of travel say which
   way it means: from the left edge of an entry it goes back to the list,
   as every iPhone screen does; sideways elsewhere on an entry it turns to
   the entry beside it in the list; down on the notes' sheet while it is
   scrolled to its top it puts the sheet away; a short pull springs back. A drag that starts in a field, the notes, or a
   text that slides sideways of its own is left to that text. */
(function(){
  var panel = $('#sheet .panel'), x0, y0, way, dx, dy;
  /* the entry's page, under its head: the head and the venue it names
     stay where they are while the page beneath turns (Mark, 2026-10-21) */
  function body(){ return $('#sheet-body .pw-page') || $('#sheet-body'); }
  panel.addEventListener('touchstart', function(e){
    way = null; dx = dy = 0;
    if (e.touches.length !== 1 || e.target.closest('input,textarea,[contenteditable="true"],.pw-orig,.pw-diff,table,.bar')){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive:true });
  panel.addEventListener('touchmove', function(e){
    if (x0 == null) return;

    if (!way){
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      var full = $('#sheet').classList.contains('pw-full');
      way = Math.abs(dx) > Math.abs(dy) * 1.4 && full ? (x0 < 28 && dx > 0 ? 'edge' : 'side')
          : !full && dy > 0 && panel.scrollTop <= 0 ? 'down' : 'none';
      if (way !== 'none'){ panel.style.transition = 'none'; body().style.transition = 'none'; }
    }
    if (way === 'side') body().style.transform = 'translateX(' + dx * .6 + 'px)';
    else if (way === 'down') panel.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
    else if (way === 'edge') panel.style.transform = 'translateX(' + Math.max(0, dx) + 'px)';
  }, { passive:true });
  function end(){
    if (!way || way === 'none'){ way = null; return; }
    var w = way; way = null;
    panel.style.transition = ''; body().style.transition = '';
    body().style.transform = ''; panel.style.transform = '';
    if (w === 'down'){ if (dy > 90) shut(); return; }
    if (w === 'edge'){ if (dx > 90) pwBack(); return; }
    if (Math.abs(dx) >= 70) pwStep(dx < 0 ? 1 : -1);
  }
  panel.addEventListener('touchend', end, { passive:true });
  panel.addEventListener('touchcancel', end, { passive:true });
})();
/* An answer is given and the next entry opens at once: on the phone,
   sorting the night's new entries is the work, and going back to the

   entry already has takes it back, as at the desk, and stays put. */
var PW_SAID = { interesting:'Marked', bin:'Binned' };
function pwAnswer(e, v){

  toast(nv ? PW_SAID[nv] + ': ' + pwTitle(e) : 'Answer taken back', function(){
    /* the entries may have been fetched afresh since: put back the one
       on screen now */

    pwPatch(e, was);
    pwDrawArenas(); pwDrawRows();

/* ── choosing several ────────────────────────────────────────────────
   Mark wanted to pick several entries on the phone and answer them
   together, as the tick boxes do at the desk (2026-10-22). A long press on
   an entry starts the choosing with that entry picked, as in Mail and
   Photos; a tap then picks or lets go. Select All takes every entry the
   list shows, so with Unsorted or a search chosen it takes
   only those; a group's header takes only that group, all the New ones
   say. What is acted on is what is picked and still shown, so changing
   the filters on the way never answers an entry out of sight. */
var pwSel = new Set(), pwSelecting = false, pwHeld = false;
/* Pointer events and not touch events, so that the scroll the system

   mouse held down does the same at the desk's browser. */
function pwHold(r, id){
  var t = null, x0 = 0, y0 = 0;
  function stop(){ clearTimeout(t); t = null; }
  r.addEventListener('pointerdown', function(ev){
    if (ev.button) return;
    pwHeld = false; x0 = ev.clientX; y0 = ev.clientY;
    t = setTimeout(function(){
      t = null; pwHeld = true;
      if (!pwSelecting){ pwSelecting = true; pwSel.clear(); }
      pwSel.add(id);
      pwSelDraw();
    }, 450);
  });
  r.addEventListener('pointermove', function(ev){ if (t && Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) > 10) stop(); });
  r.addEventListener('pointerup', stop);
  r.addEventListener('pointercancel', stop);
  r.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
}
function pwPicked(){ return pwShown().filter(function(e){ return pwSel.has(e.id); }); }
function pwSelToggle(id){ if (pwSel.has(id)) pwSel.delete(id); else pwSel.add(id); pwSelDraw(); }
function pwSelEnd(){ pwSelecting = false; pwSel.clear(); pwSelDraw(); }
function pwGroupAll(list, g){
  var mine = list.filter(function(e){ return e._g === g; });
  var all = mine.every(function(e){ return pwSel.has(e.id); });
  var b = el('button', 'pw-ghall', all ? 'Deselect' : 'Select All ' + mine.length);
  b.addEventListener('click', function(){
    mine.forEach(function(e){ if (all) pwSel.delete(e.id); else pwSel.add(e.id); });
    pwSelDraw();
  });

}
var PW_BULK = [['interesting', 'Mark', 'starLine'], ['read', 'Seen', 'seen'], ['none', 'Unsort', 'unsort'], ['bin', 'Bin', 'trash']];
function pwSelDraw(){
  document.body.classList.toggle('pw-selecting', pwSelecting);
  var list = pwShown(), n = pwPicked().length, all = list.length && n === list.length;
  $('#pw-selall').textContent = all ? 'Deselect All' : 'Select All';
  $('#pw-navtitle').textContent = pwSelecting ? (n ? n + ' Selected' : 'Select Entries') : pwView.leads ? 'Leads' : pwSite(pwView.site).name;
  var bar = $('#pw-selbar');
  bar.textContent = '';
  PW_BULK.forEach(function(a){
    var b = el('button');
    b.innerHTML = PW_I[a[2]];
    b.appendChild(el('span', '', a[1]));

}
/* The picked entries answered at once, on the phone first and then in the
   cloud, eighty to a request as the desk's patchMany does, so the address
   stays short. The toast's Undo puts each back as it was. */
function pwBulk(what){
  var list = pwPicked(), now = new Date().toISOString();
  var vals = what === 'read' ? { opened_at:now }
           : what === 'none' ? { verdict:null, decided_at:null }
           : { verdict:what, decided_at:now };
  if (what === 'read') list = list.filter(function(e){ return !e.opened_at; });
  var was = list.map(function(e){ var b = {}; Object.keys(vals).forEach(function(k){ b[k] = e[k] == null ? null : e[k]; }); return [e.id, b]; });
  pwPatchMany(list.map(function(e){ return e.id; }), vals);
  pwSelEnd(); pwDrawArenas();
  var said = { interesting:'Marked', read:'Seen', none:'Unsorted', bin:'Binned' }[what];
  toast(list.length ? said + ': ' + list.length + ' entr' + (list.length === 1 ? 'y' : 'ies') : 'They were all seen already', !list.length ? null : function(){
    var by = {};
    was.forEach(function(w){ var k = JSON.stringify(w[1]); (by[k] = by[k] || { vals:w[1], ids:[] }).ids.push(w[0]); });
    Object.keys(by).forEach(function(k){ pwPatchMany(by[k].ids, by[k].vals); });
    pwDrawArenas(); pwDrawRows();
  });
}
function pwPatchMany(ids, vals){
  var list = ids.map(function(id){ return pwById[id]; }).filter(Boolean);
  var before = list.map(function(e){ var b = {}; Object.keys(vals).forEach(function(k){ b[k] = e[k] == null ? null : e[k]; }); return b; });
  list.forEach(function(e){ Object.assign(e, vals); });
  for (var i = 0; i < list.length; i += 80){
    (function(part, back){
      rest('partner_entries?id=in.(' + part.map(function(e){ return encodeURIComponent('"' + e.id + '"'); }).join(',') + ')',
           { method:'PATCH', body:vals, prefer:'return=minimal' })
        .catch(function(err){
          part.forEach(function(e, j){ Object.assign(e, back[j]); });
          pwDrawArenas(); pwDrawRows();
          toast('Not saved: ' + (err && err.message ? err.message : 'no answer'), null, true);
          console.error(err);
        });
    })(list.slice(i, i + 80), before.slice(i, i + 80));
  }
}

/* ── Check Now ────────────────────────────────────────────────────────
   The desk's Check now on the phone (Mark, 2026-10-22: to look on the
   sites for new entries from wherever he is): the copier is asked to read
   every venue at once, as the night's run does, and the list is fetched
   afresh after. One run copies at most forty entry pages, so while pages
   are still waiting and the last run copied some it goes on by itself, as
   at the desk's checkNow; a run that copied none stops it. A run takes up
   to two minutes, long enough for the phone to lock and drop the line:
   what the run copied is kept either way, and the next press goes on
   where it stopped. */
var pwChecking = '', pwCheckAdded = 0;
function pwDrawCheck(){
  $('#pw-checknow').disabled = !!pwChecking;
  pwStamp();
}
/* The runs that follow the press only copy (`more`), as the desk's do. Had
   each counted as a press, each would ask again for the pages the copier
   gave up on, and a page that is truly broken would never stop counting as
   still to copy. */
function pwCopier(more){
  return token().then(function(tok){
    return fetch(cfg.url.replace(/\/+$/,'') + '/functions/v1/partner-copier', { method:'POST',
      headers:{ 'apikey':cfg.key, 'Authorization':'Bearer ' + tok, 'Content-Type':'application/json' }, body: more ? '{"lists":false}' : '{}' })
      .then(null, function(){ throw Object.assign(new Error('the connection dropped'), { dropped:true }); });
  }).then(function(r){
    return r.text().then(function(t){
      var j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
      if (!r.ok || (j && j.error)) throw new Error((j && j.error) || (r.status + ' ' + r.statusText));
      return j || {};
    });
  });
}
function pwCheck(again){
  pwChecking = pwChecking || '(up to two minutes)';
  pwDrawCheck();
  pwCopier(again).then(function(r){
    pwCheckAdded += r.added || 0;
    var more = r.waiting && r.fetched;
    pwChecking = more ? 'Copying… ' + r.waiting + ' entry pages to go' : '';
    return pwLoad().then(function(){
      if (more) return pwCheck(true);
      pwDrawCheck();
      toast(pwCheckAdded ? pwCheckAdded + ' new entr' + (pwCheckAdded === 1 ? 'y' : 'ies') + ' found' : 'Checked: nothing new on the venues');
    });
  }, function(err){
    pwChecking = '';
    var said = err.dropped ? 'The line dropped while checking. What was copied is kept; press the check at the top again to go on.'
      : 'The check did not finish: ' + err.message;
    return pwLoad().then(function(){ pwDrawCheck(); toast(said, null, true); });
  });
}

/* ── Make lead ────────────────────────────────────────────────────────
   The desk's Make lead (partner-watch/index.html, "Make lead", which says
   what goes where and why), on the phone since 2026-10-21: the same lead,
   built by the same reading of the entry's page, written into the
   Brokerage Semaphore's row the same way, so a lead made here and one made
   at the desk cannot be told apart. The arena is asked only when the
   entry's venue serves several or none, with the phone's own picker. The
   desk's "Lead in" opens the arena's panel; the phone has none, so here it
   only says where the lead is. */
var pwMkAsk = null, pwMkBusy = null;
var PW_EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/;
function pwNewId(){ return window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function pwTodayISO(){ var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
/* every lead made here, by its entry, read once for each copy of the
   Semaphore's row, as at the desk's leadMap */
var pwLeadsRead = null, pwLeadsBy = {};
function pwLeadMap(){
  if (pwLeadsRead === pwMarket) return pwLeadsBy;
  pwLeadsRead = pwMarket; pwLeadsBy = {};
  ((pwMarket && pwMarket.arenas) || []).forEach(function(a){
    (a.leads || []).forEach(function(l){ if (l.entryId && !pwLeadsBy[l.entryId]) pwLeadsBy[l.entryId] = { a:a, l:l }; });
  });
  return pwLeadsBy;
}
function pwLeadOf(e){ return pwLeadMap()[e.id] || null; }
/* A lead made since a list was last drawn moves over as a list is opened
   from the venues, where no Next is under way to lose its place. */
function pwLeadsMoved(){ var L = pwLeadMap(); pwEntries.forEach(function(e){ e._lead = L[e.id] || null; }); }
function pwLeadArenas(e){
  var mine = pwVenueArenas(pwSite(e.site)._venue), ids = mine.map(function(a){ return a.id; });
  var others = ((pwMarket && pwMarket.arenas) || []).filter(function(a){ return !a.frozenAt && ids.indexOf(a.id) < 0; })
    .sort(function(x, y){ return String(x.name).localeCompare(String(y.name)); });
  return { mine:mine, rest:others };
}
function pwDrawLead(e){
  var host = $('#pw-lead');
  if (!host || pwOpenId !== e.id) return;
  host.textContent = '';
  if (!pwMarket) return;
  var had = pwLeadOf(e);
  if (had){
    var m = el('button', 'pw-cell lead made', 'Lead in ' + had.a.name);
    m.disabled = true;
    host.appendChild(m);
    return;
  }
  if (pwMkBusy === e.id){ var w = el('button', 'pw-cell lead', 'Making the lead…'); w.disabled = true; host.appendChild(w); return; }
  if (pwMkAsk === e.id){
    var c = pwLeadArenas(e), pick = el('label', 'pw-cell'), sel = el('select');
    sel.setAttribute('aria-label', 'The arena this lead is filed under');
    function group(label, list){
      var g = el('optgroup'); g.label = label;
      list.forEach(function(a){ var o = el('option', '', a.name); o.value = a.id; g.appendChild(o); });
      sel.appendChild(g);
    }
    if (!c.mine.length){ var o = el('option', '', 'Choose an arena…'); o.value = ''; sel.appendChild(o); }
    else group('This venue serves', c.mine);
    group(c.mine.length ? 'Every other arena' : 'Arenas', c.rest);
    pick.appendChild(sel);
    var v = el('span', 'pw-chev'); v.innerHTML = PW_I.down; pick.appendChild(v);
    host.appendChild(pick);
    var row = el('div', 'pw-leadgo'), no = el('button', '', 'Cancel'), go = el('button', 'go', 'Make Lead');
    go.addEventListener('click', function(){ pwMakeLead(e, sel.value); });
    no.addEventListener('click', function(){ pwMkAsk = null; pwDrawLead(e); });
    row.appendChild(no); row.appendChild(go);
    host.appendChild(row);
    return;
  }
  var b = el('button', 'pw-cell lead', 'Make Lead');
  b.addEventListener('click', function(){
    /* the Why line is kept first: it is the lead's researcher, and a press
       here can come before the field has said it changed */
    var why = $('#sheet .pw-why');
    if (why && (why.value.trim() || null) !== (e.why || null)) pwPatch(e, { why:why.value.trim() || null });
    var c = pwLeadArenas(e);
    if (c.mine.length === 1) return pwMakeLead(e, c.mine[0].id);
    pwMkAsk = e.id; pwDrawLead(e);
  });
  host.appendChild(b);
}
/* The desk's leadFromEntry, as it stands there. */
function pwLeadFromEntry(e, d){
  var f = (d && d.fields) || [];
  var get = function(re){ for (var i = 0; i < f.length; i++) if (re.test(f[i][0]) && String(f[i][1] || '').trim()) return String(f[i][1]).trim(); return ''; };
  var line = function(t){ return String(t || '').split('\n')[0].trim().slice(0, 200); };
  var id = pwNewId(), site = pwSite(e.site), v = site._venue;
  var project = line(get(/^(project (title|name|acronym)|acronym|title|project)$/i) || get(/project.*(title|name|acronym)/i)) || pwTitle(e);
  var coord = line(get(/coordinat|lead(ing)?\b.*(organi[sz]ation|partner|institution)/i)) || e.org || '';
  var mail = (get(/e-?mail/i).match(PW_EMAIL) || String((d && d.page_text) || '').match(PW_EMAIL) || [''])[0];
  var web = (get(/web ?site|homepage|^url$|^web$/i).match(/(?:https?:\/\/)?[^\s,;]+\.[^\s,;]+/i) || [''])[0];
  var links = [];
  if (web) links.push({ id:pwNewId(), label:'project', url:/^https?:/i.test(web) ? web : 'https://' + web });
  if (e.url) links.push({ id:pwNewId(), label:web ? site.name + ' entry' : 'project', url:e.url });
  var l = { id:id, project:project, match:String(e.why || '').trim(), links:links, stage:'spotted', toResearchers:false, toLead:false,
            due:null, doneAt:null, updates:[{ at:pwTodayISO(), text:'Made in Mark’s Place from ' + site.name + '’s entry' }], entryId:e.id };
  if (coord) l.coordinator = coord;
  if (e.contact) l.contact = String(e.contact).trim();
  if (mail) l.email = mail;
  if (v && v.id) l.venueId = v.id;
  return l;
}
function pwMakeLead(e, aid){
  if (!aid) return;
  pwMkBusy = e.id; pwMkAsk = null; pwDrawLead(e);
  var fields = pwDetail[e.id] || !e.fetched_at ? Promise.resolve(pwDetail[e.id] || null)
    : rest('partner_entries?select=fields,page_text&id=eq.' + encodeURIComponent(e.id)).then(function(r){ return (r || [])[0] || null; });
  fields.then(function(d){
    var l = pwLeadFromEntry(e, d), name = '';
    return rest('app_state?id=eq.semaphore&select=data').then(function(rows){
      if (!rows || !rows.length) throw new Error('the Brokerage Semaphore has no copy in the cloud yet');
      var s = rows[0].data;
      if (typeof s === 'string') s = JSON.parse(s);
      var a = (s.arenas || []).filter(function(x){ return x.id === aid; })[0];
      if (!a) throw new Error('that arena is no longer on the board');
      name = a.name;
      /* a second press, or another device, got there first */
      var twice = (s.arenas || []).some(function(x){ return (x.leads || []).some(function(y){ return y.entryId === e.id; }); });
      if (!twice){ if (!Array.isArray(a.leads)) a.leads = []; a.leads.push(l); }
      return rest('app_state', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body:[{ id:'semaphore', data:s, updated_at:new Date().toISOString() }] }).then(function(){ pwMarket = s; return name; });
    });
  }).then(function(name){ pwMkBusy = null; pwDrawLead(e); pwDrawArenas(); toast('Lead made in ' + name); },
    function(err){ pwMkBusy = null; pwDrawLead(e); toast('The lead was not made: ' + (err && err.message ? err.message : 'no answer'), null, true); });
}

/* ── writing ──────────────────────────────────────────────────────────
   An entry's own columns, changed on the phone at once and then in the
   cloud; a refusal puts them back and says so. */
function pwPatch(e, vals){
  var before = {};
  Object.keys(vals).forEach(function(k){ before[k] = e[k] == null ? null : e[k]; });
  Object.assign(e, vals);
  return rest('partner_entries?id=eq.' + encodeURIComponent(e.id), { method:'PATCH', body:vals, prefer:'return=minimal' })
    .catch(function(err){
      Object.assign(e, before);
      pwDrawArenas(); pwDrawRows();
      toast('Not saved: ' + (err && err.message ? err.message : 'no answer'), null, true);
      console.error(err);
    });
}
/* Mark's row: read first and change only the part asked, so a note saved
   here does not undo a link set at the desk since this page was opened;
   one write at a time, in order. As the desk's storeMine. */
var pwQueue = Promise.resolve();
function pwStoreMine(part, changes){
  var run = pwQueue.then(function(){
    return rest('app_state?id=eq.' + PW_ROW + '&select=data').then(function(rows){
      var d = ((rows || [])[0] || {}).data || {};
      d[part] = Object.assign({}, d[part] || {}, changes);
      return rest('app_state', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body:[{ id:PW_ROW, data:d, updated_at:new Date().toISOString() }] });
    });
  });
  pwQueue = run.then(null, function(){});
  return run;
}
/* What a note may hold: the desk page's cleanNote, copied as it stands
   there (partner-watch/index.html, "What a note may hold"), so a note keeps
   the same shape whichever side wrote it: rebuilt from a short list of
   tags, the bold or italic Word and Google Docs write as a style turned
   into the tag, and nothing of the page it was pasted from. A note written
   before the notes took formatting is plain text. */
var PW_NOTE_TAGS = { B:'b', STRONG:'b', I:'i', EM:'i', U:'u', S:'s', STRIKE:'s', DEL:'s', SUB:'sub', SUP:'sup',
  P:'p', DIV:'p', BR:'br', UL:'ul', OL:'ol', LI:'li', H1:'h3', H2:'h3', H3:'h3', H4:'h4', H5:'h4', H6:'h4',
  BLOCKQUOTE:'blockquote', A:'a', TABLE:'table', THEAD:'thead', TBODY:'tbody', TR:'tr', TD:'td', TH:'th' };
var PW_NOTE_DROP = /^(SCRIPT|STYLE|META|LINK|TITLE|HEAD|IFRAME|OBJECT|EMBED|SVG|MATH|NOSCRIPT|TEMPLATE|IMG|PICTURE|VIDEO|AUDIO|CANVAS|BUTTON|INPUT|SELECT|TEXTAREA|FORM)$/;
function pwEsc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function pwCleanNote(html){
  var t = document.createElement('template'); t.innerHTML = html || '';
  function walk(node){
    var out = '';
    node.childNodes.forEach(function(n){
      if (n.nodeType === 3){ out += pwEsc(n.nodeValue); return; }
      if (n.nodeType !== 1 || PW_NOTE_DROP.test(n.tagName)) return;
      var st = n.getAttribute('style') || '', tag = PW_NOTE_TAGS[n.tagName], inner = walk(n);
      if (tag === 'b' && /font-weight\s*:\s*(normal|[1-5]00)\b/i.test(st)) tag = null;
      if (tag !== 'b' && /font-weight\s*:\s*(bold|[6-9]00)\b/i.test(st)) inner = '<b>' + inner + '</b>';
      if (tag !== 'i' && /font-style\s*:\s*italic/i.test(st)) inner = '<i>' + inner + '</i>';
      if (tag !== 'u' && /text-decoration[^;]*underline/i.test(st)) inner = '<u>' + inner + '</u>';
      if (tag === 'br') out += '<br>';
      else if (tag === 'a'){
        var href = n.getAttribute('href') || '';
        out += /^(https?:|mailto:)/i.test(href) ? '<a href="' + pwEsc(href) + '" target="_blank" rel="noopener">' + inner + '</a>' : inner;
      } else out += tag ? '<' + tag + '>' + inner + '</' + tag + '>' : inner;
    });
    return out;
  }
  return walk(t.content);
}
function pwParasHtml(t){ return String(t).split(/\n\s*\n/).map(function(p){ return '<p>' + pwEsc(p).replace(/\n/g, '<br>') + '</p>'; }).join(''); }
function pwNoteHtml(v){ return /^\s*</.test(v || '') ? pwCleanNote(v) : (v ? pwParasHtml(v) : ''); }
function pwNoteText(v){ var t = document.createElement('template'); t.innerHTML = pwNoteHtml(v); return t.content.textContent.trim(); }
/* Mark's notes on a call: written in the sheet, and saved when the field
   is left — tapping beside the sheet, closing it or putting the phone
   away — so a sheet that closes never costs what was typed. */
function pwOpenNotes(id){
  /* Only what was typed is saved: a note merely read is left as it is in
     the cloud, even a plain-text one the field shows as paragraphs. */
  var s = pwSite(id), doc = pwDocs(id), dirty = false;
  function save(){
    if (!dirty) return;
    dirty = false;
    var text = pwCleanNote(ta.innerHTML);
    /* a note emptied down to a bare paragraph is kept as no note at all */
    if (!pwNoteText(text) && !/<(li|table)/.test(text)) text = '';
    pwNotes[id] = text;
    pwDrawArenas();
    var ch = {}; ch[id] = text;
    pwStoreMine('notes', ch).then(function(){ toast('Notes saved'); }, function(err){
      dirty = true;
      toast('Your notes were not saved: ' + (err && err.message ? err.message : 'no answer') + '. They are still in the field.', null, true);
    });
  }
  var ta = el('div', 'pw-memo');
  ta.contentEditable = 'true';
  ta.spellcheck = true;
  ta.setAttribute('role', 'textbox');
  ta.setAttribute('aria-multiline', 'true');
  ta.setAttribute('aria-label', 'Your notes on the call');
  ta.dataset.placeholder = 'What matters in this call: the deadline, the budget, who may apply, what they want to fund…';
  ta.addEventListener('focus', function(){ document.execCommand('defaultParagraphSeparator', false, 'p'); });
  ta.addEventListener('input', function(){ dirty = true; ta.classList.toggle('blank', !ta.textContent.trim() && !ta.querySelector('li,table')); });
  ta.addEventListener('paste', function(ev){
    var cd = ev.clipboardData, html = cd && cd.getData('text/html'), text = cd && cd.getData('text/plain');
    if (!html && !text) return;
    ev.preventDefault();
    dirty = true;
    document.execCommand('insertHTML', false, html ? pwCleanNote(html) : pwParasHtml(text));
  });
  $('#sheet').classList.remove('pw-full');
  sheet(function(b, bar){
    b.appendChild(el('span', 'pw-label over', 'Your notes on the call'));
    b.appendChild(el('h2', '', s.name));
    if (s.call) b.appendChild(el('div', 'pw-dsub', s.call));
    ta.innerHTML = pwNoteHtml(pwNotes[id]);
    ta.classList.toggle('blank', !ta.innerHTML);
    ta.addEventListener('blur', save);
    b.appendChild(ta);
    if (doc){
      var a = el('a', 'key wide', 'Call Text ↗');
      a.href = doc; a.target = '_blank'; a.rel = 'noopener';
      a.style.fontWeight = '400';
      bar.appendChild(a);
    }
    var done = el('button', 'key wide', 'Done');
    done.addEventListener('click', function(){ save(); shut(); });
    bar.appendChild(done);
  });
  pwOpenId = null;
  var obs = new MutationObserver(function(){ if (!$('#sheet').classList.contains('up')){ obs.disconnect(); save(); } });
  obs.observe($('#sheet'), { attributes:true, attributeFilter:['class'] });
  document.addEventListener('visibilitychange', function hide(){
    if (!document.body.contains(ta)){ document.removeEventListener('visibilitychange', hide); return; }
    if (document.visibilityState === 'hidden') save();
  });
}

/* ── starting ─────────────────────────────────────────────────────── */

$('#refresh').innerHTML = PW_I.refresh;
$('#pw-checknow').innerHTML = PW_I.check;
$('#pw-checknow').addEventListener('click', function(){ if (auth && !pwChecking){ pwCheckAdded = 0; pwCheck(); } });
$('#gear').innerHTML = PW_I.gear;
$('#pw-mag').innerHTML = PW_I.mag;
$('#pw-up').addEventListener('click', function(){ pwGo('venues', true); });
$('#pw-seldone').addEventListener('click', pwSelEnd);
$('#pw-selall').addEventListener('click', function(){
  var list = pwShown(), all = list.length && pwPicked().length === list.length;
  list.forEach(function(e){ if (all) pwSel.delete(e.id); else pwSel.add(e.id); });
  pwSelDraw();
});
$('#stage').addEventListener('scroll', function(){ $('#top').classList.toggle('edge', this.scrollTop > 36); }, { passive:true });
$('#pw-q').addEventListener('input', function(){ pwView.q = this.value; pwDrawRows(); });
$('#pw-q').addEventListener('keydown', function(e){ if (e.key === 'Enter') this.blur(); });
$('#refresh').addEventListener('click', function(){ if (auth) pwLoad(); });
$('#s-out').addEventListener('click', function(){
  var a = auth;
  dropAuth();
  if (a) authCall('logout', {}, a.access).catch(function(){});
  pwSites = []; pwEntries = []; pwById = {}; pwDetail = {}; pwNotes = {}; pwLinks = {}; pwLoaded = false;
  shut(); pwGo('venues', true); pwDraw();
  askLogin('Logged out. Nothing of the entries is kept on this phone.');
});
/* pull down at the top to fetch again, as in Pocket */
(function(){
  var stage = $('#stage'), y0 = null;
  stage.addEventListener('touchstart', function(e){
    y0 = stage.scrollTop <= 0 ? e.touches[0].clientY : null;
  }, { passive:true });
  stage.addEventListener('touchmove', function(e){
    if (y0 === null) return;
    if (e.touches[0].clientY - y0 > 78){ y0 = null; if (auth) pwLoad(); }
  }, { passive:true });
  stage.addEventListener('touchend', function(){ y0 = null; }, { passive:true });
})();
/* A home-screen app wakes as it was left, with the entries of the evening
   before; coming back to the front fetches the night's, unless an entry
   is open and being read. */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && auth &&
      !$('#setup').classList.contains('up') && !$('#sheet').classList.contains('up')) pwLoad();
});

try { auth = JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch(e){}
fitScreen();
pwDraw();
if (!auth) askLogin(''); else pwLoad();
</script>
