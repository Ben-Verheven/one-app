<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No viewport-fit=cover, for Pocket's reason (pocket/index.html, the same
     meta): on the home screen iOS 26 draws nothing in the bottom status
     bar's height of a page that covers the screen (WebKit bug 301108). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#191713">
<meta name="apple-mobile-web-app-title" content="Mark 't place">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Mark 't place</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   Mark 't place (Project Watch, then MARK-it Place, MARKetplace and Mark'tplace, until 2026-10-17) on the phone — the brokerage sites' partner-search entries
   that the copier brings in every night (partner-watch/index.html is the
   desk's page, notes/partner-watch.md what Mark chose for it), gone
   through in an idle minute: a venue, its list, an entry, a flag.

   It is built to become a tab of Pocket rather than to stay a page of its
   own, so it wears Pocket's dress and is made of two parts. The first,
   "Pocket's shell", is Pocket's own bar, sheet, toast, login and request,
   copied from pocket/index.html; when the watch moves in, that part is
   dropped and Pocket's own serves. The second, "the watch", is what moves:
   its classes start with pw- and its names with pw, so none of them meets
   one of Pocket's.

   The lists stand on Pocket's charcoal; an entry opens in Pocket's light
   bone sheet, because Mark chose dark on light for reading the long
   descriptions at the desk (2026-10-16).
   ══════════════════════════════════════════════════════════════════ */

/* ── Pocket's shell: its tokens and furniture, as pocket/index.html ──── */
:root{
  color-scheme:dark;
  --paper:#191713; --panel:#231F1A; --field:rgba(10,9,7,.40);
  --ink:#EDE7DC; --muted:#B3A897; --faint:#8A8172;
  --key:#A99C86; --key2:#D8CDB8;
  --grid:rgba(200,188,165,.13); --line:rgba(200,188,165,.24); --line2:rgba(200,188,165,.38);
  --brok:#EF5B4C; --brok-deep:#FF9A8C; --brok-soft:rgba(239,91,76,.20);
  --call:#8A8BF0;
  --today:#F0B429;
  --notice:#8A8BF0; --notice-ink:#C2C3FF; --notice-line:rgba(138,139,240,.26);
  --todo:#8CC47C; --todo-ink:#BBE0AF; --todo-line:rgba(140,196,124,.26); --todo-bg:rgba(140,196,124,.10);
  --strip:rgba(216,205,184,.06);
  --radius:7px; --radius-lg:11px;
  --sans:'Optima','Palatino Linotype','Book Antiqua',Georgia,serif;
  --body:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --sb:max(env(safe-area-inset-bottom), var(--home-b, 0px));
  --top:max(env(safe-area-inset-top), var(--top-fix, 0px));
  /* No tab bar while the watch stands alone: the foot keeps only the home
     bar's room. In Pocket this is its tab bar's height again. */
  --tabs:var(--sb);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overscroll-behavior-y:none;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 50% -6%,rgba(216,205,184,.09),transparent 30rem),
    url("data:image/svg+xml,%3Csvg width='104' height='104' viewBox='0 0 104 104' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23c8bca5' stroke-opacity='0.045' stroke-width='0.7'%3E%3Crect x='42' y='42' width='20' height='20' transform='rotate(45 52 52)'/%3E%3Cpath d='M52 30V6M52 98V74M30 52H6M98 52H74'/%3E%3C/g%3E%3C/svg%3E");
  background-size:auto,104px 104px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}

#top{position:fixed;z-index:40;inset:0 0 auto 0;
  padding:calc(var(--top) + 9px) 10px 9px 16px;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,#2A251E,#1E1B16);border-bottom:1px solid var(--line)}
#top h1{margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
#top .glyph{flex:0 0 auto;width:11px;height:11px;transform:rotate(45deg);border-radius:2px;
  background:var(--brok);box-shadow:0 0 10px rgba(239,91,76,.45)}
#top .words{min-width:0}
#top .title{display:block;font:400 14px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;
  color:var(--key2)}
#top .sub{display:block;margin-top:5px;font:italic 12px/1 var(--body);color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:42px;height:42px;border-radius:var(--radius);display:flex;align-items:center;
  justify-content:center;color:var(--key);font-size:18px}
.icon:active{background:rgba(216,205,184,.12)}
.icon.spin{animation:turn .9s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

#stage{position:fixed;inset:0;padding-top:calc(var(--top) + 62px);
  padding-bottom:var(--tabs);overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain}
.view{display:none;padding:2px 0 30px}
.view.on{display:block}
@media (display-mode: standalone){ html,body{overscroll-behavior:none} }

.searchwrap{position:sticky;top:0;z-index:6;padding:10px 12px;
  background:linear-gradient(180deg,var(--paper) 78%,rgba(25,23,19,0))}
input[type="search"]{width:100%;font:400 16px/1.3 var(--body);color:var(--ink);
  background:var(--field);border:1px solid var(--line2);border-radius:var(--radius);padding:11px 13px;-webkit-appearance:none}
input[type="search"]::placeholder{color:var(--faint);font-style:italic}
input[type="search"]:focus{outline:none;border-color:var(--key)}

#sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(8,7,5,.6)}
#sheet.up{display:block}
#sheet .panel{
  --ink:#282420; --muted:#5E574B; --faint:#6A6250; --key:#6E6656; --key2:#282420;
  --grid:rgba(42,38,32,.13); --line:rgba(42,38,32,.22); --line2:rgba(42,38,32,.36);
  --brok:#C2382C; --brok-deep:#8E241B; --brok-soft:rgba(194,56,44,.16);
  --call:#4646B8; --today:#9A6A00;
  --notice-ink:#33338F; --notice-line:rgba(70,70,184,.24);
  --todo:#3F7A31; --todo-ink:#2C5A21; --todo-line:rgba(63,122,49,.26);
  --strip:rgba(42,38,32,.05); --field:#FCFAF3; --panel:#F1EBDD;
  position:absolute;inset:auto 0 0 0;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(160deg,#F6F1E6,#EAE2D2);color:var(--ink);
  border-radius:16px 16px 0 0;box-shadow:0 -14px 38px rgba(0,0,0,.42);
  padding:10px 16px 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet.up .panel{transform:translateY(0)}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
#sheet .body{padding-bottom:14px}
#sheet h2{margin:0 0 4px;font:400 21px/1.3 var(--body);letter-spacing:.01em;
  white-space:pre-wrap;overflow-wrap:break-word}
#sheet p{margin:0;font:15px/1.55 var(--body);color:var(--ink);white-space:pre-wrap;overflow-wrap:break-word}
#sheet input.line{width:100%;font:16px/1.3 var(--body);color:var(--ink);background:var(--field);
  border:1px solid var(--line2);border-radius:var(--radius);padding:11px 12px;-webkit-appearance:none}
#sheet input.line:focus{outline:none;border-color:var(--key)}
#sheet .bar{position:sticky;bottom:0;z-index:5;display:flex;gap:7px;margin:6px -16px 0;
  padding:11px 16px calc(13px + var(--sb));
  background:linear-gradient(180deg,rgba(234,226,210,0),#EAE2D2 24%);border-top:1px solid var(--line)}
#sheet .bar button,#sheet .bar a.key{flex:1;padding:14px 4px;text-align:center;text-decoration:none;border-radius:var(--radius);white-space:nowrap;
  font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  border:1px solid var(--line2);background:var(--field)}
#sheet .bar button.key,#sheet .bar a.key{flex:1.35;color:#F6F1E6;border-color:#3A342B;background:#3A342B}
#sheet .bar.five button{padding:14px 2px;letter-spacing:.06em;font-size:9.5px}
#sheet .bar.five button.x{flex:0 0 40px}
#sheet .bar button.x{flex:0 0 46px;padding:13px 0;font:17px/1 var(--body);letter-spacing:0;color:var(--faint)}
#sheet .bar button:active{filter:brightness(.94)}

#toast{position:fixed;z-index:80;left:12px;right:12px;bottom:calc(var(--tabs) + 10px);
  display:flex;align-items:center;gap:12px;padding:12px 12px 12px 15px;border-radius:var(--radius-lg);
  background:rgba(44,39,33,.98);border:1px solid var(--line2);box-shadow:0 14px 38px rgba(0,0,0,.42);
  font:15px/1.3 var(--body);color:var(--ink);
  visibility:hidden;opacity:0;pointer-events:none;transform:translateY(18px);
  transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease,visibility 0s linear .26s}
#toast.up{visibility:visible;opacity:1;pointer-events:auto;transform:translateY(0);
  transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease,visibility 0s}
#toast span{flex:1;min-width:0}
#toast button{flex:0 0 auto;padding:9px 11px;border-radius:var(--radius);color:var(--key2);
  font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
#toast button:active{background:rgba(216,205,184,.12)}
#toast.bad{border-color:rgba(239,91,76,.5)}
#sheet.up ~ #toast{bottom:calc(88px + var(--sb))}

#setup{position:fixed;inset:0;z-index:70;display:none;background:var(--paper);
  padding:calc(var(--top) + 40px) 22px 24px;overflow-y:auto}
#setup.up{display:block}
#setup h2{margin:0 0 8px;font:400 15px/1.2 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--key2)}
#setup p{margin:0 0 22px;color:var(--muted);font:italic 15px/1.5 var(--body)}
#setup p.fit{margin:26px 0 0;font:11px/1.5 var(--mono);color:var(--muted)}
#setup label{display:block;margin:0 0 6px;font:600 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
#setup input{width:100%;margin-bottom:16px;font:16px/1.3 var(--body);color:var(--ink);
  background:var(--field);border:1px solid var(--line2);border-radius:var(--radius);padding:12px 13px;-webkit-appearance:none}
#setup input:focus{outline:none;border-color:var(--key)}
#setup .act{display:block;width:100%;padding:14px;border-radius:var(--radius);
  font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#282420;
  background:linear-gradient(180deg,#E9DFC9,#BFB197)}
#setup .err{color:var(--brok);font-size:14px;margin-bottom:14px;min-height:20px}
#setup .act.quiet{margin-top:12px;background:none;border:1px solid var(--line2);color:var(--ink)}
#setup .act.quiet[hidden]{display:none}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}

/* ── the watch ──────────────────────────────────────────────────────── */

/* The arenas, two to a row: Mark works one at a time (the desk dropped
   "All sites" on 2026-10-16), so the one chosen fills the list, and each
   says how many of its entries he has not opened yet. */
.pw-arenas{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 12px 0}
.pw-arena{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:62px;padding:9px 11px 8px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--strip);text-align:left}
.pw-arena.on{border-color:var(--line2);background:rgba(216,205,184,.17)}
.pw-arena:active{border-color:var(--key)}
.pw-an{font:15px/1.25 var(--body);color:var(--ink)}
.pw-ac{font:italic 12.5px/1.2 var(--body);color:var(--muted)}
.pw-ac b{font-style:normal;font-weight:400;color:var(--todo-ink)}
/* The venues in the Marketplace's groups, each under a thin band in its
   type's colour across both columns, and on each the arenas it serves as
   Pocket's Marketplace tags them; see `pwInMarketOrder`. */
.pw-grp{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-height:24px;margin:6px 0 -1px;padding:0 10px 0 13px;border-radius:0 var(--radius) var(--radius) 0;
  background:color-mix(in srgb,var(--tone,#7D7466) 26%,var(--paper));box-shadow:inset 3px 0 0 var(--tone,var(--line2));
  font:600 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.pw-grp:first-child{margin-top:0}
.pw-grp b{font:11px var(--mono);font-weight:400;letter-spacing:0;color:var(--key2)}
.pw-tags{display:flex;flex-wrap:wrap;gap:4px}
.pw-tag{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 7px 1px 6px;font:italic 12px/1.45 var(--body);color:var(--ink);
  background:color-mix(in srgb,var(--tone) 30%,var(--paper));border-left:3px solid var(--tone);border-radius:0 var(--radius) var(--radius) 0}
.pw-tag.more{background:none;border-left-color:transparent;font-style:normal;color:var(--muted)}
/* the chosen arena's call: its text, and Mark's own notes on it */
.pw-call{display:flex;align-items:center;gap:8px;margin:10px 16px 0;min-height:36px}
.pw-cn{flex:1;min-width:0;font:italic 14px/1.3 var(--body);color:var(--muted)}
.pw-cb{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:var(--radius);
  border:1px solid var(--line2);font:13px var(--body);color:var(--key2);text-decoration:none}
.pw-cb:active{background:rgba(216,205,184,.12)}
.pw-cb.has{border-color:var(--notice-line);color:var(--notice-ink)}
.pw-cb svg{width:15px;height:15px}
/* the filters: what is shown, then which kind, each a row that slides
   sideways rather than wrapping under itself */
.pw-chips{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.pw-chips::-webkit-scrollbar{display:none}
.pw-chip{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:99px;
  font:13.5px var(--body);color:var(--muted);white-space:nowrap}
.pw-chip.on{border-color:var(--line2);background:rgba(216,205,184,.17);color:var(--ink)}
/* a group of the list: New, Interesting, Later, Seen, as on the desk */
.pw-group{display:flex;justify-content:space-between;align-items:center;margin:12px 16px 2px;padding-bottom:5px;
  border-bottom:1px solid var(--line);font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--key2)}
.pw-group b{font:11px var(--mono);font-weight:400;letter-spacing:0;color:var(--muted)}
.pw-row{display:flex;gap:11px;width:calc(100% - 24px);margin:0 12px;padding:11px 4px 10px;text-align:left;
  border-bottom:1px solid var(--grid)}
.pw-row:active{background:rgba(216,205,184,.05)}
.pw-dot{flex:0 0 8px;width:8px;height:8px;margin-top:8px;border-radius:50%;border:1px solid var(--line2)}
.pw-dot.new{background:var(--todo);border-color:var(--todo)}
.pw-rt{flex:1;min-width:0}
.pw-t{display:block;font:16px/1.3 var(--body);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-row.dim .pw-t{color:var(--muted)}
.pw-o{display:block;margin-top:2px;font:italic 13px/1.35 var(--body);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.pw-tag{font:12px/1.35 var(--body);border-radius:4px;padding:1px 7px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pw-tag.seeks{border-color:transparent;background:var(--brok-soft);color:var(--brok-deep)}
.pw-tag.offers{border-color:transparent;background:rgba(138,139,240,.2);color:var(--notice-ink)}
.pw-tag.interesting{border-color:rgba(240,180,41,.45);color:var(--today);background:rgba(240,180,41,.1)}
.pw-tag.chg{border-style:dashed;color:var(--key2)}
.pw-tag.newtag{border-color:var(--todo-line);color:var(--todo-ink)}
.pw-tag.gone{border-color:rgba(239,91,76,.45);color:var(--brok-deep)}
.pw-note{padding:40px 28px;text-align:center;color:var(--faint);font:italic 15px/1.5 var(--body)}
.pw-note b{display:block;margin-bottom:7px;color:var(--muted);font-weight:400;font-style:normal;font-size:17px}

/* An entry, in the sheet. The desk's reading of it (Mark, 2026-10-16)
   folded into one column: who it is first, small, then the long texts,
   whole and the project description first, then every other fact the
   site gives, in its words and order; the copied page and its history
   fold away at the foot. Nothing is cut short behind a "Show all". */
#sheet .pw-tags{margin:0 0 8px}
#sheet .pw-tag{border-color:var(--line);color:var(--muted)}
#sheet .pw-tag.seeks{border-color:transparent;background:rgba(194,56,44,.13);color:#8E241B}
#sheet .pw-tag.offers{border-color:transparent;background:rgba(70,70,184,.13);color:#33338F}
#sheet .pw-tag.interesting{border-color:rgba(154,106,0,.45);color:#6B4A00;background:rgba(154,106,0,.13)}
#sheet .pw-tag.chg{border-style:dashed;color:var(--ink)}
#sheet .pw-tag.newtag{border-color:rgba(108,142,28,.5);color:#43590E;background:none}
#sheet .pw-tag.gone{border-color:rgba(142,36,27,.35);color:#8E241B}
#sheet .pw-of{margin-left:auto;font:11px var(--mono);color:var(--faint)}
.pw-dsub{margin:0 0 4px;font:italic 14.5px/1.4 var(--body);color:var(--muted)}
.pw-meta{margin:0 0 12px;font:11.5px/1.5 var(--mono);color:var(--faint);overflow-wrap:anywhere}
.pw-site{display:flex;align-items:center;justify-content:center;min-height:44px;margin:0 0 12px;border:1px solid var(--line2);
  border-radius:var(--radius);background:var(--field);font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);text-decoration:none}
.pw-site:active{background:rgba(42,38,32,.07)}
.pw-label{display:block;margin:0 0 5px;font:600 9px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.pw-who{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0 4px;padding:11px 13px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--field)}
.pw-who .pw-f.wide{grid-column:1/-1}
.pw-f .pw-v{font:14.5px/1.4 var(--body);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.pw-f .pw-v.none{font-style:italic;color:var(--faint)}
.pw-f a{color:var(--notice-ink);text-underline-offset:3px}
.pw-sec{margin-top:20px}
.pw-sec h3{margin:0 0 6px;font:600 9.5px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.pw-txt{font:16.5px/1.62 var(--body);color:var(--ink);overflow-wrap:anywhere}
/* Pocket's sheet sets every p flush and pre-wrapped; a description's
   paragraphs need their gap back, or two read as one. */
#sheet .pw-txt p{margin:0 0 .7em;font:inherit;white-space:normal}
#sheet .pw-txt p.none{color:var(--faint);font-style:italic}
.pw-facts{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
#sheet .pw-plain{margin:14px 0 0;font:italic 14px/1.5 var(--body);color:var(--faint)}
.pw-fold{margin-top:14px;border-top:1px solid var(--line)}
.pw-fold summary{min-height:46px;display:flex;align-items:center;list-style:none;cursor:pointer;
  font:600 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pw-fold summary::-webkit-details-marker{display:none}
.pw-fold summary::before{content:"\203A";margin-right:9px;font:16px/1 var(--body);transition:transform .15s}
.pw-fold[open] summary::before{transform:rotate(90deg)}
.pw-orig{padding:12px 13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field);
  font:12.5px/1.6 var(--mono);color:#3A342C;white-space:pre-wrap;overflow-wrap:anywhere}
.pw-hist{display:flex;flex-direction:column;gap:9px;font:14px/1.45 var(--body)}
.pw-hist i{display:block;font:11.5px var(--mono);font-style:normal;color:var(--faint)}
.pw-diff{margin-top:5px;font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.pw-diff .add{color:#43590E;background:rgba(140,190,40,.16)}
.pw-diff .del{color:#8E241B;background:rgba(194,56,44,.13);text-decoration:line-through}
#sheet .pw-why{margin:6px 0 0}
/* the three answers in the bar, each showing when it is the one given */
#sheet .bar button.pw-i.on{border-color:#9A6A00;background:rgba(154,106,0,.16);color:#6B4A00}
#sheet .bar button.pw-l.on{border-color:#3A342B;background:#3A342B;color:#F6F1E6}

/* Mark's notes on a call, as long as he writes them */

   the desk lets him keep (bold, headings, lists, links, tables); on the
   phone it is set with the iPhone's own B I U menu over a selection. */
#sheet .pw-memo{position:relative;min-height:46vh;margin-top:14px;padding:12px 13px;

  color:var(--faint);font-style:italic;pointer-events:none}

<body>

<header id="top">
  <h1><i class="glyph" aria-hidden="true"></i><span class="words"><span class="title">Mark 't place</span><span class="sub" id="stamp">not yet loaded</span></span></h1>

<main id="stage">
  <section class="view on" id="v-watch">
    <div id="pw-arenas"></div>
    <div id="pw-call"></div>
    <div class="searchwrap">
      <input type="search" id="pw-q" placeholder="Name, organisation, keyword"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<div id="sheet"><div class="panel"><div class="grab"></div>

</div></div>

<div id="toast"><span id="toast-text"></span><button id="toast-do"></button></div>

<div id="setup">
  <h2>Connect</h2>

     One App's cloud. Log in with the email and password you use in One App.</p>

<script>
'use strict';
/* ══ Pocket's shell ═══════════════════════════════════════════════════
   Copied from pocket/index.html, where every part of it says why it is
   as it is; dropped when the watch moves into Pocket. Only the login
   sheet is cut down: this page knows its one project, so it never asks
   for a url or a key. The session is kept under a key of its own, not
   Pocket's: two pages renewing one session in turn would hand Supabase
   the same refresh token twice, and it ends the session for that. */
var AUTH = 'partnerwatch.pocket.auth';
var cfg = { url:'https://eaaggqydnjkufzajgpzh.supabase.co',
  key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhYWdncXlkbmprdWZ6YWpncHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzEwMjMsImV4cCI6MjA5OTI0NzAyM30.pRQPc-qZWV0wwPPnfQU0I_HzmZZ36xZYIXJQYfQG96g' };

function $(s){ return document.querySelector(s); }
function el(t, c, x){ var n = document.createElement(t); if (c) n.className = c;
  if (x != null) n.textContent = x; return n; }

var auth = null, renewing = null;
function authCall(path, body, token){
  return fetch(cfg.url.replace(/\/+$/,'') + '/auth/v1/' + path, {
    method: 'POST',
    headers: { 'apikey': cfg.key, 'Content-Type': 'application/json',
               'Authorization': 'Bearer ' + (token || cfg.key) },
    body: JSON.stringify(body || {})
  }).then(function(r){
    return r.text().then(function(t){
      var j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
      if (!r.ok){
        var e = new Error((j && (j.error_description || j.msg || j.message)) || (r.status + ' ' + r.statusText));
        e.status = r.status; throw e;
      }
      return j;
    });
  });
}
function keepAuth(j, email){
  auth = { access: j.access_token, refresh: j.refresh_token,
           until: j.expires_at ? j.expires_at * 1000 : Date.now() + (j.expires_in || 3600) * 1000,
           email: (j.user && j.user.email) || email || (auth && auth.email) || '' };
  try { localStorage.setItem(AUTH, JSON.stringify(auth)); } catch(e){}
}
function dropAuth(){
  auth = null;
  try { localStorage.removeItem(AUTH); } catch(e){}
}
function logIn(email, pass){
  return authCall('token?grant_type=password', { email: email, password: pass })
    .then(function(j){ keepAuth(j, email); });
}
function renew(){
  if (renewing) return renewing;
  renewing = authCall('token?grant_type=refresh_token', { refresh_token: auth.refresh })
    .then(function(j){ keepAuth(j); return auth.access; },
          function(e){
            if (e.status === 400 || e.status === 401){ dropAuth(); askLogin('Logged out — please log in again.'); }
            throw e;
          })
    .then(function(t){ renewing = null; return t; }, function(e){ renewing = null; throw e; });
  return renewing;
}
function token(){
  if (!auth || !auth.refresh) return Promise.reject(new Error('not logged in'));
  if (auth.until - Date.now() > 60000) return Promise.resolve(auth.access);
  return renew();
}
function askLogin(msg){
  $('#setup-err').textContent = msg || '';
  fillSetup();
  $('#setup').classList.add('up');
}
function rest(path, opts){
  opts = opts || {};
  return token().then(function(tok){ return send(path, opts, tok); })
    .then(null, function(e){
      if (e.status !== 401 || !auth) throw e;
      return renew().then(function(tok){ return send(path, opts, tok); });
    });
}
function send(path, opts, tok){
  var h = { 'apikey': cfg.key, 'Authorization': 'Bearer ' + tok,
            'Content-Type': 'application/json' };
  if (opts.prefer) h['Prefer'] = opts.prefer;
  return fetch(cfg.url.replace(/\/+$/,'') + '/rest/v1/' + path, {
    method: opts.method || 'GET', headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.text().then(function(t){
      if (!r.ok){ var e = new Error(r.status + ' ' + (t || r.statusText).slice(0, 160)); e.status = r.status; throw e; }
      if (!t) return null;
      try { return JSON.parse(t); } catch(e){ return null; }
    });
  });
}

var toastTimer = null;
function toast(text, undo, bad){
  var t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  var btn = document.getElementById('toast-do');
  btn.textContent = undo ? 'Undo' : '';
  btn.style.display = undo ? '' : 'none';
  btn.onclick = function(){ hideToast(); if (undo) undo(); };
  t.classList.toggle('bad', !!bad);
  t.classList.add('up');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 6000 : 3800);
}
function hideToast(){ document.getElementById('toast').classList.remove('up'); }

function sheet(build){
  var body = $('#sheet-body'), bar = $('#sheet-bar');
  body.textContent = ''; bar.textContent = ''; bar.className = 'bar';
  build(body, bar);
  bar.style.display = bar.children.length ? '' : 'none';
  body.scrollTop = 0;
  $('#sheet .panel').scrollTop = 0;
  $('#sheet').classList.add('up');
}
function shut(){ $('#sheet').classList.remove('up'); }
function closeBtn(bar){
  var x = el('button', 'x', '✕');
  x.setAttribute('aria-label', 'Close');
  x.addEventListener('click', shut);
  bar.appendChild(x);
}

var fitSaid = 'not on the home screen';
function topInset(){
  var p = $('#fit-probe');
  if (!p){
    p = el('div');
    p.id = 'fit-probe';
    p.style.cssText = 'position:fixed;left:0;top:0;width:0;visibility:hidden;' +
      'padding-top:env(safe-area-inset-top)';
    document.body.appendChild(p);
  }
  return parseFloat(getComputedStyle(p).paddingTop) || 0;
}
var CLOCK = { 812:47, 844:47, 926:47, 852:59, 932:59, 874:62, 956:62 };
function fitScreen(){
  var home = navigator.standalone ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!home || !window.screen) return;
  function fit(){
    var w = screen.width, h = screen.height;
    var upright = innerWidth < innerHeight;
    var tall = upright ? Math.max(w, h) : Math.min(w, h);
    var notch = Math.max(w, h) >= 812;
    var root = document.documentElement;
    root.style.setProperty('--home-b', (notch ? 18 : 0) + 'px');
    var whole = notch && upright && innerHeight >= tall - 1;
    root.style.setProperty('--top-fix', (whole ? CLOCK[tall] || 54 : 0) + 'px');
    fitSaid = 'screen ' + tall + ' · view ' + innerHeight + ' · top ' + topInset() +
      (whole ? ' · clock ' + (CLOCK[tall] || 54) : '') + ' · fit 8';
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
}

$('#sheet').addEventListener('click', function(e){ if (e.target === $('#sheet')) shut(); });

var ON_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
document.addEventListener('click', function(e){
  if (!ON_IOS || e.defaultPrevented) return;
  var a = e.target.closest && e.target.closest('a[href]');
  if (!a || !/^https?:\/\//i.test(a.href)) return;
  e.preventDefault();
  location.href = 'ddgQuickLink://' + a.href;
});

function fillSetup(){
  if (auth && auth.email) $('#s-email').value = auth.email;
  $('#s-pass').value = '';
  $('#s-save').textContent = auth ? 'Log in again' : 'Log in';
  $('#s-close').hidden = !auth;
  $('#s-out').hidden = !auth;
  $('#s-fit').textContent = fitSaid;
}
$('#gear').addEventListener('click', function(){ askLogin(''); });
$('#s-close').addEventListener('click', function(){ $('#setup').classList.remove('up'); });
$('#s-save').addEventListener('click', function(){
  var email = $('#s-email').value.trim(), pass = $('#s-pass').value;
  if (!email || !pass){ $('#setup-err').textContent = 'Your email and password are both needed.'; return; }
  $('#setup-err').textContent = 'Logging in…';
  logIn(email, pass).then(function(){
    $('#s-pass').value = '';
    $('#setup-err').textContent = '';
    $('#setup').classList.remove('up');
    pwLoad();
  }, function(e){
    $('#setup-err').textContent = 'Log in failed — ' + (e && e.message ? e.message : 'no answer');
  });
});
$('#s-pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#s-save').click(); });
</script>

<script>
'use strict';
/* ══ The watch ════════════════════════════════════════════════════════
   What moves into Pocket. It reads the copier's tables as the desk's page
   does (partner-watch/index.html) and writes only what that page writes:
   an entry's four columns of Mark's own (opened_at, verdict, why,
   decided_at), and his notes on a call in the `partnerwatch` row of
   app_state. The links of the arenas' scrolls are changed at the desk. */

var PW_VIEW = 'partnerwatch.pocket.view', PW_ROW = 'partnerwatch';
var pwSites = [], pwEntries = [], pwById = {}, pwRun = null, pwLoaded = false;
var pwLinks = {}, pwNotes = {}, pwDetail = {}, pwOpenId = null;
var pwView = { site:null, state:'open', kind:'all', q:'' };
try { Object.assign(pwView, JSON.parse(localStorage.getItem(PW_VIEW) || '{}'), { q:'' }); } catch(e){}
function pwSaveView(){ try { localStorage.setItem(PW_VIEW, JSON.stringify({ site:pwView.site, state:pwView.state, kind:pwView.kind })); } catch(e){} }

/* Where each arena's scroll points until Mark sets it at the desk: the
   desk page's DOCS, copied as they stand there (partner-watch/index.html,
   "Where each arena's scroll points"). A link he has set, or emptied,
   comes from the cloud and wins. */
var PW_DOCS = {
  sbep:       'https://www.bluepartnership.eu/sites/bluepartnership.eu/files/documents/2026-10/sbep_jtc_2026_4th_call_announcement_061026_0.pdf',
  water4all:  'https://www.water4all-partnership.eu/sites/default/files/2026-09/Call_Announcement_Water4All_JTC2026_20260908.pdf',
  biodiversa: 'https://www.biodiversa.eu/wp-content/uploads/2026/09/BiodivFuture_Doc1_Announcement-opportunity.pdf',
  forest:     'https://forest-partnership.eu/wp-content/uploads/2026/09/260915_FOREST_JC2026_Call_Announcement_FINAL-1.pdf',
  dut:        'https://dutpartnership.eu/sites/default/files/2026-10/DUT%20Call%202026_Call%20Text_0.pdf',
  eppermed:   'https://www.eppermed.eu/wp-content/uploads/EPPerMed_JTC2027_pre-announcement.pdf'
};
function pwDocs(id){ return Object.prototype.hasOwnProperty.call(pwLinks, id) ? pwLinks[id] : (PW_DOCS[id] || ''); }

/* ── reading ──────────────────────────────────────────────────────── */

var PW_COLS = 'id,site,ext_id,url,kind,contact,org,country,topic,keywords,posted,list_text,first_seen,fetched_at,changed_at,removed_at,opened_at,verdict,why,decided_at';
/* The database hands out a thousand rows a request at most, and the four
   arenas held past eight hundred on their first night. */
function pwAll(path){
  var out = [];
  function page(from){
    return rest(path + '&limit=1000&offset=' + from).then(function(rows){
      out = out.concat(rows || []);
      return rows && rows.length === 1000 ? page(from + 1000) : out;
    });
  }
  return page(0);
}
function pwLoad(){
  var icon = $('#refresh');
  icon.classList.add('spin');
  return Promise.all([
    rest('partner_sites?select=*&order=sort'),
    pwAll('partner_entries?select=' + PW_COLS + '&before_watch=is.false&order=first_seen.desc,id'),
    rest('partner_watch_log?select=ran_at,added,changed,removed,errors&order=ran_at.desc&limit=1'),
    rest('app_state?id=eq.' + PW_ROW + '&select=data').then(null, function(){ return []; }),
    rest('app_state?id=eq.semaphore&select=data').then(null, function(){ return []; })
  ]).then(function(r){
    pwMarket = ((r[4] || [])[0] || {}).data || null;
    pwSites = pwInMarketOrder(r[0] || []); pwEntries = r[1]; pwRun = (r[2] || [])[0] || null;
    var mine = ((r[3] || [])[0] || {}).data || {};
    pwLinks = mine.docs || {};
    pwNotes = mine.notes || {};
    pwById = {}; pwEntries.forEach(function(e){ pwById[e.id] = e; });
    /* Newest first, as the desk orders them: the night an entry arrived,
       then the site's own date where it gives one, then the site's own
       number, which both platforms count upwards. */
    pwEntries.sort(function(a, b){
      return (b.first_seen || '').slice(0, 10).localeCompare((a.first_seen || '').slice(0, 10))
          || (b.posted || '').localeCompare(a.posted || '')
          || (+b.ext_id - +a.ext_id);
    });
    pwEntries.forEach(function(e, i){ e._i = i; });
    if (!pwSites.some(function(s){ return s.id === pwView.site; })) pwView.site = pwSites.length ? pwSites[0].id : null;
    pwLoaded = true;
    pwRegroup();
    pwDraw();
  }).catch(function(e){
    pwStamp('cloud: ' + (e && e.message ? e.message.slice(0, 40) : 'unreachable'));
    if (!auth && !$('#setup').classList.contains('up')) askLogin('Log in to read the cloud.');
    console.error(e);
  }).then(function(){ icon.classList.remove('spin'); });
}
function pwStamp(msg){
  if (msg){ $('#stamp').textContent = msg; return; }
  $('#stamp').textContent = !pwLoaded ? 'not yet loaded'
    : pwRun ? 'checked ' + pwWhen(pwRun.ran_at) : 'not checked yet';
}
function pwDay(iso){ return iso ? new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : ''; }
function pwWhen(iso){ if (!iso) return ''; var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }

/* ── what is shown, in what order ─────────────────────────────────────
   The desk's filters and groups. Binned entries stay out of every view but
   Binned. Within an arena the list reads New, then Interesting, then
   Later, then the rest (Mark, 2026-10-16), each newest first; the group is
   fixed when the list is drawn afresh, not when an entry is answered, so
   going to the next entry never skips or repeats one. */
var PW_STATES = [['open','All'],['unsorted','Unsorted'],['interesting','Interesting'],['later','Later'],['bin','Binned']];
var PW_KINDS = [['all','Both kinds'],['seeks','Seeks partners'],['offers','Offers expertise']];
var PW_GROUPS = ['New', 'Interesting', 'Later', 'Seen', 'Binned'];
function pwIsNew(e){ return !e.opened_at && !e.verdict; }
function pwGroupOf(e){
  return e.verdict === 'interesting' ? 1 : e.verdict === 'later' ? 2 : e.verdict === 'bin' ? 4 : !e.opened_at ? 0 : 3;
}
function pwRegroup(){ pwEntries.forEach(function(e){ e._g = pwGroupOf(e); }); }
function pwPasses(e){
  var v = pwView;
  if (e.site !== v.site) return false;
  if (v.kind !== 'all' && e.kind !== v.kind) return false;
  if (v.state === 'open' && e.verdict === 'bin') return false;
  if (v.state === 'unsorted' && e.verdict) return false;
  if (['interesting','later','bin'].indexOf(v.state) >= 0 && e.verdict !== v.state) return false;
  if (v.q){
    var hay = [e.contact, e.org, e.country, e.topic, e.keywords, e.list_text, e.why].join(' ').toLowerCase();
    if (v.q.toLowerCase().split(/\s+/).some(function(w){ return w && hay.indexOf(w) < 0; })) return false;
  }
  return true;
}
function pwShown(){
  return pwEntries.filter(pwPasses).sort(function(a, b){ return (a._g - b._g) || (a._i - b._i); });
}
function pwTitle(e){ return e.org || e.contact || ('Entry ' + e.ext_id); }
function pwSite(id){ return pwSites.filter(function(s){ return s.id === id; })[0] || { id:id, name:id }; }

/* ── drawing ──────────────────────────────────────────────────────── */

function pwSvg(paths){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>'; }
/* the desk's two marks: the scroll that opens the call text, the note */
var PW_SCROLL = pwSvg('<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/>'
  + '<path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>');
function pwNoteIcon(full){ return pwSvg('<path d="M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/>'
  + (full ? '<path d="M7 13h10"/><path d="M7 17h6"/>' : '')); }

function pwDraw(){
  pwStamp();
  pwDrawArenas();
  pwDrawChips();
  pwDrawRows();
}
/* ── the Marketplace's order ──
   As at the desk (see "the Marketplace's order" in partner-watch/index.html,
   which says why): the venues in the order of the Marketplace's Venues,
   matched by site, and tagged with the arenas they serve. linkKey,
   SHARED_HOSTS and siteKey are the Marketplace's own under names of this
   page's; at the move into Pocket, Pocket's own siteKey and toneHex take
   their place. */
var pwMarket = null;
var PW_TONES = { blush:'#e19292', terracotta:'#db9973', sand:'#cda364', straw:'#bdaa62', olive:'#9db672', sage:'#6ebe9b',
  aqua:'#59beb8', mist:'#5bbad0', cornflower:'#71b3e1', dusk:'#8faae8', lilac:'#aca0e2', mauve:'#c598d1', rose:'#d992b3',
  rosewood:'#ad6464', rust:'#a96b45', umber:'#9c7334', ochre:'#8d7b32', moss:'#6f8644', fern:'#3c8d6d', teal:'#1b8e88',
  slate:'#218a9f', cobalt:'#4183ae', twilight:'#617ab5', violet:'#7d71b0', plum:'#9469a0', berry:'#a66384' };
function pwLinkKey(u){ return String(u || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/[#?].*$/, '').replace(/\/+$/, ''); }
var PW_SHARED_HOSTS = /^(?:b2match\.(?:io|com|eu)|(?:.+\.)?(?:europa\.eu|google\.com|linkedin\.com|youtube\.com|github\.com|eventbrite\.[a-z.]+|meetup\.com|lu\.ma|zoom\.us|microsoft\.com|sharepoint\.com|gov\.pl|horizoneuropencpportal\.eu|eurekanetwork\.org)|proposals\.etag\.ee)$/;
function pwSiteKey(u){
  var k = pwLinkKey(u), i = k.indexOf('/');
  var host = (i < 0 ? k : k.slice(0, i)).replace(/:\d+$/, '');
  if (!PW_SHARED_HOSTS.test(host)) return host;
  var segs = (i < 0 ? '' : k.slice(i + 1)).split('/').filter(function(x){ return x && !/^[a-z]{2}(?:[-_][a-z]{2})?$/.test(x); });

/* ── an entry ─────────────────────────────────────────────────────────
   The desk's reading of the site's label-value pairs, kept the same so an
   entry says the same thing on both: a pair is long when it is a
   description or the cooperation interest, runs past 220 characters or
   holds a blank line, and never when it is the call topic; who it is comes
   first, in Mark's words for it whatever the site calls it; a pair the page
   repeats word for word (EPSS prints "Looking for" twice) is shown once. */
var PW_MIDDLE = /description|cooperation interest|^title$/i;
var PW_WHO = [[/^(organisation name|name of organisation\/institution\/company)$/i, 'Name of organisation'],
              [/^country$/i, 'Country'], [/^(name|contact name)$/i, 'Contact name'], [/^(email|email address)$/i, 'Email']];

  var seen = {}, list = fields.filter(function(f){ var k = f[0] + '\u0000' + f[1]; if (seen[k]) return false; seen[k] = 1; return true; });
  var long = list.filter(pwIsLong), short = list.filter(function(f){ return !pwIsLong(f); });
  var first = /project description|cooperation interest/i;
  long.sort(function(a, b){ return (first.test(b[0]) ? 1 : 0) - (first.test(a[0]) ? 1 : 0); });
  var who = [];
  PW_WHO.forEach(function(w){
    for (var i = 0; i < short.length; i++) if (w[0].test(short[i][0])){ who.push([w[1], short.splice(i, 1)[0][1]]); return; }
  });
  short = short.filter(function(f){ return PW_TOPIC.test(f[0]); }).concat(short.filter(function(f){ return !PW_TOPIC.test(f[0]); }));
  return { who:who, long:long, short:short };
}
/* A fact's value, with an address or a web link made pressable: on the

function pwFact(f, wide){
  var d = el('div', 'pw-f' + (wide ? ' wide' : ''));
  d.appendChild(el('span', 'pw-label', f[0].replace(/^Link to 'research gate' or equivalent$/i, 'Research profile')));
  var v = String(f[1] == null ? '' : f[1]).trim(), box = el('div', 'pw-v' + (pwEmpty(v) ? ' none' : ''));

/* The next entry down the list as it was when this one was opened, so a

function pwNext(e, list){

/* An answer is given and the next entry opens at once: on the phone,

/* ── writing ──────────────────────────────────────────────────────────
   An entry's own columns, changed on the phone at once and then in the
   cloud; a refusal puts them back and says so. */
function pwPatch(e, vals){
  var before = {};
  Object.keys(vals).forEach(function(k){ before[k] = e[k] == null ? null : e[k]; });
  Object.assign(e, vals);
  return rest('partner_entries?id=eq.' + encodeURIComponent(e.id), { method:'PATCH', body:vals, prefer:'return=minimal' })
    .catch(function(err){
      Object.assign(e, before);
      pwDrawArenas(); pwDrawRows();
      toast('Not saved: ' + (err && err.message ? err.message : 'no answer'), null, true);
      console.error(err);
    });

/* Mark's row: read first and change only the part asked, so a note saved

   one write at a time, in order. As the desk's storeMine. */
var pwQueue = Promise.resolve();
function pwStoreMine(part, changes){
  var run = pwQueue.then(function(){
    return rest('app_state?id=eq.' + PW_ROW + '&select=data').then(function(rows){
      var d = ((rows || [])[0] || {}).data || {};
      d[part] = Object.assign({}, d[part] || {}, changes);
      return rest('app_state', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body:[{ id:PW_ROW, data:d, updated_at:new Date().toISOString() }] });
    });

  return run;
}
/* What a note may hold: the desk page's cleanNote, copied as it stands
   there (partner-watch/index.html, "What a note may hold"), so a note keeps

var PW_NOTE_TAGS = { B:'b', STRONG:'b', I:'i', EM:'i', U:'u', S:'s', STRIKE:'s', DEL:'s', SUB:'sub', SUP:'sup',

  BLOCKQUOTE:'blockquote', A:'a', TABLE:'table', THEAD:'thead', TBODY:'tbody', TR:'tr', TD:'td', TH:'th' };
var PW_NOTE_DROP = /^(SCRIPT|STYLE|META|LINK|TITLE|HEAD|IFRAME|OBJECT|EMBED|SVG|MATH|NOSCRIPT|TEMPLATE|IMG|PICTURE|VIDEO|AUDIO|CANVAS|BUTTON|INPUT|SELECT|TEXTAREA|FORM)$/;
function pwEsc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

      if (n.nodeType === 3){ out += pwEsc(n.nodeValue); return; }
      if (n.nodeType !== 1 || PW_NOTE_DROP.test(n.tagName)) return;

      if (tag === 'b' && /font-weight\s*:\s*(normal|[1-5]00)\b/i.test(st)) tag = null;
      if (tag !== 'b' && /font-weight\s*:\s*(bold|[6-9]00)\b/i.test(st)) inner = '<b>' + inner + '</b>';
      if (tag !== 'i' && /font-style\s*:\s*italic/i.test(st)) inner = '<i>' + inner + '</i>';
      if (tag !== 'u' && /text-decoration[^;]*underline/i.test(st)) inner = '<u>' + inner + '</u>';
      if (tag === 'br') out += '<br>';
      else if (tag === 'a'){
        var href = n.getAttribute('href') || '';
        out += /^(https?:|mailto:)/i.test(href) ? '<a href="' + pwEsc(href) + '" target="_blank" rel="noopener">' + inner + '</a>' : inner;
      } else out += tag ? '<' + tag + '>' + inner + '</' + tag + '>' : inner;
    });
    return out;
  }
  return walk(t.content);
}
function pwParasHtml(t){ return String(t).split(/\n\s*\n/).map(function(p){ return '<p>' + pwEsc(p).replace(/\n/g, '<br>') + '</p>'; }).join(''); }
function pwNoteHtml(v){ return /^\s*</.test(v || '') ? pwCleanNote(v) : (v ? pwParasHtml(v) : ''); }
function pwNoteText(v){ var t = document.createElement('template'); t.innerHTML = pwNoteHtml(v); return t.content.textContent.trim(); }
/* Mark's notes on a call: written in the sheet, and saved when the field
   is left — tapping beside the sheet, closing it or putting the phone
   away — so a sheet that closes never costs what was typed. */
function pwOpenNotes(id){
  /* Only what was typed is saved: a note merely read is left as it is in
     the cloud, even a plain-text one the field shows as paragraphs. */
  var s = pwSite(id), doc = pwDocs(id), dirty = false;
  function save(){
    if (!dirty) return;
    dirty = false;
    var text = pwCleanNote(ta.innerHTML);
    /* a note emptied down to a bare paragraph is kept as no note at all */
    if (!pwNoteText(text) && !/<(li|table)/.test(text)) text = '';
    pwNotes[id] = text;
    pwDrawArenas();
    var ch = {}; ch[id] = text;
    pwStoreMine('notes', ch).then(function(){ toast('Notes saved'); }, function(err){
      dirty = true;
      toast('Your notes were not saved: ' + (err && err.message ? err.message : 'no answer') + '. They are still in the field.', null, true);
    });
  }
  var ta = el('div', 'pw-memo');
  ta.contentEditable = 'true';
  ta.spellcheck = true;
  ta.setAttribute('role', 'textbox');
  ta.setAttribute('aria-multiline', 'true');
  ta.setAttribute('aria-label', 'Your notes on the call');
  ta.dataset.placeholder = 'What matters in this call: the deadline, the budget, who may apply, what they want to fund…';
  ta.addEventListener('focus', function(){ document.execCommand('defaultParagraphSeparator', false, 'p'); });
  ta.addEventListener('input', function(){ dirty = true; ta.classList.toggle('blank', !ta.textContent.trim() && !ta.querySelector('li,table')); });
  ta.addEventListener('paste', function(ev){
    var cd = ev.clipboardData, html = cd && cd.getData('text/html'), text = cd && cd.getData('text/plain');
    if (!html && !text) return;
    ev.preventDefault();
    dirty = true;
    document.execCommand('insertHTML', false, html ? pwCleanNote(html) : pwParasHtml(text));
  });
  sheet(function(b, bar){
    b.appendChild(el('span', 'pw-label', 'Your notes on the call'));
    b.appendChild(el('h2', '', s.name));
    if (s.call) b.appendChild(el('div', 'pw-dsub', s.call));
    ta.innerHTML = pwNoteHtml(pwNotes[id]);
    ta.classList.toggle('blank', !ta.innerHTML);
    ta.addEventListener('blur', save);
    b.appendChild(ta);
    if (doc){
      var a = el('a', 'key', 'Call text ↗');
      a.href = doc; a.target = '_blank'; a.rel = 'noopener';
      bar.appendChild(a);
    }
    var done = el('button', doc ? '' : 'key', 'Done');
    done.addEventListener('click', function(){ save(); shut(); });
    bar.appendChild(done);
    closeBtn(bar);
  });
  pwOpenId = null;
  var obs = new MutationObserver(function(){ if (!$('#sheet').classList.contains('up')){ obs.disconnect(); save(); } });
  obs.observe($('#sheet'), { attributes:true, attributeFilter:['class'] });
  document.addEventListener('visibilitychange', function hide(){
    if (!document.body.contains(ta)){ document.removeEventListener('visibilitychange', hide); return; }
    if (document.visibilityState === 'hidden') save();
  });
}

/* ── starting ─────────────────────────────────────────────────────── */

$('#pw-q').addEventListener('input', function(){ pwView.q = this.value; pwDrawRows(); });
$('#refresh').addEventListener('click', function(){ if (auth) pwLoad(); });
$('#s-out').addEventListener('click', function(){
  var a = auth;
  dropAuth();
  if (a) authCall('logout', {}, a.access).catch(function(){});
  pwSites = []; pwEntries = []; pwById = {}; pwDetail = {}; pwNotes = {}; pwLinks = {}; pwLoaded = false;
  shut(); pwDraw();
  askLogin('Logged out. Nothing of the entries is kept on this phone.');
});
/* pull down at the top to fetch again, as in Pocket */
(function(){
  var stage = $('#stage'), y0 = null;
  stage.addEventListener('touchstart', function(e){
    y0 = stage.scrollTop <= 0 ? e.touches[0].clientY : null;
  }, { passive:true });
  stage.addEventListener('touchmove', function(e){
    if (y0 === null) return;
    if (e.touches[0].clientY - y0 > 78){ y0 = null; if (auth) pwLoad(); }
  }, { passive:true });
  stage.addEventListener('touchend', function(){ y0 = null; }, { passive:true });
})();
/* A home-screen app wakes as it was left, with the entries of the evening
   before; coming back to the front fetches the night's, unless an entry
   is open and being read. */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && auth &&
      !$('#setup').classList.contains('up') && !$('#sheet').classList.contains('up')) pwLoad();
});

try { auth = JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch(e){}
fitScreen();
pwDraw();
if (!auth) askLogin(''); else pwLoad();
</script>
