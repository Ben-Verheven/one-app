<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Topic Atlas</title>
<!-- The Topic Atlas was a page of its own until 2026-10-29, when Mark
     retired it: the Call Board's Atlas switch searches the same topics the
     same way, with the dates kept current and his arenas' calls besides,
     and two places doing one job was not clean. This keeps his bookmark
     working, sending it to the Call Board with Atlas on, and takes the
     keywords he last searched with him. The files beside it stay, read by
     the Call Board and, library.js, by Mark's Place (notes/topic-atlas.md). -->
<script>
try {
  var old = JSON.parse(localStorage.getItem('topic-atlas.v1') || 'null');
  if (old && old.chips && old.chips.length && !localStorage.getItem('callboard.atlas'))
    localStorage.setItem('callboard.atlas', JSON.stringify({ chips: old.chips }));
} catch (e) {}
location.replace('../one-app/#atlas');
</script>
<body style="background:#211b10;color:#c9a84c;font:16px Georgia,serif;padding:24px">
The Topic Atlas is now the Atlas switch on the <a href="../one-app/#atlas" style="color:inherit">Call Board</a>.
</body>
</html>
