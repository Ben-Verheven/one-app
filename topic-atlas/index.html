      const d = st(n.col + 1);
      if (n.col === 0) {
        s += `<g class="inode sn ik" data-hk="${n.ci}"${d}><rect x="${n.x}" y="${n2(n.y)}" width="${n.w}" height="${n.h}" rx="6" fill="${kcol(n.ci)}"/>`
          + `<text x="${n.x + n.w / 2}" y="${n2(n.y + n.h / 2)}">${esc(clip(n.label.toUpperCase(), 20))}</text><title>${esc(`The keyword “${n.label}”: hover to follow its paths`)}</title></g>`;
      } else if (n.col === 1 || n.col === 2) {
        s += `<g class="inode sn ic a-${n.axis}"${d}><rect x="${n.x}" y="${n2(n.y)}" width="${n.w}" height="${n.h}" rx="5"/>`
          + `<text x="${n.x + 9}" y="${n2(n.y + n.h / 2)}">${esc(clip(n.label, 33))}</text><title>${esc(n.label + (n.axis === "text" ? "" : ` · ${AXN[n.axis]}`))}</title></g>`;
      } else if (n.col === 3) {
        s += `<g class="inode sn iw" data-wk="${esc(n.wk)}"${d}><text x="${n.x + 4}" y="${n2(n.y + n.h / 2)}">${esc(clip(n.label, 30))}</text>`
          + `<line x1="${n.x + 4}" x2="${n2(wordEnd(n))}" y1="${n2(n.y + n.h - 2)}" y2="${n2(n.y + n.h - 2)}"/><title>${esc(`${n.label}: words in the topics' texts that the paths land on`)}</title></g>`;
      } else {
        /* the rank and the score on the first line (the factor where the
           keywords meet before it), the title in two under it; on its top
           edge, over the factor, how close its keywords meet (step 7) */
        const lines = wrapText(n.label, 31, 2), mt = meets[n.t];
        let tag = "";
        if (mt && n.F !== 1) {
          const lv = LVL[mt.m.lvl], tx = n.x + n.w - 44, tw = Math.ceil(5.7 * lv.length) + 10;
          tag = `<g class="itag sf"${st(7)} style="--d:${(0.6 + 0.3 * n.t).toFixed(1)}s"><rect x="${n2(tx + 5 - tw)}" y="${n2(n.y - 7)}" width="${tw}" height="13" rx="6.5"/>`
            + `<text x="${tx}" y="${n2(n.y - 0.5)}">${esc(lv)}</text><title>${esc(`How close its keywords meet — ${LVLT[mt.m.lvl]}${mt.m.words != null ? `; here ${mt.m.words} word${mt.m.words === 1 ? "" : "s"} between` : ""}. The closer, the more the score rises: ×${f2(n.F)}`)}</title></g>`;
        }
        s += `<g class="inode sn it" data-ht="${n.t}"${d}><rect x="${n.x}" y="${n2(n.y)}" width="${n.w}" height="${n.h}" rx="8"/>`
          + `<text class="itr" x="${n.x + 10}" y="${n2(n.y + 16)}">${esc((c => c.length > 24 ? c.slice(0, 23) + "…" : c)(`${n.t + 1} · ${n.code}`))}</text>`
          + (n.F !== 1 ? `<text class="itf" x="${n.x + n.w - 44}" y="${n2(n.y + 16)}">×${f2(n.F)}</text>` : "")
          + `<text class="its" x="${n.x + n.w - 9}" y="${n2(n.y + 16)}">${f2(n.score)}</text>`
          + lines.map((l, i) => `<text class="itt" x="${n.x + 10}" y="${n2(n.y + 32 + i * 15)}">${esc(l)}</text>`).join("")
          + tag + `<title>${esc(`${n.code} · ${n.label} · score ${f2(n.score)}${n.F !== 1 ? `, ×${f2(n.F)} where its keywords meet` : ""}: hover to see the paths that land on it, and where its keywords meet`)}</title></g>`;
      }
    }
    /* where each topic's keywords meet: a bracket joining the two words,
       and a line from it into the topic; the first topic's is shown, a
       hovered topic's instead */
    const spine = COL[3].x + COL[3].w - 6;
    s += meets.map(x => {
      if (!x) return "";
      const A = N.get("W" + x.wa), B = N.get("W" + x.wb), T = N.get("T" + x.t);
      if (!A || !B || A === B) return "";
      const [P, Q] = A.y <= B.y ? [A, B] : [B, A];
      const ya = P.y + P.h / 2, yb = Q.y + Q.h / 2, ym = (ya + yb) / 2, xa = Math.min(wordEnd(P) + 5, spine - 8), xb = Math.min(wordEnd(Q) + 5, spine - 8);
      const ty = T.y + T.h / 2, how = x.m.lvl === "title" ? "both in the title" : LVL[x.m.lvl];
      return `<g class="imeet${x.t === 0 ? " on" : ""}" data-mt="${x.t}" data-wa="${esc(x.wa)}" data-wb="${esc(x.wb)}"${st(6)}>`
        + `<path class="imb" pathLength="1" d="M${n2(xa)} ${n2(ya)}H${spine}V${n2(yb)}H${n2(xb)}"/>`
        + `<path class="iml" pathLength="1" d="M${spine} ${n2(ym)}C${spine + 22} ${n2(ym)} ${T.x - 26} ${n2(ty)} ${T.x - 2} ${n2(ty)}"/>`
        + `<title>${esc(`In topic ${x.t + 1} the keywords meet: “${x.m.ha.ph}” and “${x.m.hb.ph}”, ${how}. Its score ×${f2(x.F)}`)}</title></g>`;
    }).join("");
    const story = STORY.concat(met ? [MEET_STORY, CLOSE_STORY] : []);
    return s + `</svg><div class="istory" aria-hidden="true">${story.map((ls, i) =>
      `<p class="ist${i > 4 ? " im" : ""}" data-t="${i + 1}">${ls.map(esc).join("<br>")}</p>`).join("")}</div>`;
  }

  /* one topic's lines, added up: each line a piece of its keyword's bar,
     the keywords' totals combined, then what their meeting adds; as the
     section comes into view the pieces come in one by one */
  function scoreHTML(res) {
    const e = res.list[0], r = R[e.ti], n = res.perChip.length;
    const scale = 560 / Math.max(e.score, ...e.perChip);
    const px = v => (v * scale).toFixed(1);
    let d = 0.1;
    const seg = rw => {
      const w = rw.contrib * scale;
      d += 0.09;
      return `<i class="iseg s-${rw.sec}" style="width:${w.toFixed(1)}px;--d:${d.toFixed(2)}s" title="${esc(`${linePath(rw)} → “${rw.hits[0].ph}”${rw.n > 1 ? ` ×${rw.n}` : ""} · ${SEC[rw.sec][1]} · ${arithText(rw)}`)}">`
        + (w >= 74 ? `<span>“${esc(rw.hits[0].ph)}”</span>` : "") + `</i>`;
    };
    let h = `<div class="iex">The first topic above: <b>${esc(r.title)}</b> <span class="mono">${esc(r.id.replace(/^HORIZON-/, ""))}</span></div><div class="ibars">`;
    res.perChip.forEach((pc, ci) => {
      const rows = e.chips[ci] || [];
      const bar = rows.map(seg).join("");
      h += `<div class="ibr"><span class="ikw" style="--kc:${kcol(ci)}">${esc(pc.q)}</span><span class="ibar">${bar}</span>`
        + `<span class="isum" style="--d:${(d + 0.2).toFixed(2)}s">${f2(e.perChip[ci])}</span><span class="inote" style="--d:${(d + 0.2).toFixed(2)}s">${rows.length} line${rows.length === 1 ? "" : "s"}, added up</span></div>`;
      d += 0.3;
    });
    const base = e.base != null ? e.base : e.score, F = e.near ? e.near.F : 1;
    const dTop = d + 0.2, dNear = dTop + 0.55;
    h += `<div class="ibr fin"><span class="ikw">the topic</span><span class="ibar">`
      + SECS.filter(s => e.bySec[s] > 0).map(s => `<i class="iseg s-${s}" style="width:${px(e.bySec[s] / e.sum * base)}px;--d:${dTop.toFixed(2)}s" title="${esc(SEC[s][1])}"></i>`).join("")
      + (F !== 1 ? `<i class="iseg s-near" style="width:${px(e.score - base)}px;--d:${dNear.toFixed(2)}s" title="${esc(`where the keywords meet: ×${f2(F)}`)}"></i>` : "")
      + `</span><span class="isum" style="--d:${(dNear + 0.3).toFixed(2)}s"><b>${f2(e.score)}</b></span><span class="inote" style="--d:${(dNear + 0.3).toFixed(2)}s">the score on its card</span></div></div>`;
    const m = e.near ? e.near.pairs.map(p => p.m).filter(Boolean).sort((a, b) => b.v - a.v)[0] : null;
    h += `<p class="iform"><span class="mono">(${e.perChip.map(f2).join(" × ")})<sup>1/${n}</sup> = ${f2(base)}</span> — every keyword must be answered, so their totals are multiplied and rooted: a topic that answers one keyword loudly and the other not at all scores nothing.`
      + (m ? ` <span class="mono">× ${f2(F)}</span> because the keywords meet: <span class="imw">“${esc(m.ha.ph)}”</span> and <span class="imw">“${esc(m.hb.ph)}”</span> stand ${m.lvl === "title" ? "together in the title" : m.lvl === "joined" ? "joined, a few words apart" : m.lvl === "same" ? "in the same sentence" : "in neighbouring sentences"}.` : "")
      + `</p><div class="ileg">${SECS.map(s => `<span><i class="iseg s-${s}"></i>${esc(SEC[s][1])}</span>`).join("")}<span><i class="iseg s-near"></i>where keywords meet</span></div>`;
    return h;
  }

  function introHTML() {
    const res = S.search(EXAMPLE, {});
    const e = res.list[0], m = e && e.near ? e.near.pairs.map(p => p.m).filter(x => x && x.v > 0).sort((a, b) => b.v - a.v)[0] : null;
    return `<p class="ilead">Start with what a researcher works on. Each keyword is read as concepts of the work programme, may follow links to neighbouring concepts, and lands wherever those concepts are named in a topic's text. Many paths lead to many topics, and every path that lands brings its topic points.</p>
      <div class="isec"><div class="ihd"><span class="inum">1</span>From keywords to topics, along many paths<button class="ireplay" id="ireplay" title="Tell the diagram again, a step at a time">replay ↻</button></div>
        <p class="itx">An example, worked out from the data: <b>${EXAMPLE.join("</b> and <b>")}</b>.</p>
        <div class="iflow">${flowHTML(res)}</div>
        <p class="ilegend">⊆ = ≡ how a keyword matched a concept's name · ~ ⊂ ⊃ a link to a related, narrower or broader concept · the thicker a path, the more points it brings · hover a keyword or a topic to follow its paths and see where its keywords meet</p></div>
      <div class="isec"><div class="ihd"><span class="inum">2</span>Every path that lands is a line, and the lines add up</div>
        <p class="itx">On a topic's card each path is one line, worth a few points: more when its word stands in the title, when the concept is rare in the work programme, when the keyword named the concept itself. A keyword's lines add up to its total; the keywords' totals make the topic's score. Hover a piece of a bar for its line.</p>
        <div class="iscore wait">${scoreHTML(res)}</div></div>
      <div class="isec"><div class="ihd"><span class="inum">3</span>What you can tune</div>
        <div class="itiles">
          <div><b>Hops</b><span>How far a keyword may travel from what you typed, and what a link to a narrower, related or broader concept costs. <em>Rail · Traversal</em></span></div>
          <div><b>Where keywords meet</b><span>How much it counts when your keywords stand close together in a topic's text. <em>Rail · Traversal</em></span></div>
          <div><b>Fine-tuning</b><span>Where a mention stands (title, outcome, scope), methods versus domains, how many mentions count. <em>Rail · Fine-tuning</em></span></div>
          <div><b>Filters</b><span>Deadline, programme part, type of action, budget, TRL: they choose what you see and never change a score. <em>Rail · Filters</em></span></div>
        </div></div>
      <div class="ibtns"><button class="sbtn on" id="itry">Try this example</button><button class="sbtn" id="istart">Start searching</button>
        <span class="hint">This page is behind <b>About</b>, top right.</span></div>`;
  }
  function wireIntro(box) {
    const svg = $(".iflow-svg", box);
    if (svg) {
      const paths = $$(".ie", svg), meets = $$(".imeet", svg), words = $$(".iw", svg);
      /* a topic's meeting: its bracket, and its two words in rose */
      const meetOf = t => {
        let shown = null;
        for (const g of meets) { const on = g.dataset.mt === String(t); g.classList.toggle("on", on); if (on) shown = g; }
        for (const w of words) w.classList.toggle("mw", !!shown && (w.dataset.wk === shown.dataset.wa || w.dataset.wk === shown.dataset.wb));
      };
      meetOf(0);
      svg.addEventListener("mouseover", ev => {
        const n = ev.target.closest("[data-hk],[data-ht]");
        if (!n) { svg.classList.remove("hl"); meetOf(0); return; }
        const k = n.dataset.hk, t = n.dataset.ht;
        svg.classList.add("hl");
        for (const p of paths) p.classList.toggle("on", k != null ? p.dataset.ks.split(" ").includes(k) : p.dataset.ts.split(" ").includes(t));
        meetOf(t != null ? t : 0);
      });
      svg.addEventListener("mouseleave", () => { svg.classList.remove("hl"); meetOf(0); });
      /* A step is told first: its line alone, large over the panel, long
         enough to read; then the line goes and what it said is drawn, long
         enough to watch. Where the keywords meet, and how close, take a
         little longer to draw. */
      const rp = $("#ireplay", box), STEPS = Math.max(0, ...$$("[data-s]", svg).map(el => +el.dataset.s));
      const story = $(".istory", box), lines = $$(".ist", box);
      const SAY = 2200, GONE = 450, dwell = k => k < 6 ? 2300 : 3000;
      let clock = null, step = 0;
      const stage = k => {
        step = k;
        for (let i = 1; i <= STEPS; i++) svg.classList.toggle("s" + i, i <= k);
      };
      const say = k => {
        lines.forEach(l => l.classList.toggle("on", +l.dataset.t === k));
        if (story) story.classList.toggle("on", lines.some(l => +l.dataset.t === k));
      };
      /* to a state at once, cutting short what is still fading or drawing:
         skip shows the whole diagram, replay starts from nothing */
      const jump = f => { svg.classList.add("now"); f(); void svg.getBoundingClientRect(); svg.classList.remove("now"); };
      const finish = () => {
        clearTimeout(clock); clock = null;
        say(0);
        jump(() => { svg.classList.remove("anim"); stage(0); });
        if (rp) { rp.textContent = "replay ↻"; rp.title = "Tell the diagram again, a step at a time"; }
      };
      const tell = () => {
        clearTimeout(clock);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return finish();
        jump(() => { stage(0); svg.classList.add("anim"); });
        if (rp) { rp.textContent = "skip ▸▸"; rp.title = "Show the whole diagram at once"; }
        const next = () => {
          const k = step + 1;
          say(k);
          clock = setTimeout(() => {
            say(0);
            clock = setTimeout(() => { stage(k); clock = setTimeout(k < STEPS ? next : finish, dwell(k)); }, GONE);
          }, SAY);
        };
        clock = setTimeout(next, 350);
      };
      if (rp) rp.onclick = () => clock ? finish() : tell();
      tell();
    }
    /* the bars come in, line by line, when they come into view */
    const sc = $(".iscore", box);
    if (sc) {
      if (typeof IntersectionObserver === "function") {
        const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { sc.classList.replace("wait", "play"); io.disconnect(); } }, { root: $("#modalbox .mb"), threshold: 0.35 });
        io.observe(sc);
      } else sc.classList.remove("wait");
    }
    const tr = $("#itry", box); if (tr) tr.onclick = () => {
      State.chips = EXAMPLE.slice(); for (const q of EXAMPLE) delete State.off[q];
      State.shown = 40; closeModal(); setMode("search");
    };
    const st = $("#istart", box); if (st) st.onclick = () => { closeModal(); setMode("search"); const i = $("#qinput"); if (i) i.focus(); };
  }

  /* ── about ───────────────────────────────────────────────────────── */
  function openAbout() {
    const fl = {};
    for (const r of R) for (const x of r.flags) fl[x.kind] = (fl[x.kind] || 0) + 1;
    const details = `
      <p>Every topic of the Horizon Europe 2026–2027 work programme — ${R.length} of them, across Clusters 1–6, the EU Missions and the Horizontal activities — ranked for a researcher's keywords, the way the Atlas ranks researchers for a project.</p>
      <h4>How a keyword is read</h4>
      <p>A keyword is matched against the names of concepts on two axes: <span class="cnode a-method">methods &amp; expertise</span> — the Atlas's own library of ${LIB.methods.concepts.length - LIB.methods.concepts.filter(c => c.origin === "extension").length} concepts plus ${LIB.methods.concepts.filter(c => c.origin === "extension").length} added for what the work programme keeps asking for — and <span class="cnode a-domain">application domains</span>, ${LIB.domains.concepts.length} concepts read off the destinations, Missions and Horizontal parts. How it matched is the glyph in front: <span class="mono">=</span> a phrase found in topics, <span class="mono">≡</span> another of the concept's names, <span class="mono">⊇ ⊆ ∋</span> inside a longer name, <span class="mono">¶</span> in neither library — the words themselves. From there it may take one step along the concept links: <span class="mono">⊂</span> to a narrower concept, <span class="mono">~</span> to a related one, <span class="mono">⊃</span> to a broader one, each step costing what the rail says. Clicking a reading in the line under the keyword switches it off.</p>
      <h4>The score</h4>
      <div class="formula">W(section) × A(axis) × idf(concept) × hop × q(match) × min(mentions, ${State.opts.cap})</div>
      <p>Title counts most, then Expected Outcome, Scope, and where the topic sits. A concept named in few topics weighs more than one named in many. Each phrase counts once per keyword. With several keywords, a topic has to answer every one, and its score is the geometric mean of its keywords' scores. Filters choose which topics are shown and never change a score.</p>
      <h4>Where keywords meet</h4>
      <div class="formula">score × (1 + strength × closeness)</div>
      <p>Two keywords that meet in one sentence of a topic say more about it than two found paragraphs apart. For each pair of keywords the closest meeting of their phrases counts: <b>joined</b> — one sentence, at most ${State.opts.near.window} words between, and not two items of a list (a comma right after the first phrase or right before the second) — 1; the <b>same sentence</b> otherwise ${num(State.opts.near.same)}; the <b>next sentence</b> ${num(State.opts.near.next)}; further apart, or in different sections, 0. Both in the title count as joined; where the topic sits is left out. Each meeting is multiplied by how surely its two phrases are the keywords — the hop and match-quality factors of their own lines${State.opts.near.hop !== 1 ? `, and ×${num(State.opts.near.hop)} for a phrase reached by a hop` : ""} — and a phrase never meets itself. With three keywords or more, closeness is the mean over the pairs. Strength is ${num(State.opts.near.strength)}, so a topic whose keywords are joined scores ×${f2(1 + State.opts.near.strength)}; at 0 proximity is off. The rail's <b>Traversal</b> section and Fine-tuning set all of it.</p>
      <h4>The data</h4>
      <p>Built on ${esc(DATA.meta.built)}. ${DATA.meta.portal ? `Each topic's text, title, dates and budget are the official ones on the EU Funding &amp; Tenders Portal, fetched on ${dmy(DATA.meta.portal.fetched)}; the Call Board's copy of the work programme gives where each topic sits, and was checked against the portal — the differences are in each topic's reader and in <span class="mono">data/portal-check.md</span>. ${fl.added || 0} topics the Call Board's copy lacks were added from the portal; ${fl.cancelled || 0} are cancelled on the portal and hidden unless closed topics are shown${fl["callboard-only"] ? `; ${fl["callboard-only"]} is not on the portal and keeps the Call Board's text` : ""}.` : `Extracted from the Call Board's copy of the work programme.`} Topics whose reading was uncertain carry a flag, shown in the topic's reader and listed in <span class="mono">data/uncertain-topics.md</span>.</p>
      <p>Deadlines are compared with today's date, ${dmy(TODAY)}. Settings and keywords are kept in this browser.</p>
      <p class="hint">The schema, the formula and three fully worked records are set out in <span class="mono">stage-1-review.html</span>, next to this file.</p>`;
    /* how it works first, the details folded under it */
    const box = $("#modalbox");
    box.className = "wide";
    box.innerHTML = `<div class="mh">How the Topic Atlas works<button id="mclose" aria-label="Close">✕</button></div><div class="mb">`
      + `${introHTML()}<details class="idetails"><summary>More about the scoring and the data</summary>${details}</details></div>`;
    $("#modal").classList.add("open", "intro");
    $("#mclose").onclick = closeModal;
    wireIntro(box);
  }
  function closeModal() {
    $("#modal").classList.remove("open", "intro");
    try { localStorage.setItem(INTRO_KEY, "seen"); } catch (e) { /* storage unavailable */ }
  }

  /* ── modes and wiring ────────────────────────────────────────────── */
  function update() {
    if (State.mode === "search") renderResults(); else { State.last = null; renderBrowse(); }
    refreshCounts();
    save();
  }
  function setMode(m) {
    State.mode = m;
    $("#tab-search").classList.toggle("on", m === "search");
    $("#tab-browse").classList.toggle("on", m === "browse");
    if (m === "search") { renderSearchPage(); } else { State.last = null; renderBrowse(); }
    renderRail();
    save();
  }
  $("#tab-search").onclick = () => setMode("search");
  $("#tab-browse").onclick = () => setMode("browse");
  $("#aboutBtn").onclick = openAbout;
  $("#scrim").onclick = closeReader;
  $("#modal").onclick = ev => { if (ev.target.id === "modal") closeModal(); };
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") { if ($("#modal").classList.contains("open")) closeModal(); else closeReader(); }
  });
  $("#barsub").textContent = `Horizon Europe 2026–2027 · ${R.length} topics`;
  setMode(State.mode);
  /* the first visit in this browser opens how it works */
  try { if (!localStorage.getItem(INTRO_KEY)) openAbout(); } catch (e) { /* storage unavailable: no first visit to tell */ }
  /* the columns are measured in the house fonts: once they are in, again */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (State.mode === "search") renderResults(); });
  /* tokenise the topic text while nothing else is happening, so a keyword
     that falls back to the words themselves answers at once */
  (function warm() { if (!S.warm(12)) setTimeout(warm, 30); })();
})();

</script>
</body>
</html>
