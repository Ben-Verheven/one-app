<script>
/* Topic Atlas — the app.

   Ranks the Horizon Europe 2026–2027 topics for a researcher's keywords the
   way the Atlas ranks researchers for a project. A keyword enters the
   concept space by the concepts' names, may travel one step along their
   links, and every topic that names a concept it lands on collects

       W(section) × A(axis) × idf(concept) × hop × q(match) × min(n, 2)

   With several keywords, the topic's score is then multiplied by
   1 + strength × closeness, for how close the keywords meet in its text.
   Every number on a card is one row of that sum, written out. The topic
   records and the scorer are inside the page; the two concept libraries
   are in library.js beside it, because Marked Place reads the same ones
   (Mark, 2026-10-21: one copy, so the two never drift apart). */
(function () {
  "use strict";
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const f2 = x => (+x).toFixed(2), f3 = x => (+x).toFixed(3);

  /* ── data ─────────────────────────────────────────────────────────── */
  const DATA = window.TOPIC_ATLAS_DATA;
  const LIB = window.TOPIC_LIBRARY;
  const TU = TextUtil.make(LIB.methods.meta.irregular);
  const SECS = ["title", "outcome", "scope", "intro"];
  const SEC = { title: ["T", "Title"], outcome: ["O", "Expected Outcome"], scope: ["S", "Scope"], intro: ["I", "Where it sits"] };
  const C = new Map();
  for (const c of [...LIB.methods.concepts, ...LIB.domains.concepts]) C.set(c.id, c);
  const AXN = { method: "method / expertise", domain: "application domain", text: "the words themselves" };
  const { MTG, MTT, RELG } = Scorer;
  const RELN = { broader: "broader", narrower: "narrower", related: "related" };
  /* where keywords meet: the kinds of meeting, and the settings under Fine-tuning */
  const LVL = { title: "both in the title", joined: "joined", same: "same sentence", next: "next sentence" };
  const LVLT = { title: "the title names both: counts as joined",
                 joined: "joined: one sentence, few words between, not two items of a list",
                 same: "in the same sentence, not joined", next: "in the next sentence" };
  const NEAR_FINE = [["same", "same sentence", "What a meeting in the same sentence counts, when not joined"],
                     ["next", "next sentence", "What a meeting in the next sentence counts"],
                     ["hop", "through a hop", "What a phrase reached by a hop brings to a meeting, on top of its hop and match quality (0: only phrases your keywords name)"]];
  const nearVal = (k, v) => k === "window" ? `${v} w` : "×" + (+v).toFixed(2);

  /* The records travel compact (see build/app.js); unpacked here into the
     shape data/topics.json has, which is the shape the scorer reads. */
  const R = DATA.topics.map(t => {
    const sections = {};
    for (const sec of SECS) {
      const b = (t.b && t.b[sec]) || [];
      sections[sec] = (t.s[sec] || []).map((text, p) => ({ text, boiler: b.filter(x => x[0] === p).map(x => [x[1], x[2]]) }));
    }
    const concepts = t.k.map(([c, si, n, flat]) => {
      const sec = SECS[si], hits = [];
      for (let i = 0; i < flat.length; i += 3)
        hits.push({ p: flat[i], s: flat[i + 1], e: flat[i + 2], ph: sections[sec][flat[i]].text.slice(flat[i + 1], flat[i + 2]) });
      return { c, axis: C.get(c).axis, sec, n, hits };
    });
    return { id: t.id, code: t.code, title: t.title, titleRaw: t.titleRaw, facets: t.f, sections, concepts,
             trimmed: t.tr || [], flags: t.fl || [], conds: t.ct || [], extra: t.x || [],
             fromPortal: t.src === "p", portal: t.po || null, check: t.ck || null,
             updates: (t.u || []).map(i => DATA.updates[i]) };
  });
  const BYID = new Map(R.map((r, i) => [r.id, i]));
  const S = Scorer.create({ libraries: LIB, stats: DATA.stats, records: R }, TU);
  const idf = c => S.idf(c);

  const PORTAL = "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/topic-details/";
  const pad = n => String(n).padStart(2, "0");
  const TODAY = (d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`)(new Date());
  const dmy = s => s ? new Date(s + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—";
  const deadlineOf = r => r.facets.call && r.facets.call.deadline;
  const cancelledOf = r => !!(r.portal && r.portal.cancelled);
  /* open, forthcoming or closed today, from the portal's dates; a cancelled topic is closed */
  const isClosed = r => cancelledOf(r) || (!!deadlineOf(r) && deadlineOf(r) < TODAY);
  const statusOf = r => {
    if (cancelledOf(r)) return "cancelled";
    const c = r.facets.call;
    if (!c || !c.deadline) return null;
    if (c.deadline < TODAY) return "closed";
    return c.opening && c.opening > TODAY ? "forthcoming" : "open";
  };
  const PORTAL_URL = id => PORTAL + String(id).toLowerCase();
  const num = x => (x == null ? "" : String(+(+x).toFixed(2)));
  const rangeTxt = (a, unit) => !a ? "" : (a[0] === a[1] ? num(a[0]) : num(a[0]) + "–" + num(a[1])) + (unit || "");

  /* parts, destinations and action types as the records have them */
  const PART_ORDER = ["CL1", "CL2", "CL3", "CL4", "CL5", "CL6", "MISS", "HORIZ"];
  const PARTS = [];
  for (const r of R) {
    const p = r.facets.part;
    if (!PARTS.some(x => x.key === p.key)) PARTS.push({ key: p.key, label: p.label, full: p.full, dests: [] });
    const P = PARTS.find(x => x.key === p.key);
    if (!P.dests.includes(r.facets.destination)) P.dests.push(r.facets.destination);
  }
  PARTS.sort((a, b) => PART_ORDER.indexOf(a.key) - PART_ORDER.indexOf(b.key));
  const PART = Object.fromEntries(PARTS.map(p => [p.key, p]));
  const ACT = {};
  for (const r of R) { const a = r.facets.actionType; ACT[a.code || "—"] = a.label || "not stated"; }
  const ACT_ORDER = ["RIA", "IA", "CSA", "PCP", "PPI", "COFUND", "TMA", "—"].filter(k => ACT[k]);
  const CONDS = [
    ["lumpSum", "lump sum", r => !!r.facets.conditions.lumpSum],
    ["twoStage", "two-stage", r => !!(r.facets.call && r.facets.call.twoStage)],
    ["partnership", "European Partnership", r => r.facets.conditions.partnerships.length > 0],
    ["fstp", "support to third parties", r => !!r.facets.conditions.fstp],
    ["intl", "international cooperation", r => r.facets.conditions.internationalCooperation.length > 0],
    ["restr", "participation restricted", r => r.facets.conditions.restrictions.length > 0],
    ["security", "security-sensitive", r => !!r.facets.conditions.securitySensitive],
    ["jrc", "JRC may participate", r => !!r.facets.conditions.jrcMayParticipate],
    ["clinical", "clinical studies", r => !!r.facets.conditions.clinicalStudies],
    ["blind", "blind evaluation", r => !!r.facets.conditions.blindEvaluation],
    ["copernicus", "must use Copernicus / Galileo", r => !!r.facets.conditions.useCopernicusGalileo],
  ];
  const FLAGNAME = { "text-mismatch": "another action's text under this topic", "title-garbled": "title repaired",
    "leak-trimmed": "run-on text cut", "leak-start-unclear": "run-on cut, start unclear", "conditions-split": "condition labels rejoined",
    "trl-unparsed": "TRL unreadable", "budget-mismatch": "budget mismatch", "no-method": "no method concept found", "thin": "few concepts found",
    "callboard-only": "not on the portal", "cancelled": "cancelled", "moved": "moved to another call", "added": "added from the portal" };
  const LOUD = ["cancelled", "callboard-only", "text-mismatch", "title-garbled", "leak-start-unclear", "trl-unparsed", "budget-mismatch"];
  const QUIET = ["moved", "added"];

  /* ── state, kept between visits in this browser ───────────────────── */
  const DEF_OPTS = clone(Scorer.DEFAULTS);
  const DEF_FILTERS = { when: "upcoming", until: "", parts: [], types: [], bmin: "", bmax: "",
                        trlMin: 1, trlMax: 9, trlNone: true, cond: {} };
  const State = { mode: "search", chips: [], off: {}, opts: clone(DEF_OPTS), filters: clone(DEF_FILTERS),
                  fineOpen: false, moreOpen: false, stepsOpen: false, arith: false, expanded: new Set(), openSnips: new Set(), openNbrs: new Set(), treeOpen: new Set(), shown: 40, last: null };
  const KEY = "topic-atlas.v1";
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s) {
      if (Array.isArray(s.chips)) State.chips = s.chips.filter(x => typeof x === "string");
      if (s.off && typeof s.off === "object") State.off = s.off;
      if (s.mode === "browse") State.mode = "browse";
      for (const k of ["fineOpen", "moreOpen", "stepsOpen", "arith"]) if (s[k] === true) State[k] = true;
      if (s.opts) State.opts = Object.assign(clone(DEF_OPTS), s.opts, {
        weights: Object.assign(clone(DEF_OPTS.weights), s.opts.weights), step: Object.assign(clone(DEF_OPTS.step), s.opts.step),
        axis: Object.assign(clone(DEF_OPTS.axis), s.opts.axis), near: Object.assign(clone(DEF_OPTS.near), s.opts.near),
        /* every keyword is required, and matching is as the defaults have it: no longer settings */
        requireAll: DEF_OPTS.requireAll, strict: DEF_OPTS.strict });
      if (s.filters) { State.filters = Object.assign(clone(DEF_FILTERS), s.filters, { cond: Object.assign({}, s.filters.cond) });
                       delete State.filters.dest; delete State.filters.ssh; }
    }
  } catch (e) { /* storage unavailable: start fresh */ }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ mode: State.mode, fineOpen: State.fineOpen, moreOpen: State.moreOpen, stepsOpen: State.stepsOpen, arith: State.arith, chips: State.chips, off: State.off,
                                                 opts: State.opts, filters: State.filters }));
    } catch (e) { /* storage unavailable: nothing kept */ }
  }

  /* ── filters ──────────────────────────────────────────────────────── */
  const PRED = {
    when: (r, F) => F.when === "all" || !isClosed(r),
    until: (r, F) => !F.until || (!!deadlineOf(r) && deadlineOf(r) <= F.until),
    parts: (r, F) => !F.parts.length || F.parts.includes(r.facets.part.key),
    types: (r, F) => !F.types.length || F.types.includes(r.facets.actionType.code || "—"),
    budget: (r, F) => {
      if (F.bmin === "" && F.bmax === "") return true;
      const b = r.facets.budget.perProjectEURm;
      if (!b) return false;
      const lo = F.bmin === "" ? -Infinity : +F.bmin, hi = F.bmax === "" ? Infinity : +F.bmax;
      return b[1] >= lo && b[0] <= hi;
    },
    trl: (r, F) => {
      if (F.trlMin <= 1 && F.trlMax >= 9 && F.trlNone) return true;
      const t = r.facets.trl && r.facets.trl.end;
      if (!t) return !!F.trlNone;
      return t[1] >= F.trlMin && t[0] <= F.trlMax;
    },
    cond: (r, F) => CONDS.every(([k, , get]) => !F.cond[k] || (F.cond[k] === 1 ? get(r) : !get(r))),
  };
  const passes = (r, except) => Object.keys(PRED).every(k => k === except || PRED[k](r, State.filters));
  const activeFilters = () => {
    const F = State.filters, n = [];
    if (F.when !== "upcoming") n.push("when"); if (F.until) n.push("until"); if (F.parts.length) n.push("parts");
    if (F.types.length) n.push("types"); if (F.bmin !== "" || F.bmax !== "") n.push("budget");
    if (!(F.trlMin <= 1 && F.trlMax >= 9 && F.trlNone)) n.push("trl");
    if (Object.values(F.cond).some(Boolean)) n.push("cond");
    return n;
  };

  /* ── search ───────────────────────────────────────────────────────── */
  function runSearch() {
    if (!State.chips.length) { State.last = null; return null; }
    State.last = S.search(State.chips, Object.assign({}, State.opts, { off: State.off }));
    return State.last;
  }
  /* the topics the filter counts are taken over: what the keywords reach,
     or every topic when there are none */
  const baseSet = () => State.last ? State.last.list.map(e => R[e.ti]) : R;

  /* ── small renderers ──────────────────────────────────────────────── */
  const badge = sec => `<span class="badge s-${sec}" title="${SEC[sec][1]}">${SEC[sec][0]}</span>`;
  function conceptTitle(id) {
    const c = C.get(id);
    if (!c) return "";
    const anch = [...((c.anchors && c.anchors.msc) || []), ...((c.anchors && c.anchors.ccs) || []), ...((c.anchors && c.anchors.arxiv) || [])].slice(0, 4).join(" · ");
    const wp = ((c.anchors && c.anchors.wp) || []).slice(0, 2).map(a => a.slice(1).join(" › ")).join("; ");
    const df = DATA.stats.df[id] || 0;
    return `${AXN[c.axis]} concept${c.origin === "atlas" ? " from the Atlas" : c.origin === "extension" ? " added to the Atlas's library" : ""}`
      + ` · named in ${df} of ${DATA.stats.N} topics (idf ${f2(idf(id))})` + (anch ? ` · ${anch}` : "") + (wp ? ` · work programme: ${wp}` : "")
      + (c.note ? ` — ${c.note}` : "");
  }
  const cnode = (id, landing, extra) => {
    const c = C.get(id);
    return `<span class="cnode a-${c.axis}${landing ? " landing" : ""}${extra || ""}" title="${esc(conceptTitle(id))}">${esc(c.label)}</span>`;
  };
  function sentenceOf(text, s) {
    return TU.sentences(text).find(([a, b]) => s >= a && s < b) || [0, text.length];
  }
  function snippetHTML(r, sec, h, ti) {
    const text = r.sections[sec][h.p].text;
    const [a, b] = sentenceOf(text, h.s);
    let pre = text.slice(a, h.s).replace(/^•\s*/, ""), post = text.slice(h.e, b).replace(/\s+$/, "");
    const lead = pre.length > 220, tail = post.length > 220;
    if (lead) pre = pre.slice(-220);
    if (tail) post = post.slice(0, 220);
    return `<div class="snippet">“${lead ? "…" : ""}${esc(pre)}<mark>${esc(text.slice(h.s, h.e))}</mark>${esc(post)}${tail ? "…" : ""}”`
      + `<span class="from">${SEC[sec][1]} · paragraph ${h.p + 1}<button data-read="${ti}">read the topic ▸</button></span></div>`;
  }
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ── the rail: filters, then the scoring ─────────────────────────────
     Filters choose which topics are shown and never change a score; the
     rarer ones are folded under "more filters". Then Traversal, the two
     things to tweak first: how far a keyword may travel (hops, the hop
     decay and, folded under it, the cost of each kind of step) and what
     it counts where keywords meet. The rest of the scoring is under
     Fine-tuning. Every setting explains itself on hover (TIPS). */
  const TIPS = {
    when: ["Which topics", "Open & upcoming hides topics whose deadline has passed, and cancelled topics; all, incl. closed shows them too.\nA filter only chooses what you see. It never changes a score."],
    until: ["Deadline by", "Shows only topics whose (first) deadline falls on or before this date, for when something has to be submitted soon."],
    more: ["More filters", "Narrow the list further: by part of the programme, type of action, EU contribution per project, the technology readiness level (TRL) a project should reach, and conditions such as a lump sum or a two-stage call.\nFilters never change a score."],
    reset: ["Reset scoring", "Puts every scoring setting, here and under Fine-tuning, back to its default. Filters and keywords stay as they are."],
    maxHops: ["Max hops", "A keyword is first read as one or more concepts from two libraries: methods & expertise, and application domains. From a concept it may follow links to neighbouring concepts.\nThis sets how many links it may follow. 0: only topics that name the concept itself. 1: also topics that name a neighbour, so ‘digital twins’ also finds topics on simulation. 2: neighbours of neighbours: more topics, looser fits.\nDefault: 1."],
    decay: ["Hop decay", "An extra discount on every link a keyword follows, on top of the step costs.\nAt 1 the step costs alone decide. Lower it and whatever is reached through a link counts for less, so topics that name your keyword directly move up.\nDefault: ×1.00."],
    steps: ["Step costs", "What a mention is still worth after one link, by kind of link: narrower, related or broader. Open to set each one."],
    narrower: ["Narrower ⊂", "A step to a concept inside yours, as from ‘health’ to ‘cancer’. A cancer topic is still a health topic, so this step costs little.\nDefault: ×0.80."],
    related: ["Related ~", "A step to a concept beside yours, as from ‘digital twins’ to ‘simulation’: close, but not the same thing.\nDefault: ×0.60."],
    broader: ["Broader ⊃", "A step to a concept around yours, as from ‘machine learning’ to ‘artificial intelligence’. An AI topic is not necessarily about machine learning, so this step costs most.\nDefault: ×0.40."],
    strength: ["Proximity strength", "With two keywords or more: how much it adds when they stand close together in a topic's text, a sign that the topic is about their combination and not about each one on its own.\nThe score is multiplied by up to 1 + this value, reached when the keywords are joined in one phrase. 0 switches it off.\nDefault: ×0.50, so at most ×1.5."],
    window: ["Joined within", "Two keywords count as joined, the closest kind of meeting, when they stand in one sentence with at most this many words between them, and are not just two items of a list.\nDefault: 8 words."],
    fine: ["Fine-tuning", "The finer settings: how much a mention counts by where it stands in a topic, methods versus domains, how many mentions of one concept count, and what the looser kinds of meeting count.\nThe defaults are the ones argued for in the stage-1 review."],
    w_title: ["Title", "How much a concept counts when the topic's title names it. The title says most about what a topic is for.\nDefault: 3."],
    w_outcome: ["Expected Outcome", "How much a concept counts when it stands in what the topic expects projects to achieve.\nDefault: 2."],
    w_scope: ["Scope", "How much a concept counts when it stands in the description of what projects should do.\nDefault: 1.5."],
    w_intro: ["Intro", "How much a concept counts when it stands only in the lines that place the topic in the work programme (destination and theme). Many topics share these lines, so they count least.\nDefault: 0.5."],
    ax_method: ["Methods & expertise", "Weight of keywords read as methods & expertise: what a researcher can do, such as machine learning or process mining. Lower it to let application domains decide the ranking more.\nDefault: ×1.0."],
    ax_domain: ["Application domains", "Weight of keywords read as application domains: where the work is applied, such as healthcare or batteries. Lower it to let methods & expertise decide the ranking more.\nDefault: ×1.0."],
    cap: ["Mentions counted", "How many mentions of the same concept in one part of a topic count. At ≤ 2, naming it twice counts double and further mentions add nothing, so a long text cannot win by repetition alone.\nDefault: ≤ 2."],
    same: ["Same sentence", "What a meeting counts when the two keywords stand in one sentence but further apart than joined within. A joined meeting counts 1.\nDefault: 0.50."],
    next: ["Next sentence", "What a meeting counts when the two keywords stand in neighbouring sentences. Further apart counts nothing.\nDefault: 0.25."],
    hop: ["Through a hop", "Whether a keyword the topic does not name itself, found only through a link, may meet another keyword. 1: it may, at its own discounted value. 0: only keywords the topic names can meet.\nDefault: 1."],
    arith: ["Arithmetic", "Shows how every number on a card is made: each line's factors (section weight · rarity · hop · match · mentions = points), each keyword's total, what the meeting of keywords adds, and how the keywords' totals combine into the topic's score."],
  };
  function renderRail() {
    const rail = $("#rail"), keep = rail.scrollTop, F = State.filters, o = State.opts;
    const tip = k => ` data-tip="${k}"`;
    const slider = (attr, key, label, min, max, step, val, shown, tk) => `<div class="wrow"${tip(tk)}><label>${label}</label>`
      + `<input type="range" ${attr}="${key}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${esc(TIPS[tk][0])}"><span class="val">${shown}</span></div>`;
    const chev = open => `<span class="chev">${open ? "▾" : "▸"}</span>`;

    /* filters: which topics are shown; they never change a score */
    const nMore = activeFilters().filter(k => k !== "when" && k !== "until").length;
    let h = `<div class="sect"><h3>Filters<button class="act" data-freset>reset</button></h3><div class="fsum" id="fsum"></div>
      <div class="wrow"${tip("when")}><div class="seg" id="whenseg">
        <button data-when="upcoming" class="${F.when === "upcoming" ? "on" : ""}">open &amp; upcoming</button>
        <button data-when="all" class="${F.when === "all" ? "on" : ""}">all, incl. closed</button></div></div>
      <div class="wrow"${tip("until")}><span class="lbl">deadline by</span><input class="fdate" type="date" id="funtil" value="${esc(F.until)}" min="2026-01-01" max="2027-12-31" aria-label="Deadline by">
        ${F.until ? `<button class="act hint" data-clear="until">clear</button>` : ""}</div>
      <button class="subexp" id="morebtn" aria-expanded="${State.moreOpen}"${tip("more")}>${chev(State.moreOpen)}more filters${nMore ? `<span class="finenote">${nMore} on</span>` : ""}</button>`;
    if (State.moreOpen) {
      h += `<div class="subbox">`
        + `<div class="sect"><h3>Programme part</h3>${PARTS.map(p => `
          <label class="frow" data-frow="parts:${p.key}"><input type="checkbox" data-fparts="${p.key}" ${F.parts.includes(p.key) ? "checked" : ""}>
            <span class="code">${esc(p.key)}</span><span>${esc(p.label)}</span><span class="cnt" data-cnt="parts:${p.key}"></span></label>`).join("")}</div>`
        + `<div class="sect"><h3>Type of action</h3>${ACT_ORDER.map(k => `
          <label class="frow" data-frow="types:${k}"><input type="checkbox" data-ftypes="${k}" ${F.types.includes(k) ? "checked" : ""}>
            <span class="code">${esc(k)}</span><span>${esc(ACT[k])}</span><span class="cnt" data-cnt="types:${k}"></span></label>`).join("")}</div>`
        + `<div class="sect"><h3>EU contribution per project</h3>
          <div class="wrow"><span class="lbl">EUR million</span><input class="fnum" type="number" min="0" step="0.5" id="fbmin" placeholder="from" value="${esc(F.bmin)}" aria-label="EU contribution from">
            <span class="hint">–</span><input class="fnum" type="number" min="0" step="0.5" id="fbmax" placeholder="to" value="${esc(F.bmax)}" aria-label="EU contribution to"></div></div>`
        + `<div class="sect"><h3>TRL at the end of the project</h3>
          <div class="wrow"><span class="lbl">between</span><select class="fnum" id="ftrlmin" aria-label="TRL from">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(i => `<option ${F.trlMin === i ? "selected" : ""}>${i}</option>`).join("")}</select>
            <span class="hint">and</span><select class="fnum" id="ftrlmax" aria-label="TRL to">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(i => `<option ${F.trlMax === i ? "selected" : ""}>${i}</option>`).join("")}</select></div>
          <label class="frow"><input type="checkbox" id="ftrlnone" ${F.trlNone ? "checked" : ""}><span>also topics that set no TRL</span><span class="cnt" data-cnt="trl:none"></span></label></div>`
        + `<div class="sect" style="margin-bottom:0"><h3>Other conditions</h3><div class="tri">${CONDS.map(([k, lbl]) => {
            const v = F.cond[k] || 0;
            return `<button data-fcond="${k}" class="${v === 1 ? "with" : v === -1 ? "without" : ""}" title="click: only topics with it · again: only topics without it · again: either">${esc(lbl)}<span class="cnt mono" data-cnt="cond:${k}" style="margin-left:5px;color:var(--ghost);font-size:10.5px"></span></button>`;
          }).join("")}</div></div>`
        + `</div>`;
    }
    h += `</div>`;

    if (State.mode === "search") {
      /* traversal: the two things to tweak first */
      const stepsMoved = ["narrower", "related", "broader"].some(k => o.step[k] !== DEF_OPTS.step[k]);
      h += `<hr class="hair"><div class="sect"><h3>Traversal<button class="act" data-oreset${tip("reset")}>reset scoring</button></h3>
        <div class="hint rhint">How far a keyword may travel from what you typed, and what it counts where keywords meet. Hover a setting for what it does.</div>
        <div class="sub">Hops</div>
        ${slider("data-o", "maxHops", "max hops", 0, 2, 1, o.maxHops, o.maxHops, "maxHops")}
        ${slider("data-o", "decay", "hop decay", 0, 1, 0.05, o.decay, "×" + (+o.decay).toFixed(2), "decay")}
        <button class="subexp" id="stepbtn" aria-expanded="${State.stepsOpen}"${tip("steps")}>${chev(State.stepsOpen)}step costs, by kind of link${stepsMoved ? `<span class="finenote">changed</span>` : ""}</button>
        ${State.stepsOpen ? `<div class="subbox">${["narrower", "related", "broader"].map(k =>
          slider("data-st", k, `<span class="mono">${RELG[k]}</span> ${k}`, 0, 1, 0.05, o.step[k], "×" + (+o.step[k]).toFixed(2), k)).join("")}</div>` : ""}
        <div class="sub">Where keywords meet</div>
        ${slider("data-nr", "strength", "strength", 0, 2, 0.05, o.near.strength, nearVal("strength", o.near.strength), "strength")}
        ${slider("data-nr", "window", "joined within", 0, 30, 1, o.near.window, nearVal("window", o.near.window), "window")}
      </div>`;

      /* fine-tuning: the rest of the scoring, folded away */
      const fineMoved = [SECS.some(s => o.weights[s] !== DEF_OPTS.weights[s]) ? "section weights" : "",
        ["method", "domain"].some(a => o.axis[a] !== DEF_OPTS.axis[a]) ? "axes" : "", o.cap !== DEF_OPTS.cap ? "mentions" : "",
        NEAR_FINE.some(([k]) => o.near[k] !== DEF_OPTS.near[k]) ? "meeting levels" : ""].filter(Boolean);
      h += `<button class="finebtn${State.fineOpen ? " open" : ""}" id="finebtn" aria-expanded="${State.fineOpen ? "true" : "false"}"${tip("fine")}>
          ${chev(State.fineOpen)}Fine-tuning${fineMoved.length ? `<span class="finenote">${esc(fineMoved.join(" · "))} changed</span>` : ""}</button>`;
      if (State.fineOpen) {
        h += `<div class="fine">
          <div class="finegrp"><div class="finehd">How a mention is weighed</div>
            <div class="sub">Where it stands in the topic</div>
            ${SECS.map(s => slider("data-w", s, `${badge(s)} ${esc(SEC[s][1].replace("Where it sits", "Intro"))}`, 0, 4, 0.1, o.weights[s], (+o.weights[s]).toFixed(1), "w_" + s)).join("")}
            <div class="sub">Methods or domains</div>
            ${["method", "domain"].map(a => slider("data-ax", a, `<span class="dot a-${a}"></span>${a === "method" ? "methods" : "domains"}`, 0, 2, 0.1, o.axis[a], "×" + (+o.axis[a]).toFixed(1), "ax_" + a)).join("")}
            <div class="sub">Repeated mentions</div>
            <div class="wrow"${tip("cap")}><label>counted up to</label><div class="seg" id="capseg">${[1, 2, 3].map(n =>
              `<button data-cap="${n}" class="${o.cap === n ? "on" : ""}">≤ ${n}</button>`).join("")}</div></div>
          </div>
          <div class="finegrp"><div class="finehd">Where keywords meet, in detail</div>
            <div class="hint" style="font-size:13px;margin-bottom:8px">What the looser kinds of meeting count, against joined (1).</div>
            ${NEAR_FINE.map(([k, lbl]) => slider("data-nr", k, esc(lbl), 0, 1, 0.05, o.near[k], nearVal(k, o.near[k]), k)).join("")}
          </div></div>`;
      }
      h += `<div class="hint" style="margin-top:16px">The defaults are the ones the stage-1 review argues for. Filters never change a score; the scoring settings do.</div>`;
    }
    rail.innerHTML = h;
    rail.scrollTop = keep;
    wireRail(rail);
    refreshCounts();
  }

  function refreshCounts() {
    const base = baseSet();
    const count = (except, test) => base.reduce((n, r) => n + (passes(r, except) && test(r) ? 1 : 0), 0);
    for (const el of $$("[data-cnt]")) {
      const [k, v] = el.dataset.cnt.split(":");
      let n = 0;
      if (k === "parts") n = count("parts", r => r.facets.part.key === v);
      else if (k === "types") n = count("types", r => (r.facets.actionType.code || "—") === v);
      else if (k === "trl") n = count("trl", r => !(r.facets.trl && r.facets.trl.end));
      else if (k === "cond") { const get = CONDS.find(c => c[0] === v)[2]; n = count("cond", get); }
      el.textContent = n;
      const row = el.closest(".frow");
      if (row) row.classList.toggle("zero", n === 0);
    }
    const pass = base.filter(r => passes(r)).length, closed = base.filter(r => isClosed(r)).length;
    const fs = $("#fsum");
    if (fs) fs.innerHTML = State.last
      ? `<b>${pass}</b> of the ${base.length} topics your keywords reach pass`
      : `<b>${pass}</b> of ${R.length} topics pass` + (State.filters.when === "upcoming" ? ` · ${closed} closed` : "");
  }

  function wireRail(rail) {
    const F = State.filters, o = State.opts;
    const changed = () => { State.shown = 40; renderRail(); update(); };
    $$("[data-freset]", rail).forEach(b => b.onclick = () => { State.filters = clone(DEF_FILTERS); changed(); });
    const fold = (id, k) => { const b = $(id, rail); if (b) b.onclick = () => { State[k] = !State[k]; save(); renderRail(); }; };
    fold("#finebtn", "fineOpen"); fold("#morebtn", "moreOpen"); fold("#stepbtn", "stepsOpen");
    $$("[data-when]", rail).forEach(b => b.onclick = () => { F.when = b.dataset.when; changed(); });
    const until = $("#funtil", rail); if (until) until.onchange = () => { F.until = until.value || ""; changed(); };
    $$("[data-clear]", rail).forEach(b => b.onclick = () => { F[b.dataset.clear] = ""; changed(); });
    const toggleIn = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); };
    $$("[data-fparts]", rail).forEach(c => c.onchange = () => { toggleIn(F.parts, c.dataset.fparts); changed(); });
    $$("[data-ftypes]", rail).forEach(c => c.onchange = () => { toggleIn(F.types, c.dataset.ftypes); changed(); });
    const bmin = $("#fbmin", rail), bmax = $("#fbmax", rail);
    if (bmin) bmin.onchange = () => { F.bmin = bmin.value === "" ? "" : String(Math.max(0, +bmin.value)); changed(); };
    if (bmax) bmax.onchange = () => { F.bmax = bmax.value === "" ? "" : String(Math.max(0, +bmax.value)); changed(); };
    const tmin = $("#ftrlmin", rail), tmax = $("#ftrlmax", rail), tnone = $("#ftrlnone", rail);
    if (tmin) tmin.onchange = () => { F.trlMin = +tmin.value; if (F.trlMax < F.trlMin) F.trlMax = F.trlMin; changed(); };
    if (tmax) tmax.onchange = () => { F.trlMax = +tmax.value; if (F.trlMin > F.trlMax) F.trlMin = F.trlMax; changed(); };
    if (tnone) tnone.onchange = () => { F.trlNone = tnone.checked; changed(); };
    $$("[data-fcond]", rail).forEach(b => b.onclick = () => {
      const k = b.dataset.fcond, v = F.cond[k] || 0;
      F.cond[k] = v === 0 ? 1 : v === 1 ? -1 : 0; changed();
    });
    /* scoring: the sliders re-score as they move, without redrawing the rail */
    const rescore = () => { State.shown = 40; update(); };
    $$("input[data-w]", rail).forEach(i => i.oninput = () => {
      o.weights[i.dataset.w] = +i.value; i.nextElementSibling.textContent = (+i.value).toFixed(1); rescore(); });
    $$("input[data-ax]", rail).forEach(i => i.oninput = () => {
      o.axis[i.dataset.ax] = +i.value; i.nextElementSibling.textContent = "×" + (+i.value).toFixed(1); rescore(); });
    $$("input[data-o]", rail).forEach(i => i.oninput = () => {
      o[i.dataset.o] = +i.value; i.nextElementSibling.textContent = i.dataset.o === "decay" ? "×" + (+i.value).toFixed(2) : i.value; rescore(); });
    $$("input[data-st]", rail).forEach(i => i.oninput = () => {
      o.step[i.dataset.st] = +i.value; i.nextElementSibling.textContent = "×" + (+i.value).toFixed(2); rescore(); });
    $$("input[data-nr]", rail).forEach(i => i.oninput = () => {
      o.near[i.dataset.nr] = +i.value; i.nextElementSibling.textContent = nearVal(i.dataset.nr, +i.value); rescore(); });
    /* the notes on the folds say what is changed: brought up to date once a slider is let go */
    $$("input[type=range]", rail).forEach(i => i.onchange = () => {
      const a = ["data-o", "data-st", "data-nr", "data-w", "data-ax"].find(x => i.hasAttribute(x)), had = document.activeElement === i;
      renderRail();
      const n = a && had ? $(`input[${a}="${i.getAttribute(a)}"]`, $("#rail")) : null;
      if (n) n.focus({ preventScroll: true });
    });
    $$("#capseg button", rail).forEach(b => b.onclick = () => { o.cap = +b.dataset.cap; renderRail(); rescore(); });
    $$("[data-oreset]", rail).forEach(b => b.onclick = () => { State.opts = clone(DEF_OPTS); renderRail(); rescore(); toast("Scoring back to its defaults"); });
  }

  /* hover-over help: one tip, beside the rail (below the setting on a narrow screen) */
  const tipEl = document.createElement("div");
  tipEl.id = "tip"; tipEl.setAttribute("role", "tooltip");
  document.body.appendChild(tipEl);
  let tipOn = null;
  function showTip(el) {
    const t = TIPS[el.dataset.tip];
    if (!t) return hideTip();
    if (tipOn !== el) {
      tipEl.innerHTML = `<b>${esc(t[0])}</b>` + t[1].split("\n").map(p => `<p${/^Default/.test(p) ? ` class="def"` : ""}>${esc(p)}</p>`).join("");
      tipOn = el;
    }
    tipEl.classList.add("show");
    const r = el.getBoundingClientRect(), rail = $("#rail").getBoundingClientRect(), W = tipEl.offsetWidth, H = tipEl.offsetHeight;
    let x = rail.right + 12, y = r.top - 4;
    if (!el.closest("#rail") || x + W > innerWidth - 8) { x = Math.max(8, Math.min(r.left, innerWidth - W - 8)); y = r.bottom + 6; }
    if (y + H > innerHeight - 8) y = el.closest("#rail") && x > rail.right ? innerHeight - H - 8 : r.top - H - 6;
    tipEl.style.left = Math.round(x) + "px"; tipEl.style.top = Math.round(Math.max(8, y)) + "px";
  }
  function hideTip() { tipEl.classList.remove("show"); tipOn = null; }
  document.addEventListener("mouseover", ev => { const el = ev.target.closest && ev.target.closest("[data-tip]"); if (el) showTip(el); else if (tipOn) hideTip(); });
  document.addEventListener("focusin", ev => { const el = ev.target.closest && ev.target.closest("[data-tip]"); if (el) showTip(el); else hideTip(); });
  document.documentElement.addEventListener("mouseleave", hideTip);
  window.addEventListener("blur", hideTip);
  window.addEventListener("scroll", hideTip, true);

  /* ── search mode ─────────────────────────────────────────────────── */
  const EXAMPLES = ["digital twins", "batteries", "machine learning, healthcare", "climate adaptation", "cybersecurity",
                    "circular economy", "photonics", "process mining", "CL4-2027"];
  function renderSearchPage() {
    const main = $("#main");
    main.innerHTML = `<div id="qbar"><div id="qbox">
        ${State.chips.map((c, i) => `<span class="chip">${esc(c)}<button class="x" data-rm="${i}" title="Remove" aria-label="Remove ${esc(c)}">×</button></span>`).join("")}
        <input id="qinput" autocomplete="off" aria-label="Keyword" placeholder="${State.chips.length ? "Add another keyword…" : "Type a method, an application or a topic code — e.g. digital twins, batteries…"}">
      </div></div><div id="mapping"></div><div id="results"></div>`;
    const inp = $("#qinput");
    inp.onkeydown = e => {
      if (e.key === "Enter" && inp.value.trim()) {
        inp.value.split(/[,;]+/).map(s => s.trim()).filter(Boolean).forEach(s => { if (!State.chips.includes(s)) State.chips.push(s); });
        State.shown = 40; renderSearchPage(); renderRail(); save();
      } else if (e.key === "Backspace" && !inp.value && State.chips.length) {
        delete State.off[State.chips.pop()]; State.shown = 40; renderSearchPage(); renderRail(); save();
      }
    };
    $$("[data-rm]", main).forEach(b => b.onclick = () => {
      const [q] = State.chips.splice(+b.dataset.rm, 1); delete State.off[q];
      State.shown = 40; renderSearchPage(); renderRail(); save();
    });
    if (!document.activeElement || document.activeElement === document.body || document.activeElement.id === "qinput") inp.focus();
    renderResults();
  }

  function renderMapping(res) {
    const el = $("#mapping");
    if (!el) return;
    if (!res) { el.innerHTML = ""; return; }
    el.innerHTML = res.perChip.map((pc, ci) => {
      let h = `<div class="maprow"><span class="q">${esc(pc.q)}</span><span class="arrow">→</span>`;
      if (pc.entries.length) {
        h += pc.entries.map(e => `<span class="ment" data-toggle="${ci}|${e.c}" title="${esc(MTT[e.mt] + (e.mt !== "exact" && e.mt !== "alias" ? ` — via “${e.via}”` : "") + (e.off ? " · switched off: click to use it again" : " · click to switch this reading off"))}">`
          + `<span class="pmt">${MTG[e.mt]}</span>${cnode(e.c, true, e.off ? " off" : "")}`
          + (e.mt !== "exact" && e.mt !== "alias" ? `<span class="via">via “${esc(e.via)}”</span>` : "") + `</span>`).join(" ");
        const nb = pc.reachedList.filter(r => r.d > 0);
        if (nb.length) h += ` <button class="more" data-nbrs="${ci}">${State.openNbrs.has(ci) ? "hide" : "+"} ${nb.length} concept${nb.length === 1 ? "" : "s"} one step away</button>`;
      } else if (pc.codes.length) {
        h += `<span class="reach">topic code — ${pc.codes.length} topic${pc.codes.length === 1 ? "" : "s"} pinned to the top</span>`;
      } else if (pc.text) {
        h += `<span class="cnode a-text landing" title="${esc(MTT.text)}">¶ “${esc(pc.text.nm)}”</span><span class="reach">in neither library — the words themselves, found in ${pc.text.df} topic${pc.text.df === 1 ? "" : "s"}</span>`;
      } else {
        const sug = S.matchChip(pc.q, 2).entries.slice(0, 6);
        h += `<span class="reach" style="color:var(--danger)">no concept and no topic text answers this</span>`
          + (sug.length ? ` <span class="reach">· did you mean</span> ${sug.map(e => `<button class="chip clickable" data-swap="${ci}" data-to="${esc(C.get(e.c).label)}">${esc(C.get(e.c).label)}</button>`).join(" ")}` : "");
      }
      h += `</div>`;
      if (State.openNbrs.has(ci) && pc.entries.length) {
        const nb = pc.reachedList.filter(r => r.d > 0).map(r => ({ r, cost: r.path.reduce((f, st) => f * State.opts.decay * State.opts.step[st.rel], 1) }))
          .sort((a, b) => b.cost - a.cost || C.get(a.r.c).label.localeCompare(C.get(b.r.c).label));
        h += `<div class="nbrs">${nb.map(({ r, cost }) => `<span class="nb" title="${esc(r.path.map(st => RELN[st.rel] + (st.note ? " — " + st.note : "")).join(" → "))}">`
          + `<span class="prel">${r.path.map(st => RELG[st.rel]).join("")}</span>${cnode(r.c)}<span class="cost">×${f2(cost)}</span></span>`).join("")}</div>`;
      }
      return h;
    }).join("");
    $$("[data-toggle]", el).forEach(b => b.onclick = () => {
      const [ci, c] = b.dataset.toggle.split("|"), q = State.chips[+ci];
      const off = new Set(State.off[q] || []);
      off.has(c) ? off.delete(c) : off.add(c);
      if (off.size) State.off[q] = [...off]; else delete State.off[q];
      update();
    });
    $$("[data-nbrs]", el).forEach(b => b.onclick = () => {
      const ci = +b.dataset.nbrs; State.openNbrs.has(ci) ? State.openNbrs.delete(ci) : State.openNbrs.add(ci); renderMapping(State.last);
    });
    $$("[data-swap]", el).forEach(b => b.onclick = () => {
      const ci = +b.dataset.swap; delete State.off[State.chips[ci]]; State.chips[ci] = b.dataset.to;
      renderSearchPage(); renderRail(); save();
    });
  }

  function renderResults() {
    const out = $("#results");
    if (!out) return;
    const res = runSearch();
    renderMapping(res);
    if (!res) {
      out.innerHTML = `<div class="empty"><h2>Which topics fit a researcher?</h2>
        <p>Type what the researcher works on — a method, an application, a technology — and press <b>Enter</b>. Separate several keywords with commas; by default every keyword has to be answered.</p>
        <p>Each keyword is read as concepts from two libraries: <span class="cnode a-method">methods &amp; expertise</span> (the Atlas's library, extended) and <span class="cnode a-domain">application domains</span> (read off the work programme). A topic code pins that topic.</p>
        <div class="sugg">${EXAMPLES.map(s => `<button class="chip clickable" data-try="${esc(s)}">${esc(s)}</button>`).join("")}</div>
        <p style="margin-top:16px">Or <button class="sbtn" data-gobrowse>browse all ${R.length} topics</button> by programme part and destination.</p></div>`;
      $$("[data-try]", out).forEach(b => b.onclick = () => {
        b.dataset.try.split(",").map(s => s.trim()).filter(Boolean).forEach(s => { if (!State.chips.includes(s)) State.chips.push(s); });
        renderSearchPage(); renderRail(); save();
      });
      $$("[data-gobrowse]", out).forEach(b => b.onclick = () => setMode("browse"));
      return;
    }
    const all = res.list, list = all.filter(e => passes(R[e.ti]));
    const closedHidden = State.filters.when === "upcoming" ? all.filter(e => isClosed(R[e.ti]) && passes(R[e.ti], "when")).length : 0;
    const other = all.length - list.length - closedHidden;
    let h = `<div class="rescount"><span>${all.length} topic${all.length === 1 ? "" : "s"} reached${State.chips.length > 1 ? " (every keyword required)" : ""}</span>`;
    if (closedHidden) h += `<span>· ${closedHidden} closed <button class="act" data-showclosed>show them</button></span>`;
    if (other > 0) h += `<span>· ${other} outside the filters</span>`;
    h += `<span class="right">${list.length ? `<button class="tgl${State.arith ? " on" : ""}" id="arithBtn" aria-pressed="${State.arith}" data-tip="arith"><span class="knob" aria-hidden="true"></span>arithmetic</button>`
      + `<button class="sbtn" id="csvBtn" title="The ranked list as a spreadsheet file">Export CSV</button>` : ""}</span></div>`;
    if (!list.length) {
      h += `<div class="empty"><h2>No topic to show.</h2>`;
      if (!all.length) h += res.perChip.some(pc => !pc.entries.length && !pc.codes.length && !pc.text)
        ? `<p>A keyword found nothing — see the line above for what it might have meant.</p>`
        : `<p>Every keyword was read, but no topic answers all of them${State.chips.length > 1 ? ". Remove one, or switch a reading back on in the line above" : ""}.</p>`;
      else h += `<p>The filters hide all ${all.length}. ${closedHidden ? "Some are closed calls. " : ""}<button class="sbtn" data-freset2>reset the filters</button></p>`;
      h += `</div>`;
      out.innerHTML = h;
      wireResults(out, res, list);
      return;
    }
    const maxScore = Math.max(...list.map(e => e.score), 1e-9);
    const sw = sectionWidths(list.slice(0, State.shown));
    for (const k of ["ww", "mw"]) out.style.setProperty("--" + k, sw[k] + "px");
    h += list.slice(0, State.shown).map((e, i) => cardHTML(e, i + 1, maxScore, res)).join("");
    if (list.length > State.shown) h += `<div style="margin:8px 4px"><button class="sbtn" data-moreres>show ${Math.min(40, list.length - State.shown)} more</button> <span class="hint">of ${list.length - State.shown} further down</span></div>`;
    out.innerHTML = h;
    wireResults(out, res, list);
  }

  function cardHTML(e, rank, maxScore, res) {
    const r = R[e.ti], f = r.facets;
    /* the bar: the sections' shares of the score before proximity, then
       what where the keywords meet adds */
    const base = e.base != null ? e.base : e.score, F = e.near ? e.near.F : 1;
    const scale = e.sum > 0 ? base / maxScore / e.sum : 0;
    const segs = SECS.map(s => `<i class="s-${s}" style="width:${(e.bySec[s] * scale * 100).toFixed(1)}%" title="${SEC[s][1]}: ${f2(e.bySec[s])}"></i>`).join("")
      + (F !== 1 ? `<i class="s-near" style="width:${((e.score - base) / maxScore * 100).toFixed(1)}%" title="where your keywords meet: ×${f2(F)}, +${f2(e.score - base)}"></i>` : "");
    const mismatch = r.flags.some(x => x.kind === "text-mismatch");
    const facts = [`<span class="code">${esc(r.id.replace(/^HORIZON-/, ""))}</span>`, esc(f.part.label), esc(f.destination),
      f.actionType.code ? `<span title="${esc(f.actionType.label)}">${esc(f.actionType.code)}</span>` : null,
      f.budget.perProjectEURm ? `€${rangeTxt(f.budget.perProjectEURm)}M per project` : null,
      whenHTML(r),
      mismatch ? `<span class="flag" title="${esc(r.flags.filter(x => x.kind === "text-mismatch").map(x => x.note).join(" · "))}">⚠ text partly not this topic's</span>` : null,
      r.flags.some(x => x.kind === "added") ? `<span class="newp" title="${esc(r.flags.find(x => x.kind === "added").note)}">added from the portal</span>` : null]
      .filter(Boolean).join(" · ");
    /* each keyword's lines: the first three and any that meet another
       keyword's, or all when asked */
    const meetRows = new Set(meetsOf(e).flatMap(({ p }) => [p.m.ra, p.m.rb]));
    const blocks = [];
    res.perChip.forEach((pc, ci) => {
      const rows = e.chips[ci] || [], code = pc.codes.includes(e.ti);
      if (!rows.length && !code) return;
      const key = e.ti + ":" + ci, open = State.expanded.has(key);
      const shown = rows.map((rw, k) => ({ rw, k })).filter(({ rw, k }) => open || k < 3 || meetRows.has(rw));
      blocks.push({ ci, pc, rows: shown, n: rows.length, total: e.perChip[ci], code,
                    more: shown.length < rows.length ? `<button class="showmore" data-more="${key}">show all ${rows.length} lines ↓</button>` : "" });
    });
    let paths = blocks.length ? linesHTML(e, blocks) : "";
    const moved = F !== 1;
    const combine = State.arith && State.chips.length > 1 && e.perChip
      ? `<div class="combine">every keyword required: (${e.perChip.map(f3).join(" × ")})<sup>1/${State.chips.length}</sup>${moved ? ` = ${f2(base)} × ${f2(F)} where they meet` : ""} = <b>${f2(e.score)}</b></div>` : "";
    return `<div class="card">
      <div class="top"><span class="rank">${rank}</span><span class="rname" data-read="${e.ti}">${esc(r.title)}</span>
        <span class="scorewrap"><span class="sbar" title="the score, split by the section each line came from">${segs}</span><span class="snum">${e.score > 0 || !e.codeHit ? f2(e.score) : "code"}</span></span></div>
      <div class="raffil">${facts}</div>
      <div class="paths">${paths}</div>${combine}</div>`;
  }

  /* where a topic stands today: open, forthcoming, closed or cancelled */
  function whenHTML(r) {
    const st = statusOf(r), c = r.facets.call;
    if (!st) return null;
    if (st === "cancelled") return `<span class="closed">cancelled</span>`;
    const two = c.twoStage ? " (stage 1)" : "";
    if (st === "closed") return `<span class="closed">closed ${dmy(c.deadline)}${two}</span>`;
    if (st === "forthcoming") return `<span class="st-fc" title="Opens ${dmy(c.opening)}">opens ${dmy(c.opening)}</span>, deadline ${dmy(c.deadline)}${two}`;
    return `<span class="st-open">open</span>, deadline ${dmy(c.deadline)}${two}`;
  }

  /* ── the keywords' lines ─────────────────────────────────────────────
     One grid per card. Each line: how the keyword matched → the concepts
     it went through, joined by their links → the concept it landed on;
     then a thin dotted arrow to the landed-upon words, a section of their
     own just right of the card's longest path (its width, and that of
     where they meet, the same on every card: sectionWidths). The arrow is what stretches;
     the concepts keep their natural places.
     Where two keywords meet, a bracket ] to the right of the words joins
     the two words that meet, with how they meet beside it.
     With the arithmetic on, each line's factors stand under its word. */
  const MEAS = document.createElement("canvas").getContext("2d");
  const textW = (s, font) => { MEAS.font = font; return Math.ceil(MEAS.measureText(s).width); };
  const FONT_C = '14.5px "Crimson Text", Georgia, serif', FONT_CL = '600 14.5px "Crimson Text", Georgia, serif',
        FONT_W = '14px "Crimson Text", Georgia, serif', FONT_M = '11px "IBM Plex Mono", monospace',
        FONT_A = '11px "IBM Plex Mono", monospace', FONT_T = '10px "IBM Plex Mono", monospace';
  const LANE = 12;
  const qgroupInner = (b, arith) => `<b>${esc(b.pc.q)}</b> — ${b.n ? `${b.n} line${b.n === 1 ? "" : "s"}${arith ? `, <span class="mono">${f3(b.total)}</span>` : ""}` : ""}${b.code ? `${b.n ? " · " : ""}matches the topic code` : ""}`;
  const phraseText = rw => `“${rw.hits[0].ph}”${rw.n > 1 ? ` ×${rw.n}` : ""}`;
  const wordsHTML = (rw, meets) => `${badge(rw.sec)}<span class="psrc${meets ? " meetw" : ""}" title="“${esc(rw.hits[0].ph)}”${rw.n > 1 ? ` — ${rw.n} mentions` : ""}${meets ? " · meets another keyword" : ""}">${esc(phraseText(rw))}</span>`
    + (meets ? `<i class="marm" aria-hidden="true"></i>` : "");
  function arithTerms(rw) {
    return [[rw.W, "section weight"], [rw.A !== 1 ? rw.A : null, "axis weight"], [f3(rw.idf), "rarity: idf of the concept"],
            [rw.hopF !== 1 ? f2(rw.hopF) : null, "hop: each step's cost × the hop decay, multiplied"], [rw.q !== 1 ? rw.q : null, "match quality"],
            [rw.capN, "mentions, counted up to " + State.opts.cap]].filter(([v]) => v != null);
  }
  const arithText = rw => arithTerms(rw).map(([v]) => v).join(" · ") + " = " + f3(rw.contrib);
  function arithHTML(rw) {
    const terms = arithTerms(rw);
    return `<span class="arith" title="${esc(terms.map(([, t]) => t).join(" × "))}">${terms.map(([v]) => v).join(" · ")} = <b>${f3(rw.contrib)}</b></span>`;
  }
  const meetLabel = (m, arith) => LVL[m.lvl] + (arith ? ` · ${f3(m.v)}` : "");
  const meetsOf = e => e.near ? e.near.pairs.map((p, k) => ({ p, k })).filter(x => x.p.m && x.p.m.v > 0) : [];
  /* how wide a line's path is written, for the place of the words */
  function pathWidth(rw) {
    let w = 6 + textW(MTG[rw.mt], FONT_M) + 8;
    if (rw.axis === "text") return w + textW(`“${rw.via}”`, FONT_CL) + 14;
    const L = rw.path.length;
    w += textW(C.get(rw.start).label, L ? FONT_C : FONT_CL) + 14;
    rw.path.forEach((st, i) => { w += 4 + textW(`—${RELG[st.rel]}→`, FONT_M) + 8 + 2 + textW(C.get(st.c).label, i === L - 1 ? FONT_CL : FONT_C) + 14; });
    return w;
  }
  /* the columns the same on every card of the page: the words (and,
     with the arithmetic on, the factors under them) and where they meet;
     the paths' column is each card's own: linesHTML */
  function sectionWidths(list) {
    const arith = State.arith;
    let ww = 0, lanes = 0, lw = 0;
    for (const e of list) {
      for (const rows of Object.values(e.chips)) for (const rw of rows) {
        ww = Math.max(ww, textW(phraseText(rw), FONT_W));
        /* with the arithmetic on it stands under the word it scores */
        if (arith) ww = Math.max(ww, textW(arithText(rw), FONT_A) - 18);
      }
      const ms = meetsOf(e);
      lanes = Math.max(lanes, ms.length);
      for (const { p } of ms) lw = Math.max(lw, textW(meetLabel(p.m, arith), FONT_T));
    }
    return { ww: Math.min(400, Math.max(170, ww + 62)), mw: lanes ? 8 + lanes * LANE + lw + 20 : 0 };
  }
  /* a line's path in pieces: how it matched and its first concept, then
     each link with the concept it leads to; the last is where it landed */
  function pieces(rw) {
    if (rw.axis === "text") return [`<span class="pmt" title="${esc(MTT[rw.mt])}">${MTG[rw.mt]}</span><span class="cnode a-text landing" title="${esc(MTT.text)}">“${esc(rw.via)}”</span>`];
    const L = rw.path.length;
    return [`<span class="pmt" title="${esc(MTT[rw.mt])}">${MTG[rw.mt]}</span>${cnode(rw.start, !L)}`,
      ...rw.path.map((st, i) => `<span class="prel" title="${esc(RELN[st.rel] + (st.note ? " — " + st.note : "") + " · ×" + f2(State.opts.step[st.rel]))}">—${RELG[st.rel]}→</span>${cnode(st.c, i === L - 1)}`)];
  }
  function linesHTML(e, blocks) {
    const arith = State.arith, N = e.near, meets = meetsOf(e);
    const inMeet = new Set(meets.flatMap(({ p }) => [p.m.ra, p.m.rb]));
    const at = new Map();                    // a line's row object → its grid row
    let r = 0, h = "";
    blocks.forEach((b, bi) => {
      r++;
      h += `<div class="lrow lq" style="grid-row:${r}"><span class="qgroup">${qgroupInner(b, arith)}</span>`;
      if (bi === 0) {
        h += `<span class="lh lwh">landed-upon words${arith ? " · points" : ""}</span>`;
        if (N) {
          const vals = N.pairs.map(p => p.m ? p.m.v : 0), off = N.pairs.filter(p => !(p.m && p.m.v > 0));
          const tip = off.length ? `not within a sentence of each other: ${off.map(p => `${State.chips[p.a]} ↔ ${State.chips[p.b]}`).join("; ")}` : "";
          h += `<span class="lh lmh"${tip ? ` title="${esc(tip)}"` : ""}><span class="qgroup near"><b>where they meet</b> <span class="mono">×${f2(N.F)}</span></span>`
            + (arith ? `<span class="lmf"> = 1 + ${num(State.opts.near.strength)} × ${vals.length > 1 ? `mean(${vals.map(f3).join(", ")})` : f3(vals[0])}</span>` : "") + `</span>`;
        }
      }
      h += `</div>`;
      b.rows.forEach(({ rw, k }) => {
        const key = e.ti + ":" + b.ci + ":" + k;
        const ps = pieces(rw);
        const path = ps.map((p, i) => `<span class="pc${i === ps.length - 1 ? " pl" : ""}">${p}</span>`).join("") + `<i class="dots" aria-hidden="true"></i>`;
        const mt = inMeet.has(rw);
        at.set(rw, ++r);
        h += `<div class="lrow line" style="grid-row:${r}" data-snip="${key}"><span class="lp">${path}</span>`
          + `<span class="lw${mt ? " mt" : ""}"><span class="lw1">${wordsHTML(rw, mt)}</span>${arith ? `<span class="lwa">${arithHTML(rw)}</span>` : ""}</span></div>`;
        if (State.openSnips.has(key)) h += `<div class="lsn" style="grid-row:${++r}">${snippetHTML(R[e.ti], rw.sec, rw.hits[0], e.ti)}</div>`;
      });
      if (b.more) h += `<div class="lrow lmore" style="grid-row:${++r}"><span class="lp">${b.more}</span></div>`;
    });
    const band = `<i class="wband" style="grid-row:1 / ${r + 1}" aria-hidden="true"></i>`;
    /* where they meet: one bracket per pair of keywords that meet, inner
       (shorter) brackets nearer the words, each in the first lane free */
    const brs = meets.map(({ p, k }) => { const a = at.get(p.m.ra), z = at.get(p.m.rb); return { p, k, top: Math.min(a, z), bot: Math.max(a, z) }; })
      .filter(x => x.top && x.bot && x.top !== x.bot).sort((x, y) => (x.bot - x.top) - (y.bot - y.top) || x.top - y.top);
    const lanes = [];
    for (const x of brs) {
      let l = 0;
      while ((lanes[l] || []).some(o => !(x.top > o.bot || x.bot < o.top))) l++;
      (lanes[l] = lanes[l] || []).push(x); x.lane = l;
    }
    for (const x of brs) {
      const m = x.p.m;
      const tip = `${State.chips[x.p.a]} ↔ ${State.chips[x.p.b]}: ${LVLT[m.lvl]}${m.words != null ? ` · ${m.words} word${m.words === 1 ? "" : "s"} between${m.list ? ", two items of a list" : ""}` : ""}`
        + ` · ${SEC[m.sec][1]} · k ${num(m.k)} × sure ${num(m.sa)} × sure ${num(m.sb)} = ${f3(m.v)} · click for the sentence`;
      h += `<i class="mbr" style="grid-row:${x.top} / ${x.bot};width:${6 + x.lane * LANE}px" aria-hidden="true"></i>`
        + `<span class="mlw" style="grid-row:${x.top} / ${x.bot};left:${8 + lanes.length * LANE}px"><button class="mlab" data-snip="${e.ti}:n:${x.k}" title="${esc(tip)}">${esc(meetLabel(m, arith))}</button></span>`;
    }
    /* the sentences of the meetings clicked open, under the lines */
    for (const { p, k } of meets) if (State.openSnips.has(e.ti + ":n:" + k)) h += `<div class="lsn" style="grid-row:${++r}">${meetSnippetHTML(R[e.ti], p.m, e.ti)}</div>`;
    /* the words stand just right of this card's longest path */
    const pw = Math.max(300, ...blocks.flatMap(b => b.rows.map(({ rw }) => pathWidth(rw) + 56)));
    return `<div class="lines" style="--pw:${pw}px;grid-template-rows:repeat(${r}, auto)">${band}${h}</div>`;
  }

  /* the sentence, or the two sentences, where two keywords meet, with both
     phrases marked */
  function meetSnippetHTML(r, m, ti) {
    const [x, y] = (m.ha.p < m.hb.p || (m.ha.p === m.hb.p && m.ha.s < m.hb.s)) ? [m.ha, m.hb] : [m.hb, m.ha];
    const piece = (p, hs) => {
      const text = r.sections[m.sec][p].text, last = hs[hs.length - 1];
      const a = sentenceOf(text, hs[0].s)[0], b = sentenceOf(text, last.s)[1];
      let pre = text.slice(a, hs[0].s).replace(/^[•◦]\s*/, ""), post = text.slice(last.e, b).replace(/\s+$/, "");
      const lead = pre.length > 160, tail = post.length > 160;
      if (lead) pre = pre.slice(-160);
      if (tail) post = post.slice(0, 160);
      let mid = "";
      hs.forEach((h, i) => { mid += `<mark>${esc(text.slice(h.s, h.e))}</mark>` + (i + 1 < hs.length ? esc(text.slice(h.e, hs[i + 1].s)) : ""); });
      return `${lead ? "…" : ""}${esc(pre)}${mid}${esc(post)}${tail ? "…" : ""}`;
    };
    const body = x.p === y.p ? piece(x.p, [x, y]) : `${piece(x.p, [x])} <span class="sep">¶</span> ${piece(y.p, [y])}`;
    const where = m.sec === "title" ? "Title" : `${SEC[m.sec][1]} · ${x.p === y.p ? `paragraph ${x.p + 1}` : `paragraphs ${x.p + 1}–${y.p + 1}`}`;
    const how = m.words != null ? ` · ${m.words} word${m.words === 1 ? "" : "s"} between${m.list ? ", two items of a list" : ""}` : "";
    return `<div class="snippet near">“${body}”<span class="from">${where} · ${LVL[m.lvl]}${how}<button data-read="${ti}">read the topic ▸</button></span></div>`;
  }

  function wireResults(out, res, list) {
    $$("[data-read]", out).forEach(b => b.onclick = ev => { ev.stopPropagation(); openReader(+b.dataset.read); });
    $$("[data-more]", out).forEach(b => b.onclick = () => { State.expanded.add(b.dataset.more); renderResults(); });
    $$("[data-moreres]", out).forEach(b => b.onclick = () => { State.shown += 40; renderResults(); });
    $$("[data-snip]", out).forEach(b => b.onclick = ev => {
      if (ev.target.closest("[data-read]")) return;
      const k = b.dataset.snip; State.openSnips.has(k) ? State.openSnips.delete(k) : State.openSnips.add(k); renderResults();
    });
    $$("[data-showclosed]", out).forEach(b => b.onclick = () => { State.filters.when = "all"; renderRail(); update(); });
    $$("[data-freset2]", out).forEach(b => b.onclick = () => { State.filters = clone(DEF_FILTERS); State.filters.when = "all"; renderRail(); update(); });
    const csv = $("#csvBtn", out); if (csv) csv.onclick = () => exportCSV(res, list);
    const ab = $("#arithBtn", out); if (ab) ab.onclick = () => { State.arith = !State.arith; save(); renderResults(); };
  }

  function exportCSV(res, list) {
    const q = v => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const head = ["rank", "score", "topic", "title", "part", "destination", "type of action", "status", "opens", "deadline", "second-stage deadline",
      "topic budget (EUR M)", "per project (EUR M)", "projects", "TRL at the end", "SSH",
      ...res.perChip.map(pc => `score: ${pc.q}`), "where they meet (×)", "meetings", "strongest lines", "link"];
    const rows = list.map((e, i) => {
      const r = R[e.ti], f = r.facets;
      const lines = Object.values(e.chips).flat().sort((a, b) => b.contrib - a.contrib).slice(0, 4)
        .map(rw => `${rw.axis === "text" ? rw.via : C.get(rw.c).label} (${SEC[rw.sec][1]}: “${rw.hits[0].ph}”)`).join("; ");
      const meets = e.near ? e.near.pairs.filter(p => p.m && p.m.v > 0).map(p =>
        `${res.perChip[p.a].q} ↔ ${res.perChip[p.b].q}: ${LVL[p.m.lvl]}, ${SEC[p.m.sec][1]} (“${p.m.ha.ph}” … “${p.m.hb.ph}”)`).join("; ") : "";
      return [i + 1, f3(e.score), r.id, r.title, f.part.label, f.destination, f.actionType.code || "", statusOf(r) || "",
        f.call ? f.call.opening : "", f.call ? f.call.deadline : "", f.call && f.call.deadline2 || "",
        f.budget.topicEURm, rangeTxt(f.budget.perProjectEURm), rangeTxt(f.budget.projects), f.trl && f.trl.end ? rangeTxt(f.trl.end) : "",
        f.ssh.level, ...res.perChip.map((pc, ci) => f3((e.perChip || [])[ci] || 0)), e.near ? f2(e.near.F) : "", meets, lines, PORTAL_URL(r.id)];
    });
    const csv = "﻿" + [head, ...rows].map(row => row.map(q).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `topic-atlas-${State.chips.join("-").replace(/[^\w-]+/g, "_").slice(0, 60) || "topics"}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(`${list.length} topics written to ${a.download}`);
  }

  /* ── browse mode ─────────────────────────────────────────────────── */
  function renderBrowse() {
    const main = $("#main");
    const pass = R.map((r, i) => [r, i]).filter(([r]) => passes(r));
    let h = `<div id="browse"><div class="rescount"><span>${pass.length} of ${R.length} topics pass the filters</span>
      <span class="right"><button class="sbtn" data-allopen>open all</button><button class="sbtn" data-allshut>close all</button></span></div>`;
    for (const P of PARTS) {
      const inP = pass.filter(([r]) => r.facets.part.key === P.key);
      if (!inP.length) continue;
      const pk = "p:" + P.key, popen = State.treeOpen.has(pk);
      h += `<div class="trow part" data-tree="${esc(pk)}"><span class="tw">${popen ? "▾" : "▸"}</span><span>${esc(P.full || P.label)}</span><span class="cnt">${inP.length}</span></div>`;
      if (!popen) continue;
      for (const d of P.dests) {
        const inD = inP.filter(([r]) => r.facets.destination === d);
        if (!inD.length) continue;
        const dk = "d:" + P.key + ":" + d, dopen = State.treeOpen.has(dk);
        h += `<div class="trow dest" data-tree="${esc(dk)}"><span class="tw">${dopen ? "▾" : "▸"}</span><span>${esc(d)}</span><span class="cnt">${inD.length}</span></div>`;
        if (!dopen) continue;
        inD.slice().sort(([a], [b]) => (deadlineOf(a) || "").localeCompare(deadlineOf(b) || "") || a.id.localeCompare(b.id)).forEach(([r, i]) => {
          const dl = deadlineOf(r), closed = isClosed(r), st = statusOf(r);
          h += `<div class="brow" data-read="${i}"><span class="code" title="${esc(r.id)}">${esc(r.id.replace(/^HORIZON-/, ""))}</span>
            <span>${esc(r.title)}${r.facets.theme ? ` <span class="hint">· ${esc(r.facets.theme)}</span>` : ""}${r.flags.some(x => x.kind === "added") ? ` <span class="newp">added</span>` : ""}</span>
            <span class="when${closed ? " closed" : ""}">${esc(r.facets.actionType.code || "")} · ${st === "cancelled" ? "cancelled" : closed ? "closed" : (st === "forthcoming" ? "opens " + dmy(r.facets.call.opening) + " · " : "") + dmy(dl)}</span></div>`;
        });
      }
    }
    if (!pass.length) h += `<div class="empty"><h2>No topic passes the filters.</h2><p><button class="sbtn" data-freset2>reset the filters</button></p></div>`;
    h += `</div>`;
    main.innerHTML = h;
    $$("[data-tree]", main).forEach(b => b.onclick = () => {
      const k = b.dataset.tree; State.treeOpen.has(k) ? State.treeOpen.delete(k) : State.treeOpen.add(k); renderBrowse();
    });
    $$("[data-read]", main).forEach(b => b.onclick = () => openReader(+b.dataset.read));
    $$("[data-allopen]", main).forEach(b => b.onclick = () => {
      for (const P of PARTS) { State.treeOpen.add("p:" + P.key); for (const d of P.dests) State.treeOpen.add("d:" + P.key + ":" + d); }
      renderBrowse();
    });
    $$("[data-allshut]", main).forEach(b => b.onclick = () => { State.treeOpen.clear(); renderBrowse(); });
    $$("[data-freset2]", main).forEach(b => b.onclick = () => { State.filters = clone(DEF_FILTERS); State.filters.when = "all"; renderRail(); update(); });
  }

  /* ── the reader: the whole topic, with what was found in it ──────── */
  function paraHTML(text, spans) {
    if (!spans.length) return esc(text);
    const cuts = new Set([0, text.length]);
    for (const sp of spans) { cuts.add(Math.max(0, sp.s)); cuts.add(Math.min(text.length, sp.e)); }
    const pts = [...cuts].sort((a, b) => a - b);
    let out = "";
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], seg = text.slice(a, b);
      const on = spans.filter(sp => sp.s <= a && sp.e >= b);
      if (!on.length) { out += esc(seg); continue; }
      const cls = [...new Set(on.flatMap(sp => sp.cls.split(" ")))].join(" ");
      const title = [...new Set(on.map(sp => sp.title).filter(Boolean))].join(" · ");
      out += `<span class="${cls}"${title ? ` title="${esc(title)}"` : ""}>${esc(seg)}</span>`;
    }
    return out;
  }
  function spansFor(r, sec, p, credited, meets) {
    const sp = [];
    for (const mt of meets || []) if (mt.sec === sec && mt.p === p) sp.push({ s: mt.s, e: mt.e, cls: "meet", title: mt.title });
    for (const o of r.concepts) if (o.sec === sec) for (const h of o.hits) if (h.p === p) {
      const c = C.get(o.c), q = credited.has(sec + "|" + p + "|" + h.s);
      sp.push({ s: h.s, e: h.e, cls: `xc a-${c.axis}${q ? " qhit" : ""}`, title: `${c.label} · ${AXN[c.axis]}${q ? " · counted for your keywords" : ""}` });
    }
    for (const k of credited.keys()) {
      const [s0, p0, a] = k.split("|");
      if (s0 === sec && +p0 === p && !sp.some(x => x.s === +a)) {     // the words themselves (¶)
        const e = credited.get(k);
        sp.push({ s: +a, e, cls: "xc a-text qhit", title: "your keyword, in the text" });
      }
    }
    for (const [a, b] of (r.sections[sec][p].boiler || [])) sp.push({ s: a, e: b, cls: "boil", title: "standing text of the work programme: not searched" });
    return sp;
  }
  function openReader(ti) {
    const r = R[ti], f = r.facets;
    const e = State.last ? State.last.list.find(x => x.ti === ti) : null;
    const credited = new Map();
    if (e) for (const rows of Object.values(e.chips)) for (const rw of rows) for (const h of rw.hits) credited.set(rw.sec + "|" + h.p + "|" + h.s, h.e);
    /* where the keywords meet: the sentences of every meeting that counts, shaded */
    const meets = [];
    if (e && e.near) for (const p of e.near.pairs) if (p.m && p.m.v > 0) {
      const title = `where ${State.chips[p.a]} and ${State.chips[p.b]} meet: ${LVL[p.m.lvl]}`;
      for (const h of [p.m.ha, p.m.hb]) {
        const [s, en] = sentenceOf(r.sections[p.m.sec][h.p].text, h.s);
        meets.push({ sec: p.m.sec, p: h.p, s, e: en, title });
      }
    }
    const tspans = r.sections.title[0] ? spansFor(r, "title", 0, credited, meets) : [];
    $("#rhead").innerHTML = `<button class="rclose" id="rclose" aria-label="Close">✕</button>
      <div class="rtitle">${r.sections.title[0] ? paraHTML(r.sections.title[0].text, tspans) : esc(r.title)}</div>
      <div class="rsub"><span class="mono">${esc(r.id)}</span> · ${esc(f.part.label)} · ${esc(f.destination)}${f.theme ? " › " + esc(f.theme) : ""}</div>
      <div class="rowbtns"><a class="sbtn" href="${PORTAL_URL(r.id)}" target="_blank" rel="noopener">Topic on the portal ↗</a>
        ${e ? "" : `<button class="sbtn" data-rsearch="${ti}" title="Search with this topic's strongest concepts">find topics like this</button>`}</div>`;
    let b = "";

    const STORY = [["Type in keywords:", "what a researcher works on"], ["Each is read as concepts", "of the work programme"],

      + [0, 1, 2, 3].map(c => `<text class="ich ia sf" x="${(COL[c].x + COL[c].w + COL[c + 1].x) / 2 + 4}" y="14"${st(c + 2)}>→</text>`).join("");
