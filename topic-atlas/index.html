<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Topic Atlas — the Atlas's room, warmed as One App warms it: vellum paper,
   brass / verdigris / terracotta for the sections, the house ribbon on top,
   Cinzel for names, Crimson Text to read, Plex Mono for the arithmetic. */
:root{
  --paper:#EFE8D7; --panel:#F7F3E9; --wash:#E6DDC9;
  --ink:#2C2418; --faint:#5C5140; --ghost:#6A5E48;
  --line:rgba(120,96,58,0.20); --line2:rgba(120,96,58,0.34);
  /* the four sections, in the Atlas's layer hues */
  --k1:#7A5E24; --k2:#41705C; --k3:#9E5B24; --k4:#6F6450;
  --k1w:#EDE3CB; --k2w:#DFEAE2; --k3w:#F2E2D0; --k4w:#E8E1D3;
  --k1i:#5E4716; --k2i:#2F5646; --k3i:#7A4416; --k4i:#4F4636;
  /* the two axes, and the words themselves */
  --con:#6B5F7E; --conw:#E7E2EC; --coni:#4F4566;
  --dom:#3F5A78; --domw:#E0E6EE; --domi:#2E4560;
  --txt:#8A6A2E; --txtw:#F1E6CC; --txti:#6B5020;
  --danger:#A33A2C; --dangerw:#F3DDD5;
  --serif:'Cinzel',Georgia,serif;
  --sans:'Crimson Text',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --r:7px;
  /* the house ribbon */
  --bar:linear-gradient(180deg,#3A2F1A,#241D10); --bar-rule:rgba(205,176,105,.26); --bar-h:60px;
  --bar-shadow:0 5px 16px rgba(8,6,2,.34);
  --oa-title:#C6AE79; --oa-title-hi:#F5ECD8; --oa-ctl:#AE9569; --oa-key2:#DDC287;
  --oa-slab:linear-gradient(180deg,rgba(255,255,255,.045),rgba(0,0,0,.14));
  --oa-line:rgba(205,176,105,.24); --oa-line2:rgba(205,176,105,.40);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:var(--k1w)}
a{color:var(--k1);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--k1);outline-offset:1px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- chrome ---------- */
#app{display:flex;flex-direction:column;height:100%}
header.bar{display:flex;align-items:center;gap:18px;height:var(--bar-h);flex:none;padding:0 22px;
  background:var(--bar);border-bottom:1px solid var(--bar-rule);box-shadow:var(--bar-shadow);position:relative;z-index:6;
  overflow-x:auto;scrollbar-width:none}
header.bar::-webkit-scrollbar{display:none}
.bartitle{font:400 14px/1.4 var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--oa-title-hi);white-space:nowrap}
.barsub{font:13px var(--sans);color:var(--oa-title);letter-spacing:.06em;white-space:nowrap}
header.bar nav{display:flex;gap:4px;margin-left:10px}
header.bar nav button,header.bar .hbtn{white-space:nowrap;min-height:31px;padding:5px 13px;border-radius:7px;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-family:var(--sans);
  transition:transform .14s ease,background-color .14s,border-color .14s,color .14s}
header.bar nav button{border:1px solid transparent;color:var(--oa-ctl)}
header.bar .hbtn{background:var(--oa-slab);border:1px solid var(--oa-line);color:var(--oa-title);box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
header.bar nav button:hover,header.bar .hbtn:hover{background:rgba(216,205,184,.08);border-color:var(--oa-line2);color:var(--oa-key2);transform:translateY(-1px)}
header.bar nav button.on{background:rgba(216,205,184,.16);border-color:var(--oa-line2);color:var(--oa-title-hi)}
.spacer{flex:1}
#body{display:flex;flex:1;min-height:0}
#rail{width:340px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;
  scrollbar-gutter:stable;padding:18px 18px 40px}
#main{flex:1;min-width:0;overflow-y:auto;position:relative}
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .barsub{display:none}
  /* the search first, the filters and the scoring after it */
  #body{flex-direction:column}
  #main{overflow:visible;order:1}
  #rail{order:2;width:auto;border-right:0;border-top:1px solid var(--line);overflow:visible;padding:14px 16px 16px}
  .card .top{flex-wrap:wrap}
  .card .scorewrap{order:-1;width:100%;justify-content:flex-end;padding-top:0}
  .raffil,.paths,.combine{margin-left:0!important}
  .rank{display:none}
  #qbar{padding:14px 16px 8px!important}
  #mapping,#results,#browse{padding-left:16px!important;padding-right:16px!important}
  .path{grid-template-columns:1fr!important}
  .arith{text-align:left!important;padding-left:22px}
}

/* ---------- shared bits ---------- */
.sect{margin-bottom:20px}
.sect h3{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ghost);margin-bottom:8px;
  display:flex;align-items:baseline;gap:8px}
.sect h3 .act{margin-left:auto;font:11px var(--sans);letter-spacing:0;text-transform:none;color:var(--ghost)}
.sect h3 .act:hover{color:var(--ink);text-decoration:underline}
.hint{color:var(--faint);font-size:13.5px}
.mono{font-family:var(--mono);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;flex:none}
.dot.a-method{background:var(--con)} .dot.a-domain{background:var(--dom)} .dot.a-text{background:var(--txt)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:14px;
  border:1px solid var(--line2);background:var(--panel);white-space:nowrap;max-width:100%}
.chip .x{color:var(--ghost);margin-left:2px;font-size:15px;line-height:1}
.chip .x:hover{color:var(--danger)}
.chip.clickable{cursor:pointer}
.chip.clickable:hover{background:var(--wash)}
.badge{display:inline-block;font:600 10.5px var(--mono);padding:1px 6px;border-radius:4px;letter-spacing:.3px;line-height:1.5}
.badge.s-title{background:var(--k1w);color:var(--k1i)} .badge.s-outcome{background:var(--k2w);color:var(--k2i)}
.badge.s-scope{background:var(--k3w);color:var(--k3i)} .badge.s-intro{background:var(--k4w);color:var(--k4i)}
.cnode{display:inline-block;padding:0 7px;border-radius:5px;font-size:14.5px;line-height:1.55}
.cnode.a-method{background:var(--conw);color:var(--coni)}
.cnode.a-domain{background:var(--domw);color:var(--domi)}
.cnode.a-text{background:var(--txtw);color:var(--txti)}
.cnode.landing{font-weight:600}
.cnode.off{text-decoration:line-through;opacity:.55}
.sbtn{padding:3px 11px;border:1px solid var(--line2);border-radius:var(--r);font-size:13.5px;color:var(--faint);background:var(--panel)}
.sbtn:hover{color:var(--ink);background:var(--wash)}
.sbtn.on{color:var(--ink);background:var(--wash);font-weight:600}
hr.hair{border:none;border-top:1px solid var(--line);margin:16px 0}
.finebtn{display:flex;align-items:center;gap:8px;width:100%;margin:22px 0 0;padding:10px 12px;border:1px solid var(--line2);
  border-radius:var(--r);background:var(--panel);font:600 12px var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left}
.finebtn:hover{background:var(--wash);color:var(--ink)}
.finebtn.open{border-bottom-left-radius:0;border-bottom-right-radius:0;color:var(--ink)}
.finebtn .chev{font-size:11px;width:10px}
.finebtn .finenote{margin-left:auto;font:11px var(--mono);letter-spacing:0;text-transform:none;color:var(--ghost)}
.fine{border:1px solid var(--line2);border-top:none;border-radius:0 0 var(--r) var(--r);padding:4px 12px 14px}
.finegrp{padding-top:12px}
.finegrp+.finegrp{margin-top:14px;border-top:2px solid var(--line2)}
.finehd{display:flex;align-items:baseline;gap:8px;font:600 13px var(--serif);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:10px}
.finehd span{margin-left:auto;font:italic 13px var(--sans);letter-spacing:0;text-transform:none;color:var(--ghost)}

/* ---------- rail controls ---------- */
.wrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.wrow label,.wrow .lbl{width:104px;flex:none;font-size:14px;color:var(--faint);display:flex;align-items:center;gap:7px}
.wrow input[type=range]{flex:1;min-width:0;accent-color:var(--k1);height:18px}
.wrow .val{width:34px;flex:none;text-align:right;font:11.5px var(--mono);color:var(--faint)}
.seg{display:flex;flex:1;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;padding:3px 4px;font-size:13.5px;color:var(--faint);background:var(--panel);white-space:nowrap}
.seg button.on{background:var(--wash);color:var(--ink);font-weight:600}
.seg button+button{border-left:1px solid var(--line2)}
.frow{display:flex;align-items:center;gap:8px;padding:1px 4px;border-radius:5px;font-size:14.5px;cursor:pointer;user-select:none}
.frow:hover{background:var(--wash)}
.frow input{accent-color:var(--k1)}
.frow .cnt{margin-left:auto;font:11px var(--mono);color:var(--ghost)}
.frow.zero{opacity:.5}
.frow .code{font:11px var(--mono);color:var(--ghost);width:42px;flex:none}
.fsel{width:100%;padding:4px 8px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);font-size:14px}
.fnum{width:64px;padding:2px 6px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);font:12px var(--mono)}
.fdate{padding:2px 6px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);font:12px var(--mono)}
.tri{display:flex;flex-wrap:wrap;gap:6px}
.tri button{padding:1px 9px;border-radius:99px;border:1px solid var(--line2);font-size:13.5px;color:var(--faint);background:var(--panel)}
.tri button:hover{background:var(--wash)}
.tri button.with{background:var(--k2w);border-color:transparent;color:var(--k2i);font-weight:600}
.tri button.with::before{content:"✓ "}
.tri button.without{background:var(--dangerw);border-color:transparent;color:var(--danger);text-decoration:line-through}
.fsum{font-size:13.5px;color:var(--faint);margin-bottom:12px}
.fsum b{color:var(--ink)}

/* ---------- search ---------- */
#qbar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--paper) 82%,transparent);padding:22px 30px 10px}
#qbox{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--panel);border:1px solid var(--line2);
  border-radius:12px;padding:8px 12px;box-shadow:0 1px 3px rgba(30,24,14,.06);max-width:1040px}
#qbox:focus-within{border-color:var(--k1)}
#qinput{flex:1;min-width:200px;border:none;outline:none;font-size:16px;background:none;padding:3px}
#mapping{padding:2px 30px 0;max-width:1100px}
.maprow{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;margin:4px 0;font-size:14px}
.maprow .q{font-weight:600}
.maprow .arrow{color:var(--ghost);font-family:var(--mono);font-size:12px}
.ment{display:inline-flex;align-items:center;gap:3px;cursor:pointer;border-radius:6px;padding:0 2px}
.ment:hover .cnode{box-shadow:inset 0 0 0 1px var(--line2)}
.ment .via{font-size:12.5px;color:var(--faint)}
.maprow .reach{font-size:12.5px;color:var(--faint)}
.maprow .more{font-size:12.5px;color:var(--faint);border-bottom:1px dashed var(--line2)}
.maprow .more:hover{color:var(--ink)}
.nbrs{display:flex;flex-wrap:wrap;gap:4px 10px;margin:2px 0 8px 24px;padding:6px 10px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;font-size:13.5px}
.nbrs .nb{display:inline-flex;align-items:center;gap:3px}
.nbrs .cost{font:10.5px var(--mono);color:var(--ghost)}
.pmt{font:11px var(--mono);color:var(--ghost);padding:0 3px}
.prel{font:11px var(--mono);color:var(--ghost);padding:0 4px;white-space:nowrap}
#results{padding:4px 30px 70px;max-width:1100px}
.rescount{color:var(--faint);font-size:14px;margin:6px 2px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.rescount .act{border-bottom:1px dashed var(--line2);color:var(--faint);font-size:13.5px}
.rescount .act:hover{color:var(--ink)}
.rescount .right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px 12px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(30,24,14,.04)}
.card .top{display:flex;align-items:flex-start;gap:14px}
.rank{font:12px var(--mono);color:var(--ghost);padding-top:4px;width:22px;flex:none;text-align:right}
.rname{font:600 17.5px/1.3 var(--sans);cursor:pointer;flex:1;min-width:0}
.rname:hover{text-decoration:underline}
.raffil{color:var(--faint);font-size:14px;margin:3px 0 0 36px}
.raffil .code{font:11.5px var(--mono);color:var(--ghost)}
.raffil .closed{color:var(--danger)}
.raffil .flag{color:var(--danger);cursor:help}
.scorewrap{display:flex;align-items:center;gap:9px;padding-top:4px;flex:none}
.sbar{width:130px;height:7px;border-radius:4px;background:var(--wash);overflow:hidden;display:flex}
.sbar i{display:block;height:100%}
.sbar .s-title{background:var(--k1)} .sbar .s-outcome{background:var(--k2)} .sbar .s-scope{background:var(--k3)} .sbar .s-intro{background:var(--k4)}
.snum{font:13px var(--mono);color:var(--ink);min-width:36px;text-align:right}
.paths{margin:10px 0 0 36px;border-top:1px solid var(--line);padding-top:3px}
.qgroup{margin:7px 0 2px;font-size:13.5px;color:var(--ghost)}
.qgroup b{color:var(--ink);font-weight:600}
.path{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:14px;padding:2px 6px;border-radius:6px;cursor:pointer}
.path:hover{background:var(--wash)}
.path .pl{display:flex;align-items:center;flex-wrap:wrap;gap:3px 2px;min-width:0}
.psrc{margin-left:6px;font-size:14px;color:var(--faint);border-bottom:1px dashed var(--line2)}
.path:hover .psrc{color:var(--ink)}
.arith{font:11.5px var(--mono);color:var(--faint);white-space:nowrap;text-align:right}
.arith b{color:var(--ink);font-weight:500}
.showmore{font-size:13px;color:var(--faint);padding:2px 6px}
.showmore:hover{color:var(--ink)}
.combine{margin:7px 0 0 36px;padding-top:6px;border-top:1px dashed var(--line2);font:12px var(--mono);color:var(--faint)}
.combine b{color:var(--ink);font-weight:600}
.snippet{margin:4px 4px 8px 22px;padding:8px 12px;background:var(--wash);border-left:2px solid var(--line2);
  border-radius:0 7px 7px 0;font-size:14.5px;color:#3A3226;max-width:780px}
.snippet mark{background:none;font-weight:700;color:inherit;box-shadow:inset 0 -2px 0 currentColor}
.snippet .from{display:block;margin-top:5px;color:var(--ghost);font:11px var(--mono)}
.snippet .from button{font:11px var(--mono);color:var(--k1);margin-left:8px}
.empty{padding:40px 30px;max-width:720px;color:var(--faint)}
.empty h2{font:600 17px var(--sans);color:var(--ink);margin-bottom:8px}
.empty p{margin-bottom:8px}
.sugg{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}

/* ---------- browse ---------- */
#browse{padding:22px 30px 70px;max-width:1100px}
.trow{display:flex;align-items:baseline;gap:8px;padding:4px 8px;border-radius:7px;cursor:pointer;user-select:none}
.trow:hover{background:var(--wash)}
.trow .tw{font:10px var(--mono);color:var(--ghost);width:12px;flex:none}
.trow.part{font:600 16px var(--sans)}
.trow.dest{margin-left:18px;font-size:15px}
.trow .cnt{font:11px var(--mono);color:var(--ghost);margin-left:auto}
.brow{display:grid;grid-template-columns:250px 1fr auto;gap:12px;margin-left:44px;padding:3px 10px;border-radius:7px;
  cursor:pointer;align-items:baseline;font-size:14.5px}
.brow:hover{background:var(--wash)}
.brow .code{font:11.5px var(--mono);color:var(--ghost);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .when{font:11.5px var(--mono);color:var(--faint);white-space:nowrap}
.brow .when.closed{color:var(--danger)}
@media (max-width:820px){.brow{grid-template-columns:1fr;margin-left:10px}}

/* ---------- reader ---------- */
#scrim{position:fixed;inset:0;background:rgba(44,36,24,.18);opacity:0;visibility:hidden;transition:opacity .18s,visibility 0s linear .18s;z-index:19}
#scrim.open{opacity:1;visibility:visible;transition:opacity .18s}
#reader{position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);background:var(--panel);border-left:1px solid var(--line);
  box-shadow:-8px 0 24px rgba(30,24,14,.12);transform:translateX(102%);visibility:hidden;
  transition:transform .18s ease,visibility 0s linear .18s;z-index:20;display:flex;flex-direction:column}
#reader.open{transform:none;visibility:visible;transition:transform .18s ease,visibility 0s}
#rhead{padding:18px 26px 12px;border-bottom:1px solid var(--line);flex:none;position:relative}
#rhead .rtitle{font:600 20px/1.3 var(--sans);padding-right:30px}
#rhead .rsub{color:var(--faint);font-size:14px;margin-top:4px}
#rhead .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#rbody{overflow-y:auto;padding:16px 26px 60px;flex:1}
.rclose{position:absolute;top:12px;right:14px;font-size:18px;color:var(--ghost);padding:4px 8px;border-radius:6px}
.rclose:hover{color:var(--ink);background:var(--wash)}
.rclose:focus-visible{outline-width:1px;outline-offset:-2px}
.meta{border-collapse:collapse;width:100%;font-size:14.5px;margin-bottom:6px}
.meta td{padding:3px 8px 3px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.meta td:first-child{width:150px;color:var(--faint);white-space:nowrap}
.meta .aside{color:var(--faint)}
.meta .mono{font-size:12px}
.flagbox{background:var(--dangerw);border-left:2px solid var(--danger);border-radius:0 7px 7px 0;padding:8px 12px;margin-bottom:14px;font-size:14px}
.flagbox b{color:var(--danger)}
.flagbox div+div{margin-top:4px}
.whybox{background:var(--wash);border-radius:9px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.kwline{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cchip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:14px;cursor:pointer;border:1px solid transparent}
.cchip.a-method{background:var(--conw);color:var(--coni)}
.cchip.a-domain{background:var(--domw);color:var(--domi)}
.cchip:hover{border-color:var(--line2)}
.cchip .n{font:10.5px var(--mono);opacity:.75;display:inline-flex;align-items:center;gap:1px}
.mb{font:600 9px/1.4 var(--mono);font-style:normal;padding:0 3px;border-radius:3px}
.mb.s-title{background:var(--k1w);color:var(--k1i)} .mb.s-outcome{background:var(--k2w);color:var(--k2i)}
.mb.s-scope{background:var(--k3w);color:var(--k3i)} .mb.s-intro{background:var(--k4w);color:var(--k4i)}
.cchip.hit{box-shadow:inset 0 0 0 1.5px currentColor;font-weight:600}
.rsec{margin-top:18px}
.rsec h4{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ghost);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.prose p{margin-bottom:8px;max-width:68ch}
.prose p.bul{padding-left:14px;text-indent:-10px}
.xc{border-bottom:1.5px solid;cursor:help}
.xc.a-method{border-color:rgba(107,95,126,.55)}
.xc.a-domain{border-color:rgba(63,90,120,.5)}
.xc.qhit{font-weight:700;background:rgba(201,168,76,.22);border-radius:2px}
.boil{color:#7d725f}
.conds dt{font-weight:600;margin-top:8px;font-size:14.5px}
.conds dd{margin:2px 0 0 0;font-size:14.5px;max-width:68ch;white-space:pre-line}
details.cut{margin-top:14px}
details.cut summary{cursor:pointer;color:var(--faint);font-size:14px}
details.cut summary:hover{color:var(--ink)}

/* ---------- modal, toast ---------- */

.lvl{margin-left:8px;font:10.5px/1.5 var(--mono);color:var(--neari);background:var(--nearw);border-radius:4px;padding:0 6px;white-space:nowrap}

/* ---------- the keywords' lines: the path, the dotted arrow, the landed-upon words, where they meet ---------- */
/* the arithmetic switch */
.tgl{display:inline-flex;align-items:center;gap:7px;padding:3px 11px 3px 6px;border:1px solid var(--line2);border-radius:99px;background:var(--panel);font-size:13.5px;color:var(--faint)}
.tgl:hover{background:var(--wash);color:var(--ink)}
.tgl .knob{position:relative;width:26px;height:14px;border-radius:99px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line2);transition:background .15s}
.tgl .knob::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(30,24,14,.3);transition:left .15s}
.tgl.on{color:var(--ink)}

/* one grid per card: the paths (each card's own width) | the landed-upon

.lines{display:grid;position:relative;
  grid-template-columns:minmax(0,min(var(--pw,400px),60%)) var(--ww,260px) var(--mw,0px) minmax(0,1fr)}
.wband{grid-column:2;background:rgba(120,96,58,.075);border-radius:7px}

.lrow.line{cursor:pointer}

.dots{flex:1 0 28px;height:0;border-top:1px dotted var(--ghost);margin:0 -7px 0 8px;position:relative}
.dots::after{content:"";position:absolute;right:0;top:-3.5px;width:0;height:0;
  border-left:5px solid var(--ghost);border-top:3px solid transparent;border-bottom:3px solid transparent}

.lw{grid-column:2;align-self:start;display:flex;flex-direction:column;min-width:0;padding:0 6px 0 9px}

/* where two keywords meet: a bracket joining the two words, how they meet beside it */
.mbr{position:absolute;grid-column:3;left:0;top:12.75px;bottom:-14.25px;border:1.5px solid var(--near);border-left:none;
  border-radius:0 4px 4px 0;z-index:2;pointer-events:none}

#modal.intro{padding-top:3vh}

.ilead{font-size:16.5px;line-height:1.5;max-width:78ch;margin:0 0 6px!important;color:var(--ink)}

.inum{display:inline-flex;align-items:center;justify-content:center;flex:none;width:21px;height:21px;border-radius:50%;background:var(--ink);color:#F2E8D2;font:600 11px var(--mono);letter-spacing:0}
.itx{color:var(--faint);font-size:14.5px;max-width:84ch;margin:0 0 6px!important}
.iflow{position:relative;overflow-x:auto;margin:6px -8px 0;padding:6px 8px 4px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.iflow-svg{display:block;width:100%;min-width:780px;height:auto}

.ig{font:12px var(--mono);fill:var(--faint);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.inode{cursor:default}
.ik{cursor:pointer}
.ik text{font:600 10.5px var(--serif);letter-spacing:.12em;fill:#FBF4E4;text-anchor:middle;dominant-baseline:central}
.ic rect{fill:var(--conw)} .ic text{font:13px var(--sans);fill:var(--coni);dominant-baseline:central}
.ic.a-domain rect{fill:var(--domw)} .ic.a-domain text{fill:var(--domi)}
.ic.a-text rect{fill:var(--txtw)} .ic.a-text text{fill:var(--txti)}
.iw text{font:italic 13px var(--sans);fill:var(--ink);dominant-baseline:central}
.iw line{stroke:var(--line2);stroke-dasharray:2 2}
.it{cursor:default}
.it > rect{fill:#FBF8F0;stroke:var(--line2)}
.it:hover > rect{stroke:var(--ink)}
.itt{font:600 12.5px var(--sans);fill:var(--ink)}
.itr{font:9.5px var(--mono);fill:var(--ghost)}
.its{font:500 11.5px var(--mono);fill:var(--ink);text-anchor:end}
.itf{font:500 10.5px var(--mono);fill:var(--neari);text-anchor:end}
/* where the keywords meet: the two words in rose, a bracket joining them, a line into the topic */
.imeet{display:none} .imeet.on{display:inline}
.imb{fill:none;stroke:var(--near);stroke-width:1.7;stroke-linejoin:round}
.iml{fill:none;stroke:var(--near);stroke-width:1.3;stroke-opacity:.85}
.iw.mw text{fill:var(--neari)} .iw.mw line{stroke:var(--near);stroke-dasharray:none}
/* how close a topic's keywords meet: a tag on its top edge, over the factor it brings */
.itag rect{fill:#FBF8F0;stroke:var(--near);stroke-width:.9}
.itag text{font:9.5px var(--mono);fill:var(--neari);text-anchor:end;dominant-baseline:central}
/* on opening, the diagram tells itself a step at a time (anim, s1 … s7):
   the step's line large over the whole panel first, then, once it has
   gone, the column's header, its paths drawing and its nodes; then where
   the keywords meet (6) and the tags with how close (7) */
.istory{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--panel);
  opacity:0;pointer-events:none;transition:opacity .45s ease}
.istory.on{opacity:1}
.ist{display:none;margin:0!important;text-align:center;font:italic 38px/1.3 var(--sans);color:var(--ink)}
.ist.on{display:block}
.ist.im{color:var(--neari)}
.iflow-svg.anim .sf,.iflow-svg.anim .sn{opacity:0;transition:opacity .45s ease}
.iflow-svg.anim .sn{transition-delay:1s}
.iflow-svg.anim .itag{transition-delay:var(--d,.6s)}
.iflow-svg.anim .ie{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .95s ease-out .5s,stroke-opacity .15s}
.iflow-svg.anim .imeet .imb,.iflow-svg.anim .imeet .iml{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s ease-out .55s}
.iflow-svg.anim .imeet .iml{transition-delay:1.2s}
.iflow-svg.anim:not(.s6) .iw.mw text{fill:var(--ink)}
.iflow-svg.anim:not(.s6) .iw.mw line{stroke:var(--line2);stroke-dasharray:2 2}
.iflow-svg.anim .itf{opacity:0;transition:opacity .45s ease 1.5s}
.iflow-svg.anim.s6 .itf{opacity:1}
.iflow-svg.anim.s1 [data-s="1"].sf,.iflow-svg.anim.s1 [data-s="1"].sn{opacity:1}
.iflow-svg.anim.s1 .ie[data-s="1"]{stroke-dashoffset:0}
.iflow-svg.anim.s2 [data-s="2"].sf,.iflow-svg.anim.s2 [data-s="2"].sn{opacity:1}
.iflow-svg.anim.s2 .ie[data-s="2"]{stroke-dashoffset:0}
.iflow-svg.anim.s3 [data-s="3"].sf,.iflow-svg.anim.s3 [data-s="3"].sn{opacity:1}
.iflow-svg.anim.s3 .ie[data-s="3"]{stroke-dashoffset:0}
.iflow-svg.anim.s4 [data-s="4"].sf,.iflow-svg.anim.s4 [data-s="4"].sn{opacity:1}
.iflow-svg.anim.s4 .ie[data-s="4"]{stroke-dashoffset:0}
.iflow-svg.anim.s5 [data-s="5"].sf,.iflow-svg.anim.s5 [data-s="5"].sn{opacity:1}
.iflow-svg.anim.s5 .ie[data-s="5"]{stroke-dashoffset:0}
.iflow-svg.anim.s6 [data-s="6"].sf,.iflow-svg.anim.s7 [data-s="7"].sf{opacity:1}
.iflow-svg.anim.s6 .imeet .imb,.iflow-svg.anim.s6 .imeet .iml{stroke-dashoffset:0}
.iflow-svg.now,.iflow-svg.now *{transition:none!important}
.ilegend{font-size:12.5px;color:var(--ghost);margin:6px 0 0!important;max-width:none!important}
