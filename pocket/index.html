<script type="application/json" id="atlas-index">{"researchers":[{"name":"Mark de Berg","domain":"Computer Science","cluster":"Algorithms","group":"Algorithms","leader":true,"kwRaw":"Computational geometry, geometric networks, spatial data","desc":"Mark is a full professor at Eindhoven University of Technology (TU/e) and chair of the TU/e Algorithms Group. This group performs research in various areas within algorithms, including computational geometry and FPT algorithms, and is inspired by applications in complex networks, geographic information science and design and manufacturing. Mark's personal interest is in algorithms and data structures in general, and in algorithmic questions involving spatial data in particular. His current research includes algorithms for geometric networks, exact algorithms for NP-hard geometric problems [and FPT algorithms for geometric problems?] and spatial data structures. Much of his work centers around the question: How can we exploit the properties that real-world spatial data sets often possess to obtain provably efficient solutions? [again: 'paramterizing' the complexity in spatial structures?]\n\nGeometry is everywhere. By my research I want to contribute to a deeper understanding of the techniques needed to tackle the algorithmic challenges involved in processing spatial data in an efficient and reliable manner.'","cov":"5 of 5","pubs":[0,1,2,3,4],"sim":[5,139,3,8,9,4]},{"name":"Morteza Monemizadeh","domain":"Computer Science","cluster":"Algorithms","group":"Algorithms","leader":false,"kwRaw":"Algorithms for big data (clustering, dimensionality reduction), computational geometry","desc":"My interests include algorithms for big data, sublinear-time algorithms, streaming and dynamic algorithms, computational geometry in low-and high-dimensional Euclidean spaces, and machine learning. (2016)\n\nClustering, dimensionality reduction, unsupervised learning","cov":"5 of 5","pubs":[5,6,7,8,9],"sim":[56,70,73,8,0,5]},{"name":"Ulrike Schmidt-Kraepelin","domain":"Computer Science","cluster":"Algorithms","group":"Algorithms","leader":false,"kwRaw":"Computational social choice, voting rules, blockchain, fairness","desc":"My research is motivated by social choice questions and uses techniques from a range of fields such as combinatorial optimization, game theory, and statistics. In particular, I work on multiwinner elections, participatory budgeting, apportionment, liquid democracy, and fair division\n\nHow to combine the conflicting preferences of multiple agents to come to a joint decision? This fundamental question arises frequently in democratic societies, for example, when electing a parliament, deciding on a public budget, or randomly selecting a citizens assembly. Computational social choice studies this question by analyzing preference aggregation rules with respect to their fairness, computational tractability, and robustness towards strategic behavior. To this end, we leverage methods from combinatorics, algorithm theory, and game theory.\n\nFairness, voting rules, blockchain","cov":"5 of 5","pubs":[10,11,12,13,14],"sim":[139,124,57,4,126,136]},{"name":"Bart M. P. Jansen","domain":"Computer Science","cluster":"Algorithms","group":"Graph Algorithms","leader":true,"kwRaw":"Parameterized complexity, effective preprocessing, kernelization, graph theory","desc":"Parameterized complexity, effective preprocessing, kernelization, graph theory\n\nBart's main focus is on understanding the power of data reduction. In practice, the search for the exact solution to an NP-complete problem is often accelerated by orders of magnitude by adding a preprocessing phase. Before attempting to solve the problem, it is simplified by repeatedly applying reduction rules that do not change the answer. How can such reduction rules be developed systematically, how can we explain their success, and how can we estimate what types of reduction rules are useful for a certain application? These are questions that Bart attacks on a daily basis\n\n'Investigating efficient preprocessing algorithms is like exploring the lost continent of polynomial time. For decades, researchers believed there are no polynomial-time algorithms which are guaranteed to be useful in the search for exact answers to NP-complete problems. But we're now discovering there is a rich variety of preprocessing algorithms to be found!'","cov":"5 of 5","pubs":[15,16,17,18,19],"sim":[139,4,9,0,117,142]},{"name":"Thekla Hamm","domain":"Computer Science","cluster":"Algorithms","group":"Graph Algorithms","leader":false,"kwRaw":"Complexity theory, real polynomial hierarchy, discrete vs real Turing machines","desc":"Complexity theory, real polynomial hierarchy, discrete vs real Turing machines","cov":"5 of 5","pubs":[20,21,22,23,24],"sim":[3,139,128,0,2,7]},{"name":"Bettina Speckmann","domain":"Computer Science","cluster":"Algorithms","group":"Applied Geometric Algorithms","leader":true,"kwRaw":"Discrete and computational geometry; geographic information systems (including movement), geo-visualization and visual analytics, and e-Humanities,","desc":"Research interests: Algorithms and data structures; discrete and computational geometry; applications of computational geometry to geographic information systems, geo-visualization and visual analytics, and e-Humanities\n\nGeometric algorithms is the field within algorithms research that is concerned with the design and analysis of efficient algorithms and data structures for problems involving geometric objects in 2-, 3-, and higher-dimensional space. The Applied Geometric Algorithms group mainly focuses on geometric algorithms for spatial data and applications of geometric algorithms in the areas of GIScience and Smart Mobility (including automated cartography and moving object analysis), geo-visualization, visual analytics, and e-Humanities.\n\nHumans have an intuitive sense of spatial structures, computers just 'see' zeros and ones. I find it endlessly fascinating to teach computers how to gain a human-like understanding of spatial data","cov":"5 of 5","pubs":[25,26,27,28,29],"sim":[6,8,0,9,80,85]},{"name":"Wouter Meulemans","domain":"Computer Science","cluster":"Algorithms","group":"Applied Geometric Algorithms","leader":false,"kwRaw":"Information visualization, automated cartography, geographic information science.","desc":"My research revolves around the intersection of algorithms and information visualization. That is, to study how we can automatically compute high-quality visualizations of data. My research therefore applies methods and techniques from algorithms, computational geometry and graph drawing in the areas of information visualization, automated cartography and geographic information science.\n\nMy focus within this intersection lies with designing and optimizing objective measures of visualization quality. This measured approach I use to study how we can best compute visualizations of high quality, low visual complexity or that make a trade-off between various aspects. Showcasing such aspects, a central theme throughout my research is schematic geovisualizations. In such schematizations, the data is not made to fit the (geo)spatial dimension, but rather the other way around. That is, space is seen as a deformable tool that we can use to give focus, provide context and highlight structures of the data\n\nIf you know what to look for, you will find possible applications for geometric algorithms everywhere","cov":"5 of 5","pubs":[30,31,32,33,34],"sim":[8,5,85,88,9,86]},{"name":"Tim Ophelders","domain":"Computer Science","cluster":"Algorithms","group":"Applied Geometric Algorithms","leader":false,"kwRaw":"Topology, continuous distance measures for low-dimensional shapes.","desc":"My research direction is computational geometry and topology, and I specialize in continuous distance measures for low-dimensional shapes","cov":"5 of 5","pubs":[35,36,37,38,39],"sim":[5,8,88,82,4,6]},{"name":"Kevin Verbeek","domain":"Computer Science","cluster":"Algorithms","group":"Algorithmic Spatial Data Analysis","leader":true,"kwRaw":"\"Projects that require (applied) geometric algorithms (often on geometric/geographic data), do not heavily rely on AI, and fundamental research. TRLs 1-2, maybe 3\"","desc":"Kevin Verbeek is an assistant professor in the Applied Geometric Algorithms group at TU Eindhoven. His main research interests lie within the area of computational geometry. Kevin is specialized in using theoretical techniques from computational geometry to solve real-world problems, mostly in the area of information visualization. His favorite research topics include computational geometry, graph drawing, automated cartography, social network analysis, information visualization, and computational topology. As part of an NWO-funded VENI project, he is developing new tools to measure and analyze the stability of geometric algorithms: small changes in the input should lead to small changes in the output. The stability of geometric algorithms plays an important role in the visualization of dynamic or time-varying data. Kevin is also involved in the GlamMap project. The goal of this project is to develop an interactive geo-spatial visualization tool to visualize GLAM (Galleries, Libraries, Archives, Museums) metadata.\n\nI recently acquired a VENI grant on Stable Geometric Algorithms. This is a personal grant for three years awarded by NWO, the Netherlands Organization for Scientific Research. In this project I will study the stability of geometric algorithms from a theoretical perspective. The stability of geometric algorithms plays an important role in the visualization of dynamic or time-varying data. Dynamic visualizations that are too jumpy do not convey their information well. Often there is a tradeoff between the (static) quality of a visualization and its stability, as demonstrated by the treemap video below. In the left treemap the rectangles have smaller aspect ratios, but the right treemap is more stable\n\nAs for what kind of projects I would be interested in: Projects that require (applied) geometric algorithms (often on geometric/geographic data), do not heavily rely on AI (or at least not on machine learning), and that also offer room for fundamental research. The kind of research that I do typically falls within TRLs 1-2, maybe 3. I hope this is somewhat clear, otherwise I'm happy to talk more extensively on that","cov":"5 of 5","pubs":[40,41,42,43,44],"sim":[6,5,9,85,7,88]},{"name":"Thomas C. van Dijk","domain":"Computer Science","cluster":"Algorithms","group":"Algorithmic Spatial Data Analysis","leader":false,"kwRaw":"Geographic information systems (GIS), eco-informatics, information visualisation, historical information, and algorithmically-guided user interaction","desc":"I am an applied algorithms researcher working on geographic information systems (GIS), eco-informatics, information visualisation, historical information, and algorithmically-guided user interaction","cov":"5 of 5","pubs":[45,46,47,48,49],"sim":[5,6,3,8,88,85]},{"name":"Jan Friso Groote","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Formal System Analysis","leader":true,"kwRaw":"FM for software, control systems, architecture, industry critical systems; FM as a design tool; bisimulation (not only simulation but inner workings)","desc":"His areas of expertise include Computer systems, architectures, software, algorithms, embedded systems and formal methods. Jan Friso has contributed to structural operational semantics and verification technology. His particular contributions include the tyft/tyxt format for operational rules, the first and also the most efficient algorithms to determine branching bisimulation and the cones and foci method to prove correctness of protocols and distributed algorithms. He is the founding father of the process modeling language and analysis tool set mCRL2. This tool set makes it possible to describe the behavior of software with data, time and probabilities, whilst proving properties related to this behavior, expressed in the modal mu-calculus, as well as reducing and visuaizing this.\n\nHis current research goal is to show that formal analysis techniques can be used to design the software for complete systems. For this it is not only necessary to improve the verification techniques and algorithms, but it is also important to develop software development styles suitable for verification. Industrial experience shows that this reduces the development time with a factor three increasing the quality with a factor 10. Especially regarding the quality, it can be expected that substantial further improvements are possible, hopefully leading to zero defect software.\n\nWe want to provide technology that enables software engineersto deliver flawless software at reasonable cost\n\nHoe moeten wij, als mensen, voorspelbaar bruikbare complexe systemen construeren?","cov":"5 of 5","pubs":[50,51,52,53,54],"sim":[15,51,11,14,17,121]},{"name":"Jeroen J. A. Keiren","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Formal System Analysis","leader":false,"kwRaw":"Reducing structures in model checking (keeping state space explosion in check); FM for software, hardware and especially industry critical systems","desc":"I am an assistant professor in the Formal System Analysis group at the Eindhoven University of Technology (TU/e). My research interests lie in the development of formal methods for the design and application of correct and reliable software and hardware systems. A common theme throughout much of my research is reducing the structures generated in model checking, for example using bisimulation methods. Specific areas of expertise include (explicit state) model checking, parity games and timed systems.\n\nI am also particularly interested in the application of such techniques to industry critical systems. I am currently PI of two research projects that focus on the verification of machine control applications described using a variation of UML state machine diagrams in the Cordis SUITE\n\nWe should expect safety critical software to verifiably meet its requirements","cov":"5 of 5","pubs":[55,56,57,58,59],"sim":[15,17,18,12,14,51]},{"name":"E. P. de Vink","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Formal System Analysis","leader":false,"kwRaw":"FM for software product lines, family oriented verification; dynamic system adaptation","desc":"Currently, I am interested in formal modelling and analysis of Software Product Lines and in formal methods for Dynamic System Adaptation. More specifically I focus at present in Software Product Lines on the use of model checkers for the analysis of feature-behaviour interaction and family-oriented verification. As to Dynamic System Adaptation, Paradigm and Reo are two languages that have my interest. I aim to develop methods for the modelling dynamic migration trajectories and related validation techniques. I mainly use the mCRL2 and Prism modelcheckers for tool support","cov":"5 of 5","pubs":[60,61,62,63,64],"sim":[11,17,15,16,14,46]},{"name":"Bas Luttik","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Concurrency Theory","leader":true,"kwRaw":"Process algebra & concurrency; especially as applied to railway; digital innovation of education","desc":"I am an associate professor in the Formal System Analysis research group of the Computer Science Department of Eindhoven University of Technology.\n\nMy main area of research is concurrency theory, in particular process algebra, with the aim to provide a solid and well-understood mathematical foundation for methods and tools to verify system behaviour. My research has focussed on unique parallel decomposition and finite basis problems in process algebra, and the integration of concurrency theory and classical automata theory.\n\nI am also interested in applying process-algebra based formal methods to improve the quality of system requirements, most notably in the railway domain. In particular, I lead the FormaSig project.\n\nI am also actively involved in projects to innovate education using digital technology. For my course on Logic and Set Theory, I have recorded over 50 videoclips explaining the course material. Furthermore, I have initiated a project to develop an online homologation recommendation tool to allow master students through digital tests to identify deficiencies in their bachelor background and present them a recommendation on how to repair those deficiencies\n\nHis research on the integration of concurrency theory and classical automata theory has led to a theory of executability, based on Reactive Turing machines.","cov":"5 of 5","pubs":[65,66,67,68,69],"sim":[17,14,25,47,118,12]},{"name":"Valentina Castiglioni","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Concurrency Theory","leader":false,"kwRaw":"Concurrent systems; verification(of robustness) of cyber physical systems; FM for biological systems.","desc":"My research activity is mainly focused on formal methods for concurrent systems. In particular, I am interested in:\n-Verification of robustness properties of cyber-physical systems\n-Metric and approximate semantics reasoning on probabilistic languages\n-Equational logic of processes\n-Model checking\n-Formal methods applied to biological systems","cov":"5 of 5","pubs":[70,71,72,73,74],"sim":[11,15,12,13,17,10]},{"name":"Tim A. C. Willemse","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Algorithms and Logics for Verification","leader":true,"kwRaw":"Formal software verification, fixed point logics (formal recursion)","desc":"My research is in Algorithms and Logics for Verification (ALIVE), and, more broadly, in all means and methods that help designing correct and reliable systems. I work on algorithms and theory for fixed point logics, parity games and applications of model checking. My theories drive the verification technology offered by the mCRL2 toolset to which I contribute in some way or another\n\nTim's research focusses on applying, developing and scaling formal methods for designing correct and reliable systems. His research receives financial support from organisations such as NWO and the European Commission, and commercial parties, including ASML, Canon Production Printing and Verum.\n\nHis group works on algorithms and theory for parity games and fixpoint logics, such as parameterised Boolean equation systems, and their application. Their theories and algorithms drive the model checking technology offered by mCRL2, a toolset for specifying and analysing (software controlled) systems.\n\nTim led the development of dedicated verification tooling for the software controlling the physics experiments at CERN. More recently, he developed the verification technology underlying the commercial model-driven software engineering toolset Dezyne, used on a day-to-day basis by the high-tech industry.\n\nThe beauty and power of formal software analysis never cease to surprise","cov":"5 of 5","pubs":[75,76,77,78,79],"sim":[11,17,10,12,51,14]},{"name":"Clemens Dubslaff","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Algorithms and Logics for Verification","leader":false,"kwRaw":"(Probabilistic) model checking; configurable systems analysis, explainability in formal methods, and reliability analysis","desc":"I am interested in formal methods and (probabilistic) model checking in particular. My research areas mainly cover symbolic methods, configurable systems analysis, explainability in formal methods, and reliability analysis\n\nClemens Dubslaff is a computer scientist conducting research at the crossroads between theoretical computer science and software engineering. His overall goal is to improve reliability of computing systems. Modern systems become more and more complex while taking on more and more responsibilities even in critical areas of society. Hence, their reliability but also their explainability, to express reasons for their decisions and behavior, are of utter interest. Clemens develops techniques to unlock the analysis of large-scale computing systems and their explainability through symbolic formal methods. He is in particular interested in methods to cope with huge configuration and feature spaces.","cov":"5 of 5","pubs":[80,81,82,83,84],"sim":[18,12,11,17,46,15]},{"name":"Thomas Neele","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Algorithms and Logics for Verification","leader":false,"kwRaw":"Concurrent behaviour and scalability problems; model checking, symbolic techniques, partial-order reduction; fixpoint logics, parallel programming and automata learning.","desc":"My research interests are the analysis of concurrent behaviour and its associated scalability problems. In the context of model checking, I study symbolic techniques, syntactic transformations for reduction, and partial-order reduction. My other interests are fixpoint logics, parallel programming and automata learning\n\nhttps://www.tue.nl/en/research/researchers/thomas-neele","cov":"5 of 5","pubs":[85,86,87,88,89],"sim":[11,15,13,12,18,14]},{"name":"Matthias Volk","domain":"Computer Science","cluster":"Formal Systems Analysis","group":"Algorithms and Logics for Verification","leader":false,"kwRaw":"FM  for saftery critical systems (autonomous vehicles, smart grids, robotic systems); automated techniques for modeling; probabilistic model checking","desc":"My research goal is to improve the safety and reliability of complex, safety-critical systems through formal methods. Certifying that systems, such as autonomous vehicles, smart grids, and robotic systems, operate safely and reliably is a major challenge today. My aim is to develop rigorous, automated techniques for modeling and analyzing safety-critical systems,\nprovide optimized implementations in mature tools for use by other researchers, and apply the approaches in industrial collaborations. In my research, I focus primarily on probabilistic model checking, and I am a main developer of the Storm model checker","cov":"5 of 5","pubs":[90,91,92,93,94],"sim":[11,16,17,15,40,147]},{"name":"Nirvana Meratnia","domain":"Computer Science","cluster":"Interconnected Resource-aware Intelligent Systems","group":"Interconnected Resource-aware Intelligent Systems","leader":true,"kwRaw":"Cloud to edge continuum, IoT, distributed embedded systems, federated (un)learning, explainable AI","desc":"Edge-cloud continuum, IoT, federated (un) learning, explainable AI; https://iris.win.tue.nl/Research/","cov":"5 of 5","pubs":[95,96,97,98,99],"sim":[26,35,82,22,32,30]},{"name":"Mike Holenderski","domain":"Computer Science","cluster":"Interconnected Resource-aware Intelligent Systems","group":"Interconnected Resource-aware Intelligent Systems","leader":false,"kwRaw":"Reliable machine learning (robustness to noise, scarce data etc.), especially for industry; distributed learning.","desc":"His research focus is on, machine learning which has been shown to perform well in various domains, some- times even outperforming humans on tasks such as image classification. Usually, the data that the machine learning systems are trained and evaluated on are static and relatively clean. In reality, however, the data is often noisy, corrupted, partially missing and coming from dynamic environments which are changing over time.\n\nReliable machine learning aims at developing models which are robust to noise and missing data, and can detect and adapt to changes in the processes that they monitor and control. The relevant questions include: How can a system measure its own performance and detect when its predictions are not accurate, e.g. because the behavior of the monitored process has changed or because the input is very different from previous observations? How can it provide safe predictions when it cannot be certain about the accuracy? How can a system adapt to the changes in the environment or when being deployed in a new context? How can a machine learning agent deal with corrupt or missing data?\n\nI am interested in the design and applications of reliable machine learning in industrial systems for optimizing the manufacturing and maintenance processes'\n\nMy current research interests are in the system architecture aspects of machine learning. In particular, I am interested in how learning can be distributed in a sensing network in order to meet real-time and bandwidth constraints, and how different learners can interact together in order to improve their joint performance. My current work is funded by the European project Mantis, where I investigate machine learning based failure prediction for predictive maintenance (Old)","cov":"5 of 5","pubs":[100,101,102,103,104],"sim":[55,56,63,99,14,110]},{"name":"Johan J. Lukkien","domain":"Computer Science","cluster":"Interconnected Resource-aware Intelligent Systems","group":"Interconnected Resource-aware Intelligent Systems","leader":false,"kwRaw":"Development of CPS, rôle of ML for CPS","desc":"Until 2000, Johan was primarily involved in large-scale simulations in physics and chemistry, resulting in the Kinetix software package of Biovia's Materials Studio. Since 2000, his research focus shifted to the application domain of networked resource-constrained embedded systems (called Cyber-Physical Systems, CPS) with a focus on architecture and protocols. Contributions are in the area of component-based middleware for resource-constrained CPSs, Quality of Service and schedulability analysis. Recent work targets the development processes of CPSs and the role that data and machine learning play.","cov":"5 of 5","pubs":[105,106,107,108,109],"sim":[26,35,25,44,24,71]},{"name":"Habib Mostafaei","domain":"Computer Science","cluster":"Interconnected Resource-aware Intelligent Systems","group":"Interconnected Resource-aware Intelligent Systems","leader":false,"kwRaw":"Programmable networks, network monitoring, 6g, geo-distributed computing, QoS & QoE.","desc":"Programmable Networks: Programmable networks enable dynamic control over packet processing and measurement within network devices. We are working on multiple aspects of this area:\nProgrammable Packet Scheduling: Programmable packet schedulers allow network operators to implement their scheduling policies on a per-packet level without changing the hardware design. Push-In-First-Out (PIFO) queues provide an abstraction for the implementation of programmable packet schedulers. However, modern programmable switches lack support for the realization of PIFO queues, and approximating PIFO behavior has the potential to overcome these limitations. We are working in several directions:\nApproximating PIFO with normalization [ToN'25]\nApproximating PIFO with exponential bining [CoNEXT'25]\nNetwork Measurement: Accurate network measurement techniques are critical for optimizing performance, detecting anomalies, and ensuring quality of service. We are exploring novel programmable measurement techniques for efficient network telemetry.\nAccurate per-priority data measurement with PrioMeter [EuroP4'23]\nDetecting Straggler flows with StragFlow [IFIP Networking'25]\nGeo-Distributed Computing: Modern large-scale applications rely on geo-distributed infrastructures to achieve low-latency execution of processes while efficiently utilizing the available compute and network resources. Our research explores strategies for optimizing geo-distributed execution.\nMulti-cluster Service Mesh: Microservice architectures and service meshes have become highly popular and face increasingly stringent scalability and dependability requirements. To achieve low-latency service execution and maximize performance, service providers of large-scale distributed systems deploy microservices geographically closer to their users in multi-cluster service mesh environments. We are developing systems that can achieve the quality of service requirements of microservices.\nL3 [Middleware'24] in load balancing of microservices.\nMiddleware'24 Best Student Paper Award\nGeo-Distributed Processing: Efficient processing of data across geographically distributed locations is critical for emerging applications. Our research focuses on network-aware resource allocation and optimization strategies.\nUnderstanding the impact of WAN latency [TNSM'22]\nFrameworks to manage resources [ToIT'23] [FGCS'22]\n\nMy research focuses on designing resource-efficient networked systems that improve both quality of service (QoS) and quality of experience (QoE) for end users.","cov":"5 of 5","pubs":[110,111,112,113,114],"sim":[143,71,35,19,26,25]},{"name":"Mitra Nasri","domain":"Computer Science","cluster":"Interconnected Resource-aware Intelligent Systems","group":"Interconnected Resource-aware Intelligent Systems","leader":false,"kwRaw":"Real-time (autonmous) systems: ML import, design, orchestration, timing analysis, security; dependable ROS","desc":"Machine-learning and real-time systems\nDesigning and orchestrating real-time systems\nTiming analysis of real-time systems\nReal-time systems and security\nDependable robot operating system (ROS)","cov":"5 of 5","pubs":[115,116,117,118,119],"sim":[24,25,139]},{"name":"Geoffrey Nelissen","domain":"Computer Science","cluster":"Interconnected Resource-aware Intelligent Systems","group":"Interconnected Resource-aware Intelligent Systems","leader":false,"kwRaw":"Real-time and embedded systems (including networks); real-time parallel applications & scheduling on multicore and distributed platforms/systems; cache analysis","desc":"My work is mostly related to the modelling and analysis of real-time and embedded systems. My research interests include scheduling on multicore and distributed systems, cache analysis, solutions for safety critical systems, real-time network and everything related to the analysis and configuration of real-time parallel applications on multicore and distributed platforms","cov":"5 of 5","pubs":[120,121,122,123,124],"sim":[23,25,21,51,149,10]},{"name":"Pieter J. L. Cuijpers","domain":"Computer Science","cluster":"Interconnected Resource-aware Intelligent Systems","group":null,"leader":true,"kwRaw":"Quantitative formal modelling of [the performance analysis) cyber physical systems; scheduling of distributed embedded systems (e.g. Ethernet TSN).","desc":"After developing a process algebra for hybrid systems (HyPA), his research has focussed on the quantitative formal modelling of cyber physical systems, with a focus on performance analysis (timing and resource usage) and scheduling of distributed embedded systems (e.g. Ethernet TSN).\n\nImportant tools techniques that play a role in this are: max-plus algebra, order theory, event-based modeling and simulation and axiomatic and reasoning about execution trees. Recent research is focussing on structuring the theoretical framework between real-time scheduling techniques using the proof-assistant LEAN.","cov":"5 of 5","pubs":[125,126,127,128,129],"sim":[24,23,13,21,14,35]},{"name":"Tanir Özçelebi","domain":"Computer Science","cluster":"Interconnected Resource-aware Intelligent Systems","group":"Intelligent Internet of Things Systems","leader":true,"kwRaw":"life-cycle management for resource-constrained embedded devices, architecture of smart spaces, IoT, QoS management","desc":"His main research interests are life-cycle management for resource-constrained embedded devices, architecture development for smart spaces and Internet of Things, as well as resource and QoS management and data analytics for networked services. In more detail, his research interests cover the following areas:\n\nDefining and enhancing life-cycles of networks of resource-constrained embedded devices\n\nArchitectures for resource management, QoS management and data analytics\n\nSmart spaces, Internet of Things (smart lighting in as application),\n\nData analytics in Internet of Things and smart spaces context.\n\nIn the Internet of Things era, where tiny networked embedded devices support tasks of humans by organizing themselves into a smart space that is Internet-enabled, ubiquitous smart interaction as was originally envisioned by Mark Weiser is becoming a reality","cov":"5 of 5","pubs":[130,131,132,133,134],"sim":[19,21,35,22,32,71]},{"name":"Luca Allodi","domain":"Computer Science","cluster":"Security","group":"Threat Analysis","leader":true,"kwRaw":"Dark web, intrusion detection, phishing, attacker operations & economics & psychology, user psychology","desc":"Psychology and economics of the attacker and the targets.\n\nI am an Associate Professor and head of the Threat Analysis group within the Security Cluster of the Eindhoven University of Technology, in the Netherlands. We investigate attacker operations ([1], [2]), economics ([3], [4]), and how these are ultimately delivered to the (human) user ( [5] , [6]) to improve operational defense capabilities ([7], [8]). Our research draws from several fields, including computer security, economics, risk analysis, and criminology\n\nThe real voyage of discovery consists not in seeking new landscapes but in having new eyes. -Marcel Proust","cov":"5 of 5","pubs":[135,136,137,138,139],"sim":[28,29,30,32]},{"name":"Emmanuele Zambon","domain":"Computer Science","cluster":"Security","group":"Threat Analysis","leader":false,"kwRaw":"Security of industrial control systems, network monitoring, network intrusion detection and incident response.","desc":"I am an Assistant Professor at the Security Group of the Eindhoven University of Technology, in the Netherlands. I investigate the security of Industrial Control Systems (ICS) to improve their defense capabilities. My research focuses in the areas of network intrusion detection and incident response. I collaborate with the Eindhoven Security Hub Security Operations Center initiative.\n\nI was one of the three founders of the spin-off SecurityMattters, with the goal of bringing to the market SilentDefense, a platform for network monitoring, asset inventory and network intrusion detection for Industrial Control Systems. At SecurityMatters I served as the CTO, and I was responsible of the company's R&D","cov":"5 of 5","pubs":[140,141,142,143,144],"sim":[29,30,27,133,22]},{"name":"Sandro Etalle","domain":"Computer Science","cluster":"Security","group":"Defensive Cybersecurity","leader":true,"kwRaw":"Security policy specification & enforcement, security of embedded systems, threat intelligence and defense, network intrusion, incident response","desc":"I have a passion for entrepreneurship and for computer security\n\nMy current research interest include network intrusion detection, protection of industrial control systems and trust management\n\nSandro Etalle leads the Security group where the approach to system security is multi-faceted and covers offensive and defensive aspects of system security, always targeting concrete security problems and addressing the underlying, fundamental issues at their core. The group's strength lies precisely in its ability to empirically and theoretically understand the full security process: from attack generation and system management, to policy specification and user aspects. Today,Etalle's research is focused mainly on network monitoring and intrusion detection, with particular emphasis on the security of industrial control systems. Other topics includes policy specification and enforcement, and incident response. With two PhD students, Etalle founded the company SecurityMatters, bringing the result of their research to the market, and at the same time providing a source for insights into how cybersecurity evolvesin real life, leading to new research challenges.His group's research spans three areas vital to the security of decentralized and embedded systems: (a) Security policy specification & enforcement (b) Security of embedded systems, and (c) Threat intelligence and defense, sitting at the cutting-edge intersection of these areas, addressing particularly challenging operative and theoretical problems.\n\nThe key to security is understanding'","cov":"5 of 5","pubs":[145,146,147,148,149],"sim":[28,30,27,32,22,121]},{"name":"Jerry I. den Hartog","domain":"Computer Science","cluster":"Security","group":"Security","leader":true,"kwRaw":"Data protection for collaborative systems, network situational awareness, intrusion detection, access control, trust management","desc":"Jerry den Hartog is an assistant professor with the Security Group, which is part of the section Security and Embedded Networked Systems at the department of Mathematics and Computer Science. His research interests cover data protection for collaborative systems; while sharing confidential information is often essential to collaboration, it is only possible within a demonstrably trustworthy setting. To this end his work focuses on network situational awareness and intrusion detection as well as on access control, trust management and formal verification. His work is applied in different settings such as critical infrastructure and industrial control systems, intelligent transport systems, smart buildings, and IoT in general, thus contributing to different TU/e research areas such as Data Science, Smart mobility, Energy and Engineering Heath. It ranges from fundamental research to more applied research in close collaboration with industrial partners. To support this collaboration he regularly acquires and managing projects in these areas.\n\nAlone we can do so little; together we can break so much\n\nTrustworthy collaborative systems; Access control and trust management, Network situational awareness and intrusion detection, Formal methods for security.","cov":"5 of 5","pubs":[150,151,152,153,154],"sim":[28,29,32,27,35,40]},{"name":"Boris Škorić","domain":"Computer Science","cluster":"Security","group":"Information-Theoretic and Quantum Security","leader":true,"kwRaw":"Physically unclonalbe functions, quantum physics for security (Q-readout of Physical Unclonable Functions, Q-Key Recycling), security with noisy data, anti counterfeiting","desc":"physically unclonable functions\n\nResearch interests\nSecurity with noisy data\nAn essential property of cryptographic primitives is an extreme sensitivity to small changes in their inputs. However, a number of important security applications use physical measurements as a source of (secret) randomness. On the one hand, these measurements are inherently noisy. On the other hand, we often wish to use them as input for hash functions, block ciphers etc. Some form of error correction is obviously needed if we want reproducible results. This requires storage/transfer of redundancy data. It is prudent to assume that attackers have access to this data. Hence the challenge is to develop efficient error correction methods where the redundancy data does not compromise security. This leads to an interesting mix of physics, information theory, coding theory and cryptography. The techniques developed in this field are useful in the following applications:\nsecure key storage\nanti-counterfeiting\nprivacy preserving biometric identification and authentication\ntrue random number generation\nUsing quantum physics for security\nQuantum physics has the interesting property that measurements typically destroy state information, and that unknown quantum information cannot be cloned. The inherent confidentiality and tamper evidence properties allow one to design security protocols that would be impossible with classical physics. The most notable example is Quantum Key Distribution, but there are other nifty tricks:\nQuantum Readout of Physical Unclonable Functions\nI found a way to use quantum physics to protect the challenge in a PUF challenge-response protocol. This provides unconditional security against digital emulation attacks.\nSee this article for laymen in The Converstation.\nThe idea was experimentally realized using laser speckle.\n\n\n\nQuantum Key Recycling\nIt is possible to keep re-using the same encryption key in an unconditionally secure way as long as the communicating parties do not detect an excess of noise. This is called key recycling. Key recycling is more efficient than repeated use of Quantum Key Distribution. Recently developed recycling schemes are simple and no longer need a quantum computer for the encryption and decryption. See this preprint and this preprint.\n\nCollusion-resistant watermarking codes\nIt is possible to embed hidden data in digital content such as audio and video. This is called watermarking or fingerprinting. In forensic watermarking a content provider embeds a unique identification code into the content for each individual customer, in order to be able to trace any 'leakage' of content (e.g. distribution on P2P) back to the customer. The most powerful attack against forensic watermarks is the so-called collusion attack: multiple attackers collaborate to remove the watermark. As they have bought differently watermarked versions of the same content, they can find the location of a significant part of their watermarks simply by comparing their content. In these locations they have a strong attack. The content provider's defense is to use an error-correcting code for the embedded indentifier. I concentrate on the following questions:\nFundamental limits on the collusion resistance of codes.\nAnalysis and optimization of existing codes.\nDevelopment of new codes.\nThis research topic involves information theory, statistics and analysis.\nSee the webpage of the CREST project.","cov":"5 of 5","pubs":[155,156,157,158,159],"sim":[120,142,127,129,35,128]},{"name":"Nicola Zannone","domain":"Computer Science","cluster":"Security","group":"Data Protection","leader":true,"kwRaw":"Requirements engineering, data protection,formal methods, data analytics for security,  access control, auditing, privacy & ethics, social engineering","desc":"Computer Security\n\nNicola Zannone is an Associate Professor and chair of the Data Protection group at Eindhoven University of Technology (TU/e). His research interests focus on information security, ranging from access control and data analytics for security and privacy to social engineering.","cov":"5 of 5","pubs":[160,161,162,163,164],"sim":[30,35,29,26,19,27]},{"name":"Wil Michiels","domain":"Computer Science","cluster":"Security","group":"Data Protection","leader":false,"kwRaw":"Attack analysis, binary instrumentation, reverse engineering, execution trace","desc":"Full prof but no publications since 2020","cov":"5 of 5","pubs":[165,166,167,168,169],"sim":[]},{"name":"Milan Petković","domain":"Computer Science","cluster":"Security","group":"Data Protection","leader":false,"kwRaw":"Artificial intelligence and Machine Learning, secure data management, big data","desc":"Artificial intelligence and Machine Learning\nSecure data management\nBig Data","cov":"5 of 5","pubs":[170,171,172,173,174],"sim":[70,62,1,57,59,105]},{"name":"Savio Sciancalepore","domain":"Computer Science","cluster":"Security","group":"Data Protection","leader":false,"kwRaw":"Physically unclonable functions (/physical layer security), security and privacy issues in wireless, mobile Internet of Things (IoT) networks and cyber-physical systems.","desc":"My major research interests include applied network security and privacy issues in Wireless, Mobile Internet of Things (IoT) networks and Cyber-Physical Systems. -Physical Layer Security, Specific Emitter Iden x0002 tification, Deep Learning, Internet of Things, Wireless Sec","cov":"5 of 5","pubs":[175,176,177,178,179],"sim":[26,19,32,30,21,22]},{"name":"Mark van den Brand","domain":"Computer Science","cluster":"Software Engineering and Technology","group":"Software Engineering and Technology","leader":true,"kwRaw":"Software quality, Domain Driven Design, Meta models, Digital Twins, model-driven software development, Legacy, AI ce are core concerns in software engineering. They are often seen together-or not at all'\n\nHis work in MDSE has varied from developing model-driven virtualizations of high-tech systems, to generation of efficient algorithm toolkits based on taxonomies of proven-to-be-correct algorithms. More recent work focuses on analyzing large collections of models and extracting variability and commonality information from them.","cov":"5 of 5","pubs":[220,221,222,223,224],"sim":[37,36,44,84,43,39]},{"name":"Jacob Krüger","domain":"Computer Science","cluster":"Software Engineering and Technology","group":"Engineering of Software-Intensive Systems","leader":false,"kwRaw":"Development and evolution of variant-rich software systems, interplay of human cognition and software quality, Decision making in SE.","desc":"'During these studies, I found that developers' comprehension of their system is the most important factor to engineer high-quality (variant-rich) software. This topic has fascinated me ever since'\nDevelopment and evolution of variant-rich software systems, interplay of human cognition and software quality, Decision making in SE.","cov":"5 of 5","pubs":[225,226,227,228,229],"sim":[44,42,39,12,38,16]},{"name":"Cornelis (Kees) Huizing","domain":"Computer Science","cluster":"Software Engineering and Technology","group":"Engineering of Software-Intensive Systems","leader":false,"kwRaw":"Concurrent programming, code transformation","desc":"","cov":"5 of 5","pubs":[230,231,232,233,234],"sim":[84,13,88,6,60,85]},{"name":"Alexander Serebrenik","domain":"Computer Science","cluster":"Software Engineering and Technology","group":"Social Software Engineering","leader":true,"kwRaw":"Empiricism; digital tools (e.g. machine learning, DT's of social interaction, NLP) for the sociology of software engineering.","desc":"Empiricism; socio-technical perspective (e.g. DT's of social interactions, machine learning, NLP) in combination with sociology/psychology of SE 'proper'.\n(for example currently: DT's of social interactions) i.c.w. sociological/psychological.","cov":"5 of 5","pubs":[235,236,237,238,239],"sim":[49,78,36,77,76,79]},{"name":"Alexander Nolte","domain":"Computer Science","cluster":"Software Engineering and Technology","group":"Social Software Engineering","leader":false,"kwRaw":"Social software engineering, collaborations & hackatons.","desc":"Social software engineering, collaborations & hackatons.","cov":"5 of 5","pubs":[240,241,242,243,244],"sim":[48,50,44]},{"name":"Katja Tuma","domain":"Computer Science","cluster":"Software Engineering and Technology","group":"Social Software Engineering","leader":false,"kwRaw":"Emprical methods fo security, gender bias in security, security by design, Security4AI & AI4security.","desc":"'I am passionate about building and evaluating methods for analyzing security threats and vulnerabilities in software systems. I like to work on solving practical problems with direct impact. I particularly focus on:\nEmpirical methods for security. Designing and conducting controlled experiments, industrial case studies and studies involving human participants.\nMeasuring human aspects (e.g., diversity) in security threat analysis. Risk perception, gender bias, diversity processes in technical (i.e., security) domain.\nSecurity4AI and AI4Security. Investigating how to secure AI, how AI could be used to support security activities, and which human factors that play a key role in practice.'","cov":"5 of 5","pubs":[245,246,247,248,249],"sim":[63,66,49,48]},{"name":"Anton Wijs","domain":"Computer Science","cluster":"Software Engineering and Technology","group":"Parallel Software Development","leader":true,"kwRaw":"GPU's; parallel computation; parallelism for verification, verification for parallelism, compilers, low level code","desc":"'Parallelism in software is both a blessing and a curse: if used correctly, it speeds up computations, but also makes them harder to understand'\n\nAnton works both on the development of parallel software, and the use of parallelism to improve the development process itself. The latter category covers investigating how formal verification techniques, to reason about the functional correctness of systems, can be improved by parallelising the involved computations. In the former category, research is done to identify which types of (formal) analyses are useful to make development of parallel software more insightful and less prone to errors\nParallel software engineering for AI & AI for parallel software engineering","cov":"5 of 5","pubs":[250,251,252,253,254],"sim":[15,10,11,17,12,83]},{"name":"Mykola Pechenizkiy","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Data Mining","leader":true,"kwRaw":"Responsible analytics, fairness, (context aware) predictive analytics, analytics on evolving data, concept drift, automation of feature construction","desc":"'Data collected over time often exhibit changes in distribution, or concept drift, caused by changes in factors relevant to the classification task, e.g. weather conditions. Incorporating all relevant factors into the model may be able to capture these changes, however, this is usually not practical. Data stream based methods, which instead explicitly detect concept drift, have been shown to retain performance under unknown changing conditions. These methods adapt to concept drift by training a model to classify each distinct data distribution'\n\nKnowledge extraction from evolving data/data stream.","cov":"5 of 5","pubs":[255,256,257,258,259],"sim":[73,57,76,54,69,71]},{"name":"Thiago D. Simão","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Data Mining","leader":false,"kwRaw":"(Multi) agent systems, reinforcement learning, model uncertainty.","desc":"The motivation for my research revolves around making AI techniques more reliable, to enable their deployment in real-world applications. I focus on developing AI algorithms for scenarios with ization subject to binary constraints and the development of algorithms for overlapping clusters. Also: matrix factorization for the win!\n\nI worked during my PhD a lot on solving optimization challenges connected to clustering, which are usually matrix factorization objectives with binary constraints. This is why it's called the Zero Shades of Grey page - it's all about obtaining black-and-white binary solutions. Meanwhile, I developed also other interests, for example in deep learning. Yet, independent of the task, in classification as well as in clustering, I think the most fascinating question is how we can make models learn semantically meaningful latent spaces. Imposing binary constraints can help us interpret the representations of models and reduces model size. If only their optimization weren't so difficult, I believe we could be much further in our development of trustworthy models that actually learn the relations that we want them to learn","cov":"5 of 5","pubs":[275,276,277,278,279],"sim":[1,73,136,20,146,99]},{"name":"Hilde J.P. Weerts","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Data Mining","leader":false,"kwRaw":"Responsible AI, fairness in ML (non-discriminatory aspects), Algorithmic interventions & the law","desc":"My work is guided by my mission to ensure AI is applied responsibly, particularly in applications where fundamental rights such as non-discrimination are at stake.\n\nWhile I'm a computer scientist by training, my research is highly interdisciplinary. I'm particularly interested in bridging the gap between algorithmic interventions and the law.\n\nI'm one of the maintainers of Fairlearn, an open-source, community-driven project that aims to help data scientists improve fairness of machine learning models","cov":"5 of 5","pubs":[280,281,282,283,284],"sim":[77,68,52,2,65,63]},{"name":"Hannah Pinson","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Data Mining","leader":false,"kwRaw":"Inductive biases, implicit regularization and generalization, interplay between dataset structure, neural network architecture and gradient descent, effective capacity of NNs.","desc":"I am interested in obtaining fundamental insights in deep learning. My current focus is on questions about inductive bias, implicit regularization and generalization, and I mainly study the interplay between dataset structure, neural network architecture and gradient descent.\n\nI also teach about the use and understanding of neural networks, and I supervise several research projects in AI\n\nThe remarkable success of deep neural networks often outpaces our theoretical understanding. In this talk, we will focus on how we can gain more insights in neural networks from studying their learning dynamics - the intricate trajectory of model parameters and representations during training. We will explore how the interplay between network architecture, optimization algorithms, and data structure shapes these dynamics. We will furthermore discuss how these insights can contribute to two big open questions in deep learning: first, how does the network architecture exactly influence how the data is processed by the network ('inductive bias')? We will specifically explain the fundamental difference in how (linear) convolutional and fully connected neural networks process data. Finally, we will discuss our ongoing work on the problem of 'effective' capacity of neural networks. It is known that the theoretical capacity of networks is reduced to an effective capacity during training, and we will show how studying the dynamics of learning can shed light on this important phenomenon as well","cov":"5 of 5","pubs":[285,286,287,288,289],"sim":[75,109,99,98,94,93]},{"name":"George H.L. Fletcher","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Database Group","leader":true,"kwRaw":"Social data science, data management, graph databases, query & schema langauges,","desc":"His main area of study is data systems, focusing on social aspects of data systems and the theoretical and engineering foundations of query and schema languages. He is currently investigating data systems education and the management of graph data such as social networks, knowledge graphs, biological networks, and communication networks.\n\nGraph databases take the relationship between data as priority\nAs of 2021, no graph query language has been universally adopted in the same way as SQL was for relational databases, and there are a wide variety of systems, many of which are tightly tied to one product.\n\nInterested (2024) in how people use Data, in the 'why' and perhaps 'how' of data-use in organizations (or elsewhere).","cov":"5 of 5","pubs":[290,291,292,293,294],"sim":[61,62,38,70,60,34]},{"name":"Daniele Bonetta","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Database Group","leader":false,"kwRaw":"Programming Languages, language VMs, programming models design, runtime optimization, performance engineering","desc":"I am an Assistant Professor in the Computer Science department at VU Amsterdam, where I am a member of the Computer Systems group in the At Large team. I am also a part-time Assistant Professor at TU Eindhoven, where I am affiliated with the Database systems group.\n\nBefore joining the VU, I was a Principal Researcher at the Virtual Machine Research Group at Oracle labs, and a member of the GraalVM team. While at Oracle, I was a delegate member of ECMA TC39.\n\nBroadly speaking, I work on Programming Languages and Systems. I am especially intererested in all interactions between language VMs, Serverless applications, and Data analytics workloads. I am interested in all aspects of such interactions, from programming models design to runtime optimization and performance engineering","cov":"5 of 5","pubs":[295,296,297,298,299],"sim":[62,59,121,47,61,70]},{"name":"Robert Brijder","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Database Group","leader":false,"kwRaw":"Databases for ML & other network-type data, graph databases, linear algebra query langauges","desc":"Databases for ML & other network-type data, graph databases, linear algebra query langauges","cov":"5 of 5","pubs":[300,301,302,303,304],"sim":[59,62,38,70,60,118]},{"name":"Nikolay Yakovets","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Database Group","leader":false,"kwRaw":"Core & high performance database technologies and data processing systems, knowledge graphs, and applications of GenAI to these.","desc":"Nikolay Yakovets is an Assistant Professor at the Department of Mathematics and Computer Science, Information Systems WSK&I at Eindhoven University of Technology (TU/e). His main area of stud is databases and data intensive systems. He is particularly interested in foundations of databases, efficient data analytics and engineering of high-performance data processing systems.\n\nNikolay's current focus is on design and implementation of core database technologies, management of massive graph data, and efficient processing of queries on graphs. His educational activities focus on data modeling and databases, data management for data analytics, database technology, data engineering, seminar databases and capita selecta databases.","cov":"5 of 5","pubs":[305,306,307,308,309],"sim":[59,61,70,60,34,38]},{"name":"Cassio P. de Campos","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Uncertainty in Artificial Intelligence","leader":true,"kwRaw":"Robust/reliable AI, efficient learning, graphical models (e.g. bayesian models), credal networks, imprecise probability, generative models, causality","desc":"'Main research interests are reliable machine learning and robust artificial intelligence, focused on theoretical and foundational developments for learning and reasoning with graphical models such as Bayesian networks, (hidden) Markov models, Markov random fields, influence diagrams, Markov decision processes, sum-product networks, and their use in applications. This includes proofs about the computational complexity of many tasks, devising new algorithms that (when created) were orders of magnitude faster than state-of-the-art methods, new mathematical results that may considerably reduce the time to learn graphical models from data, among other challenges. Credal networks, which are graphical models aimed at greater robustness/reliability of results, are of great importance. The work on them and on credal sum-product networks includes the development of the theoretical foundations, as well as some of the best performing algorithms for learning and reasoning'\n\nCredal set: (convex) set of probability distributions. When you don't want to pick only one probability distribution. I somehow understand how this relates to imprecise probability (well, perhaps that is obvious) but also to robustness of AI in that having a belief of 0.412 that it's going to rain tomorrow is like an unstable system.\n\n'It's not (only) about the result, it's about how we reached it'","cov":"5 of 5","pubs":[310,311,312,313,314],"sim":[66,64,67,50,20,57]},{"name":"Arthur Van Camp","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Uncertainty in Artificial Intelligence","leader":false,"kwRaw":"Probabilistic graphical models, choice functions, imprecise probabilies","desc":"Arthur's research revolves around cautious uncertainty representations, mainly by means of choice functions. He has experience with efficient inference algorithms in generalised graphical models and stochastic processes, and dreams of developing inference algorithms for graphical models with choice functions as local models.\n\n'Let X be a set of sets none of which are empty. Then a choice function (selector, selection) on X is a mathematical function f that is defined on X such that f is a mapping that assigns each element of X to one of its elements'\nThink: axiom of choice. Do I get this straight: he want to use choice functions for local models, in that from some 'conglomeration' in a graphical model (say some extended node) an element is chosen, and so for all nodes, so that a 'new' graphical model is generated with which to do your calculations further?","cov":"5 of 5","pubs":[315,316,317,318,319],"sim":[66,63,67]},{"name":"Devendra Singh Dhami","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Uncertainty in Artificial Intelligence","leader":false,"kwRaw":"Machine learning and causality, reasoning in ML, Neuro Symbolic AI","desc":"Devendra's research interests are multi-faceted and are currently centered on making machine learning models move beyond correlations towards causality and in the process develop novel methods and interconnect subfields to create systems that can not only learn, but also successfully incorporate reasoning with deep learning systems. His work has established intricate connections between causality and several research areas in machine learning such as large language models, explainable AI, probabilistic models, adversarial attacks and geometric deep learning. He is also interested in the intersection of causality and neuro-symbolic AI where the causal models inform neuro-symbolic models and vice versa in order to learn better systems.\n\nSo he seems to wants to move from correlation to causality based on 'reasoning' capabilities, perhaps framed in terms of neuro-symbolic AI.","cov":"5 of 5","pubs":[320,321,322,323,324],"sim":[57,68,63,151,34]},{"name":"Thomas Krak","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Uncertainty in Artificial Intelligence","leader":false,"kwRaw":"Cautious uncertainty representation, probabilistic graphical models (imprecise Markof chains, credal networks)","desc":"His research interests revolve around cautious uncertainty representations and efficient inference algorithms, with an emphasis on (generalized) probabilistic graphical models and stochastic processes.","cov":"5 of 5","pubs":[325,326,327,328,329],"sim":[64,63,67,50,51,132]},{"name":"Erik Quaeghebeur","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Uncertainty in Artificial Intelligence","leader":false,"kwRaw":"Surrogate models, (credal) probabilistic circuits, probabilistic uncertainty models","desc":"He has performed research on probabilistic uncertainty models (learning from data, generalizations, optimization, inference, elicitation) and wind energy systems (knowledge base creation, data analysis, surrogate modeling, probabilistic design, optimization, and uncertainty quantification).","cov":"5 of 5","pubs":[330,331,332,333,334],"sim":[66,99,63,64,94,75]},{"name":"Maryam Tavakol","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Uncertainty in Artificial Intelligence","leader":false,"kwRaw":"Reinforcement learning, fariness aware learning, counterfactual learning","desc":"Reinforcement learning, counterfactual learning, fairness aware learning.","cov":"5 of 5","pubs":[335,336,337,338,339],"sim":[53,57,149,65,146,77]},{"name":"Joaquin Vanschoren","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Automated Machine Learning","leader":true,"kwRaw":"Self-learning, self-assembling AI-systems (automated machine learning, machines building machines, \"AI in the loop\"), advanced ML-models, AI as open science","desc":"He and his team build AI systems that learn continually and assemble themselves to learn faster and better, much like the human brain. He founded OpenML, an open science platform for machine learning, started the NeurIPS Datasets and Benchmarks track to incentivize better training data and evaluations, and works with MLCommons on AI Safety, ML standards, and data-centric AI. He is always eager to collaborate with new people. Do reach out!","cov":"5 of 5","pubs":[340,341,342,343,344],"sim":[57,52,105]},{"name":"Odysseas Papapetrou","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Scalable Online Data Management","leader":true,"kwRaw":"Analysis of complex data streams/time series data; approximation algorithms, sketching and summarization, mulitvariate search.","desc":"Odysseas Papapetrou is Assistant Professor in the Information Systems group in the Department of Mathematics and Computer Science at Eindhoven University of Technology (TU/e). He is an experienced Big Data researcher, with expertise in real-time processing of streaming data and a specialty in approximation algorithms for distributed Big Data management, distributed data streams processing and sketching/summarization techniques. Papapetrou also focuses on aspects of cloud computing such as cloud federations, cloud-based stream processing and privacy-preserving query execution.\n\nHe is an experienced Big Data researcher, with expertise in real-time processing of streaming data and a specialty in approximation algorithms for distributed Big Data management, distributed data streams processing and sketching/summarization techniques. Papapetrou also focuses on aspects of cloud computing such as cloud federations, cloud-based stream processing and privacy-preserving query execution.\n\n'A key need in different disciplines is to perform analytics over fast-paced data streams, similar in nature to the traditional OLAP analytics in relational databases, i.e., with filters and aggregates. Storing unbounded streams, however, is not a realistic approach due to the high storage requirements, and the delays introduced when storing massive data. Accordingly, many synopses/sketches have been proposed that can summarize the stream in small memory (usually sufficiently small to be stored in RAM), such that aggregate queries can be efficiently approximated, without storing the full stream. However, past synopses predominantly focus on summarizing single-attribute streams, and cannot handle filters and constraints on arbitrary subsets of multiple attributes efficiently. We propose OmniSketch, the first sketch that scales to fast-paced and complex data streams (with many attributes), and supports count aggregates with filters on multiple attributes, dynamically chosen at query time'","cov":"5 of 5","pubs":[345,346,347,348,349],"sim":[62,1,59,34,61,55]},{"name":"V. Menkovski","domain":"Data Science","cluster":"Data and Artificial Intelligence","group":"Machine Learning for Physical Science","leader":true,"kwRaw":"Enhancing scientific simulation through ML-techniques","desc":"Enhancing scientific simulation through ML-techniques","cov":"5 of 5","pubs":[350,351,352,353,354],"sim":[22,26,21,52,143,73]},{"name":"Boudewijn F. van Dongen","domain":"Data Science","cluster":"Process Analytics","group":"Process Analytics","leader":true,"kwRaw":"Complience, process mining, privacy preserving analysis, conformance checking, business process management","desc":"Boudewijn van Dongen is a full Professor in computer science and chair of the Process Analytics group at Eindhoven University of Technology (TU/e). The research group distinguishes itself in the Information Systems discipline by its fundamental focus on modeling, understanding, analyzing, and improving processes. Boudewijn's research focuses on conformance checking: anything where observed behavior needs to be related to previously modeled behavior. Conformance checking is embedded in the larger contexts of Business Process Management and Process Mining.\n\nBoudewijn aims to develop techniques and tools to analyze databases and logs of large-scale information systems for the purpose of detecting, isolating, diagnosing and predicting misconformance in the business processes supported by these systems. The notion of alignments play a seminal role in conformance checking and the AIS group is world-leading in the definition of alignments for various types of observed behavior and for various modelling languages. Next to the theoretical foundations, he also develops the tools to actually measure conformance. These tools are typically implemented in Java in the open-source framework ProM.\n\nThe research in the our group continues to expand outward from a classical situation of data with clear case notions in the context of explicitly structured processes to a broad, multi-faceted field, where processes are less structured or consist of many interacting artifacts and where case notions in data become more fluid or are complex, multi-dimensional networks.","cov":"5 of 5","pubs":[355,356,357,358,359],"sim":[79,74,73,77,78,76]},{"name":"Marwan Hassani","domain":"Data Science","cluster":"Process Analytics","group":"Process Analytics","leader":false,"kwRaw":"Real time process mining, data stream mining, real time knowledge extraction, pattern detection in streams","desc":"Marwan Hassani is leading a small research group on streaming process mining within the Process Analytic cluster. Marwan focuses in his research on online knowledge extraction from streaming event data and its applications in stream process mining. Marwan's main interests are developing and applying unsupervised learning methods such as clustering, outlier detection and sequential pattern mining over streaming data. His main use case is optimizing customer journey and similar applications where scalable solutions are needed in an online manner and with limited availability of domain knowledge.\n\nUnsupervised online learning from event streams is essential for applications with limited domain knowledge and real time demands\n\n\nk","cov":"5 of 5","pubs":[360,361,362,363,364],"sim":[79,72,77,52,78,1]},{"name":"Renata Medeiros de Carvalho","domain":"Data Science","cluster":"Process Analytics","group":"Process Analytics","leader":false,"kwRaw":"Adaptive and declarative business processes and Business Process Management (BPM), hospital processes","desc":"Renata Medeiros de Carvalho is an Assistant Professor at Eindhoven University of Technology (TU/e). Her research interests are focused on, but not limited to, adaptive and declarative business processes and Business Process Management (BPM). She works in the domain of flexible business processes in particular, and how this can enrich business process models with domain-specific knowledge.\n\nBPM and BPM systems have only solved the 'easy problems': 1) business processes where a handful of contingencies handle all situations, and 2) processes where most of the activities can be automated. However, knowledge intensive processes do not lend themselves to such rigid formalizations: both the set of activities to perform, and the content of each activity, depend heavily on a combination of domain-specific knowledge, and the case at hand. Renata is interested in both pragmatic issues of modeling convenience and how flexibility is represented and/or can be detected through recorded data. She is currently conducting research into Object-Centric Behavioral Constraint (OCBC) modeling language, which combines ideas from declarative, constraint-based languages such as Declare, and from data/object modeling techniques (ER, UML, or ORM)","cov":"5 of 5","pubs":[365,366,367,368,369],"sim":[79,72,73,77,78,80]},{"name":"Wim P.M. Nuijten","domain":"Data Science","cluster":"Process Analytics","group":"Process Analytics","leader":false,"kwRaw":"Optimization and scheduling across complex industrial and sports domains, constraint programming, hybrid models, graph neural networks","desc":"Optimization and scheduling across complex industrial and sports domains, constraint programming, hybrid models, graph neural networks","cov":"5 of 5","pubs":[370,371,372,373,374],"sim":[58,136,137,99,114,55]},{"name":"Natalia Sidorova","domain":"Data Science","cluster":"Process Analytics","group":"Process Analytics","leader":false,"kwRaw":"Sensor data, mining and analysis, proces model, petri net","desc":"Sensor data, mining and analysis, proces model, petri net","cov":"5 of 5","pubs":[375,376,377,378,379],"sim":[78,72,73,52,48,12]},{"name":"Gyunam Park","domain":"Data Science","cluster":"Process Analytics","group":"Process Analytics","leader":false,"kwRaw":"Transparent process mining (both fairness and technical related), responsible machine learning methods","desc":"I'm Gyunam Park, an assistant professor at the Process Analytics Cluster in the Department of Mathematics and Computer Science at Eindhoven University of Technology. I also serve as an advisor at Fraunhofer FIT. I am deeply passionate about providing fair, compliant, and transparent solutions to process-related problems. My current research interests are two-fold: 1) designing process mining methods to provide full transparency over processes and support process stakeholders to characterize fatal process problems and 2) developing responsible machine learning methods to provide responsible solutions to such process problems. I received my Ph.D. in Computer Science from RWTH Aachen University, Germany, my M.S. in Industrial Engineering from POSTECH, South Korea, and my B.S. in Computer Science/Technology Management from UNIST, South Korea\n\nhttps://www.gyunam.com/","cov":"5 of 5","pubs":[380,381,382,383,384],"sim":[79,78,72,73,57,48]},{"name":"Dirk Fahland","domain":"Data Science","cluster":"Process Analytics","group":"Process Analytics on Multi-Dimensional Data","leader":true,"kwRaw":"Process Analytics on Multi-Dimensional Event Data, petri nets","desc":"Dirk is Associate Professor (UHD) in the PA group. He completed his PhD with summa cum laude at Humboldt-Univeristät zu Berlin and Eindhoven University of Technology in 2010. His research interests include distributed processes and systems built from distributed components for which he investigates modeling systems (using process modeling languages, Petri nets, or scenario-based techniques), analyzing systems for errors or misconformances (through verification or simulation), and process mining/specification mining techniques for discovering system models from event logs. He particularly focuses on distributed system with multi-instance characteristics and their synchronizing and interacting behaviors. Dirk published his research results in over 40 articles at international conferences and journals and implemented them in a number of software tools.","cov":"5 of 5","pubs":[385,386,387,388,389],"sim":[79,77,76,72,73,48]},{"name":"Francesca Zerbato","domain":"Data Science","cluster":"Process Analytics","group":"Process Analytics on Multi-Dimensional Data","leader":false,"kwRaw":"SSE-approach to process analytics, tools and artifacts for process analysts (that assist in the), sense-making of data.","desc":"Francesca Zerbato received her Ph.D. from the Department of Computer Science at the University of Verona (Italy). Her thesis focused on the modeling of temporal aspects and data in business process models under the supervision of Prof. Carlo Combi. After her Ph.D., she joined the Software Systems Programming and Development group of Prof. Dr. Barbara Weber at the University of St. Gallen (Switzerland) as a senior researcher. During her time in St. Gallen, Francesca mainly contributed to the research project 'ProMiSE: Process Mining Support for End-Users', funded by the Swiss National Science Foundation (SNSF) and running until the end of 2024. The main focus of the project is to understand the behavior of (process) analysts through the analysis of multimodal data and, based on the empirical findings, to develop methodological and software-based support for process analysts. She is currently an Assistant Professor at Eindhoven University of Technology - Data Science Domain - Process Analytics cluster. Francesca works under the supervision of Dirk Fahland and plans to continue her research on the design, development and evaluation of interactive tools and software artifacts that can support the real needs of human analysts when dealing with complex and knowledge-intensive tasks such as data sense-making.","cov":"5 of 5","pubs":[390,391,392,393,394],"sim":[72,74,77,78,73,80]},{"name":"Anna Vilanova","domain":"Data Science","cluster":"Visualisation","group":"Visual Analytics","leader":true,"kwRaw":"Medical imaging, visualisation of high dimensional and complex data.","desc":"She is leading a research group in the subject of visual analytics and multivalued image analysis and visualization, focusing on Visual Analytics for high dimensional data and explainable AI. She focuses on Biomedical applications such as: Diffusion Weighted Imaging, 4D Flow and Pangenomics.","cov":"5 of 5","pubs":[395,396,397,398,399],"sim":[82,88,81,86,87,84]},{"name":"Maxime Chamberland","domain":"Data Science","cluster":"Visualisation","group":"Visual Analytics","leader":false,"kwRaw":"Medical image analysis, neuroimaging, tractography, statistical visualisation","desc":"My research interests are driven by a passion to improve our understanding of the human brain by developing neuroimaging visualization & analysis methods. My main focus includes the development of software to navigate the brain's white matter architecture using diffusion MRI tractography. If you have any interests related to 3D Computer Graphics, Deep Learning, Anomaly Detection, Statistical Visualization and Medical Image Analysis in general, please get in touch!","cov":"5 of 5","pubs":[400,401,402,403,404],"sim":[80,113,111,112,83,85]},{"name":"Stef van den Elzen","domain":"Data Science","cluster":"Visualisation","group":"Visual Analytics","leader":false,"kwRaw":"Explainable AI, visual analytics for XAI, (dynamic) network visualisation.","desc":"Welcome! I am an Assistant Professor of Visual Analytics at the Eindhoven University of Technology working on Visual Analytics techniques for Networks, Events, and Explainable AI. For my PhD (cum laude) research, I developed visual analytics tools and techniques for the exploration of dynamic multivariate networks aimed at supporting both the data scientist and layman users. After and during my PhD I worked at SynerScope as VP engineering, leading the development team. I then spent time at Philips Research working on Artificial Intelligence solutions as product owner, leading a team of 15+ research scientists.\n\nMy research goal is to make visual analytics easier and available to a broader audience. Artificial Intelligence (AI) is here to stay and visual analytics enables it to enhance model trust, reduce bias and increase usability and transparancy\n\nI want to push the field of visual analytics forward, both in terms of application/concepts and theoretical foundations. If you are looking for a Master project in the area of visual analytics, explainable AI, (dynamic) network visualization, or a combination of these, please reach out to me!\n\nIn the vast landscape of visualization research, Dimensionality Reduction (DR) and graph analysis are two popular subfields, often essential to most visual data analytics setups. DR aims to create representations to support neighborhood and similarity analysis on complex, large datasets. Graph analysis focuses on identifying the salient topological properties and key actors within network data, with specialized research investigating how such features could be presented to users to ease the comprehension of the underlying structure. Although these two disciplines are typically regarded as disjoint subfields, we argue that both fields share strong similarities and synergies that can potentially benefit both'\n\nPuclications: The Transform-and-Perform framework: Explainable deep learning beyond classification","cov":"5 of 5","pubs":[405,406,407,408,409],"sim":[80,88,87,86,85,84]},{"name":"Andrei C. Jalba","domain":"Data Science","cluster":"Visualisation","group":"Visual Analytics","leader":false,"kwRaw":"(medical) image processing (in combination with) parallel computing (on GPU's)","desc":"Interested in topics such as point-cloud/shape/(medical) i
