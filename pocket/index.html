mage processing, high-performance/parallel computing (particularly on the GPU), modeling and simulation for graphics","cov":"5 of 5","pubs":[410,411,412,413,414],"sim":[81,80,109,113,51,111]},{"name":"Huub M.M. van de Wetering","domain":"Data Science","cluster":"Visualisation","group":"Visual Analytics","leader":false,"kwRaw":"Aplied visual analytics, genealogy visualizaton, spatial-temporal event visualization, e.g. related to sports","desc":"I am interested in creation of applications that help users to make sense of data using visual analytics; especially if this brings about the development of new information visualization and/or interaction techniques. Any application domain will do. My current interests include genealogy visualizaton, spatial-temporal event visualization, e.g. related to sports","cov":"5 of 5","pubs":[415,416,417,418,419],"sim":[37,88,80,86,82,6]},{"name":"Sarah Schöttler","domain":"Data Science","cluster":"Visualisation","group":"Visual Analytics","leader":false,"kwRaw":"Responsive visualisation, thematic mapping (map-making), geographic network visualisation","desc":"My research interests are in responsive (i.e., cross-device) visualization and thematic mapping. I am also open to projects on geographic network visualization. My research often combines prototyping interactive visualizations with qualitative user studies through interviews and workshops. If you are interested in these areas and would like to discuss potential projects (your own idea or a topic proposed by me), get in touch!","cov":"5 of 5","pubs":[420,421,422,423,424],"sim":[6,87,82,88,80,84]},{"name":"Fernando Paulovich","domain":"Data Science","cluster":"Visualisation","group":"Visual Analytics for Data Science","leader":true,"kwRaw":"Visual analytics/information visualisation 'for the people', (ML 4 Visual Anlytics) 4 knowelege generation from data","desc":"He has been researching information visualization and visual analytics, focusing on integrating machine learning and visualization tools and techniques, taking advantage of the automation provided by machine learning approaches, and user knowledge through interactions with visual representations to help people understand and take advantage of complex and massive data collections. In the past years, his primary focus has been on designing and developing visual analytics techniques for the general public to advance the concept of data democratization, promoting unconstrained access to data analysis and widening the analytic capability of lay users in transforming data into insights.\n\nIf you are interested in researching how humans can cooperate with machines to generate knowledge, do not hesitate to contact me!","cov":"5 of 5","pubs":[425,426,427,428,429],"sim":[88,80,82,87,6,84]},{"name":"Alessio Arleo","domain":"Data Science","cluster":"Visualisation","group":"Visual Analytics for Data Science","leader":false,"kwRaw":"Dynamic network visualisation, information diffusion, graph algorithms, information visualisation","desc":"I am currently working on topics closely related to dynamic network visualization, information diffusion, and visual analytics. If the intricacies of graph algorithms on continuous time and their applications on understanding complex diffusion phenomena (malware diffusion, pathogen spread, fake news proliferations) fascinate you, we can discuss projects and collaborations. I'm also active information visualization and viz. for process mining","cov":"5 of 5","pubs":[430,431,432,433,434],"sim":[88,82,85,86,80,6]},{"name":"Jack J. van Wijk","domain":"Data Science","cluster":"Visualisation","group":"Visualization","leader":true,"kwRaw":"Information visualisation, visual analytics,  XAI,  hierarchical data, network visualisation","desc":"'For serious research, check the work of our PhD students. For more information on my own work, see below'\n\n'The main challenge is to understand needs, strengths, and limitations of people, in such a way that we can develop powerful methods to support them in their exploration of large and complex data sets. Data science is about people, not about data'\n\nJack van Wijk is full professor in visualization at the Department of Mathematics and Computer Science of Eindhoven University of Technology (TU/e). His current research interests are information visualization and visual analytics. Previously he worked on flow visualization and mathematical visualization. The challenges are enabling people to explore and understand large amounts of abstract data (information visualization) and integrating methods and techniques from statistics, machine learning, and data mining to deal with even larger data sets (visual analytics).\n\nVan Wijk's work spans many aspects of visualization - representation, interaction, evaluation, and methodology - for a wide variety of applications and data types. He is known for his work on hierarchical data and network visualization. With his students, he has developed new techniques for treemaps, exploring large image collections, event data, vessel traffic, and medicine prescriptions. His current focus is on visually explaining the results of automated methods. Useful results have been obtained for dealing with decision trees and models for judging vessel behavior, the next aim is to develop more generic methods.","cov":"5 of 5","pubs":[435,436,437,438,439],"sim":[87,82,86,80,6,85]},{"name":"Karen Veroy-Grepl","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Science (numerical methods)","leader":true,"kwRaw":"Numerical methods for PDEs, Reduced order(basis) modeling, optimized control (minimizing cost function over system trajectories), data assimilation","desc":"Karen Veroy-Grepl is a Full Professor of Computational Science in the Centre for Analysis, Scientific Computing and Applications (CASA) at the Department of Mathematics and Computer Science, Eindhoven University of Technology (TU/e). Key areas of expertise include numerical methods for partial differential equations, model order reduction, and uncertainty quantification. Her current research focuses on the development of reduced order modelling techniques for multi-scale simulations in mechanics and on data assimilation and optimal experimental design.","cov":"5 of 5","pubs":[440,441,442,443,444],"sim":[91,102,94,114,100,93]},{"name":"Kerstin Lux-Gottschalk","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Science (numerical methods)","leader":false,"kwRaw":"Uncertainty quantification (of bifurcations) in random ODEs, tipping points in complex models (climate science/epidemiology/ecology)","desc":"Essentialy all models are wrong. Some though, are useful\n\nShe is a broadly based applied mathematician who draws a lot of motivation from real-world applications and challenges that society is facing. Her research lies at the interface of uncertainty quantification, differential equations (in particular numerical methods for stochastic differential equations), and optimal control. In particular, she works on uncertainty quantification of bifurcations in random ordinary differential equations. The aim is to contribute to a risk assessment of tipping points (critical transitions) in complex mathematical models from climate science, epidemiology, and ecology.","cov":"5 of 5","pubs":[445,446,447,448,449],"sim":[107,114,103,99,94,111]},{"name":"Jemima Tabeart","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Science (numerical methods)","leader":false,"kwRaw":"Large scale numerical linear algebra (in combination with), data assimilation","desc":"I am an Assistant Professor in the Computational Science group within the Centre for Analysis, Scientific Computing and Applications at TU Eindhoven. My research interests include large scale numerical linear algebra (theory and applications), data assimilation, and treatment of covariance matrices. Alongside my research I'm interested in outreach and scientific crafting. Contact me at j[.]m[.]tabeart[at]tue[.]nl and find out more about the Computational Science group here. I don't currently have funding for PhD students, but I have openings to supervise Bachelor and Master Final Projects - some of the topics I am offering can be found here\n\nHer research interests lies at the intersection of numerical linear algebra and data assimilation for applications. This work spans the very applied (working with industrial partners at the Met Office and Cerfacs) to the more theoretical (designing preconditioners for saddle point systems arising from applications).","cov":"5 of 5","pubs":[450,451,452,453,454],"sim":[89,92,118,102,61,13]},{"name":"Michiel E. Hochstenbach","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Science (numerical methods)","leader":false,"kwRaw":"Numerical linear algebra, ill-posed and inverse problems, numerical analysis, scientific computing, numerical algorithms.","desc":"His research interests include numerical linear algebra, ill-posed and inverse problems, numerical analysis, scientific computing, and numerical algorithms and software. Michiel has been awarded an NSF grant in the US (2004-2007) as well as an NWO Vidi research grant in The Netherlands (2012-2017). He received several best paper awards, and is member of the editor board of various journals. He is advisor or co-advisor of several PhD students, who have won best paper awards themselves.","cov":"5 of 5","pubs":[455,456,457,458,459],"sim":[91,93,100,96,114,118]},{"name":"Victorita Dolean-Maini","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"High-Performance Scientific Computing","leader":true,"kwRaw":"Simulation of complex/mulitiscale systems, wave propegation problems, SciML, PINNs, surrogate models & HPC (hybrid computing), neural operators","desc":"Victorita Dolean-Maini works on the design of fast algorithms for the simulation of complex systems of PDEs with a focus in the latest years on wave propagation problems. Together with her collaborators, she was the recipient of Bull-Joseph Fourier Prize, delivered by Atos-Bull, for her innovative work on real time simulation of strokes using HPC (SIAM News, 2016). She co-authored a reference work on Domain decomposition methods (published by SIAM in 2015). She's a member of the editorial board of SIAM Journal on Scientific Computing and of the Scientific Committee of International Conferences on Domain decomposition methods. As a general rule, in addition to applications of mathematics in a broad sense, she works on many intra/interdisciplinary projects and is involved industrial collaborations which are thriving in the TU/e environment. Her current focus are the development of new projects in the emerging field of Scientific Machine Learning.\n\nComputers are incredibly fast, accurate, and stupid. Human beings are incredibly slow, inaccurate, and brilliant. Together they are powerful beyond imagination'\n\nI work on the more applied side of numerical analysis, meaning scientific computing. It consists in the applications of numerical analysis methods to the solving of problems modelled by PDEs, where the algorithmic and applicative part play an important role. What I like in that is the interdisciplinarity and the 'problem solving' part going from the mathematical abstraction to the final interpretation, say in a realistic framework\n\nThere is a whole race on publishing, getting grants and getting visible far more than enjoying sharing and exchanging scientific ideas","cov":"5 of 5","pubs":[460,461,462,463,464],"sim":[100,94,89,107,109,92]},{"name":"Benjamin Sanderse","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"High-Performance Scientific Computing","leader":false,"kwRaw":"Numerical methods for uncertainty quantification in real world systems, SciML, fluid dynamics, structure preserving ROMs & NNs, closure modelling.","desc":"I have extensive experience in (computational) fluid dynamics, differential equations, and uncertainty quantification from working in academia, at research institutes and in industry. My current interest lies in the smart integration of data with physical models, through development of techniques such as reduced order models, Bayesian calibration, (neural) closure models, and scientific machine learning algorithms\n\nHis work focuses on development of numerical methods for uncertainty quantification, for tackling closure problems, for constructing reduced order models, with the overarching theme of using structure-preserving techniques and applying them to solve complex partial differential equations, for example occurring in fluid flow problems. Prior to his tenure track position, he worked at Shell Technology Centre Amsterdam on research and development of multiphase flow simulators in oil and gas applications.\n\nMy research interest is to develop efficient methods for making predictions under uncertainty of physical systems by developing new methodologies that combine physical modelling approaches and data-driven techniques, in particular to applications involving fluid dynamic problems\n\n\nCurrently the following topics have my main interest:\n\nReduced order models: development of structure-preserving methods that have enhanced stability and accuracy.\nStructure-preserving neural networks and machine learning.\nClosure modeling for multiscale problems, such as in turbulence.\nUncertainty quantification: surrogate modelling for parametric PDEs, efficient solvers for Bayesian inverse problems, statistical learning for closure models, novel quadrature rules.\nComputational fluid dynamics (CFD): time integration methods for differential-algebraic equations arising from fluid dynamic problems, such as incompressible single-phase and multi-phase Navier-Stokes equations; structure-preserving discretization methods.\nApplications: Wind energy and in particular turbulent wind turbine wakes. Multi-phase flow such as CO2 transport in pipelines and reservoirs. Sloshing of liquids in tankers (SLING project)","cov":"5 of 5","pubs":[465,466,467,468,469],"sim":[95,93,89,99,96,100]},{"name":"Arris S. Tijsseling","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"High-Performance Scientific Computing","leader":false,"kwRaw":"Hydrodynamics, (computational) fluid dynamics, pipe systems, fluid-structure interaction, hydraulics","desc":"Hydrodynamics, (computational) fluid dynamics, pipe systems, fluid-structure interaction, hydraulics","cov":"5 of 5","pubs":[470,471,472,473,474],"sim":[94,96,97,99,103,93]},{"name":"Jan H.M. ten Thije Boonkkamp","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Illumination Optics","leader":true,"kwRaw":"Computational illumination optics, flux approximations schemes for conservations laws, fluid dynamics, combustion theory, plasma physics, semiconductor simulation","desc":"* Numerical analysis - numerical methods for partial differential equations, finite volume methods for conservation laws, complete flux schemes, hyperbolic systems, time integration methods, Monge-Ampère equation, ray tracing\n\n* Applied sciences: computational fluid dynamics, combustion theory, plasma physics, semiconductor simulation, computational illumination optics\n\nJan operates two main research lines\n\n* Develop mathematical models for illumination optics, both analytical and numerical. An optical system is formulated as an optimal transport problem, subject to energy conservation. This approach allows us to derive a nonlinear PDE defining one of the optical surfaces. Efficient numerical solution methods for this equation are developed.\n\n* Develop novel flux approximation schemes for conservation laws.\n\nBasic idea is to compute the numerical flux from a local boundary value problem. The resulting numerical solution features properties of the exact solution\n\nIf you look carefully, you can see PDEs everywhere'","cov":"5 of 5","pubs":[475,476,477,478,479],"sim":[98,97,100,94,99,95]},{"name":"Martijn Anthonissen","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Illumination Optics","leader":false,"kwRaw":"Inverse methods for freeform optical design, imaging optics, combustion, anisotropic turbulence, laser surface remelting, wafer positioning, wind-farm aerodynamics.","desc":"The industry standard is to design an optical system, use ray tracing to test it, change the design, ray trace and so on. This is quite a slow process.\n\nOur group develops inverse methods that directly compute the required optical system. Our methods are based on advanced physical models describing the interaction of light with lenses and reflectors. The ultimate goal is to develop advanced simulation tools that can be used for virtual prototyping.\n\nBefore joining the optics group, Martijn has worked on many applications, such as combustion, glass sintering, transport of tracers in anisotropic turbulence, film cooling, laser surface remelting, wafer positioning, lens deformation, cathodic protection for ships and wind-farm aerodynamics.\n\nTheory and experiments have driven science forward for centuries. The explosion of computational power gives us a new way to increase our knowledge through numerical simulations. This is an exciting era of scientific computing!","cov":"5 of 5","pubs":[480,481,482,483,484],"sim":[98,96,99,95,100,94]},{"name":"Wilbert L. IJzerman","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Illumination Optics","leader":false,"kwRaw":"Inverse methods for freeform optical design (for complex, industry relevant systems), radically improved optical simulation tools.","desc":"Wilbert IJzerman is a Full Professor and Chair of Illumination Optics at Eindhoven University of Technology (TU/e). The TU/e Scientific Computing and Applications team (CASA), which he leads with dr.ir. Jan ten Thije Boonkkamp. They work on the mathematical-physical description and numerical simulation of illumination systems related to:\n\n- The inverse optical problem. In the optical forward problem, the target distribution is calculated by ray tracing. In the inverse problem, the shape of the optical components is calculated directly given the source and target distribution. CASA aims to solve the inverse optical problem for more complex (industry-relevant) optical configurations that consist of more than one or two optical surfaces. In addition, CASA would like to find other solutions than current convex and concave solutions and to integrate the inverse approach with scattering surfaces.\n\n- Improved optical simulation tools. A method based on Hamiltonian optics using the Liouville equation has significant speed advantages and will be developed further in the TTW Perspective Program 'Free-Shape Scattering Optics'. CASA will extend the developed method to 3D and prove the applicability to practical problems.","cov":"5 of 5","pubs":[485,486,487,488,489],"sim":[96,97,99,100,58]},{"name":"Lisa Kusch","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Illumination Optics","leader":false,"kwRaw":"NN for solutions to Monge-Ampere equation, Uncertainty in design, robustness of design, multi-obiective optimization of design (in fluid dynamics)","desc":"Multi-Objective Optimization\nUncertainty Quantification\nRobust Design\nOne-Shot Methods\n\nA significant step to engineering design is to take into account uncertainties and to develop optimal designs that are robust with respect to perturbations. Furthermore, when multiple optimization objectives are involved it is important to define suitable descriptions for robustness. We introduce robustness measures for robust design with multiple objectives that are suitable for considering the effect of uncertainties in objective space. A direct formulation and a two-phase formulation based on expected losses in objective space are presented for finding robust optimal solutions. We apply both formulations to the robust design of an airfoil. Fluid mechanical quantities are optimized under the consideration of aleatory uncertainties. The uncertainties are propagated with the help of the non-intrusive polynomial chaos approach. The resulting multi-objective optimization problem is solved with a constraint-based approach, that combines adjoint-based optimization methods and evolutionary methods evaluated on surrogate models","cov":"5 of 5","pubs":[490,491,492,493,494],"sim":[94,67,96,97,98,114]},{"name":"Koondanibha Mitra","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Illumination Optics","leader":false,"kwRaw":"Applied analysis (well-posedness), numerical analysis (domain decomposition schemes), scientific computing (ODE solvers), modelling, asymptotic analysis and upscaling","desc":"Applied analysis: Nonlinear degenerate PDEs, well-posedness, Rothe's method, free boundaries.\n\nNumerical analysis: Iterative methods, a-posteriori error estimates, domain decomposition schemes, spatial discretizations including finite differences, elements, volumes.\n\nScientific computing: Adaptivity, data-driven simulations, post-processing and visualization, parallelization, ODE solvers, meshing, linear solvers.\n\nModelling: Multiphase flow in porous medium, particularly, hysteresis and dynamic effects; mathematical biology, in particular, biofilm growth; Illumination optics.\n\nSpecial solutions: Travelling waves, similarity solutions, entropy solutions, Riemann problems.\n\nAsymptotic analysis and upscaling: Homogenization, stability analysis, phase-fields.\n\nI am fascinated by how partial differential equations can explain the world around us\n\nDavid Hilbert:\nFor us there is no ignorabimus, and in my opinion none whatever in natural science.\nIn opposition to the foolish ignorabimus our slogan shall be:\n\n'We must know - we will know'","cov":"5 of 5","pubs":[495,496,497,498,499],"sim":[93,96,106,107,89,94]},{"name":"Björn Baumeier","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Quantum & Molecular Dynamics","leader":true,"kwRaw":"Multiscale simulation of complex molecular materials, moddeling electronic processes in soft matter, computational chemistry, statistical physics, opto-electronic devices","desc":"I earned my Diploma (2005) and PhD (2009) in Physics from the Westfälische Wilhelms-Universität Münster (Germany), focusing on self-interaction corrections to density-functional theory in Johannes Pollmann's group at the Institute of Solid State Theory. A postdoctoral fellowship from the German Academic Exchange Service allowed me to work with Alexei Maradudin at University of California Irvine (USA) on optical interactions and scattering at nonideal surfaces. I then joined the Polymer Theory group of Kurt Kremer at the Max Planck Institute for Polymer Research in Mainz (Germany) to work on multiscale simulations in soft matter. After six years, first as a research associate and later as project leader 'Computational Chemistry', I moved to starts as Assistant Professor at Eindhoven University of Technology in September 2015. In 2020, I was promoted to Associate Professor.\n\nThe research activity in my group is devoted to the development and application of multiscale simulation techniques for the study of electronic transport processes in soft matter. Our models combine techniques from computational chemistry, statistical physics, and mathematics and will allow for the analysis of the interplay between molecular electronic structure and material morphology, relevant for many opto-electronic device properties or bio-molecular processes.\n\nI believe that my role as a teacher is not only to pass on information to my students. It is more difficult, both for the teacher and for the student, to also teach them how to think. In evolving fields such as physics, chemistry, or materials science, factual knowledge changes rapidly but the ability to reason is what allows us to master these changes","cov":"5 of 5","pubs":[500,501,502,503,504],"sim":[132,130]},{"name":"Joseph M.L. Maubach","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Computational Quantum & Molecular Dynamics","leader":false,"kwRaw":"Computational Science and Engineering, factorization, electron microsopy, model order reduction","desc":"Jos Maubach is an assistant professor with the Centre for Analysis, Scientific Computing, and Applications (CASA) which combines all activities related to analysis at the department of Mathematics and Computer Science. Its major research objective is to develop new and improve existing mathematical (both analytical and numerical) methods for a wide range of applications in science and engineering. This area of research is commonly known as Computational Science and Engineering (IAM-CSE).","cov":"5 of 5","pubs":[505,506,507,508,509],"sim":[89,91]},{"name":"Mark A. Peletier","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Applied Analysis","leader":true,"kwRaw":"Variational calculus, gradient flows, interplay analysis and stochastics, pattern formation and evolution. Biology, geology, chemistry, solid mechanics, fluid dynamics","desc":"Research interests:\nVariational calculus, gradient flows\nConnections between analysis and stochastics\nThe link between large deviations and gradient flows\nPattern formation and pattern evolution\n\nHis research interest focuses on differential equations and their applications to real-world systems. His work spans the spectrum from applied to fundamental, with mathematical contributions to biology, geology, chemistry, pattern formation, solid mechanics, fluid dynamics, and contributions to the theory of variational calculus and differential equations.","cov":"5 of 5","pubs":[510,511,512,513,514],"sim":[114,107,104,90,94,95]},{"name":"Annika Bach","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Applied Analysis","leader":false,"kwRaw":"Multi-scale variational problems (appl. in computer vision or materials science), free-discontinuity problems, stochastic homogenization, discrete-to-continuous problems.","desc":"Her research area is the Calculus of Variations and in particular the asymptotic analysis of multi-scale variational problems with applications in computer vision or materials science. In this framework she is working on phase-field models for free-discontinuity problems, stochastic homogenization, and on the passage from discrete to continuum problems for example in the context of dislocation models or nematic liquid crystals.\n\nSpecialized in the Calculus of Variations and in particular the asymptotic analysis of multi-scale variational problems with applications in computer vision or materials science","cov":"5 of 5","pubs":[515,516,517,518,519],"sim":[103,114,132]},{"name":"Jim W. Portegies","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Applied Analysis","leader":false,"kwRaw":"Apply differential geometry and measure theory in the construction of ML/AI systems, learning theory, simple universal task- and signal-independent learning algorithms","desc":"Jim Portegies works in the mathematical fields of analysis, measure theory and geometry, and applies techniques from these fields to problems in machine-learning and artificial intelligence. He has applied techniques from spectral geometry to prove guarantees on performance of nonlinear dimensionality reduction algorithms. Currently, he is investigating how to design algorithms that mimic how humans and animals learn. Despite the large number of recent advances in artificial intelligence, humans still outperform machines in many tasks. The central question of how to design machines that learn like humans is still wide open. The answer may lie in universal learning algorithms. Such algorithms are simple, efficient and can be applied to a broad variety of signals and tasks and are conjectured to exist in the depths of the human brain.\n\nConjecturally, in the depths of the human brain runs an immensely powerful, simple, efficient and task- and signal-independent learning algorithm. It is my ultimate aim to use mathematics to uncover and develop such algorithms'\n\nCurrently, I am an assistant professor at the Eindhoven University of Technology. I work in the analysis of PDE, differential geometry and geometric measure theory","cov":"5 of 5","pubs":[520,521,522,523,524],"sim":[109,113,111,117,94,1]},{"name":"Georg Prokert","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Applied Analysis","leader":false,"kwRaw":"Applied functional analysis, nonlinear evolution equations, free and moving boundary problems. Appl.: continuum mechanics, mathematical biology, elektrodynamics.","desc":"His research is in the area of applied functional analysis, or more precisely, the application of methods from functional analysis to nonlinear evolution equations arising from free and moving boundary problems. Such problems originate, for example, from continuum mechanics, mathematical biology, or electrodynamics. The results obtained typically concern well-posedness of these problems and qualitative properties of the solutions, as well as limit behavior for small parameters. This contributes to the theoretical understanding of the underlying problems, both in mathematical and in modeling terms, and can provide useful preliminary information for numerical simulations.\n\nI am fascinated by how the same abstract mathematical techniques can be used successfully to describe and understand the most diverse phenomena in nature, technology, and society","cov":"5 of 5","pubs":[525,526,527,528,529],"sim":[100,96,114,107,109,93]},{"name":"Rafael Bailo","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Applied Analysis","leader":false,"kwRaw":"Numerical analysis of kinetic equations and other PDEs, collective dynamics, self-organisation, control of agent-based models","desc":"I'm an assistant professor of mathematics in the Centre for Analysis, Scientific Computing and Applications at TU/e (Eindhoven University of Technology). My work deals with the numerical analysis of kinetic equations and other partial differential equations (PDEs). I'm also interested in collective dynamics, self-organisation, and the control of agent-based models","cov":"5 of 5","pubs":[530,531,532,533,534],"sim":[114,90,103,100,93,109]},{"name":"J.J.M. (Han) Slot","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Applied Analysis","leader":false,"kwRaw":"Step-Growth Polymerized Systems, rheology,","desc":"No info","cov":"5 of 5","pubs":[535,536,537,538,539],"sim":[]},{"name":"Remco Duits","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Geometric Learning & Differential Geometry","leader":true,"kwRaw":"Mathematical/medical image analysis, geometric deep learning, orientation scores, equivariant nn.","desc":"Many mathematical research challenges arise in geometric PDE-based image processing and deep learning on homogeneous spaces. The combination of advanced geometric analysis and scientific computing gives the Geometric Learning and Differential Geometry group a central position in CASA.\n\nWe invent, apply and analyse new theory and methods in geometric AI for automated medical & industrial image analysis.\n\nWe build the bridge between convolution neural networks and differential geometrical PDEs\nwhere deep learning automates learning the geometry, and where geometry allows to design, reduce and understand networks.\n\nOur PDE-based neural networks have impact, as they:\n\n1) open the black-box of deep learning via geometric interpretation via training\nneuro-geometrical association fields of cortical human vision.\n\n2) perform better with both less network complexity and less training data.\n\nThis is valorized in many applications, for instance with the ophthalmology department at Maastricht University, where we achieved strongly improved automatic\ntracking of complete vascular trees.\n\nWe also explore many other industrial image analysis applications with ASML (joint master projects), Philips IGTS (joint publications), and ProRail and Rijkswaterstaat\n\n\n\n\n\nI am a Mathematician. I develop new mathematical theory and algorithms to tackle image analysis applications.\n\nMain Expertises:\n\nDifferential Geometry, Harmonic Analysis, Probability Theory,\n\nNumerical Analysis, Functional Analysis, Machine Learning & PDEs on Lie Groups, Mathematical Image Analysis & Medical Image Analysis","cov":"5 of 5","pubs":[540,541,542,543,544],"sim":[105,83,111,58,115,93]},{"name":"Maxim Pisarenco","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Geometric Learning & Differential Geometry","leader":false,"kwRaw":"Advanced optimization, model discovery, information extraction from SEM-images","desc":"My name is Maxim Pisarenco, and I (re)joined CASA in May as a part-time Associate Professor (one day per week). I'm excited about this opportunity, which I see as a chance to strengthen the connection between TU/e and ASML.\n\nAt ASML Research, we focus on integrating noisy data and physical laws-including models with incomplete physics-into unified frameworks. In cases where the underlying physics is not well understood, we aim to discover it. This places our work at the intersection of partial differential equations, advanced optimization, and machine learning. Currently, I lead research on model discovery and information extraction from scanning electron microscope (SEM) images.\n\nOriginally from Moldova, I moved to the Netherlands in 2006 to pursue a Master's degree here at CASA. That was followed by a PhD at both CASA and ASML. Since 2011, I've been working full-time at ASML Research. In these 14 years I worked on various topics ranging from numerical solution of Maxwell's equations and preconditioning to inverse problems, machine learning, and hybrid modeling","cov":"5 of 5","pubs":[545,546,547,548,549],"sim":[113,111,93,99,105,94]},{"name":"Luc M.J. Florack","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Applied Differential Geometry","leader":true,"kwRaw":"Multiscale differential geometric representations of complex imaging data, diffusion/tagging MRI, geodesic tractography, connectomics, deformation/strain analysis","desc":"Luc Florack is full professor in the Applied Differential Geometry (ADG) group of the Department of Mathematics and Computer Science at Eindhoven University of Technology (TU/e). His key research interests are multiscale and differential geometric representations of complex imaging data. The application focus is on magnetic resonance imaging (MRI) techniques, notably diffusion and tagging MRI, and on biologically motivated models of 'early vision'. The approach in all these cases is to depart from a geometrical representation and reformulation of clinical image analysis challenges, such as geodesic tractography for mapping structural brain connectivity (connectomics) and deformation and strain analysis for quantification of myocardial function. The motivation is to bring these hitherto unexploited techniques into the clinical workflow.\n\nTuition revolves around mathematical techniques for image analysis, tensor calculus, differential geometry, and linear partial differential equations.\n\n\nNeuro geometry Details: Diffusion weighted imaging (DWI) is a magnetic resonance imaging modality capable of producing scalar images on a six-dimensional '(x,q)'-domain. Three of the independent variables refer to position ('x') and three to a machine-controllable diffusion gradient magnetic field in the scanner ('q'). The signal S(x,q) acquired with the help of a suitable diffusion sensitisation protocol can be related to a probability density function P(x,y) for the y-displacement of diffusing (water-bound) hydrogen spins at each position x in the brain, aka the 'ensemble average propagator'. These high-dimensional images provide a rich source of information about the brain, which can be seen as a porous medium affecting the local diffusivity of water molecules. However, we must then solve the notoriously hard inverse problem to extract quantitative and/or visually meaningful information about the brain's neural architecture from these complex diffusion data. Our point of departure is to try and relate the physical signals S(x,q) and P(x,y) to mutually conjugate representations of scalar fields that naturally live on the so-called slit-tangent bundle in a Finsler geometric framework, and to exploit the machinery of Finsler geometry for solving the inverse problem. This endeavour is part of the 21st century grand challenge to unravel the human brain, coined 'connectomics', which has drawn massive attention worldwide, boosted by the advent of DWI. We are particularly interested in turning scientific results into instruments for improving the neurosurgical workflow.\n\nCardiovascular geometry: Details: Having a healthy cardiovascular system is vital to our health and well-being. A proper assessment of the circulatory system from a medical scan is not merely a matter of depicting arteries and veins, but requires a topologically correct mapping of full vessel trees. Data noise and vessel crossings and bifurcations often lead to confusion due to ambiguities or missing pieces of information. To properly deal with these issues we consider 'liftings' of spatial data into higher-dimensional homogeneous spaces, a trick of the trade from differential geometry that allows one to pry apart position and orientation. After lifting, empirical data are more sparsely distributed over a higher x0002 dimensional domain, but, in a precise sense, still carry exactly the same information. Subject to geometric partial (linear, morphological) differential equations of parabolic type, the higher-dimensional images can be processed so as to enhance, complete, and delineate the line-like structures of interest, with much less chance of confusion as compared to traditional 'direct' routes. After processing, the lifted data can be back-projected into 3-space for human inspection. We furthermore propose 'geometric deep learning' as a natural augmentation to learn from extrinsic expert annotations, thus complementing the data intrinsic analysis sketched above.\n\nSpace time geometry: Details: In order to accommodate unexplained spacetime and gravitational phenomena observed at galactic and cosmological scales, we need to extend our purview of Einstein's relativity theory beyond its classical reach. Finsler geometry is a canonical extension of Riemannian geometry, aptly paraphrased as 'Riemannian geometry without the quadratic restriction'. Since the classical theory is formulated in the language of (pseudo-)Riemannian geometry, a promising avenue is to view it as some (as yet poorly understood) limiting case of a more comprehensive (pseudo-)Finslerian framework. But, without any guiding principles, the latter brings in infinitely many new degrees of freedom, begging the question of how to apply Ockham's razor in order to 'make things as simple as possible, but not simpler' in the light of new physical phenomena to be accounted for. Our approach to figure this out is to venture upon a heuristic program with a modest amount of foresight, stipulating a priori geometric constraints, and then investigating the pros and cons implied by these. Intriguing results have been obtained.","cov":"5 of 5","pubs":[550,551,552,553,554],"sim":[113,81,112,105,109,110]},{"name":"Geert-Jan Rutten","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Applied Differential Geometry","leader":false,"kwRaw":"Structure-function relationship in the human brain, cognition & well-being in brain tumor patients, advanced MRI techniques for mapping brain connectivity.","desc":"Geert-Jan Rutten is full professor of Computational Neurosurgery in the Department of Mathematics and Computer Science. His research focuses on the structure-function relationship in the human brain, a question that has fascinated him since his early background in physics. As a neurosurgeon, he has built a research program at Elisabeth-TweeSteden Hospital over the past 15 years with two central lines: cognition & well-being in brain tumor patients, and advanced MRI techniques for mapping brain connectivity. Together with TU Eindhoven and Tilburg University, these projects have developed into a strong interdisciplinary infrastructure. By combining cognitive neuroscience, medical imaging, mathematics, and computer science, his research seeks to better understand how brain networks are altered by tumors and surgery, and how this translates into cognitive outcomes and quality of life. His ambition is to further strengthen this bridge between clinic and technology, fostering collaborations that are both scientifically innovative and clinically meaningful.","cov":"5 of 5","pubs":[555,556,557,558,559],"sim":[111,81,113,83,80]},{"name":"Andrea Fuster","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":null,"leader":true,"kwRaw":"Mathematical image analysis and theoretical physics, differential geometry in the context of general relativity and diffusion MRI","desc":"Andrea Fuster is an Assistant Professor within the Mathematical Image Analysis group at the Department of Mathematics and Computer Science at Eindhoven University of Technology (TU/e). Her areas of expertise include mathematical image analysis and theoretical physics. In particular, she focuses on differential geometry in the context of diffusion MRI and (extensions of) general relativity. Her research has a highly interdisciplinary character, combining elements from physics, mathematics and medical imaging.\n\nThe importance of role models: You cannot become what you don't see","cov":"5 of 5","pubs":[560,561,562,563,564],"sim":[111,81,105,112,131,110]},{"name":"Oliver Tse","domain":"Mathematics","cluster":"Center for Analysis, Scientific Computing and Applications","group":"Calculus of Variations and Optimal Control","leader":true,"kwRaw":"Modeling and simulation, optimization, nonlinear dynamics, stability analysis, parameter estimation and optimal control, quantum computing.","desc":"Oliver Tse is an Associate Professor leading the Calculus of Variations and Optimal Control group of the Centre for Analysis, Scientific Computing and Applications (CASA) at Eindhoven University of Technology (TU/e). Oliver's areas of expertise include modeling and simulation, numerical simulation, optimization, mathematical modeling, nonlinear dynamics, stability analysis, parameter estimation and optimal control.\n\nHis research topics have included\n\nAnalysis of nonlinear diffusion systems and multiscale analysis of variational evolutions\n\nKinetic equations: qualitative properties, multiscale modelling and numerical simulation\n\nOptimal control with PDEs: analysis of adjoint-based methods\n\nInteracting particle systems: consensus-based methods in global optimization, disease and population dynamics, large deviations\n\nVariational methods and algorithms in quantum computing\n\nOliver is interested in anything and everything that helps him understand the origin and intricate behavior of nonlinear and nonlocal Partial Differential Equations (PDEs). His current interest lies in the connections between optimal transport, (generalized) gradient flows, and large deviations, and in probabilistic methods for studying PDEs, with an eye toward applications. He hopes to develop new analytical tools by unveiling or establishing these connections.\n\nMathematics knows no races or geographic boundaries; for mathematics, the cultural world is one country' David Hilbert (1862-1943)","cov":"5 of 5","pubs":[565,566,567,568,569],"sim":[107,103,90,89,99,100]},{"name":"Mireille (Mimi) Boutin","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Applied Algebra and Geometry","leader":true,"kwRaw":"Discrete inverse problems, lossless representations of objects using invariant statistics, geometry & probability, Lie groups, invariant theory, commutative algebra.","desc":"Boutin's research is in the area of applied mathematics, signal processing and machine learning. Mathematically speaking, she is interested in discrete inverse problems. The methods she uses include Lie groups, invariant theory, commutative algebra, and PDEs, among others. One of the particularities of her work is that it often integrates geometric tools inside a probabilistic framework. In particular, she has worked on building lossless representations of objects using invariant statistics., including different unlabeled distance geometry problems.","cov":"5 of 5","pubs":[570,571,572,573,574],"sim":[109,117,118,35,116]},{"name":"Samantha Fairchild","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Applied Algebra and Geometry","leader":false,"kwRaw":"Analysis of discrete sets arising from geometry, translation surfaces, applied algebraic geometry, connecting geometric and algebraic techniques","desc":"Groups, Geometry, and Dynamical Systems\nBroadly my research focuses on analyzing discrete sets arising from geometry. My inspiration often comes from the study of translation surfaces. This Numberphile video is a great introduction to the types of problems I enjoy working on. I'm also working with people in the field of applied algebraic geometry to better understand explicit computations moving between Riemann surfaces and algebraic curves. You can see some of my work on crossing the transcendental divide for an idea. I'm also pursuing new projects which connect geometric and algebraic techniques to real-world problems in collaboration with local industries.","cov":"5 of 5","pubs":[575,576,577,578,579],"sim":[117,115]},{"name":"Rob H. Eggermont","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Applied Algebra and Geometry","leader":false,"kwRaw":"Algebraic geometry, finiteness properties of varieties in settings of variable or infinite dimension through symmetry. Appl: phylogenetics, chemistry, and algebraic statistics.","desc":"Rob Eggermont is an assistant professor with the research group Discrete Mathematics at the TU/e department of Mathematics and Computer Science. He is a member of the group for Discrete Algebra and Geometry, which plays a leading role in algebraic graph theory, finite and incidence geometry, and discrete Lie theory. His research focuses on finiteness properties in settings of variable or infinite dimension with symmetry, as well as the general theory and structure of these settings, as well as algorithms and their practical applications.\n\nNo matter the number of coefficients in a matrix, one can state whether or not the matrix has rank at most one. In the same way, in the setting of algebraic geometry many varieties can be described independent of the number of variables. It turns out that many of these varieties can be described by finitely many equations up to symmetry, again independent of the number of variables. If said equations can be found, this allows for algorithms that test membership of such a variety in polynomial time. This has applications in many fields, such as phylogenetics, chemistry, and algebraic statistics.\n\nIn systems with a great deal of symmetry, dealing with a million variables can be as easy as dealing with ten","cov":"5 of 5","pubs":[580,581,582,583,584],"sim":[116,115,118,142,105,137]},{"name":"F.G.M.T. (Hans) Cuypers","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Discrete Algebra and Geometry","leader":true,"kwRaw":"Finite geometry, group theory, design theory, algebraic combinatorics, abstract, applied and computer algebra. Technology enhanced education of mathematics and science","desc":"Hans Cuypers is a Full Professor in the Department of Mathematics and Computer Science at Eindhoven University of Technology (TU/e). His main mathematical interests are in discrete algebra and geometry, in particular in (finite) geometry, group theory, graph theory, design theory, algebraic combinatorics, abstract and applied algebra and computer algebra. His areas of expertise further include Technology enhanced Education of Mathematics and Science . Since 2009, Hans has been leading the Discrete Algebra and Geometry group at TU/e. Moreover, he has been active in the introduction and implementation of various forms of blended learning at the university.\n\nLately I am also interested in interactive books on mathematics\n\n\nThere is always light. If only we're brave enough to see it. If only we're brave enough to be it. Amanda Gorman","cov":"5 of 5","pubs":[585,586,587,588,589],"sim":[41,91,117,13,129,25]},{"name":"Andreas T. Hülsing","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Discrete Algebra and Geometry","leader":false,"kwRaw":"Post-quantum cryptography, modelling post-quantum attacks/post quantum security models, analysis of side-channel attacks, efficient hash-based signature schemes.","desc":"The Applied and Provable Security (APS) group covers research on applied cryptography and formal treatment of the security of cryptographic systems.\nResearch topics span from the design of secure communication protocols to the foundational development of proof techniques and machine-checking security proofs using proof-assistants.\nThe research of APS has a strong focus on constructions that achieve post-quantum security, i.e., security against attackers in possession of a quantum computer.\n\nI am an associate professor leading the Applied and Provable Security (APS) group at Eindhoven University of Technology (TU/e). My research group and I are currently supported by NWO under the Vidi grant 'A solid theory for post-quantum cryptography'. Besides, I am collaborating in the Formosa project to produce machine-checked proofs for high-assurance cryptographic software. My research focuses on post-quantum cryptography - cryptography that resists quantum computer-aided attacks. My works range from theoretical works, like how to model quantum attacks or formal security arguments in post-quantum security models, to applied works, like the analysis of side-channel attacks or the development of efficient hash-based signature schemes. In many of my works I try to combine the theoretical and the applied perspective. This is especially reflected in my work on standardizing post-quantum cryptography","cov":"5 of 5","pubs":[590,591,592,593,594],"sim":[122,120,123,125,127,121]},{"name":"Kathrin Hövelmanns","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Discrete Algebra and Geometry","leader":false,"kwRaw":"Post-quantum security, combing provable security with quantum information theory.","desc":"My research focuses on mitigating the threat posed by quantum computers to how we communicate sensitive data. (Wiring money, transmitting sensitive information like medical data or company/governmental/military secrets, Whatsapp, ...) My main focus is on cryptography that can be used already on today's computers, but withstands even quantum attacks. (This is called 'post-quantum security'.) One achievement I'm very exited about is that my research contributed to the theoretical groundwork for Kyber, an emerging NIST standard for public-key encryption.\n\nMy methods combine techniques from provable security with developing new theoretical tools based in quantum information theory. To learn more about my research, take a look at my publications and talks and my other scientific activities","cov":"5 of 5","pubs":[595,596,597,598,599],"sim":[128,119,142,31,123,122]},{"name":"Roberto Blanco","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Discrete Algebra and Geometry","leader":false,"kwRaw":"Proof assistants, proof certificates, type systems, computational logic, secure compilation, compartmentalization, hardware enforcement, micropolicies, capability machines.","desc":"My research interests are centered around the development and application of formal methods to solve computer security problems, developed along both axes:\n\nProgramming languages: proof assistants; formal specification, testing and verification; proof certificates; type systems; computational logic.\n\nComputer security: secure compilation; compartmentalization; security policies; hardware enforcement; micropolicies; capability machines.\n\nThe principal objective of my work at FOVSEC is to build secure compilation chains that preserve useful classes of security properties while scaling to realistic programming languages and enabling efficient and secure program execution.\n\nPreviously, I was a doctoral researcher in the Parsifal team (now Partout) at the LIX laboratory at École polytechnique in Université Paris-Saclay, and Inria Saclay - Île de France. I was advised by Dale Miller working in the ERC ProofCert project.\n\nA grand unifying theme and pragmatic motivation of my research is an ambition that I am convinced is both lofty and realistic: this is the need for trust (which encompasses a notion of security) and correctness - in theorems as in the entire pantheon of formalizable artifacts, with software as primus inter pares in today's world - and a discipline that treats these as first-class abstractions","cov":"5 of 5","pubs":[600,601,602,603,604],"sim":[10,51,60,119,29,25]},{"name":"Tanja Lange","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Coding Theory and Cryptology","leader":true,"kwRaw":"Post-quantum cryptography, number theory","desc":"I work on cryptography and number theory. I'm chair of the Coding Theory and Cryptology group at the Technische Universiteit Eindhoven in the Department of Mathematics and Computer Science.\nCurrently I'm also scientific director of the Eindhoven Institute for the Protection of Systems and Information (Ei/Ψ)","cov":"5 of 5","pubs":[605,606,607,608,609],"sim":[119,120,125,124,142,129]},{"name":"Sven Schäge","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Coding Theory and Cryptology","leader":false,"kwRaw":"Multi-(human)agent complex cryptographic tasks, provable security paradigm, tight cryptographic reductions, formal proofs of inherent limitations.","desc":"Goal:\n\nSven's goal is to contribute to a better understanding of cryptographic protocols to obtain more solid theoretical foundations and better protocols with high efficiency and strong security guarantees. A special focus of his work is i) the development of strong cryptographic models for complex cryptographic tasks that involve interaction between several parties, and ii) constructions that efficiently achieve strong security guarantees in these models.\n\nTechnical Interest:\n\nSven is particularly interested in realistic notions of security and privacy and the technical consequences for efficient and provably secure instantiations that they imply. A topic that he particularly focuses on is tight cryptographic reductions. At the same time, he is interested in revealing (and formally proving) the inherent limitations of cryptographic tasks and ways to circumvent such barriers.\n\nMethods:\n\nSven's results rely on the provable security paradigm, a very rigorous method of arguing about a system's security guarantees. At the same time, he regularly uses complex theoretical techniques like meta-reductions to obtain impossibility results showing that no further improvement can be achieved. These results can then be used to argue that a given construction is optimal.","cov":"5 of 5","pubs":[610,611,612,613,614],"sim":[120,119,124,31,122,126]},{"name":"L.A.M. (Berry) Schoenmakers","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Coding Theory and Cryptology","leader":false,"kwRaw":"Cryptographic protocols for electronic voting, electronic payment, and secure multiparty computation, amortized data structures, sigma-protocols and threshold cryptography","desc":"My research interests are reflected in my papers on cryptographic protocols for electronic voting, electronic payment, and secure multiparty computation, on amortized data structures and on some other algorithms.\nSee also these Lecture Notes Cryptographic Protocols and matching Lecture Slides Cryptographic Protocols (Handout version without animations), with extensive coverage of Sigma-protocols and threshold cryptography.\nRelated programming projects:\n\nMPyC -- Multiparty Computation in Python\nPebbling One-Way Hash Chains\nTheVote -- Threshold Homomorphic Electronic Voting","cov":"5 of 5","pubs":[615,616,617,618,619],"sim":[126,127,2,122,123,120]},{"name":"Monika Trimoska","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Coding Theory and Cryptology","leader":false,"kwRaw":"Cryptanalysis of post-quantum (multivariate, code-based and isogeny-based ) cryptosystems.","desc":"Currently, my primary research interest is cryptanalysis of post-quantum cryptosystems, specifically multivariate, code-based and isogeny-based. During my thesis, I was investigating the use of SAT solvers in cryptographic attacks on public-key cryptosystems, with a focus on elliptic curve cryptography\n\ntags: multivariatecode-basedisogeniesECCalg. cryptanalysisSATsignaturesfault injection","cov":"5 of 5","pubs":[620,621,622,623,624],"sim":[127,122,119]},{"name":"Benne de Weger","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Coding Theory and Cryptology","leader":false,"kwRaw":"Cryptographic protocols for electronic voting, electronic payment, secure multiparty computation","desc":"Cryptographic protocols for electronic voting, electronic payment, secure multiparty computation","cov":"5 of 5","pubs":[625,626,627,628,629],"sim":[124,127,2,123,120]},{"name":"Lorenzo Grassi","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Coding Theory and Cryptology","leader":false,"kwRaw":"Design and cryptanalysis of symmetric cryptographic algorithms, cryptanalysis of AES and AES-like schemes, symmetric primitives for MPC, ZK and HE.","desc":"His research interests include all aspects of cryptography, with particular focus on the design and cryptanalysis of symmetric cryptographic algorithms, such as ciphers and hash functions. Within symmetric cryptography, he has a well-established expertise in\n- the cryptanalysis of AES and AES-like schemes, and\n- the design and the security analysis of symmetric primitives for Multi-Party Computation (MPC), Zero-Knowledge (ZK) and Homomorphic Encryption (HE) applications.\nHe is a co-designer of several MPC-/ZK-/FHE-friendly schemes, including MiMC, Rasta, HadesMiMC, Poseidon, Reinforced Concrete, Hydra, Griffin, Pasta, among others.","cov":"5 of 5","pubs":[630,631,632,633,634],"sim":[125,124,126,31,119,120]},{"name":"Subhasree Patro","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Coding Theory and Cryptology","leader":false,"kwRaw":"Quantum computational complexity theory, quantum fine-grained complexity, quantum query complexity","desc":"I am broadly interested in the area of quantum computational complexity theory. More specifically, in quantum fine-grained complexity and quantum query complexity","cov":"5 of 5","pubs":[635,636,637,638,639],"sim":[120,142,4,31,122]},{"name":"Alberto Ravagnani","domain":"Mathematics","cluster":"Discrete Mathematics","group":"Mathematical Communication Theory","leader":true,"kwRaw":"Error-correcting codes, network coding, adversarial networks, poset theory, enumerative combinatorics, quantum error correction, code-based cryptography","desc":"Data communication is about reliably communicating data over a possibly noisy channel, efficiently storing and retrieving them, and guaranteeing their integrity. MCT focuses on various research topics at the crossroad of data communication and applied discrete mathematics:\n\n'My research focuses on the mathematical foundations of communication theory, particularly on coding theory, network communication, and combinatorics\n\ncoding theory: error-correcting codes and their properties;\nnetwork information theory: network coding, adversarial networks;\ncombinatorics: poset theory, enumerative combinatorics, and their applications;\noptimization for data storage and recovery, including DNA storage;\nquantum error correction;\ncode-based (post-quantum) cryptography\nenumerative and algebraic combinatorics\nnetwork coding'","cov":"5 of 5","pubs":[640,641,642,643,644],"sim":[142,31,122,118,119,120]},{"name":"Remco W. van der Hofstad","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Probability","leader":true,"kwRaw":"Random graph models for complex networks, percolation and high-dimensional statistical physics, probability in elec. eng., comp. science, photolith., and theoretical physics","desc":"Random graphs and complex networks\n\nIn the past two decades, it has become clear that many real networks share fascinating features in being small worlds and scale-free. Such networks are typically modelled using random graphs. Random graphs are closely related to percolation, the difference being that random graphs tend to have finite size, while percolation systems tend to be infinite. The empirical findings on real networks have ignited research on various models for complex networks. The focus of the research of the group was the study of distances in models of complex networks where power-law degrees are observed, as well as the behavior of stochastic processes on random graphs.\n\nMy research has focussed on studying network properties from a mathematically rigorous perspectives. Primary topics include the structure of random graph models for complex networks (such as distances, diameters, degree structure and local structure), stochastic processes on them (such as first-passage percolation, percolation, Ising mdoels, and epidemics). The random graph models that I have studied include\nthe configuration model,\nvarious versions of generalized random graphs,\npreferential attachment models\nvarious spatial random graph models.\n\nA key question in random graph theory relates to universality, that is, to which extent do models with similar properties show similar behavior.\nPercolation and high-dimensional statistical physics\n\n\n\nPercolation is one of the paradigm models in statistical physics, displaying extremely rich critical behavior. It is a model of a porous medium, where the materials consist of substance and holes. My main focus of research in the past period has been on the study of percolation models close to criticality for high-dimensional systems. Related problems include lattice trees and lattice animals, and the Ising model, in high-dimensions.\n\nMethodology\n\nIn this research, we mainly make use of four key methods:\nCoupling methods and comparisons with branching processes.\nWeak convergence methods for stochastic processes.\nLarge deviations.\nCombinatorial expansion techniques for high-dimensional systems, using the lace expansion.\nApplications of Probability\n\nI have always been interested in applications of probability, particularly in electrical engineering, computer science, photolithography for chip printing, and theoretical physics. So if you have a cool problem, please knock on my door!\n\nRemco's research currently focuses on probability questions that have applications in the area of (complex) networks, such as social media networks. Key topics include percolation, one of the paradigm models in statistical physics, random graphs and complex networks, self-interacting random processes, and applications of probability, particularly in electrical engineering, computer science and theoretical physics","cov":"5 of 5","pubs":[645,646,647,648,649],"sim":[131,132,150,148,146,133]},{"name":"W.L.F. (Pim) van der Hoorn","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Probability","leader":false,"kwRaw":"Design of mathematical frameworks for statistical analysis of networks, emerging geometry in networks, random graphs and graph limits","desc":"My work focuses on developing mathematical foundations of network science, using probability theory, statistics, random graphs and graph limits. The two main pillars of my research are the design of mathematical frameworks for statistical analysis of networks and understanding emerging geometry in networks","cov":"5 of 5","pubs":[650,651,652,653,654],"sim":[130,150,132,113,148,133]},{"name":"Noela Müller","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Probability","leader":false,"kwRaw":"Statistical physics, recursive structures, inference on random graphs, correlations and phase transitions.","desc":"Her scientific interests focus on probability theory and statistical physics; in particular on random recursive structures, inference on random graphs, correlations and phase transitions.","cov":"5 of 5","pubs":[655,656,657,658,659],"sim":[130,101,131,146,150,63]},{"name":"Rui M. Castro","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Mathematical Statistics","leader":true,"kwRaw":"Learning (sampling) theory, non-parametric and high-dimensional statistics, statistical signal and image processing, network inference, active learning techniques.","desc":"His research interests are on the borderline of signal processing, learning theory and statistics, including learning theory, non-parametric and high-dimensional statistics, statistical signal and image processing, network inference, and pattern recognition.\n\nRui is also interested in active learning techniques, also known as sequential experimental design. These include learning/sampling procedures that are able to use information gleaned from previous samples to adapt the sampling procedure. Applications include, among others, network monitoring and measurement and effective spectrum analysis methods for opportunistic transmission in cognitive radio. Previously, Rui worked on Distilled Sensing (DS), a multi-step, selective (adaptive) sampling procedure for recovering sparse signals from noisy observations. DS results in dramatic quantifiable improvements over the best non-adaptive sensing methods for the estimation and detection of sparse signals in noise.","cov":"5 of 5","pubs":[660,661,662,663,664],"sim":[130,131,105,28,83,150]},{"name":"Elisa Perrone","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Mathematical Statistics","leader":false,"kwRaw":"Multivariate statistics and dependence modeling  (copulas). Application areas: environmental sciences and weather forecasting","desc":"My research lies at the interface between theoretical and applied statistics. I am mainly interested in multivariate statistics and dependence modeling, with particular emphasis on copulas and their mathematical properties. My work includes the development of novel methodology for environmental sciences and weather forecasting","cov":"5 of 5","pubs":[665,666,667,668,669],"sim":[]},{"name":"Jeanine Duistermaat","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Applied statistics","leader":true,"kwRaw":"Statistical epidemiology, statistical bioinformatics, (statistical) analysis and integration of multiple omics datasets, non-biological applications.","desc":"Jeanine Duistermaat obtained her PhD in statistical epidemiology in 1997, focusing on modeling family data. In 2005, she received a VIDI grant to conduct research in statistical genetics. In 2010, she was appointed Professor of Genetic Statistics at Leiden University.\n\nSince 2012, her research has also encompassed statistical bioinformatics, with a particular emphasis on integrating multiple omics datasets (genomics, transcriptomics, metabolomics, proteomics). This work has been funded by the EU FP7 collaborative grant MIMOmics and the Horizon 2020 MSCA network IMforFUTURE, both of which she coordinated, as well as the ZonMW grants MSA-Omics and SynOD. She also served as Co-Editor of Biometrics, the journal of the International Biometric Society.\n\nIn 2015, she became Professor of Data Analytics and Statistics at the University of Leeds, where she initiated a third research line: modeling data along a continuum, such as weather data and images. In 2022, she joined Radboud University as Professor of Statistics. Since 2024, she has been a member of the Royal Netherlands Academy of Arts and Sciences (KNAW). In 2025, she was appointed Professor of Applied Statistics at Eindhoven University of Technology (TU/e).\n\nHouwing-Duistermaat performs research at the interface of statistics and application domains, such as bioinformatics, genetics, epidemiology, and biophysics. Disease and health are both influenced by biological mechanisms. Technological developments make it possible to measure datasets that contain information about these mechanisms. These datasets are becoming more and more complex and expanding exponentially in size. It is therefore a challenge to derive 'simple' statistical models that describe data appropriately and provide insight into these mechanisms. Houwing-Duistermaat's goal is to develop these models.\n\nRetrieving information from complex data comes with a number of statistical challenges: the various datasets have to be integrated, their dimensions have to be reduced, and their relationships to health have to be modelled,' says Houwing-Duistermaat. 'I have developed models for the analysis of multiple cross-sectional omics datasets. In Nijmegen, I plan to focus on modelling multiple longitudinal omics in order to gain insight into dynamic mechanisms. I am also open to new collaborations related to omics and other complex data sets. In the past, , for example, I have developed methods that can be applied in urban analytics'","cov":"5 of 5","pubs":[670,671,672,673,674],"sim":[151]},{"name":"Frits C.R. Spieksma","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Combinatorial Optimization","leader":true,"kwRaw":"(combinatorial) Optimization, scheduling, routing, exchange and clustering problems (in the context of abundant data), combinatorial auctions, computational revealed pref.","desc":"His key field of expertise is operations research, especially combinatorial optimization problems and applications thereof. He combines an interest in theoretical results with the desire to affect practice.\n\nWithin his field, Frits is particularly interested in various scheduling, routing, and clustering problems. He is especially interested in sport scheduling; in addition, he works on other applications of combinatorial optimization such as kidney exchange models, combinatorial auctions, and computational revealed preference. Also, logistic challenges, such as the optimization of inland waterway transport have his interest. These problems are connected to computer science, discrete mathematics, (applied) economics, management science, and indeed, he has great interest in problems that are in the intersection of other scientific disciplines and combinatorial optimization.\n\nUnderstanding the precise characteristics of today's relevant optimization problems, and dealing with the abundant presence of data, are key in developing techniques that can solve tomorrow's combinatorial optimization problems!","cov":"5 of 5","pubs":[675,676,677,678,679],"sim":[141,137,142,75,56,1]},{"name":"Christopher Hojny","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Combinatorial Optimization","leader":false,"kwRaw":"(Symmetries in) Mixed-integer programs, integer programming approaches to solve combinatorial optimization problems","desc":"Christopher Hojny is an assistant professor working at TU/e since October 2019. His main research topic is the development of efficient techniques to handle symmetries in mixed-integer programs. Besides symmetry handling, he is also interested in theoretical properties of integer programs (e.g., the existence of formulations with certain properties) and developing integer programming approaches to solve combinatorial optimization problems. Christopher is also a co-developer of the academic solver SCIP.\n\nI am an assistant professor at Eindhoven University of Technology within the group Combinatorial Optimization. My research interests are theory and practice of mixed-integer programming. The focus of my research is on developing algorithms to handle symmetries in mathematical optimization problems as well as investigating quantitative properties of mixed-integer programs (e.g., relaxation complexity)","cov":"5 of 5","pubs":[680,681,682,683,684],"sim":[136,139,43,141,75,142]},{"name":"Tim Baarslag","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Combinatorial Optimization","leader":false,"kwRaw":"(Foundations of) Multi agent cooperative AI & joint decion making. Applications: trading platforms, autonomous vehicles, and digital privacy & security assistants","desc":"Tim Baarslag studies intelligent and autonomous systems that can collaborate through the process of joint decision making. Practical applications include smart energy trading, the Internet of Things, trading platforms, autonomous vehicles, and digital privacy & security assistants. Tim Baarslag currently investigates how negotiation AI can coordinate multiple deals as part of an NWO Vidi grant, called COMBINE: Coordinating Multi-deal Bilateral Negotiations. His research is featured in Science Magazine, Artificial Intelligence, Wired, BBC Technology of Business, AI Magazine, MIT Technology Review, and New Scientist.\n\nMy goal is to act as a bridge between Mathematics and Cooperative AI, by developing a foundational theory for making effective and intelligent joint decisions","cov":"5 of 5","pubs":[685,686,687,688,689],"sim":[53,40,18,39]},{"name":"Alexandra Lassota","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Combinatorial Optimization","leader":false,"kwRaw":"(mixed) Integer programming, scheduling, extension complexity, tropical convolutions, fixed-parameter tractability, and approximation algorithms","desc":"My main research interests revolve around (mixed) integer programming, scheduling, extension complexity, tropical convolutions, fixed-parameter tractability, and approximation algorithms","cov":"5 of 5","pubs":[690,691,692,693,694],"sim":[3,0,2,137,4,9]},{"name":"Rudi A. Pendavingh","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Combinatorial Optimization","leader":false,"kwRaw":"Topological graph theory, matroid theory, linear-, integer-, and semidefinite optimization. (More to explore)","desc":"Rudi Pendavingh is affiliated with TU/e since 1999. He obtained a PhD at the University of Amsterdam on a topic in topological graph theory, and has worked on very diverse topics in combinatorics and geometry since. In recent years, his research has focussed on matroid theory. Working in the chair of Combinatorial Optimization, he has taught courses on many aspects of mathematical programming, including linear-, integer-, and semidefinite optimization.","cov":"5 of 5","pubs":[695,696,697,698,699],"sim":[142,137,136,99,75]},{"name":"Bart M.L. Smeulders","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Combinatorial Optimization","leader":false,"kwRaw":"Exchange/allocation problems (in medical domain), optimization/approximation algorithms.","desc":"Very little info","cov":"5 of 5","pubs":[700,701,702,703,704],"sim":[136,137,139,142,75]},{"name":"Aida Abiad Monge","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Algebraic Combinatorics","leader":true,"kwRaw":"Algebraic graph theory, deducing properties from graph spectra, combinatorial optimization, quantum information theory, coding theory and finite geometry.","desc":"I work primarly in algebraic graph theory. I am for example interested in studying which properties of a graph can be deduced from its spectrum. My research interests also include combinatorial optimization, quantum information theory, coding theory and finite geometry","cov":"5 of 5","pubs":[705,706,707,708,709],"sim":[129,120,128,136,31,137]},{"name":"Sem C. Borst","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Stochastic Operations Research","leader":true,"kwRaw":"Performance evaluation and resource allocation algorithms for large-scale Stochastic Networks, influence of local behavior on global dynamics of SN, comm. systems","desc":"His main research interests are in the area of performance evaluation and resource allocation algorithms for large-scale stochastic networks.\n\nA major theme in Sem's research is to explore how local behavior and interactions affect the dynamics of large-scale stochastic networks on a macroscopic level. This provides crucial insight for the design of low-complexity resource allocation algorithms, which operate in a distributed fashion, and yet achieve near-optimal performance on a global network scale.\n\nSem's main research interests are in the area of performance evaluation and resource allocation\nalgorithms for stochastic networks, in particular communication systems, and lie at the interface\nof applied probability, stochastic operations research and networking\n\nStochastic networks are a tremendous source of mathematical challenges, and provide powerful paradigms for understanding and designing complex large-scale systems at the heart of society and technology'","cov":"5 of 5","pubs":[710,711,712,713,714],"sim":[148,22,147,146,145,144]},{"name":"Marko A.A. Boon","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Stochastic Operations Research","leader":false,"kwRaw":"Stochastic (queueing) models for urban road traffic, platoon forming algorithms for self driving cars, stochastic models for finance and insurance.","desc":"His main research topics are stochastic queueing models for urban road traffic. Marko develops efficient algorithms in order to optimally adjust traffic lights to reduce the environmental impact of unnecessarily stopped cars, improve traffic flows and improve traffic participation efficiency and experience for drivers, cyclists and pedestrians. Another interesting research question is whether it is better to have 'smart' in-car navigation devices and ''stupid'' infrastructure, or the other way around. In certain network settings, classical yet predictable traffic signals combined with smart navigation devices can yield a better performance than state-of-the art infrastructure, with sensors, simply due to the fact that it is less predictable. Currently, he is especially interested in developing platoon forming al
