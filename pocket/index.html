  return box;
}

/* Each arena's leads wear the colour Mark picks for them in the Ledger, or
   the one handed out from the arena's place in the list. The palette and
   that rule are the Ledger's (PALETTE and toneOf in
   one-app/rooms/ledger/ledger.js), copied because Pocket has no Ledger:
   change them there, then here. */
var LEAD_TONES = [
  ['terracotta','#c08a78'], ['rust','#a8714f'], ['ochre','#b59c66'], ['olive','#9ea06e'],
  ['sage','#86a088'], ['slate','#7f9aa8'], ['dusk','#8f8db0'], ['mauve','#a8879e'],
  ['rosewood','#ad7680'], ['sand','#b5a690']
];
function leadTone(a){
  for (var i = 0; i < LEAD_TONES.length; i++) if (LEAD_TONES[i][0] === a.color) return LEAD_TONES[i][1];
  var all = (data.semaphore && data.semaphore.arenas) || [];
  var n = Math.max(0, all.indexOf(a));
  return LEAD_TONES[(n * 3) % LEAD_TONES.length][1];
}
function leadRow(it, inSheet){
  var b = el('button', 'lead toned');
  b.style.setProperty('--tone', leadTone(it.arena));
  b.appendChild(ruit(it.lead));
  var tx = el('span', 'ltx');
  if (!inSheet) tx.appendChild(el('span', 'lar', plainOf(it.where)));
  tx.appendChild(el('span', 'lname', plainOf(it.what)));
  tx.appendChild(el('span', 'lsub', it.match ? plainOf(it.match) : 'No match yet'));
  b.appendChild(tx);
  var n = daysTo(it.when);
  var w = el('span', 'lwhen' + (it.when ? ' set' : '') + (n !== null && n <= 0 ? ' late' : ''),
    it.when ? (n === 0 ? 'Today' : dowDate(it.when)) : 'No date');
  b.appendChild(w);
  b.addEventListener('click', function(){ openLead(it); });
  return b;
}

function kindHead(k){
  var up = k !== 'lead', dn = k !== 'researchers';
  function ln(x1,y1,x2,y2,on){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"'+(on?' class="on"':'')+'/>'; }
  var d = el('div', 'lkind');
  d.innerHTML = '<svg viewBox="0 0 16 10" aria-hidden="true">' +
    ln(1,5,8,1.5,up) + ln(8,1.5,15,5,up) + ln(1,5,8,8.5,dn) + ln(8,8.5,15,5,dn) + '</svg>';
  d.appendChild(el('span', '', KIND_NAME[k]));
  return d;
}

/* The desk's Leads arrangement: one Spotted, one Contacted, one Talking,
   every open lead in whichever it has reached. Within a step the day
   decides, soonest first, then the undated. Contacted runs by its two
   paths: the researchers asked, then both, then the lead written to. */
function drawLeads(){
  var host = $('#v-leads');
  host.textContent = '';
  var all = leadItems();
  var today = isoToday();
  var owedAll = all.filter(function(it){ return it.when && it.when <= today; }).length;
  badge('leads', owedAll);
  var items = all;

  if (scope){
    items = all.filter(function(it){ return it.ref.aid === scope.aid; });
    var sc = el('div', 'scope');
    var lab = el('b', '', scope.name);
    lab.appendChild(el('i', '', '  ·  its leads'));
    sc.appendChild(lab);
    var clr = el('button', 'cap', 'All leads');
    clr.addEventListener('click', function(){ scope = null; drawLeads(); });
    sc.appendChild(clr);
    host.appendChild(sc);
  }
  if (data.semaphore){
    var add = el('button', 'addlead', '+ New lead');
    add.addEventListener('click', newLead);
    host.appendChild(add);
  }
  if (!items.length){
    host.appendChild(empty('Nothing being pursued',
      !data.semaphore ? 'Pull down to fetch from the cloud.'
        : scope ? 'Everything on this arena has been closed.'
        : 'Found a project worth following? Add it with New lead above.'));
    return;
  }
  var arenas = {}; items.forEach(function(it){ arenas[it.ref.aid] = 1; });
  var na = Object.keys(arenas).length;
  var owed = items.filter(function(it){ return it.when && it.when <= today; }).length;
  var hd = el('div', 'whead');
  hd.appendChild(el('b', '', String(items.length)));
  hd.appendChild(document.createTextNode(items.length === 1 ? ' lead' : ' leads'));
  if (!scope){
    hd.appendChild(document.createTextNode(' across '));
    hd.appendChild(el('b', '', String(na)));
    hd.appendChild(document.createTextNode(na === 1 ? ' arena' : ' arenas'));
  }
  if (owed){
    hd.appendChild(document.createTextNode(', '));
    hd.appendChild(el('b', '', String(owed)));
    hd.appendChild(document.createTextNode(' owed today'));
  }
  hd.appendChild(document.createTextNode('.'));
  host.appendChild(hd);

  STAGES.forEach(function(k){
    var col = items.filter(function(it){ return it.stageKey === k; }).sort(byDay);
    if (!col.length) return;
    if (k === 'contacted') col.sort(function(x,y){
      return KIND_RANK[leadKind(x.lead)] - KIND_RANK[leadKind(y.lead)] || byDay(x,y); });
    var run = el('section', 'lrun');
    var fl = el('div', 'lflank');
    fl.appendChild(el('span', 'lfn', STAGE_NAME[k]));
    fl.appendChild(el('span', 'lfc', col.length + (col.length === 1 ? ' lead' : ' leads')));
    run.appendChild(fl);
    var rows = el('div', 'lrows');
    col.forEach(function(it, i){
      var kd = k === 'contacted' ? leadKind(it.lead) : null;
      if (kd && (!i || leadKind(col[i-1].lead) !== kd)) rows.appendChild(kindHead(kd));
      rows.appendChild(leadRow(it));
    });
    run.appendChild(rows);
    host.appendChild(run);
  });
}

/* ── coming up: every arena's dates on one line ─────────────────────── */

var datesAll = false;
try { datesAll = localStorage.getItem('pocket.datesAll') === '1'; } catch(e){}

function evDate(d){
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p = String(d.start).split('-'), y = +p[0], m = +p[1], dd = +p[2];
  switch (d.gran){
    case 'day': return dd + ' ' + M[m-1];
    case 'month': return M[m-1];
    case 'quarter': return 'Q' + (Math.floor((m-1)/3)+1);
    case 'half': return 'H' + (m < 7 ? 1 : 2);
    case 'year': return String(y);
    case 'range':
      if (!d.end || d.end === d.start) return dd + ' ' + M[m-1];
      var q = String(d.end).split('-');
      if (q[0] === p[0] && q[1] === p[1]) return dd + '–' + (+q[2]) + ' ' + M[m-1];
      return dd + ' ' + M[m-1] + ' – ' + (+q[2]) + ' ' + M[+q[1]-1];
    default: return dd + ' ' + M[m-1];
  }
}

function comingUp(){
  var out = [], Sm = data.semaphore;
  if (!Sm || !Sm.arenas) return out;
  var from = -14, to = 366;
  Sm.arenas.forEach(function(a){
    if (!a || a.frozenAt) return;
    (a.dates || []).forEach(function(d){
      if (!d || !d.start || d.gran === 'none') return;
      if (!datesAll && d.kind === 'call') return;
      var s = daysTo(d.start), e = daysTo(d.end || d.start);
      if (e < from || s > to) return;
      out.push({ d:d, a:a, s:s, e:e });
    });
  });
  out.sort(function(x,y){ return x.d.start < y.d.start ? -1 : x.d.start > y.d.start ? 1
    : (x.d.kind === 'call') - (y.d.kind === 'call'); });
  return out;
}

/* The desk keeps an event's websites among its arena's brokerage links,
   without saying which link belongs to which date. Pocket pairs them by
   the words their titles share (and the year); an arena with a single
   brokerage link gives that one. No fit → no link, the row opens the arena. */
var EV_STOP = {};
('the and for with from event events brokerage day days info online calls call expected '
 + 'horizon europe european page public official tool platform matchmaking b2match networking')
  .split(' ').forEach(function(w){ EV_STOP[w] = 1; });
function evWords(s){
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(' ')
    .filter(function(w){ return w.length > 2 && !EV_STOP[w] && !/^20\d\d$/.test(w); });
}
function eventLink(d, a){
  var ls = (((a && a.brokerage) || {}).links || []).filter(function(l){
    return l && typeof l.url === 'string' && /^https?:/i.test(l.url); });
  if (!ls.length) return null;
  var dw = {}, y = String(d.start || '').slice(0, 4), best = null, top = 0;
  evWords(plainOf(d.label)).forEach(function(w){ dw[w] = 1; });
  ls.forEach(function(l){
    var lab = plainOf(l.label), sc = 0, seen = {};
    evWords(lab).forEach(function(w){ if (dw[w] && !seen[w]){ seen[w] = 1; sc++; } });
    if (sc && y && lab.indexOf(y) >= 0) sc += 0.5;
    if (sc && /precedent|projection basis/i.test(lab)) sc -= 0.6;
    if (sc > top){ top = sc; best = l; }
  });
  if (best && top >= 1) return best;
  return ls.length === 1 ? ls[0] : null;
}

/* Semaphore colours a date by what it is: brokerage red, or one of the
   three stages of a call — against Pocket's copy of those hues. */
var ROLE_HUE = { announcement:'var(--r-ann)', publication:'var(--r-pub)',
                 deadline:'var(--r-dl)' };
function dateHue(d){
  return d.kind === 'call' ? (ROLE_HUE[d.role] || ROLE_HUE.publication) : 'var(--brok)';
}
function dateName(d){
  return plainOf(d.kind === 'call' ? (d.call || 'Untitled call') : (d.label || '(untitled)'));

/* the drawer's stream, one row per date down a spine */
function streamFor(a){
  var all = (a.dates || []).slice();
  var dated = all.filter(function(d){ return d && d.start; })
                 .sort(function(x,y){ return x.start < y.start ? -1 : 1; });
  var undated = all.filter(function(d){ return d && !d.start; });
  if (!dated.length && !undated.length) return null;

  var box = el('div', 'stream'), placed = false;

  function row(d, past){
    var r = el('div', 'ln' + (d.kind === 'call' ? ' call' : ' brk') + (past ? ' past' : ''));
    r.style.setProperty('--c', dateHue(d));
    var dt = el('span', 'd' + (d.grade === 'fixed' ? '' : ' unc'));
    dt.textContent = (d.grade === 'fixed' ? '' : '≈ ') +
      (d.start && typeof shortDate === 'function' ? shortDate(d) : 'no date yet');
    r.appendChild(dt);
    var g = el('span', 'g');
    g.appendChild(el('i', 'sw-' + (d.grade === 'fixed' ? 'fixed' : 'uncertain')));
    r.appendChild(g);
    var t = el('span', 't');
    t.appendChild(document.createTextNode(dateName(d)));
    if (isFresh(a, d)) t.appendChild(el('i', 'wfresh', 'new'));
    if (d.kind === 'call'){
      var role = (typeof ROLES !== 'undefined' && ROLES[d.role]) ? ROLES[d.role].short : d.role;
      if (role) t.appendChild(el('span', 'stage', role));
    } else if (d.note){
      t.appendChild(el('span', 'nt', plainOf(d.note)));
    }
    r.appendChild(t);
    return r;
  }
  function todayMark(){
    var m = el('div', 'mark today cap');
    m.appendChild(el('span', 'mlab', 'today'));
    box.appendChild(m); placed = true;
  }
  dated.forEach(function(d){
    var past = daysTo(d.end || d.start) < 0;
    if (!past && !placed) todayMark();
    box.appendChild(row(d, past));
  });
  if (!placed && dated.length) todayMark();
  if (undated.length){
    var m3 = el('div', 'mark cap');
    m3.appendChild(el('span', 'mlab', 'no date yet'));
    box.appendChild(m3);
    undated.forEach(function(d){ box.appendChild(row(d, false)); });
  }
  return box;
}

/* The frame the home screen really gives, and whether the page needs it
   (see html.fullh in the style). Where the viewport starts tells how much
   it lacks. With the translucent bar the page starts at the top of the
   screen, the safe area above it says so, and it lacks the whole gap down
   to the screen's foot. With an opaque bar it starts under the bar and is
   one bar short as well, so the gap is two bars and it lacks one; a gap of
   one bar there is a phone without the fault, and is left alone. A gap
   wider than any bar is the keyboard, also left alone. */
var fitSaid = 'not on the home screen';
function topInset(){
  var p = $('#fit-probe');
  if (!p){
    p = el('div');
    p.id = 'fit-probe';
    p.style.cssText = 'position:fixed;left:0;top:0;width:0;visibility:hidden;' +
      'padding-top:env(safe-area-inset-top)';
    document.body.appendChild(p);
  }
  return parseFloat(getComputedStyle(p).paddingTop) || 0;
}
function fitScreen(){
  var home = navigator.standalone ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!home || !window.screen) return;
  function fit(){
    var w = screen.width, h = screen.height;
    var tall = innerWidth > innerHeight ? Math.min(w, h) : Math.max(w, h);
    var gap = tall - innerHeight, under = topInset();
    var lack = gap <= 0 ? 0 : under > 0 ? gap : gap >= 88 ? gap / 2 : 0;
    if (lack > 140) lack = 0;
    var root = document.documentElement;
    root.style.setProperty('--app-h', (innerHeight + lack) + 'px');
    /* the home bar ends about 13 points above the edge; an older iPhone
       with a button has none */
    root.style.setProperty('--home-b', (Math.max(w, h) < 812 ? 0 : 18) + 'px');
    root.classList.toggle('fullh', lack > 0);
    fitSaid = 'screen ' + tall + ' · view ' + innerHeight + ' · top ' + under +
      ' · added ' + (lack > 0 ? innerHeight + lack : 'none') + ' · fit 7';
  }
  fit();
  ['#tabs', '#top'].forEach(function(q){
    var n = $(q);
    if (n) n.addEventListener('touchmove', function(e){
      if (document.documentElement.classList.contains('fullh')) e.preventDefault();
    }, { passive:false });
  });
  addEventListener('resize', fit);
  addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
}

function openArena(a, st){
  st = st || scoreOf(a) || { state:'rotate', score:0, rest:0 };
  sheet(function(b, bar){
    b.appendChild(el('h2', '', plainOf(a.name) || 'Untitled'));
    var left = 0;
    rotList.forEach(function(x){ if (!stampedToday(x.a)) left++; });
    var wk = weightOf(a);
    var sub = [typeName(a), wk !== 'ordinary' ? WEIGHTS[wk].name : '',
      a.frozenAt ? 'in the freezer' : stampedToday(a) ? 'stamped today'
        : left ? left + ' still to look at' : '']
      .filter(Boolean).join('  ·  ');
    b.appendChild(el('p', 'sub', sub || ' '));

    /* the card's two switches, spelled out here where there is room */
    var sw = el('div', 'switches');
    var sPin = el('button', 'switch' + (a.pin ? ' on' : ''));
    sPin.appendChild(el('span', 'pin' + (a.pin ? ' on' : '')).appendChild(el('i')).parentNode);
    sPin.appendChild(document.createTextNode(a.pin ? 'Pinned' : 'Pin card'));
    sPin.addEventListener('click', function(){ shut(); pinArena(a); });
    sw.appendChild(sPin);
    var sAsk = el('button', 'switch' + (a.askAt ? ' on' : ''));
    sAsk.appendChild(el('span', 'wask' + (a.askAt ? ' on' : '')).appendChild(el('i')).parentNode);
    sAsk.appendChild(document.createTextNode(a.askAt ? 'Agent asked' : 'Ask the nightly agent'));
    sAsk.addEventListener('click', function(){ shut(); askAgent(a); });
    sw.appendChild(sAsk);
    b.appendChild(sw);

    var panel = el('div', 'composer');
    b.appendChild(panel);

    /* Why this card is where it is: the one thing standing() works out
       that nothing else can see. */
    var why = el('div', 'why');
    function line(label, text, cls){
      var l = el('div', 'l' + (cls ? ' ' + cls : ''));
      l.appendChild(el('b', '', label));
      var sp = el('span', '', text);
      l.appendChild(sp);
      why.appendChild(l);
      return sp;
    }
    line('Saying', saying(st), st.state === 'wake' ? 'hot' : '');

    /* The turn, worked out the way standing() works it out: the weight buys
       a base cycle, an open call tightens it towards a week, an event of its
       own puts a floor of a week under it. */
    var W = WEIGHTS[wk];
    if (W){
      var base  = Math.max(1, Math.round(W.turn * SWEEP_CYCLE));
      var pull  = (st.sweep && st.sweep.pull) || 0;
      var byCall = W.turn * (SWEEP_CYCLE - (SWEEP_CYCLE - SWEEP_SHORT) * pull);
      var byEvent = !!st.event && SWEEP_SHORT < byCall;
      var cycle = Math.max(1, Math.round(byEvent ? SWEEP_SHORT : byCall));
      var tight = byEvent ? 'an event of its own is near'
              : (cycle < base ? 'a call window is open' : null);
      var since = a.sweptAt ? -daysTo(a.sweptAt) : null;
      var txt;
      if (since === null){
        txt = 'Never stamped — it will come round about every ' + cycle + ' days once it is.';
      } else {
        var rem = cycle - since;
        txt = (since === 0 ? 'Stamped today'
                : 'Stamped ' + since + (since === 1 ? ' day' : ' days') + ' ago') +
              ', on ' + (/^(8|11|18)/.test(String(cycle)) ? 'an ' : 'a ') + cycle + '-day turn' +
              (tight ? ' — down from ' + base + ' because ' + tight : '') + '. ' +
              (rem > 0 ? 'Not due for about another ' + rem + (rem === 1 ? ' day' : ' days') + '.'
                : rem === 0 ? 'Due today.'
                : 'Due ' + (-rem) + (rem === -1 ? ' day' : ' days') + ' ago.');
      }
      var sp2 = line('Turn', txt);
      var meter = el('div', 'turn');
      var fill = el('i');
      fill.style.width = Math.round(Math.max(0, Math.min(1, st.rest || 0)) * 100) + '%';
      meter.appendChild(fill);
      sp2.appendChild(meter);
    }
    if (st.hold)
      line('Waiting', plainOf(st.hold.label || 'a date') +
        (st.hold.asleep ? ' — still far off' : ' — in ' + st.hold.near + ' days'),
        st.hold.asleep ? '' : 'hot');
    /* the event is often what the card is saying already; said once is enough */
    if (st.event && plainOf(eventNote(st.event)) !== saying(st)) line('Event', plainOf(eventNote(st.event)));
    if (st.sweep && st.sweep.call) line('Window', plainOf(st.sweep.call) + ' — ' + plainOf(st.sweep.text));
    section(b, 'Where it stands', why);

    /* About: the arena's own note and links. Brokerage: its note and the
       tools — the desk drawer's two boxes, in the same order. */
    var links = (a.links || []).filter(function(l){ return l; });
    if (a.notes || links.length){
      var ab = el('div');
      if (a.notes) ab.appendChild(el('p', '', plainOf(a.notes)));
      if (links.length){
        var lw = el('div', 'wlinks');
        links.forEach(function(l){ lw.appendChild(linkRow(l, a, true)); });
        ab.appendChild(lw);
      }
      section(b, 'About', ab);
    }
    var bk = a.brokerage || { notes:'', links:[] };
    var bb = el('div');
    if (bk.notes) bb.appendChild(el('p', '', plainOf(bk.notes)));
    if ((bk.links || []).length){
      var tw = el('div', 'wlinks');
      bk.links.forEach(function(lk){ if (lk) tw.appendChild(pinnableRow(lk, a)); });
      bb.appendChild(tw);
    }
    if (!bk.notes && !(bk.links || []).length) bb.appendChild(el('p', 'none', 'Nothing recorded yet.'));
    section(b, 'Brokerage', bb, 'brk');

    var mine = leadItems().filter(function(x){ return x.ref.aid === a.id; }).sort(byDay);
    var ll = el('div', 'leadlist');
    if (mine.length) mine.forEach(function(it){ ll.appendChild(leadRow(it, true)); });
    else ll.appendChild(el('p', 'none', 'Nothing found here yet — a lead is whatever a sweep turns up.'));
    section(b, mine.length ? mine.length + (mine.length === 1 ? ' open lead' : ' open leads') : 'Leads', ll);

    var stream2 = streamFor(a);
    if (stream2) section(b, (a.dates || []).length === 1 ? 'Date' : 'Dates', stream2);

    closeBtn(bar);

    /* a card is where a lead comes from, so this is where you add one */
    var vAdd = el('button', '', '+ Lead');
    var addOpen = false;
    vAdd.addEventListener('click', function(){
      addOpen = !addOpen;
      panel.textContent = '';
      panel.classList.toggle('open', addOpen);
      if (!addOpen) return;
      $('#sheet .panel').scrollTop = 0;
      leadForm(panel, function(){ return a.id; });
    });
    bar.appendChild(vAdd);

    /* walking the round: Next skips, Stamp & next marks it looked at */
    var nxt = nextAfter(a.id), on = stampedToday(a);
    if (nxt){
      var skip = el('button', '', 'Next ›');
      skip.addEventListener('click', function(){ openArenaById(nxt); });
      bar.appendChild(skip);
    }
    var stampB = el('button', 'key', on ? 'Unstamp' : nxt ? 'Stamp & next' : 'Stamp it');
    stampB.addEventListener('click', function(){
      stampArena(a);
      if (!on && nxt) openArenaById(nxt); else shut();
    });
    bar.appendChild(stampB);
  });
}

function openPerson(r){
  sheet(function(b, bar){
    b.appendChild(el('h2', '', r.name + (r.leader ? '  ✦' : '')));
    var w = [r.group, r.cluster, r.domain].filter(Boolean);
    w = w.filter(function(v,i){ return w.indexOf(v) === i; });
    b.appendChild(el('p', 'sub', w.join(' · ') + (r.leader ? '  ·  group leader' : '') +
      (r.cov && r.cov !== 'nan' ? '  ·  ' + r.cov + ' covered' : '')));

    var kws = (r.kwRaw || '').split(/[,;]/).map(function(s){ return s.trim(); }).filter(Boolean);
    if (kws.length){
      var ch = el('div', 'chips');
      kws.forEach(function(k){ ch.appendChild(el('span', '', k)); });
      section(b, 'Declared expertise', ch);
    }
    if (r.desc) section(b, 'In their own words', el('p', '', r.desc));

    var list = (r.pubs || []).map(function(i){ return pubs[i]; }).filter(Boolean);
    if (list.length){
      var pl = el('div');
      list.forEach(function(p){
        var row = p.u ? el('a', 'pub') : el('div', 'pub');
        if (p.u){ row.href = p.u; row.target = '_blank'; row.rel = 'noopener'; }
        row.appendChild(el('span', 't', p.t));
        row.appendChild(el('span', 'm',
          [p.v, p.y].filter(Boolean).join('  ·  ') +
          (p.c ? '  ·  ' + p.c + ' cited' : '')));
        pl.appendChild(row);
      });
      section(b, list.length + (list.length === 1 ? ' publication' : ' publications'), pl);
    }

    var sim = (r.sim || []).map(function(i){ return people[i]; }).filter(Boolean);
    if (sim.length){
      var sc = el('div', 'chips');
      sim.forEach(function(o){
        var bt = el('button', '', o.name);
        bt.addEventListener('click', function(){ openPerson(o); });
        sc.appendChild(bt);
      });
      section(b, 'Closest work', sc);
    }
    closeBtn(bar);
    var pDone = el('button', 'key', 'Close');
    pDone.addEventListener('click', shut);
    bar.appendChild(pDone);
  });
}

/* ── chrome ─────────────────────────────────────────────────────────── */

function draw(){ stamp(); drawRot(); drawPins(); drawLeads(); drawDates(); drawPeople($('#q').value); }

function goPeople(q){
  $('#q').value = q || '';
  drawPeople(q || '');
  shut();
  goTab('people');
}

document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]');
  if (!b) return;
  /* tapping Leads itself is the way back to everything */
  if (b.dataset.tab === 'leads' && scope){ scope = null; drawLeads(); }
  goTab(b.dataset.tab);
});

$('#sheet').addEventListener('click', function(e){ if (e.target === $('#sheet')) shut(); });

/* A web link on the phone opens in DuckDuckGo, Mark's own browser, not in
   the Safari panel a home-screen app is given. iOS lets a page name no
   "default browser", so the link is handed over in DuckDuckGo's own form,
   ddgQuickLink://https://…, which the app reads back as the address (its
   AppDeepLinkSchemes.query). Only on an iPhone or iPad, where the app is;
   mail links and everything on a desk stay as they were. */
var ON_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
document.addEventListener('click', function(e){
  if (!ON_IOS || e.defaultPrevented) return;
  var a = e.target.closest && e.target.closest('a[href]');
  if (!a || !/^https?:\/\//i.test(a.href)) return;
  e.preventDefault();
  location.href = 'ddgQuickLink://' + a.href;
});
$('#refresh').addEventListener('click', function(){ if (cfg) pull(); });
function fillSetup(){
  if (cfg){ $('#s-url').value = cfg.url; $('#s-key').value = cfg.key; }
  $('#s-conn').hidden = !!cfg && cfg.url === BUILT_IN.url && cfg.key === BUILT_IN.key;
  if (auth && auth.email) $('#s-email').value = auth.email;
  else if (cfg && cfg.email && !$('#s-email').value) $('#s-email').value = cfg.email;
  $('#s-pass').value = '';
  $('#s-save').textContent = auth ? 'Log in again' : 'Log in';
  $('#s-close').hidden = !(cfg && auth);
  $('#s-out').hidden = !auth;
  $('#s-fit').textContent = fitSaid;
}
$('#gear').addEventListener('click', function(){ askLogin(''); });
$('#s-close').addEventListener('click', function(){ $('#setup').classList.remove('up'); });
/* Logging out takes the copy on the phone with it: what is cached is the
   board itself, and a phone left logged out should not still show it. */
$('#s-out').addEventListener('click', function(){
  var a = auth;
  dropAuth();
  if (a && cfg) authCall('logout', {}, a.access).catch(function(){});
  data = { semaphore: null, at: null };
  try { localStorage.removeItem(CACHE); } catch(e){}
  draw();
  askLogin('Logged out. Nothing of the board is kept on this phone.');
});
$('#q').addEventListener('input', function(){ drawPeople(this.value); });
$('#find').addEventListener('click', function(){
  goPeople('');
  setTimeout(function(){ $('#q').focus(); }, 60);
});
$('#people-back').addEventListener('click', function(){ goTab(lastTab); });
$('#s-save').addEventListener('click', function(){
  var url = $('#s-url').value.trim(), key = $('#s-key').value.trim();
  var email = $('#s-email').value.trim(), pass = $('#s-pass').value;
  if (!/^https?:\/\/.+/.test(url) || key.length < 20){
    $('#setup-err').textContent = 'That URL or key does not look right.'; return;
  }
  if (!email || !pass){ $('#setup-err').textContent = 'Your email and password are both needed.'; return; }
  /* a different project is a different login */
  if (cfg && (cfg.url !== url || cfg.key !== key)) dropAuth();
  cfg = { url:url, key:key, email:email };
  try { localStorage.setItem(CFG, JSON.stringify(cfg)); } catch(e){}
  $('#setup-err').textContent = 'Logging in…';
  logIn(email, pass).then(function(){
    $('#s-pass').value = '';
    $('#setup-err').textContent = '';
    $('#setup').classList.remove('up');
    pull();
  }, function(e){
    $('#setup-err').textContent = 'Log in failed — ' + (e && e.message ? e.message : 'no answer');
  });
});
$('#s-pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#s-save').click(); });

(function(){
  var stage = $('#stage'), y0 = null;
  stage.addEventListener('touchstart', function(e){
    y0 = stage.scrollTop <= 0 ? e.touches[0].clientY : null;
  }, { passive:true });
  stage.addEventListener('touchmove', function(e){
    if (y0 === null) return;
    if (e.touches[0].clientY - y0 > 78){ y0 = null; if (cfg) pull(); }
  }, { passive:true });
  stage.addEventListener('touchend', function(){ y0 = null; }, { passive:true });
})();

(function(){
  try {
    var idx = JSON.parse(document.getElementById('atlas-index').textContent);
    pubs = idx.pubs || [];
    people = (idx.researchers || []).map(function(r){
      r._s = fold([r.name, r.group, r.cluster, r.domain, r.kwRaw].filter(Boolean).join(' '));
      return r;
    });
  } catch(e){ console.error('atlas index', e); }

  try {
    /* an older cache also held the Ledger; only Semaphore is kept */
    var c = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (c) data = { semaphore: c.semaphore || null, at: c.semaphore ? (c.at || null) : null };
    if (c && c.ledger) cacheSave();
  } catch(e){}
  try { cfg = JSON.parse(localStorage.getItem(CFG) || 'null'); } catch(e){}
  try { auth = JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch(e){}
  /* a phone that has never logged in says nothing in red: it has done
     nothing wrong yet */
  var stored = !!cfg;
  if (!cfg) cfg = { url:BUILT_IN.url, key:BUILT_IN.key };

  fitScreen();
  draw();
  if (!auth) askLogin(stored ? 'Log in to read the cloud.' : ''); else pull();
})();
</script>
