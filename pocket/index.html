gorithms for self-driving vehicles. We have found that a substantial reduction in delays can be gained by exploiting the new potential of vehicle-to-vehicle communication between cars. Other application areas include stochastics and simulation for finance and insurance.\n\nMarko also likes to study theoretical aspects of queueing models. He is very interested in so-called polling models, which are systems with multiple queues visited by a single server. He derived interpolation techniques for the mean delay in such systems and a heavy-traffic limit for k-limited polling models.","cov":"5 of 5","pubs":[715,716,717,718,719],"sim":[145,40,147,146,39,143]},{"name":"Jacques A.C. Resing","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Stochastic Operations Research","leader":false,"kwRaw":"Applied probability, queueing theory, performance analysis of (optical communication) networks,  insurance risk, optimization of condition-based maintenance models","desc":"His research is in general focused on applied probability and in particular on queueing theory. Amongst others, he studied several polling systems, fluid queues and tandem queues. These models play an important role in the performance analysis, design and optimization of modern production, transportation and communication systems. sFor example, several of his recent research papers deal with the performance analysis of optical communication networks. Another area of Jacques' interest, both in his research and teaching activities, is Insurance Risk. He is active as teacher in courses of the coherent package Finance and Risk and several of his papers study the analysis of insurance risk models. Finally, in recent years he has also become interested in the optimization of condition-based maintenance models.\n\nA nice feature of queueing theory is the fact that it has so many applications in different areas, leading to a continuous flow of new and challenging problems","cov":"5 of 5","pubs":[720,721,722,723,724],"sim":[144,147,146,143,22]},{"name":"Jaron Sanders","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Stochastic Operations Research","leader":false,"kwRaw":"Intersection of probability theory, theoretical statistics, machine learning, and operations research; optimization algorithms for large complex systems.","desc":"He researches applied mathematics on the intersection of probability theory, theoretical statistics, machine learning, and operations research, and is specifically an expert on optimization algorithms for large complex systems.","cov":"5 of 5","pubs":[725,726,727,728,729],"sim":[147,145,130,143,144,148]},{"name":"Fiona Sloothaak","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Stochastic Operations Research","leader":false,"kwRaw":"Graphs, traffic networks, queues, recourse pooling, cascading failures.","desc":"No info","cov":"5 of 5","pubs":[730,731,732,733,734],"sim":[145,144,146,143,148,40]},{"name":"A.P. (Bert) Zwart","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Stochastic Operations Research","leader":false,"kwRaw":"Stochastic networks, rare event analysis and simulation, scaling limits, scheduling under uncertainty, dynamic pricing, applications in communication and energy networks","desc":"Bert's research expertise is in applied probability and stochastic networks, in particular rare event analysis and simulation, scaling limits, scheduling under uncertainty, dynamic pricing and applications in communication and energy networks. The outcome of Bert's research makes it possible to analyze complex systems and procedures, in which traditional methods of analysis are unusable, due to the number of factors and variables involved.\n\nThe scope of his activities extends to mathematical models for computer and communication networks, call centers and production processes, which are all frequently highly dimensional and, therefore, difficult to analyze. His research aims to reduce complexity of such models by focusing on their macroscopic behavior. In addition, a new application area for stochastic operations research is emerging - energy networks, especially electricity grids - which brings new and urgent research questions.\n\nDespite the arrival of big data analytics, rare events remain rare, and we still need advanced mathematical methods and techniques to understand and gain insights'","cov":"5 of 5","pubs":[735,736,737,738,739],"sim":[143,130,147,131,146,150]},{"name":"Stella Kapodistria","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Data-Driven Stochastic Operations Research","leader":true,"kwRaw":"Data-driven decision-making, performance assessment and optimization of systems and networks under uncertainty.","desc":"Her research focuses on data-driven decision-making and the performance assessment of systems and networks under uncertainty.\n\nShe develops algorithms that integrate real-time information to optimize system and network performance, tackling challenges of scalability and computational efficiency in complex systems and large networks. Her work is published in flagship peer-reviewed journals and conferences. She also contributes to the academic community as an editorial board member of MCAP, previously serving on the editorial board of PEIS and as a guest editor for ANOR. Additionally, she has served on technical program committees for prominent conferences such as Sigmetrics, Performance, APS, ICORES, and QTNA.\n\nStella played a key role in securing funding, coordinating efforts, and establishing the 4TU Resilience Engineering Center. She has been awarded (co-PI) an NWA-ORC, an NWO Big Data, and a TKI WoZ grant.\n\nCollaboration with industrial partners in the Brainport area has shaped her research approach, bridging fundamental and applied research. These partnerships and numerous industrial projects have significantly influenced her vision and methodology.\n\nHer approach to education can be summed up as: engaging students, ensuring they fully grasp theoretical material and its practical relevance, and helping them understand its real-world applications.\n\nNowadays problems are vastly more complex than anything we have tackled in the past. Such problems cannot be solved by simply applying methods which at an earlier stage might have been sufficient. If we want to solve them, we must revolutionise our thinking, revolutionise our methods and become beacons of knowledge to the younger generations","cov":"5 of 5","pubs":[740,741,742,743,744],"sim":[53,68,146,24,75]},{"name":"Nelly V. Litvak","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Algorithms for Complex Networks","leader":true,"kwRaw":"(Information extraction from/mathematical analysis of) Complex networks, stochastic processes, randomized algorithms (medical logistics).","desc":"Nelly Vladimirovna Litvak (Russian: Нелли Владимировна Литвак, born January 27, 1972)[1] is a Russian and Dutch applied mathematician whose research includes the study of complex networks, stochastic processes, and their applications in medical logistics.\n\nShe works on mathematical methods and algorithms for complex networks, such as social networks and the WWW. Real-life networks are modeled as random graphs, and algorithms are used to extract information from the massive network data.\n\nThe overall goal of her research is to extract value from (Big) Data, focusing on network data. Her research revolves around three main topics: Information extraction and predictions based on data, mathematical analysis of network characteristics and randomized algorithms. The first looks at defining and collecting the correct measurements and data for specific purposes and deducing networks from data. The second examines mathematical properties of algorithms in networks, for example, the famous PageRank that Google invented to rank web pages. The third looks at efficient algorithms for computing network characteristics when the complete network data is not available.\n\nNetworks are fascinating. They are all around us - from social networks to power grids. Yet we know so little about them and even less we can prove. But we are getting there!'","cov":"5 of 5","pubs":[745,746,747,748,749],"sim":[130,131,148,0,132,146]},{"name":"Edwin R. van den Heuvel","domain":"Mathematics","cluster":"Statistics, Probability, and Operations Research","group":"Statistics","leader":true,"kwRaw":"Health statistics, causality, cohort studies, multi-morbesity","desc":"","cov":"5 of 5","pubs":[750,751,752,753,754],"sim":[135,65]}],"pubs":[{"t":"A Clique-Based Separator for Intersection Graphs of Geodesic Disks in $$\\mathbb {R}^2$$","y":2025,"v":"Algorithmica","u":"https://research.tue.nl/en/publications/8031aae0-b88b-493b-b818-ce7feba820eb","c":""},{"t":"Stable Approximation Algorithms for Dominating Set and Independent Set","y":2025,"v":"SIAM Journal on Discrete Mathematics","u":"https://research.tue.nl/en/publications/bad7c189-d1e8-463a-8083-b6271b5e30d0","c":1},{"t":"Computational Geometry","y":2008,"v":"nan","u":"https://research.tue.nl/en/publications/058978d5-3ce7-4bdb-9037-8ae7bd56f00e","c":1952},{"t":"The priority R-tree","y":2008,"v":"ACM Transactions on Algorithms","u":"https://research.tue.nl/en/publications/d92cfa39-e086-4621-84a0-6773c6a5d4c7","c":117},{"t":"Subquadratic algorithms for some 3Sum-hard geometric problems in the algebraic decision-tree model","y":2022,"v":"Computational Geometry","u":"https://research.tue.nl/en/publications/64a4fab0-b058-425b-8dea-86f653f4ccce","c":3},{"t":"Range Counting Oracles for Geometric Problems","y":2025,"v":"arXiv (Cornell University)","u":"https://doi.org/10.4230/lipics.socg.2025.42","c":""},{"t":"Resilient k-Clustering","y":2024,"v":"nan","u":"https://doi.org/10.1145/3637528.3671888","c":1},{"t":"1-pass ,"u":"https://research.tue.nl/en/publications/a34af9aa-c942-413e-86f9-36b9a4cb5bb7","c":""},{"t":"Rare failure analysis - challenges and perspectives from high-tech industry","y":2025,"v":"nan","u":"https://api.openalex.org/works/W4414434768","c":""},{"t":"LINEAR BIRTH/IMMIGRATION-DEATH PROCESS WITH BINOMIAL CATASTROPHES","y":2015,"v":"Probability in the Engineering and Informational Sciences","u":"https://research.tue.nl/en/publications/107a3e52-0f62-45c9-bb6f-306791aa3d82","c":48},{"t":"The M/M/1 queue with synchronized abandonments","y":2011,"v":"Queueing Systems","u":"https://research.tue.nl/en/publications/c85354b0-1b06-4cc2-a4fa-b1b51c4d472a","c":42},{"t":"Real-Time Integrated Learning and Decision Making for Cumulative Shock Degradation","y":2022,"v":"Manufacturing & Service Operations Management","u":"https://research.tue.nl/en/publications/6b07ba52-0685-4796-be25-ec3a6bed7a53","c":34},{"t":"Planted clique recovery in random geometric graphs","y":2026,"v":"Journal of Complex Networks","u":"https://api.openalex.org/works/W4415270306","c":""},{"t":"Value of risk-contact data from digital contact monitoring apps in infectious disease modeling","y":2026,"v":"Epidemics","u":"https://research.tue.nl/en/publications/7b566787-256c-4dd1-8b0b-bffb0a2f1c04","c":""},{"t":"Monte Carlo Methods in PageRank Computation: When One Iteration is Sufficient","y":2007,"v":"SIAM Journal on Numerical Analysis","u":"https://api.openalex.org/works/W2107577105","c":256},{"t":"Managing the overflow of intensive care patients","y":2006,"v":"European Journal of Operational Research","u":"https://api.openalex.org/works/W1986314674","c":154},{"t":"When Less Is More: Systematic Analysis of Cascade-Based Community Detection","y":2022,"v":"ACM Transactions on Knowledge Discovery from Data","u":"https://api.openalex.org/works/W3004357879","c":""},{"t":"Statistical Monitoring of Multivariate Count Data From Real-Time Particle Counters","y":2026,"v":"Quality and Reliability Engineering International","u":"https://api.openalex.org/works/W7172106865","c":""},{"t":"Moment estimators for a three-parameter family of spatial Poisson models","y":2026,"v":"Spatial Statistics","u":"https://api.openalex.org/works/W7167798591","c":""},{"t":"Cohort Profile: The Canadian Longitudinal Study on Aging (CLSA)","y":2019,"v":"International Journal of Epidemiology","u":"https://research.tue.nl/en/publications/60d0f5f3-466e-49ce-84d0-d2b403e382b8","c":551},{"t":"Effect of Multimodal Prehabilitation on Reducing Postoperative Complications and Enhancing Functional Capacity Following Colorectal Cancer Surgery","y":2023,"v":"JAMA Surgery","u":"https://research.tue.nl/en/publications/501e2311-ff39-4ddc-8a1b-7130d49241ea","c":470},{"t":"Mortality in patients with Dupuytren's disease in the first 5 years after diagnosis: a population-based survival analysis","y":2024,"v":"Journal of Hand Surgery (European Volume)","u":"https://research.tue.nl/en/publications/9e002958-bef7-4d04-8632-fa743fb84218","c":3}]}</script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   Semaphore's rotation, lifted out of the desk's own semaphore.js rather
   than written again here. standing(), the desk's split and three bands,
   its lead steps and everything they lean on are copied verbatim — picked
   by name, with whatever they depend on, out of the room's source (last
   re-extracted 2026-10-07, from the 2026-10-06 desk). When the arithmetic
   changes on the desk, re-extract; never edit here. A second
   implementation that looks right and ranks wrong would be worse than
   having no rotation at all.
   ══════════════════════════════════════════════════════════════════ */
/* The extraction brings Semaphore's own `let S` with it — its state
   binding — which starts empty here and is pointed at the fetched board
   before the rotation is scored. */
/* ============ state ============ */
/* ============ state ============ */
const LS='semaphore.v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY=86400000;
const pad=n=>String(n).padStart(2,'0');
const T=iso=>new Date(iso+'T12:00:00').getTime();
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmtDay=iso=>{const[y,m,d]=iso.split('-');return +d+' '+MONTHS[+m-1]+' '+y;};
const ymAdd=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const i=y*12+(m-1)+n;return Math.floor(i/12)+'-'+pad(i%12+1);};
const thisYM=()=>todayISO().slice(0,7);
/* ───────── how much an arena is worth ─────────
   The rotation on its own treats every arena alike: a programme you watch out of
   diligence comes round as often as the partnership your work lives in, which is
   fine for eight arenas and a treadmill for forty. So each one carries a standing
   weight, set once in its own panel and rarely touched.

   It buys frequency, not height — the same choice the open call makes. A central
   arena turns about twice as often, a peripheral one about a third as often, and
   the freezer is simply the step past peripheral: one axis, four positions, from
   the work you are in to the work you have put away. */
/* Where a lead has got to. Three steps and no more: the point is to know at a
   glance whether anyone has been written to yet, not to run a pipeline. There is
   deliberately no 'agreed' — the moment something is agreed it stops being a
   lead and becomes a project on the ledger, so the last thing this side can say
   is that a conversation is running. Closing a lead is separate: one closed at
   'talking' came to something, one closed at 'spotted' did not, and between them
   an arena's record says whether it has ever been worth the attention.

   Anything still carrying the old fourth step is read as 'talking' — the far end
   of the funnel it actually reached — rather than dropped back to the start. */
const STAGES=['spotted','contacted','talking'];
const STAGE_NAME={spotted:'Spotted',contacted:'Contacted',talking:'Talking'};
const stageOf=l=>{const s=l&&l.stage;
  return STAGE_NAME[s]?s:(s==='agreed'?'talking':'spotted');};
const WEIGHTS={
  central:   {name:'Central',   turn:.6,lift:1, long:'Work you are actually in. Comes round about twice as often.'},
  ordinary:  {name:'Ordinary',  turn:1, lift:.5,long:'The ordinary rotation \u2014 about four weeks.'},
  peripheral:{name:'Peripheral',turn:3, lift:0, long:'Watched out of diligence. Comes round about a third as often.'}
};
const weightOf=a=>WEIGHTS[a&&a.weight]?a.weight:'ordinary';
/* stages of a call, in the order they happen */
const ROLES={
  announcement:{name:'Announcement window',short:'announcement window',c:'var(--r-ann)',ord:0},
  publication:{name:'Publication date',short:'publication',c:'var(--r-pub)',ord:1},
  deadline:{name:'Submission deadline',short:'submission deadline',c:'var(--r-dl)',ord:2}
};
function dtLabel(dt){
  return dt.kind==='call'?(dt.call||'Untitled call'):(dt.label||'(untitled)');
}
function defaultTypes(){
  return ['Partnership','Mission','Cluster','Joint Undertaking','Programme'].map(n=>({id:uid(),name:n}));
}
function blank(){
  return {v:1,types:defaultTypes(),arenas:[],
    ui:{typeSel:[],tagSel:[],q:'',
        grades:{fixed:true,uncertain:true},
        layers:{brokerage:true,call:true},
        win:{start:ymAdd(thisYM(),-1),span:12},collapsed:{},filtersOpen:false,view:'board',
        wallSort:'rotation',boardSort:'next',
        howOpen:false,freezerOpen:false,wopen:{},flipped:{}}};
}
/* An arena remembers which of its own dates it is waiting for. That goes stale
   the moment the dates change, so this puts it straight — a wait ends when the
   thing waited for is deleted or has been and gone. */
function reconcile(a){
  if(!a)return a;
  if(a.hold){
    const dt=(a.dates||[]).find(d=>d.id===a.hold.dateId&&d.start);
    if(!dt||T(dt.end||dt.start)<T(todayISO()))a.hold=null;
  }
  return a;
}
/* The one door everything that arrives comes through — storage, an import,
   the cloud. What leaves here is a board every other function in the room
   may assume the shape of, so the two collections the whole app iterates
   are made real first and the arenas are given the fields they are read
   for whether or not they came with them. */
function migrate(s){
  if(!s||typeof s!=='object'||Array.isArray(s))s={};
  if(!Array.isArray(s.arenas))s.arenas=[];
  if(!Array.isArray(s.types)||!s.types.length)s.types=defaultTypes();
  s.types=s.types.filter(t=>t&&typeof t==='object')
    .map(t=>({id:t.id||uid(),name:String(t.name||'').trim()||'Untitled type'}));
  s.arenas=s.arenas.filter(a=>a&&typeof a==='object');
  s.arenas.forEach(a=>{
    if(!a.id)a.id=uid();
    a.name=String(a.name==null?'':a.name).trim()||'Unnamed arena';
    if(!Array.isArray(a.tags))a.tags=[];
  });
  s.arenas.forEach(a=>{
    if(!Array.isArray(a.links))a.links=a.link?[{id:uid(),label:'',url:a.link}]:[];
    delete a.link;
    (a.links||[]).forEach(l=>{if(!l.id)l.id=uid();});
  });
  s.arenas.forEach(a=>{
    if(!a.brokerage||typeof a.brokerage!=='object')a.brokerage={notes:'',links:[]};
    if(!Array.isArray(a.brokerage.links))a.brokerage.links=[];
    if(typeof a.brokerage.notes!=='string')a.brokerage.notes='';
    /* Pinning once belonged to a single brokerage link, then only to the whole
       card; a board from the first days comes over with its pinned-link arenas
       pinned whole. Since 2026-10-06 a link can be pinned again in its own
       right, beside the cards, so a link's `pin` — the moment it was pinned —
       is kept rather than cleared as it used to be. */
    if(typeof a.pin!=='boolean')a.pin=a.brokerage.links.some(l=>l.pin);
    a.brokerage.links.forEach(l=>{if(!l.id)l.id=uid();});
    /* the freezer holds the date it went in, so the panel can say since when */
    if(typeof a.frozenAt!=='string')a.frozenAt=null;
    /* how much this arena is worth of the rotation; unset means ordinary */
    if(!WEIGHTS[a.weight])a.weight='ordinary';
    /* one sweep clock and one follow-up. The old pair of stamps collapses
       into the sweep. */
    if(!('sweptAt' in a))a.sweptAt=a.lastCheckedAt||null;
    if(!('sweptPrev' in a))a.sweptPrev=a.prevCheckedAt||null;
    delete a.lastCheckedAt;delete a.prevCheckedAt;delete a.lastWatchedAt;delete a.prevWatchedAt;
    /* The look notice is gone — the nightly agents hunt for the event and the
       tool now and leave what they find in Dispatches — so the answers it kept
       ("nothing yet", "found it") have nothing left to answer and are dropped. */
    delete a.look;
    /* A lead is whatever a sweep turned up: a partner, a project page, a thread
       worth pursuing. The old single follow-up was the same object with nothing
       found yet — a name and a date — so it becomes one rather than sitting
       beside them. */
    if(!Array.isArray(a.leads))a.leads=[];
    if(a.todo&&typeof a.todo==='object'&&String(a.todo.text||'').trim())
      a.leads.push({id:uid(),project:String(a.todo.text).trim(),match:'',links:[],
                    stage:'spotted',due:a.todo.due||todayISO(),doneAt:null});
    delete a.todo;
    a.leads.forEach(l=>{
      if(!l.id)l.id=uid();
      /* a lead used to be a partner with a note; it is now the project itself,
         and a separate thought about who might fit it */
      if(typeof l.project!=='string')l.project=String(l.name||'').trim();
      if(typeof l.match!=='string')l.match=String(l.note||'');
      delete l.name;delete l.note;
      l.project=l.project.trim();
      /* through stageOf, so the fold from the old fourth step and the
         fallback for anything unreadable are each stated once. Written back
         rather than merely read: a lead that reached the far end of the
         funnel must not be knocked to the start of it on the way in. */
      l.stage=stageOf(l);
      /* Which way it was contacted — see "the ruit". A lead from before the
         two paths existed that had got past Spotted is put on the lower path,
         the lead itself; Mark asked only that the data come out clean. */
      l.toResearchers=l.toResearchers===true;
      l.toLead=l.toLead===true;
      if(l.stage==='spotted'){l.toResearchers=false;l.toLead=false;}
      else if(!l.toResearchers&&!l.toLead)l.toLead=true;
      if(!Array.isArray(l.links))l.links=[];
      l.links.forEach(k=>{if(!k.id)k.id=uid();});
      if(typeof l.due!=='string'||!l.due)l.due=null;
      if(typeof l.doneAt!=='string'||!l.doneAt)l.doneAt=null;
      /* what has happened to it, oldest first; the old bolt-on wrote a
         formatted stamp, the card now writes the day itself */
      if(!Array.isArray(l.updates))l.updates=[];
      l.updates=l.updates.filter(u=>u&&typeof u.text==='string'&&u.text.trim())
        .map(u=>u.at?{at:String(u.at),text:u.text}:{stamp:String(u.stamp||''),text:u.text});
    });
    a.leads=a.leads.filter(l=>l.project||l.match||l.links.length||l.updates.length);
    /* parked until a dated event of its own; the date is held by reference, so
       moving the event moves the wait with it */
    if(!a.hold||typeof a.hold!=='object'||!a.hold.dateId)a.hold=null;
    else a.hold={dateId:String(a.hold.dateId)};
    delete a.todos;
    if(!Array.isArray(a.dates))a.dates=[];   /* the rest of the app iterates this freely */
    a.dates.forEach(dt=>{
      /* everywhere else reads a date as call-or-brokerage and as one of the
         granularities the editor offers — 'none' among them, which is how an
         entry says it is coming but has no date yet */
      dt.kind=dt.kind==='call'?'call':'brokerage';
      if(!['day','month','quarter','half','year','range','none'].includes(dt.gran))
        dt.gran=dt.start?((dt.end&&dt.start!==dt.end)?'range':'day'):'none';
      /* A date is a span of one day or of many, and everything downstream
         reads both ends of it. A file written by hand, or by a version that
         only ever kept single days, can arrive with a start and no end —
         and T(undefined) is NaN, which then runs silently through the whole
         standing calculation and leaves the card with a score no comparison
         can order. Both ends, once, here. */
      if(!dt.start)dt.start=null;
      if(!dt.end)dt.end=dt.start;
      if(dt.start&&dt.end<dt.start){const e=dt.end;dt.end=dt.start;dt.start=e;}
      if(dt.grade!=='fixed')dt.grade='uncertain';
      if(dt.kind==='call'){
        if(!dt.call)dt.call=dt.label||'Call';
        if(!ROLES[dt.role])dt.role='publication';
      }
    });
  });
  /* ── the ui, whole ──
     Every field below was guarded one at a time, and each guard asked only
     whether `s.ui` existed at all. A board arriving with *some* of a ui —
     a hand-edited file, an export from a build that kept fewer settings —
     therefore passed straight through with holes in it, and the first
     render read `S.ui.tagSel.filter` off nothing and threw. That throw
     happened after the state had already been written to storage, so the
     room came back dead on the next load and stayed dead: exactly the loss
     the load() below refuses to allow, arriving by the other door.

     So the ui is not patched field by field any more. A fresh, complete one
     is made, and whatever arrived is laid over it a field at a time, each
     one taken only if it is the shape that field is meant to be. There is
     no way through this that leaves a hole. */
  {
    const d=blank().ui, u=(s.ui&&typeof s.ui==='object'&&!Array.isArray(s.ui))?s.ui:{};
    const strs=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):null;
    const map=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:null;
    const ui=Object.assign({},d);
    ui.typeSel  = strs(u.typeSel) || d.typeSel;
    ui.tagSel   =(strs(u.tagSel) || d.tagSel).map(t=>String(t).trim().toLowerCase());
    ui.q        = typeof u.q==='string' ? u.q : d.q;
    /* uncertain is never filtered out: a date you are unsure of is the one
       you most need to see */
    ui.grades   = {fixed:!(map(u.grades)&&u.grades.fixed===false), uncertain:true};
    ui.layers   = {brokerage:!(map(u.layers)&&u.layers.brokerage===false),
                   call:     !(map(u.layers)&&u.layers.call===false)};
    ui.collapsed= map(u.collapsed) || {};
    /* which type sections stand open on the wall — absent means shut, so a
       type you have never opened, including one made later, starts closed */
    ui.wopen    = map(u.wopen)   || {};
    ui.flipped  = map(u.flipped) || {};
    ui.view     = (u.view==='brokerage'||u.view==='dispatch') ? u.view : 'board';
    ui.wallSort = ['rotation','type','pinned','leads'].includes(u.wallSort) ? u.wallSort : 'rotation';
    ui.boardSort = u.boardSort==='phase' ? 'phase' : 'next';
    ui.filtersOpen = u.filtersOpen===true;
    ui.howOpen     = u.howOpen===true;
    ui.freezerOpen = u.freezerOpen===true;
    const w=map(u.win)||{};
    ui.win = {
      start: /^\d{4}-\d{2}$/.test(String(w.start||'')) ? w.start : d.win.start,
      span:  [6,9,12,18,24].includes(+w.span) ? +w.span : d.win.span
    };
    s.ui=ui;
  }
  const first=new Map();
  s.arenas.forEach(a=>(a.tags||[]).forEach(t=>{
    const k=String(t).trim().toLowerCase();
    if(k&&!first.has(k))first.set(k,String(t).trim());
  }));
  s.arenas.forEach(a=>{
    const seen=new Set(),out=[];
    (a.tags||[]).forEach(t=>{const k=String(t).trim().toLowerCase();
      if(!k||seen.has(k))return;seen.add(k);out.push(first.get(k));});
    a.tags=out;
  });
  /* Anything an arena remembers about its dates has to be reconciled whenever
     those dates change — on load here, and at the moment of an edit below. */
  s.arenas.forEach(reconcile);
  return s;
}
/* Reading the board is the one place this app can lose everything: if migrate
   throws, the old code caught it, opened a blank board and let the next save
   write that blank over the only copy. So a genuine first run is told apart from
   a board that would not read — and in the second case nothing is written at
   all, leaving the stored text untouched for a reload or an import to recover. */
let loadError=null;
function load(){
  const raw=localStorage.getItem(LS);
  if(!raw)return null;                       /* nothing stored: a real first run */
  try{
    const s=JSON.parse(raw);
    if(!s||!s.arenas||!s.types)throw new Error('not a Semaphore board');
    return migrate(s);
  }catch(e){
    loadError=e;
    return null;
  }
}
let S=load()||blank();
function dispDate(dt){
  if(dt.gran==='none'||!dt.start)return 'no date yet';
  const[y,m]=dt.start.split('-').map(Number);
  switch(dt.gran){
    case 'day':return fmtDay(dt.start);
    case 'month':return MONTHS[m-1]+' '+y;
    case 'quarter':return 'Q'+(Math.floor((m-1)/3)+1)+' '+y;
    case 'half':return 'H'+(m<7?1:2)+' '+y;
    case 'year':return String(y);
    case 'range':return fmtDay(dt.start)+' \u2013 '+fmtDay(dt.end);
    default:return '';
  }
}
               /* how much history a row shows before it offers the rest */
function arena(id){return S.arenas.find(a=>a.id===id);}
/* ---- read view: one stream, in time order ---- */
function linkName(lk){
  if(lk.label)return lk.label;
  if(!lk.url)return '(unnamed)';
  /* a mail address has no host to stand for it, so it stands for itself */
  if(/^mailto:/i.test(lk.url))return lk.url.slice(7);
  try{return new URL(lk.url).hostname.replace(/^www\./,'');}catch(e){return lk.url;}
}
function bkPos(a){return typeof a.bkPos==='number'?a.bkPos:1e9;}
/* The rotation wall's order. An arena with nothing recorded still earns a
   card while it is asking for something — a wait whose day is in reach —
   because a ghost at the foot of the wall cannot say so. It drops back to a

    .sort((x,y)=>y.s.score-x.s.score||x.a.name.localeCompare(y.a.name));

/* ───────── standing ─────────
   A card's height on the wall is one number, and three things move it. None of
   the arithmetic is ever on screen: a card shows a follow-up, or just its own
   size.

   SWEEP   the plain rotation. You go through a platform, you stamp it, it
           sinks; time floats it back up. The calendar raises the ceiling — a
           platform is worth trawling once its call is published, best shortly
           after, tailing off towards the deadline.
           Finding the event or the tool in the first place used to be a
           fourth: a notice in the run-up to a publication that asked you to go
           and look. It kept asking for hunts the scheduled agents now do every
           night, so it is gone; what they find waits in Dispatches.
   A lead's day used to be a fourth: on the day, its card went to the top of
   the wall with a green strip. The Ledger's board now carries every lead on
   its day, so the card no longer calls out for it (Mark, 2026-10-06) — a lead
   changes nothing about where its arena stands. Putting a card away is the
   wait, below.
   WAIT    parked against a date of its own: dormant until three weeks out,
           then awake and climbing as the day comes. */
const SWEEP_CYCLE=28;
                    /* days for an untouched card to climb back */
const SWEEP_SHORT=7;

const NEAR=21;

const EVENT_NEAR=30;
                     /* a month either side of a brokerage event */
const FORMING=42;

                                            together — which is why brokerage surfaces within
                                            roughly that long after a call opens, and why it is

   A card is in exactly one state, and the rungs do not overlap, so the order you
   read down the wall is the order of the ladder itself: what is asking to be
   looked at, what is merely due a turn, and what is parked. (There was a
   fourth rung above them, for a lead whose day had come; see "standing".)

   rotation could climb past a card that was asking you a question. Now the kind
   of thing decides the rung and the degree decides the place within it. */
const RUNG={asking:[.68,.88],turning:[.10,.66],parked:[0,.04]};

/* this year is understood, so it goes unsaid */
const trimYear=s=>{const y=' '+new Date().getFullYear();return s.endsWith(y)?s.slice(0,-y.length):s;};
const shortDay=iso=>trimYear(fmtDay(iso));

  ? shortDay(dt.start)+' \u2013 '+shortDay(dt.end)

  const by=new Map();
  for(const dt of (a.dates||[])){
    if(dt.kind!=='call'||!dt.start)continue;
    const k=callKey(dt);
    if(!by.has(k))by.set(k,{key:k,name:dt.call||'Untitled call'});
    by.get(k)[ROLES[dt.role]?dt.role:'publication']=dt;

}
/* How badly a call wants you to go through the platform for partners.

   Partner search is front-loaded. Profiles take a week or two to appear on a
   matchmaking platform after a call opens, so the trawl is worth most about
   three weeks in; and by the last six weeks before the deadline the consortia
   have closed and the writing has started, so a sweep then turns up little but
   others in the same position. The ramp therefore runs over that forming window
   rather than over the whole call, and its peak sits at a real three weeks
   rather than at a share of however long the call happens to run — brokerage
   lands a month or so after opening whether the call is open for three months
   or for seven. */
function sweepOf(w){
  const now=T(todayISO());
  const pub=w.publication,dl=w.deadline;

  const from=T(pub.end);
  const shut=dl?T(dl.end):from+3*FORMING*DAY;   /* no deadline recorded: assume about four months */
  if(now<from||now>shut)return null;
  const open=dl?('Open until <b>'+esc(shortDate(dl))+'</b>'):'Call open';
  const close=Math.max(from+7*DAY,shut-Math.min(FORMING*DAY,.45*(shut-from)));

/* The other thing that quickens a card, and the plainest one: a brokerage event
   of its own, close by. From a month before until a month after, the arena is
   worth looking at weekly whatever else is true of it — beforehand because
   registration, profiles and the agenda all land in those weeks, and afterwards
   because that is when the contacts made there are still warm.

   Only an actual event counts. A brokerage entry pencilled into a quarter or a
   year is a guess at a season, not a date, so anything spanning more than about
   six weeks is left out of it. */
function eventNear(a){
  const now=T(todayISO());
  for(const d of (a.dates||[])){
    if(d.kind!=='brokerage'||!d.start)continue;
    const s=T(d.start),e=T(d.end||d.start);
    if(e-s>45*DAY)continue;
    if(now>=s-EVENT_NEAR*DAY&&now<=e+EVENT_NEAR*DAY)return d;

}
/* Both branches used to test for a nought day, and both dates here are
   noon-normalised \u2014 so a day that has neither arrived nor passed is always
   at least one, and "tomorrow" and "yesterday", which were plainly what was
   wanted, could not be reached. Today itself is caught by the middle line. */
function eventNote(d){
  const now=T(todayISO()),s=T(d.start),e=T(d.end||d.start);
  const said='<b>'+esc(dtLabel(d))+'</b>';
  if(now<s){const n=daysBetween(now,s);
    return said+' \u2014 '+(n===1?'tomorrow':'in '+n+' days');}
  if(now<=e)return said+' \u2014 on now';
  const n=daysBetween(e,now);

/* A wait, resolved: dormant until a few weeks out, then awake and climbing as
   the day approaches. The event is held by reference, so if you move the date
   the wait moves with it; if you delete it, the wait is over. */
function holdOf(a){
  if(!a.hold||!a.hold.dateId)return null;
  const dt=(a.dates||[]).find(d=>d.id===a.hold.dateId&&d.start);
  if(!dt)return null;
  const now=T(todayISO()),at=T(dt.start),gone=T(dt.end||dt.start);

  const wake=at-NEAR*DAY,near=daysBetween(now,at);
  return {dt,at,wake,near,asleep:now<wake,label:dtLabel(dt)};
}
/* What a sweep turned up. A lead is open until you tick it off; a done one stays
   in the record, because "did this arena ever produce anything" is a question
   worth being able to answer. */
function openLeads(a){return (a.leads||[]).filter(l=>!l.doneAt);}
function leadName(l){return l.project||(l.links[0]?linkName(l.links[0]):'')||'Untitled lead';}
function standing(a){
  const now=T(todayISO());
  let sweep=null;
  for(const w of windowsOf(a)){
    const K=sweepOf(w);
    if(K&&(!sweep||K.pull>sweep.pull))sweep={...K,call:w.name};

     the cadence tightens from four weeks to about a week at the peak of the
     window, so it keeps coming back around while the call is live. The arena's

     moment is, the weight says how much the arena is worth at all, and they
     multiply rather than competing. */
  const W=WEIGHTS[weightOf(a)];
  let cycle=W.turn*(SWEEP_CYCLE-(SWEEP_CYCLE-SWEEP_SHORT)*(sweep?sweep.pull:0));

    /* the event is the more immediate fact of the two, so it is the one said */
    st.note=event?{pull:1,text:eventNote(event)}:sweep;

       the rung whatever its weight or its calls — nothing shouts at you the day

/* ───────── the three bands ─────────
   Standing decides the order; it is a poor judge of size. On a quiet week every
   score is low and nothing would stand at full height; on a busy one they all
   clear the bar and the wall is a wall of equals. Either way the readout is
   lost. So the cut is relative: a short head, a wider middle, and the longest
   band at the bottom, in roughly 1 : 2 : 4. The scores still decide who goes
   where — only the size of the bands is fixed, so the top of the stack means
   the same thing whatever the day looks like. */

  if(n===1)return[1,0,0];
  if(n===2)return[1,1,0];

  let mid=Math.max(lead,Math.ceil(2*n/7)),rest=n-lead-mid;

function bandOf(i,quota){return i<quota[0]?'lead':i<quota[0]+quota[1]?'mid':'rest';}
/* What the nightly agents brought, and whether you have looked since. A date
   or a link that comes in through Dispatches carries `foundAt`, the moment it
   was accepted, and reads as new until the arena is next swept — a sweep is
   already the act that means "I have been through this one", so it needs no
   second button to say so. The card and the panel ask this of the same
   record, which is what keeps the two in step: sweep from either and the mark
   goes from both. Before this an accepted finding simply joined the arena
   and looked exactly like something typed by hand, so a morning's Accept all
   left nothing to say what had changed. */
function isFresh(a,x){return !!(x&&x.foundAt)&&(!a.seenAt||x.foundAt>a.seenAt);}
/* ---- the line on top of a card ----
   What a card has to say first is where its arena stands in a call's run:
   open, about to open, or between calls, and how long until the next thing
   that matters. It was a spine of up to four dates, and on a real wall
   those were topic codes cut off at the same point, several of them
   sharing one deadline, so finding out whether anything was open meant
   reading every row, and the links under it read as more of the same
   (Mark, 2026-10-07: "a mess"). Now it is one phase line over a strip of
   time, picked from three drawn options.

   The strip runs from five weeks back to the last date it shows. A call is
   a bar from its publication to its deadline. The stages of one call —
   Stage 1 and Stage 2, pre- and full proposals, outline and full proposal —
   are one bar with a notch at each earlier deadline (`callBase`), and calls
   with exactly the same dates are one bar, because a cluster's work
   programme opens a dozen topics on the same two days and a dozen identical
   bars say nothing. Brokerage events are diamonds on a lane above, and
   today is the gold line through both. Names are in the room's tooltip:
   the strip is a picture of where you are, the panel is where you read.

function callBase(n){

    .replace(/\s*[–—-]\s*(stage\s*\d|pre-?proposals?|full( project)? proposals?|project outline).*$/i,'')
    .replace(/[\s\/]+stage\s*\d.*$/i,'').trim();
}
function callRuns(a){
  const now=T(todayISO()),by=new Map();
  for(const d of a.dates||[]){
    if(d.kind!=='call'||!d.start||d.gran==='none')continue;
    const k=callBase(dtLabel(d))||dtLabel(d);
    if(!by.has(k))by.set(k,{all:[],opens:[],anns:[],dls:[]});
    const r=by.get(k);
    r.all.push(d);

  const byStart=(x,y)=>T(x.start)-T(y.start);

    r.opens.sort(byStart);r.anns.sort(byStart);r.dls.sort(byStart);

       opening when no publication is known. It is uncertain when either of
       its two ends is — ITEA's call was drawn dashed for a vague
       announcement month although its publication and deadline were fixed */
    r.open=r.opens[0]||r.anns[0]||null;
    r.close=r.dls[r.dls.length-1]||null;

    r.next=r.dls.find(d=>T(d.end||d.start)>=now)||null;

       which is longer than any call here runs, and closed after that */

  const all=[...merged.values()];

    .sort((x,y)=>(x.state==='soon')-(y.state==='soon')||when(x)-when(y));
  const last=all.filter(r=>r.state==='closed')
    .sort((x,y)=>T(y.close?y.close.start:y.open.start)-T(x.close?x.close.start:x.open.start))[0]||null;
  return {live,last,all};
}
function linkHost(lk){
  try{return new URL(lk.url).hostname.replace(/^www\./,'');}catch(e){return '';}
}
/* What a press on one of the ruit's dots does — the one place it is decided,
   used by this room's own dots and by the Ledger's. The first dot puts a lead
   back to Spotted; a middle dot switches its path; the last makes the lead
   Talking, or takes it back to Contacted when it already is. A lead with no
   path left lit falls back to Spotted, because "contacted, but nobody" says
   nothing; and a lead made Talking with no path yet takes the lower one, the
   lead itself, since a conversation is with someone. */
function leadPath(l,v){
  if(v==='spotted'){l.stage='spotted';l.toResearchers=false;l.toLead=false;return true;}
  if(v==='researchers'||v==='lead'){
    const k=v==='researchers'?'toResearchers':'toLead';
    l[k]=!l[k];
    if(!l.toResearchers&&!l.toLead)l.stage='spotted';
    else if(l.stage==='spotted')l.stage='contacted';
    return true;
  }
  if(v==='talking'){
    if(l.stage==='talking'){l.stage=(l.toResearchers||l.toLead)?'contacted':'spotted';return true;}
    if(!l.toResearchers&&!l.toLead)l.toLead=true;
    l.stage='talking';return true;
  }
  return false;
}
/* Which of Contacted's two paths a lead is on, for the leads view's split. */
const KIND_RANK={researchers:0,both:1,lead:2};
const KIND_NAME={researchers:'researchers contacted',both:'both contacted',lead:'lead contacted'};
function leadKind(l){return l.toResearchers&&l.toLead?'both':(l.toResearchers?'researchers':'lead');}

  $('#stamp').textContent = m < 1 ? 'up to date'
    : m < 60 ? 'as of ' + m + ' min ago'
    : 'as of ' + new Date(data.at).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

/* ── dates ──────────────────────────────────────────────────────────── */

function pad2(n){ return String(n).padStart(2,'0'); }
function isoToday(){ var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function daysTo(iso){
  if (!iso) return null;
  return Math.round((new Date(String(iso).slice(0,10)+'T12:00:00') - new Date(isoToday()+'T12:00:00'))/86400000);
}

/* ── writing ────────────────────────────────────────────────────────────
   Every change lands locally first, so the phone answers under the
   thumb rather than after a round trip. It then goes to the cloud the
   safe way: fetch the row again, apply the same change to that copy, put
   it back. Anything can be taken back while the toast is up. */

function cacheSave(){
  try { localStorage.setItem(CACHE, JSON.stringify(data)); } catch(e){}
}

var toastTimer = null;
function toast(text, undo, bad){
  var t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  var btn = document.getElementById('toast-do');
  btn.textContent = undo ? 'Undo' : '';
  btn.style.display = undo ? '' : 'none';
  btn.onclick = function(){ hideToast(); if (undo) undo(); };
  t.classList.toggle('bad', !!bad);
  t.classList.add('up');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 6000 : 3800);
}
function hideToast(){ document.getElementById('toast').classList.remove('up'); }

/* `apply` is a pure function of the Semaphore blob: it runs on the local
   copy for the eye, and again on whatever the cloud currently holds.
   There is one row now, `semaphore`; the argument is kept for clarity. */
function commit(row, apply, said, undoApply){
  row = 'semaphore';
  var key = 'semaphore';
  if (!data[key]) return Promise.resolve();
  var before = JSON.stringify(data[key]);

  apply(data[key]);
  cacheSave(); draw();
  toast(said, undoApply ? function(){ commit(row, undoApply, 'Put back'); } : null);

  if (!cfg) return Promise.resolve();
  return rest('app_state?id=eq.' + row + '&select=data').then(function(rows){
    if (!rows || !rows.length) throw new Error('row missing');
    var d = typeof rows[0].data === 'string' ? JSON.parse(rows[0].data) : rows[0].data;
    apply(d);
    return rest('app_state', { method:'POST',
      prefer:'resolution=merge-duplicates,return=minimal',
      body:[{ id:row, data:d, updated_at:new Date().toISOString() }] })
      .then(function(){ data[key] = d; cacheSave(); draw(); });
  }).catch(function(e){
    data[key] = JSON.parse(before); cacheSave(); draw();
    toast('Not saved: ' + (e && e.message ? e.message : 'unknown'), null, true);
    console.error(e);
  });
}

/* ── the mutations, written once and reused by every control ────────── */

function eachLead(d, ref, fn){
  (d.arenas || []).forEach(function(a){
    if (a.id !== ref.aid) return;
    (a.leads || []).forEach(function(l){ if (l.id === ref.lid) fn(l); });
  });
}
function edit(ref, fn){ return function(d){ eachLead(d, ref, fn); }; }

/* the desk keeps a lead's doneAt as a plain day */
function setDone(ref, on){
  var day = isoToday();
  commit('semaphore', edit(ref, function(x){ x.doneAt = on ? day : null; }),
    on ? 'Completed' : 'Reopened',
    edit(ref, function(x){ x.doneAt = on ? null : day; }));
}

function setDate(ref, iso, was){
  commit('semaphore', edit(ref, function(x){ x.due = iso || null; }),
    iso ? 'Moved to ' + longDate(iso) : 'Date cleared',
    edit(ref, function(x){ x.due = was || null; }));
}

/* Where a lead has got to: a press on one of the diamond's four dots, decided
   by the desk's own leadPath (copied into script 1) — Spotted clears both
   paths, a middle dot switches its path, the last makes it Talking. Undo puts
   back exactly the three fields it may have touched. */
var PATH_KEYS = ['stage', 'toResearchers', 'toLead'];
function setPath(ref, v, lead){
  var was = keep(lead, PATH_KEYS);
  var probe = keep(lead, PATH_KEYS); leadPath(probe, v);
  commit('semaphore', edit(ref, function(l){ leadPath(l, v); }),
    'Now ' + STAGE_NAME[stageOf(probe)] + pathSaid(probe),
    edit(ref, function(l){ putBack(l, was); }));
}
function pathSaid(l){
  if (stageOf(l) === 'spotted') return '';
  return l.toResearchers && l.toLead ? ' — both contacted'
       : l.toResearchers ? ' — researchers contacted' : l.toLead ? ' — lead contacted' : '';
}
/* a snapshot of some fields, and putting it back — absent stays absent */
function keep(o, keys){
  var k = {}; keys.forEach(function(x){ k[x] = o && (x in o) ? o[x] : undefined; }); return k;
}
function putBack(o, k){
  Object.keys(k).forEach(function(x){ if (k[x] === undefined) delete o[x]; else o[x] = k[x]; });
}

/* a lead's update, in the desk's shape: {at:'YYYY-MM-DD', text}.
   Older ones carry {stamp, text}; both are read. */
function addUpdate(ref, text){
  var day = isoToday();
  function same(u){ return u && u.at === day && u.text === text; }
  return commit('semaphore', edit(ref, function(x){
    if (!Array.isArray(x.updates)) x.updates = [];
    if (!x.updates.some(same)) x.updates.push({ at: day, text: text });
  }), 'Update added', edit(ref, function(x){
    x.updates = (x.updates || []).filter(function(u){ return !same(u); });
  }));
}
function updWhen(u){
  if (!u) return '';
  if (u.at) return briefDate(u.at) + (String(u.at).slice(0,4) !== isoToday().slice(0,4)
                                      ? ' ' + String(u.at).slice(0,4) : '');
  return u.stamp || '';
}

/* editing what the lead actually says */
function editItem(ref, fields, was){
  commit('semaphore', edit(ref, function(x){
    Object.keys(fields).forEach(function(k){ x[k] = fields[k]; });
  }), 'Edited', edit(ref, function(x){
    Object.keys(was).forEach(function(k){ x[k] = was[k]; });
  }));
}

/* A new lead, in the shape Semaphore gives one — the same fields, the
   same first stage, a URL normalised the way it normalises them. */
function addLead(aid, fields){
  var id = (typeof uid === 'function') ? uid()
         : 'p' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  var lead = { id:id, project:fields.project || '', match:fields.match || '',
               links:[], stage:'spotted', toResearchers:false, toLead:false,
               due:fields.due || (typeof todayISO === 'function' ? todayISO() : isoToday()),
               doneAt:null, updates:[] };
  if (fields.url && fields.url.trim())
    lead.links.push({ id:(typeof uid === 'function') ? uid() : id + 'l', label:'',
      url:deskUrl(fields.url) });
  commit('semaphore', function(d){
    (d.arenas || []).forEach(function(a){
      if (a.id !== aid) return;
      if (!Array.isArray(a.leads)) a.leads = [];
      if (!a.leads.some(function(l){ return l.id === id; })) a.leads.push(lead);
    });
  }, 'Lead added', function(d){
    (d.arenas || []).forEach(function(a){
      if (a.id !== aid) return;
      a.leads = (a.leads || []).filter(function(l){ return l.id !== id; });
    });
  });
}

/* a bare address read the desk's way: one with an @ is a person to write
   to, anything else without a scheme is a site */
function deskUrl(u){
  u = String(u || '').trim();
  if (!u) return '';
  if (/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(u)) return 'mailto:' + u;
  return /^(https?:|mailto:|file:)/i.test(u) ? u : 'https://' + u;
}
function onArena(aid, fn){
  return function(d){ (d.arenas || []).forEach(function(x){ if (x.id === aid) fn(x); }); };
}
function onLink(aid, lid, fn){
  return onArena(aid, function(x){
    ((x.brokerage && x.brokerage.links) || []).forEach(function(k){ if (k.id === lid) fn(k); });
  });
}

/* Stamping an arena, as the desk's sweep: the day, with a same-day stamp
   taking itself back; and the moment, which is what marks the nightly
   agent's findings seen. */
var SWEEP_KEYS = ['sweptAt', 'sweptPrev', 'seenAt', 'seenPrev'];
function stampArena(a){
  var t = isoToday(), was = keep(a, SWEEP_KEYS), off = (a.sweptAt === t);
  var now = new Date().toISOString();
  commit('semaphore', onArena(a.id, function(x){
      if (x.sweptAt === t){ x.sweptAt = x.sweptPrev || null; x.seenAt = x.seenPrev || null; }
      else { x.sweptPrev = x.sweptAt || null; x.sweptAt = t;
             x.seenPrev = x.seenAt || null; x.seenAt = now; }
    }),
    off ? 'Stamp taken off ' + (a.name || 'arena') : (a.name || 'Arena') + ' stamped',
    onArena(a.id, function(x){ putBack(x, was); }));
}

/* a whole card kept on Pinned */
function pinArena(a){
  var was = keep(a, ['pin']), on = !a.pin;
  commit('semaphore', onArena(a.id, function(x){ x.pin = !x.pin; }),
    on ? 'Card pinned' : 'Card unpinned',
    onArena(a.id, function(x){ putBack(x, was); }));
}

/* the ring: ask the nightly agent to look at this arena on its next run */
function askAgent(a){
  var was = keep(a, ['askAt']), on = !a.askAt, now = new Date().toISOString();
  commit('semaphore', onArena(a.id, function(x){ x.askAt = x.askAt ? null : now; }),
    on ? 'Asked — the nightly agent looks here on its next run' : 'Request taken back',
    onArena(a.id, function(x){ putBack(x, was); }));
}

/* A brokerage link pinned is the moment it was pinned, which is the order
   Pinned lists them in; unpinned, it is back on its card. */
function pinLink(a, lk){
  var was = keep(lk, ['pin']), on = !lk.pin, now = new Date().toISOString();
  commit('semaphore', onLink(a.id, lk.id, function(k){ if (k.pin) delete k.pin; else k.pin = now; }),
    on ? 'Link pinned' : 'Link back on its card',
    onLink(a.id, lk.id, function(k){ putBack(k, was); }));
}

/* a pinned link's own stamp: the day you last went through it */
function stampLink(a, lk){
  var t = isoToday(), was = keep(lk, ['stampedAt', 'stampPrev']), off = lk.stampedAt === t;
  commit('semaphore', onLink(a.id, lk.id, function(k){
      if (k.stampedAt === t){ k.stampedAt = k.stampPrev || null; delete k.stampPrev; }
      else { k.stampPrev = k.stampedAt || null; k.stampedAt = t; }
    }),
    off ? 'Stamp taken off' : linkLabel(lk) + ' stamped',
    onLink(a.id, lk.id, function(k){ putBack(k, was); }));
}

/* a link or an email address on a lead, as the desk adds one */
function addLeadLink(ref, url, label){
  var id = uid(), link = { id:id, label:String(label || '').trim(), url:deskUrl(url) };
  if (!link.url && !link.label) return;
  commit('semaphore', edit(ref, function(l){
    if (!Array.isArray(l.links)) l.links = [];
    if (!l.links.some(function(k){ return k.id === id; })) l.links.push(link);
  }), /^mailto:/.test(link.url) ? 'Email added' : 'Link added',
  edit(ref, function(l){ l.links = (l.links || []).filter(function(k){ return k.id !== id; }); }));
}
function dropLeadLink(ref, k){
  var at = -1;
  commit('semaphore', edit(ref, function(l){
    at = (l.links || []).map(function(x){ return x.id; }).indexOf(k.id);
    l.links = (l.links || []).filter(function(x){ return x.id !== k.id; });
  }), 'Link removed', edit(ref, function(l){
    if (!Array.isArray(l.links)) l.links = [];
    if (!l.links.some(function(x){ return x.id === k.id; }))
      l.links.splice(at < 0 ? l.links.length : at, 0, k);
  }));
}

/* ── dates in words ─────────────────────────────────────────────────── */

function longDate(iso){
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined,
    { weekday:'long', day:'numeric', month:'long' });
}
/* Semaphore's extracted block already declares shortDate; two top-level
   scripts cannot both bind the same name, so Pocket's is briefDate. */
function briefDate(iso){
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined,
    { day:'numeric', month:'short' });
}
/* the desk's quiet form for a lead's day: Sun 4 Oct */
function dowDate(iso){
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined,
    { weekday:'short', day:'numeric', month:'short' });
}
function plusDays(n){
  var d = new Date(); d.setDate(d.getDate() + n);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

/* Several of Semaphore's notes come back as markup — eventNote wraps the
   date's name in <b> and escapes its entities — because there they are
   handed to innerHTML. Pocket sets text, so they are read back to plain. */
function plainOf(html){
  if (html == null) return '';
  var s = String(html);
  if (s.indexOf('<') < 0 && s.indexOf('&') < 0) return s;
  var d = document.createElement('div');
  d.innerHTML = s;
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
function linkLabel(k){
  if (!k) return '';
  if (k.label) return k.label;
  try { return new URL(k.url).hostname.replace(/^www\./,''); } catch(e){ return k.url; }
}

/* ── the board, scored ──────────────────────────────────────────────── */

function liveList(){
  var Sm = data.semaphore;
  if (!Sm || !Sm.arenas) return [];
  S = Sm;                                   /* the extracted maths reads S */
  return Sm.arenas.filter(function(a){ return a && !a.frozenAt; });
}
function scoreOf(a){
  try { if (typeof reconcile === 'function') reconcile(a); } catch(e){}
  try { return standing(a); } catch(e){ console.error(e); return null; }
}
/* The desk's own split: cards with brokerage material (or asking for
   something) in standing order, and the ghosts with nothing recorded. */
function wall(){
  var live = liveList().filter(function(a){ return !!scoreOf(a); });
  if (!live.length) return { list:[], empty:[] };
  try { return rotationSplit(live); }
  catch(e){ console.error(e); return { list:[], empty:[] }; }
}
function typeName(a){
  var t = ((data.semaphore && data.semaphore.types) || []).filter(function(x){ return x.id === a.typeId; })[0];
  return t ? t.name : '';
}
function stampedToday(a){ return !!a && a.sweptAt === isoToday(); }
function asking(st){ return !!st && st.score >= RUNG.asking[0]; }

function saying(st){
  if (!st) return '';
  if (st.state === 'held' && st.hold) return 'Waiting until ' + plainOf(st.hold.label || 'its date');
  if (st.state === 'wake' && st.hold)
    return 'The date it was waiting for is in reach — ' + plainOf(st.hold.label || '') +
           ' in ' + st.hold.near + (st.hold.near === 1 ? ' day' : ' days');
  if (st.note && st.note.text) return plainOf(st.note.text);
  if (st.state === 'sweep') return 'A call window is open';
  return (st.rest != null && st.rest < 1)
    ? 'Nothing pressing — not yet due a turn'
    : 'Nothing pressing — its turn has come round';
}

/* ── the line on a card: phase, then a strip of time ────────────────────
   The desk's cardLineHTML, drawn the same way without its buttons: a tap
   anywhere on it opens the arena. A top card draws up to four calls, a
   middle card two. Built as markup from escaped values only. */

function cardLine(a, t){
  var now = T(todayISO());
  var runs = callRuns(a), live = runs.live, last = runs.last;
  var evs = (a.dates || []).filter(function(d){ return d.kind !== 'call' && d.start && d.gran !== 'none'; })
    .map(function(d){ return { d:d, s:T(d.start), e:T(d.end || d.start) }; })
    .sort(function(x,y){ return x.s - y.s; });
  var ahead = evs.filter(function(x){ return x.e >= now; });
  if (!live.length && !last && !evs.length) return '';
  function when(d){ return (d.grade === 'fixed' ? '' : '≈ ') + shortDate(d); }
  function until(d){ var n = daysBetween(now, T(d.start));
    return T(d.end || d.start) >= now && n <= 0 ? 'on now' : n < 0 ? '' : n === 1 ? 'tomorrow' : 'in ' + n + ' d'; }

  var o = live.filter(function(r){ return r.state === 'open' && r.next; })[0]
       || live.filter(function(r){ return r.state === 'open'; })[0];
  var so = live.filter(function(r){ return r.state === 'soon'; })[0];
  var ph;
  if (o && o.next) ph = { w:'Open', c:'open', pre:'next deadline ', d:o.next };
  else if (o) ph = { w:'Open', c:'open', pre:'published ', d:o.open, still:true };
  else if (so) ph = { w:'Opens', c:'soon', pre:'', d:so.open };
  else if (ahead.length) ph = { w:last ? 'Between calls' : 'No call dated', c:'none', pre:'brokerage ', d:ahead[0].d };
  else if (last) ph = { w:'Between calls', c:'none', pre:'last deadline ', d:last.close || last.open, still:true };
  else ph = { w:'No call dated', c:'none', pre:'', d:null };
  var n = ph.d && !ph.still ? until(ph.d) : '';
  var fresh = (a.dates || []).filter(function(d){ return isFresh(a, d); })[0];
  var h = '<div class="wph"><span class="wpw ' + ph.c + '">' + ph.w + '</span>' +
    '<span class="wpt">' + esc(ph.pre) +
      (ph.d ? '<span class="wpd' + (ph.d.grade === 'fixed' ? '' : ' unc') + '">' + esc(when(ph.d)) + '</span>' : '') +
      (fresh ? '<i class="wfresh">new</i>' : '') + '</span>' +
    (n ? '<span class="wpn">' + n + '</span>' : '') + '</div>';

  var rows = live.slice(0, t === 'mid' ? 2 : 4);
  var t0 = now - 35*DAY, t1 = now + 100*DAY;
  rows.forEach(function(r){ t1 = Math.max(t1, r.close ? T(r.close.end || r.close.start) : T(r.open.start) + 60*DAY); });
  ahead.slice(0,3).forEach(function(x){ t1 = Math.max(t1, x.e); });
  t1 = Math.min(t1 + 12*DAY, now + 380*DAY);
  function P(v){ return Math.max(0, Math.min(100, (v - t0)/(t1 - t0)*100)).toFixed(2); }
  var lane = '';
  evs.forEach(function(x){
    if (x.e < t0 || x.s > t1) return;
    var cls = (x.e < now ? ' past' : '') + (x.d.grade === 'fixed' ? '' : ' unc') + (isFresh(a, x.d) ? ' fresh' : '');
    if (x.e - x.s >= 3*DAY) lane += '<span class="wsr' + (x.e < now ? ' past' : '') + '" style="left:' + P(x.s) +
      '%;width:' + (P(x.e) - P(x.s)).toFixed(2) + '%"></span>';
    lane += '<span class="wsd' + cls + '" style="left:' + P(x.s) + '%"></span>';
  });
  var bars = rows.map(function(r){
    var x0 = r.open ? +P(T(r.open.start)) : 0;
    var x1 = r.close ? +P(T(r.close.end || r.close.start)) : 100;
    var w = Math.max(x1 - x0, .8);
    var notch = r.dls.slice(0, -1).map(function(d){
      return '<i style="left:' + ((+P(T(d.start)) - x0)/w*100).toFixed(1) + '%"></i>'; }).join('');
    var cls = (r.unc ? ' unc' : '') + (r.open ? '' : ' lead-in') + (r.close ? '' : ' run-on') +
      (r.all.some(function(d){ return isFresh(a, d); }) ? ' fresh' : '');
    return '<div class="wsrow"><span class="wsb' + cls + '" style="left:' + x0.toFixed(2) + '%;width:' + w.toFixed(2) + '%">' +
      notch + '</span></div>';
  }).join('');
  var ticks = '', lastX = -99, lastW = 0;
  var span = (t1 - t0)/DAY, step = span > 300 ? 2 : 1;
  var m = new Date(t0); m.setDate(1); m.setMonth(m.getMonth() + 1);
  for (var i = 0; m.getTime() < t1; i++, m.setMonth(m.getMonth() + 1)){
    var jan = m.getMonth() === 0, x = +P(m.getTime());
    ticks += '<i style="left:' + x.toFixed(2) + '%"></i>';
    /* a phone strip is narrower than a card on the desk, so labels need more room */
    if ((i % step === 0 || jan) && x < 94 && x - lastX >= lastW){
      ticks += '<span class="' + (jan ? 'y' : '') + '" style="left:' + x.toFixed(2) + '%">' +
        (jan ? m.getFullYear() : MONTHS[m.getMonth()][0]) + '</span>';
      lastX = x; lastW = jan ? 12 : 5;
    }
  }
  var more = live.length - rows.length;
  return h + '<div class="wstrip"><div class="wsl">' + lane + '</div>' +
    (bars ? '<div class="wsbars">' + bars + '</div>' : '') +
    '<span class="wsnow" style="left:' + P(now) + '%"></span>' +
    '<div class="wsx">' + ticks + '</div></div>' +
    (more > 0 ? '<p class="wlmore">+' + more + ' more call' + (more > 1 ? 's' : '') + '</p>' : '');
}

/* the three small controls a card and a link carry, as on the desk:
   the ring (ask the nightly agent), the pin (a diamond), the stamp (a tick) */
function ringBtn(a){
  var on = !!a.askAt, b = el('button', 'wask' + (on ? ' on' : ''));
  b.appendChild(el('i'));
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', on ? 'Asked the nightly agent — tap to take it back'
                                  : 'Ask the nightly agent to look at this arena');
  b.addEventListener('click', function(e){ e.stopPropagation(); askAgent(a); });
  return b;
}
function pinBtn(on, label, act){
  var b = el('button', 'pin' + (on ? ' on' : ''));
  b.appendChild(el('i'));
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', label);
  b.addEventListener('click', function(e){ e.stopPropagation(); e.preventDefault(); act(); });
  return b;
}
function tickBtn(on, label, act){
  var b = el('button', 'stamp' + (on ? ' on' : ''));
  b.appendChild(el('b', '', '✓'));
  b.setAttribute('aria-label', label);
  b.addEventListener('click', function(e){ e.stopPropagation(); act(); });
  return b;
}
/* a brokerage link with its pin beside it: pinning sends it to Pinned */
function pinnableRow(lk, a){
  var w = el('div', 'wlrow');
  w.appendChild(linkRow(lk, a, true));
  w.appendChild(pinBtn(!!lk.pin, lk.pin ? 'Unpin — put it back on its card' : 'Pin — keep it on Pinned',
    function(){ pinLink(a, lk); }));
  return w;
}

/* one link row, named and hosted the way Semaphore names them */
function linkRow(lk, a, showPin){
  var nm = (typeof linkName === 'function') ? linkName(lk) : linkLabel(lk);
  var r;
  if (lk.url){
    r = el('a', 'wlink');
    r.href = lk.url; r.target = '_blank'; r.rel = 'noopener';
  } else r = el('span', 'wlink dead');
  r.appendChild(el('span', 'wn', plainOf(nm)));
  if (a && isFresh(a, lk)) r.appendChild(el('i', 'wfresh', 'new'));
  if (showPin && lk.pin) r.appendChild(el('span', 'pd'));
  /* an email shows its address where a site shows its host */
  var host = /^mailto:/i.test(lk.url || '') ? lk.url.slice(7) : lk.url ? linkHost(lk) : '';
  if (host && host !== nm) r.appendChild(el('span', 'wd', host));
  return r;
}

/* ── a card on the wall ─────────────────────────────────────────────── */

function wallCard(a, st, tier){
  var c = el('article', 'wcard t-' + tier + (stampedToday(a) ? ' stamped' : ''));
  var head = el('header', 'wch');
  var wk = weightOf(a);
  var nm = el('button', 'wname' + (wk === 'ordinary' ? '' : ' w-' + wk), plainOf(a.name) || 'Untitled');
  nm.addEventListener('click', function(){ openArena(a, st); });
  head.appendChild(nm);

  var bk = a.brokerage || { links:[] };
  var shown = (bk.links || []).filter(function(l){ return l && !l.pin; });
  if (tier === 'rest' && shown.length) head.appendChild(el('span', 'wcnt', String(shown.length)));

  var nl = (a.leads || []).filter(function(l){ return l && !l.doneAt; }).length;
  if (nl){
    var chip = el('button', 'lchip');
    chip.appendChild(el('i'));
    chip.appendChild(document.createTextNode(String(nl)));
    chip.setAttribute('aria-label', 'Show the ' + nl + ' open leads on ' + (a.name || 'this arena'));
    chip.addEventListener('click', function(e){ e.stopPropagation(); showArenaLeads(a); });
    head.appendChild(chip);
  }
  /* a tail card is one line of name, so it carries the ring and the pin only
     while they are lit — as on the desk */
  if (tier !== 'rest' || a.askAt) head.appendChild(ringBtn(a));
  if (tier !== 'rest' || a.pin)
    head.appendChild(pinBtn(!!a.pin, a.pin ? 'Unpin this card' : 'Pin this card',
      function(){ pinArena(a); }));
  var on = stampedToday(a);
  head.appendChild(tickBtn(on, on ? 'Take the stamp off' : 'Stamp it — gone through',
    function(){ stampArena(a); }));
  c.appendChild(head);
  if (tier === 'rest') return c;

  var lineHTML = '';
  try { lineHTML = cardLine(a, tier); } catch(e){ console.error(e); }
  if (lineHTML){
    var line = el('div', 'wline');
    line.innerHTML = lineHTML;
    line.addEventListener('click', function(){ openArena(a, st); });
    c.appendChild(line);
  }

  if (shown.length){
    var band = el('div', 'wlk');
    var lab = el('span', 'cap', 'Links');
    lab.appendChild(el('b', '', String(shown.length)));
    band.appendChild(lab);
    var cap = tier === 'mid' ? 2 : 3;
    shown.slice(0, cap).forEach(function(lk){ band.appendChild(pinnableRow(lk, a)); });
    if (shown.length > cap){
      var more = el('button', 'wlkmore', '+ ' + (shown.length - cap) + ' more in the arena');
      more.addEventListener('click', function(){ openArena(a, st); });
      band.appendChild(more);
    }
    c.appendChild(band);
  }
  var say = saying(st);
  if (say){
    var s = el('div', 'wsay' + (st && (st.state === 'wake') ? ' hot' : ''), say);
    s.addEventListener('click', function(){ openArena(a, st); });
    c.appendChild(s);
  }
  return c;
}

/* ── the rotation ───────────────────────────────────────────────────── */

var rotList = [];      /* the rotation in its walking order, for Next */

function nextAfter(id){
  var i = -1;
  for (var k = 0; k < rotList.length; k++) if (rotList[k].a.id === id){ i = k; break; }
  for (var j = i + 1; j < rotList.length; j++)
    if (!stampedToday(rotList[j].a)) return rotList[j].a.id;
  return null;
}
function openArenaById(id){
  for (var k = 0; k < rotList.length; k++)
    if (rotList[k].a.id === id){ openArena(rotList[k].a, rotList[k].s); return; }
  var a = liveList().concat(((data.semaphore && data.semaphore.arenas) || []))
    .filter(function(x){ return x && x.id === id; })[0];
  if (a) openArena(a, scoreOf(a)); else shut();
}

function drawRot(){
  var host = $('#v-rot');
  host.textContent = '';
  var w = wall(), all = w.list;
  if (!all.length && !w.empty.length){ rotList = [];
    host.appendChild(empty('Nothing in rotation',
      data.semaphore ? 'Every arena is frozen, or none has been added yet.'
                     : 'Pull down to fetch from the cloud.'));
    badge('rot', 0); return;
  }
  /* The desk's three bands — a short head, a wider middle, the long tail —
     cut over the whole rotation, so a card is the size it is on the desk.
     A card stamped today leaves the walk: the ones still to look at keep
     their order, the stamped ones sit together at the foot. */
  var quota = tierQuota(all.length);
  all.forEach(function(x, i){ x.t = bandOf(i, quota); });
  var todo = all.filter(function(x){ return !stampedToday(x.a); });
  var stamped = all.filter(function(x){ return stampedToday(x.a); });
  rotList = todo.concat(stamped);
  var n = todo.filter(function(x){ return asking(x.s); }).length;
  badge('rot', n);

  var hd = el('div', 'whead');
  if (n){
    hd.appendChild(el('b', '', String(n)));
    hd.appendChild(document.createTextNode(n === 1 ? ' card is asking for something.' : ' cards are asking for something.'));
  } else hd.textContent = 'Highest is whatever wants attention today.';
  host.appendChild(hd);

  if (todo.length){
    var go = el('button', 'round');
    go.appendChild(el('span', 'go', '▶'));
    var tx = el('span', 'tx');
    tx.appendChild(el('b', '', stamped.length ? 'Carry on looking around' : 'Look around'));
    tx.appendChild(el('span', '', 'Next up: ' + (plainOf(todo[0].a.name) || 'Untitled') +
      (stamped.length ? '  ·  ' + stamped.length + ' stamped today' : '')));
    go.appendChild(tx);
    go.addEventListener('click', function(){ openArena(todo[0].a, todo[0].s); });
    host.appendChild(go);
  } else if (all.length) {
    host.appendChild(empty('All looked at today', 'Every card has been stamped. Come back tomorrow.'));
  }

  var tier = null;
  todo.forEach(function(x){
    if (x.t !== tier){
      if (tier !== null && x.t === 'rest') bandHead(host, 'The rest', todo.filter(function(z){ return z.t === 'rest'; }).length);
      tier = x.t;
    }
    host.appendChild(wallCard(x.a, x.s, x.t));
  });

  if (stamped.length){
    bandHead(host, 'Stamped today', stamped.length);
    stamped.forEach(function(x){ host.appendChild(wallCard(x.a, x.s, 'rest')); });
  }

  if (w.empty.length){
    var p = el('p', 'wrest', 'No brokerage material yet — ');
    w.empty.forEach(function(a){
      var g = el('button', 'wghost', plainOf(a.name) || 'Untitled');
      g.addEventListener('click', function(){ openArena(a, scoreOf(a)); });
      p.appendChild(g);
    });
    host.appendChild(p);
  }
}
function bandHead(host, name, n){
  var h = el('div', 'band cap', name + ' ');
  h.appendChild(el('b', '', '· ' + n));
  host.appendChild(h);
}

/* ── pinned: the links and the cards you keep to hand ───────────────────
   A whole card (`pin` on the arena), or a single link (`pin` on the link,
   the moment it was pinned), as the desk's Pinned arrangement: the links
   first, oldest pin first, each with its own stamp and the days since, so
   the round can be walked the way the rotation is; then the cards. A pinned
   link stands only here; the cards leave it out. */

function pinnedOf(){
  var arenas = liveList(), types = (data.semaphore && data.semaphore.types) || [];
  var rank = {}; types.forEach(function(t, i){ rank[t.id] = i; });
  function ord(a){ return a.typeId in rank ? rank[a.typeId] : types.length; }
  var cards = arenas.filter(function(a){ return !!a.pin; }).sort(function(x,y){
    return ord(x) - ord(y) || bkPos(x) - bkPos(y) || String(x.name).localeCompare(String(y.name)); });
  var links = [];
  arenas.forEach(function(a){
    [['brokerage', (a.brokerage || {}).links || []], ['arena', a.links || []]].forEach(function(p){
      p[1].forEach(function(lk){ if (lk && lk.pin) links.push({ a:a, lk:lk, scope:p[0] }); });
    });
  });
  links.sort(function(x,y){ return String(x.lk.pin).localeCompare(String(y.lk.pin)); });
  return { cards:cards, links:links };
}

function drawPins(){
  var host = $('#v-pins');
  host.textContent = '';
  if (!data.semaphore){
    host.appendChild(empty('Nothing pinned yet', 'Pull down to fetch from the cloud.'));
    return;
  }
  var p = pinnedOf();
  if (!p.cards.length && !p.links.length){
    host.appendChild(empty('Nothing pinned yet',
      'Tap the diamond in a card’s head to keep the whole card here, ' +
      'or the diamond beside one of its links to keep just that link.'));
    return;
  }
  var hd = el('div', 'whead');
  var bits = [];
  if (p.cards.length) bits.push([p.cards.length, p.cards.length === 1 ? ' card' : ' cards']);
  if (p.links.length) bits.push([p.links.length, p.links.length === 1 ? ' link' : ' links']);
  bits.forEach(function(b, i){
    if (i) hd.appendChild(document.createTextNode(' and '));
    hd.appendChild(el('b', '', String(b[0])));
    hd.appendChild(document.createTextNode(b[1]));
  });
  hd.appendChild(document.createTextNode(' kept to hand.'));
  host.appendChild(hd);

  if (p.links.length){
    var box = el('section', 'wpins');
    p.links.forEach(function(x){
      var t = isoToday(), on = x.lk.stampedAt === t;
      var row = el('div', 'wprow' + (on ? ' on' : ''));
      /* the link's own stamp and pin are the desk's brokerage-link fields; a
         pinned link of the arena's own list is shown, and handled on the desk */
      if (x.scope === 'brokerage')
        row.appendChild(tickBtn(on, on ? 'Stamped today — tap to undo' : 'Stamp it once you have been through it',
          function(){ stampLink(x.a, x.lk); }));
      var lk = linkRow(x.lk, x.a);
      row.appendChild(lk);
      var meta = el('span', 'wpmeta');
      var ar = el('button', 'wpa', plainOf(x.a.name) || 'Arena');
      ar.addEventListener('click', function(){ openArenaById(x.a.id); });
      meta.appendChild(ar);
      var d = x.lk.stampedAt ? -daysTo(x.lk.stampedAt) : null;
      var age = el('span', 'wpage' + (d === null ? ' never' : ''),
        d === null ? 'never' : d <= 0 ? 'today' : d + ' d');
      age.title = d === null ? 'Not stamped yet' : d <= 0 ? 'Stamped today' : 'Stamped ' + d + ' days ago';
      meta.appendChild(age);
      row.appendChild(meta);
      if (x.scope === 'brokerage')
        row.appendChild(pinBtn(true, 'Unpin — put it back on its card', function(){ pinLink(x.a, x.lk); }));
      box.appendChild(row);
    });
    host.appendChild(box);
  }
  p.cards.forEach(function(a){ host.appendChild(wallCard(a, scoreOf(a), 'lead')); });
}

/* ── the leads ──────────────────────────────────────────────────────── */

/* not `openLeads` — the pasted Semaphore block already has that name */
function leadItems(){
  var out = [], Sm = data.semaphore;
  if (Sm && Sm.arenas) Sm.arenas.forEach(function(a){
    if (!a || a.frozenAt) return;
    (a.leads || []).forEach(function(l){
      if (!l || l.doneAt) return;
      var lks = (l.links || []).filter(function(k){ return k && k.url; });
      out.push({ when:l.due || null,
                 what:l.project || (lks[0] ? linkLabel(lks[0]) : '') || 'Untitled lead',
                 where:a.name || 'Arena', arena:a, lead:l,
                 stageKey:stageOf(l), stage:STAGE_NAME[stageOf(l)],
                 match:l.match || '', links:lks,
                 updates:(l.updates || []),
                 ref:{ kind:'lead', aid:a.id, lid:l.id } });
    });
  });
  return out;
}
function byDay(x, y){
  if (!!x.when !== !!y.when) return x.when ? -1 : 1;
  if (x.when && y.when && x.when !== y.when) return x.when < y.when ? -1 : 1;
  return String(x.what).localeCompare(String(y.what));
}

var scope = null;      /* {aid, name} — the leads list narrowed to one arena */
var curTab = 'rot', lastTab = 'rot';

function goTab(name){
  if (name !== curTab && curTab !== 'people') lastTab = curTab;
  curTab = name;
  document.querySelectorAll('#tabs button').forEach(function(x){
    x.classList.toggle('on', x.dataset.tab === name);
  });
  document.querySelectorAll('.view').forEach(function(v){
    v.classList.toggle('on', v.id === 'v-' + name);
  });
  $('#stage').scrollTop = 0;
}

function showArenaLeads(a){
  scope = { aid:a.id, name:plainOf(a.name) || 'Arena' };
  drawLeads();
  shut();
  goTab('leads');
}

/* the ruit, read only: Spotted on the left, the researchers asked above,
   the lead itself written to below, Talking on the right */
var RUIT_AT = { sp:[6,13], r:[23,5], l:[23,21], t:[40,13] };
function ruit(l){
  var r = !!l.toResearchers, ld = !!l.toLead, st = stageOf(l), talk = st === 'talking';
  var box = el('span', 'lruit');
  box.setAttribute('aria-label', STAGE_NAME[st]);
  function seg(p, q, on){ return '<line x1="' + p[0] + '" y1="' + p[1] + '" x2="' + q[0] + '" y2="' + q[1] + '"' +
    (on ? ' class="on"' : '') + '/>'; }
  box.innerHTML = '<svg viewBox="0 0 46 26" aria-hidden="true">' +
    seg(RUIT_AT.sp, RUIT_AT.r, r) + seg(RUIT_AT.sp, RUIT_AT.l, ld) +
    seg(RUIT_AT.r, RUIT_AT.t, talk && r) + seg(RUIT_AT.l, RUIT_AT.t, talk && ld) + '</svg>';
  var on = { sp:true, r:r, l:ld, t:talk };
  function now(k){ return k === 'sp' ? st === 'spotted' : k === 't' ? talk : (st === 'contacted' && (k === 'r' ? r : ld)); }
  ['sp','r','l','t'].forEach(function(k){
    var d = el('i', (on[k] ? 'on' : '') + (now(k) ? ' now' : ''));
    d.style.left = RUIT_AT[k][0] + 'px'; d.style.top = RUIT_AT[k][1] + 'px';
    box.appendChild(d);
  });
  return box;
}

/* The diamond in the lead's sheet, pressed rather than read: Spotted on the
   left, the researchers asked above, the lead itself written to below,
   Talking on the right — each a thumb-sized target with its name. */
var BIG_AT = { sp:[8,50], r:[50,16], l:[50,84], t:[92,50] };
var BIG_NAME = { sp:'Spotted', r:'Researchers asked', l:'Lead written to', t:'Talking' };
var BIG_V = { sp:'spotted', r:'researchers', l:'lead', t:'talking' };
function bigRuit(l, act){
  var r = !!l.toResearchers, ld = !!l.toLead, st = stageOf(l), talk = st === 'talking';
  var box = el('div', 'bruit');
  function seg(p, q, on){ return '<line x1="' + p[0] + '" y1="' + p[1] + '" x2="' + q[0] + '" y2="' + q[1] + '"' +
    (on ? ' class="on"' : '') + ' vector-effect="non-scaling-stroke"/>'; }
  box.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
    seg(BIG_AT.sp, BIG_AT.r, r) + seg(BIG_AT.sp, BIG_AT.l, ld) +
    seg(BIG_AT.r, BIG_AT.t, talk && r) + seg(BIG_AT.l, BIG_AT.t, talk && ld) + '</svg>';
  var on = { sp:true, r:r, l:ld, t:talk };
  function now(k){ return k === 'sp' ? st === 'spotted' : k === 't' ? talk : (st === 'contacted' && (k === 'r' ? r : ld)); }
  ['sp','r','l','t'].forEach(function(k){
    var d = el('button', 'bdot b-' + k + (on[k] ? ' on' : '') + (now(k) ? ' now' : ''));
    d.style.left = BIG_AT[k][0] + '%'; d.style.top = BIG_AT[k][1] + '%';
    d.appendChild(el('i'));
    d.appendChild(el('span', '', BIG_NAME[k]));
    d.setAttribute('aria-pressed', on[k] ? 'true' : 'false');
    d.addEventListener('click', function(){ act(BIG_V[k]); });
    box.appendChild(d);
